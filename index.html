  $('overlay').classList.add('open');
  $('modal-close').addEventListener('click', closeModal);
  $('modal-cancel').addEventListener('click', closeModal);
  $('modal-save-task-note').addEventListener('click', function(){ saveTaskNote(this.dataset.id); });
  document.querySelectorAll('.task-link-jump').forEach(function(el){
    el.addEventListener('click', function(){
      var kind = el.dataset.jump, jid = el.dataset.id;
      closeModal();
      if(kind==='client'){ go('clients'); setTimeout(function(){openClientForm(jid);},100); }
      else if(kind==='vendor'){ go('vendors'); setTimeout(function(){openVendorForm(jid);},100); }
      else if(kind==='trip'){ go('trips'); setTimeout(function(){openTripForm(jid);},100); }
    });
  });
}

function saveTaskNote(id){
  var task = db.planner.find(function(t){return t.id===id;});
  if(!task) return;
  var text = gv('task-note-txt');
  if(!text){toast('Note text is required','err');return;}
  if(!task.clientId && !task.vendorId && !task.tripId){
    toast('This task has no linked client, supplier, or trip','err');
    return;
  }
  var noteType = gv('task-note-type')||'General';
  snapshot('Add task note');
  var ts = tsNow();
  var count = 0;
  var taskCid = taskClientId(task);
  if(taskCid){
    db.clients = db.clients.map(function(c){
      if(c.id!==taskCid) return c;
      var nl = Array.isArray(c.notesLog)?c.notesLog.slice():[];
      nl.push({ts:ts,text:text,noteType:noteType,source:'planner'});
      return Object.assign({},c,{notesLog:nl});
    });
    count++;
  }
  if(task.vendorId){
    db.vendors = db.vendors.map(function(v){
      if(v.id!==task.vendorId) return v;
      var nl = Array.isArray(v.notesLog)?v.notesLog.slice():[];
      nl.push({ts:ts,text:text,noteType:noteType,source:'planner'});
      return Object.assign({},v,{notesLog:nl});
    });
    count++;
  }
  if(task.tripId){
    db.trips = db.trips.map(function(t){
      if(t.id!==task.tripId) return t;
      var appended = t.notes ? t.notes+'\n\n['+ts+'] '+text : '['+ts+'] '+text;
      return Object.assign({},t,{notes:appended});
    });
    count++;
  }
  saveDB();closeModal();render();
  toast('Note added to '+count+' linked record'+(count!==1?'s':''),'ok');
}

(function checkMsRedirect(){
  const params=new URLSearchParams(window.location.search);
  const code=params.get('code');
  const state=params.get('state');
  if(code&&state==='outlooksync'){
    window.history.replaceState({},'',window.location.pathname);
    debugLog('Got auth code, exchanging for token...');
    exchangeCodeForToken(code).then(function(){
      debugLog('Token exchange SUCCESS - auto-syncing emails...');
      toast('Outlook connected - syncing emails...','info');
      $('outlook-btn').style.color='#059669';
      $('outlook-btn').style.borderColor='#6ee7b7';
      // Auto-run sync immediately after login
      syncOutlook();
    }).catch(function(e){
      debugLog('Token exchange FAILED: '+e.message);
      toast('Outlook auth failed: '+e.message,'err');
    });
  }
})();

// Bind all buttons (script runs after DOM since it's at end of body).
// Each binding is independent — if one element is missing or a handler throws
// during setup, it's logged and skipped, but every OTHER button still gets wired up.
function bindClick(id, handler){
  try{
    var el = document.getElementById(id);
    if(!el){ debugLog('Button bind skipped — #'+id+' not found in DOM'); return; }
    el.addEventListener('click', handler);
  }catch(e){
    debugLog('Button bind FAILED for #'+id+': '+e.message);
  }
}

    localStorage.removeItem('mm_last_outlook_sync');
    const btn = document.getElementById('outlook-btn');
    if(btn){btn.style.color='';btn.style.borderColor='';}
    toast('Outlook login reset - click Sync to reconnect','ok');
    debugLog('MS tokens cleared');
  });
  bindClick('btn-user-guide', function(){ window.open('user-guide.html', '_blank', 'noopener,noreferrer'); });
  bindClick('btn-documentation', function(){ window.open('documentation.html', '_blank', 'noopener,noreferrer'); });
  bindClick('btn-debug-toggle', function(){
    const p=$('debug-panel');
    p.style.display=p.style.display==='none'?'block':'none';
  });
  bindClick('debug-close', function(){$('debug-panel').style.display='none';});
  bindClick('btn-test-connectivity', function(){
    $('debug-panel').style.display='block';
    debugLog('=== Connectivity Test Started ===');
    fetch('https://api.github.com').then(function(r){
      debugLog('GitHub fetch: status='+r.status+' ok='+r.ok);
    }).catch(function(e){
      debugLog('GitHub fetch FAILED: '+e.message);
    });
    fetch('https://milesman-auth.vercel.app').then(function(r){
      debugLog('Vercel auth server fetch: status='+r.status+' ok='+r.ok);
    }).catch(function(e){
      debugLog('Vercel auth server fetch FAILED: '+e.message);
    });
    fetch('https://www.googleapis.com').then(function(r){
      debugLog('Google APIs fetch: status='+r.status+' ok='+r.ok);
    }).catch(function(e){
      debugLog('Google APIs fetch FAILED: '+e.message);
    });
  });
  bindClick('note-expand-close', closeNoteExpand);
  bindClick('note-expand-overlay', function(e){
    if(e.target === document.getElementById('note-expand-overlay')) closeNoteExpand();
  });
  bindClick('btn-change-password', changeAuthPassword);
  bindClick('btn-lock-app', lockApp);
  bindClick('btn-close-app', closeApp);

  // Assistant chat widget
  var assistantToggle = document.getElementById('assistant-toggle-btn');
  var assistantPanel = document.getElementById('assistant-panel');
  var assistantClose = document.getElementById('assistant-close-btn');
  var assistantSendBtn = document.getElementById('assistant-send-btn');
  var assistantInputEl = document.getElementById('assistant-input');
  function toggleAssistantPanel(forceOpen){
    if(!assistantPanel) return;
    var isOpen = assistantPanel.style.display === 'flex';
    var open = forceOpen!==undefined ? forceOpen : !isOpen;
    assistantPanel.style.display = open ? 'flex' : 'none';
    if(open && assistantInputEl) assistantInputEl.focus();
  }
  if(assistantToggle) assistantToggle.addEventListener('click', function(){ toggleAssistantPanel(); });
  if(assistantClose) assistantClose.addEventListener('click', function(){ toggleAssistantPanel(false); });
  function submitAssistantInput(){
    var text = assistantInputEl.value.trim();
    if(!text) return;
    assistantInputEl.value = '';
    sendAssistantMessage(text);
  }
  if(assistantSendBtn) assistantSendBtn.addEventListener('click', submitAssistantInput);
  if(assistantInputEl) assistantInputEl.addEventListener('keydown', function(e){
    if(e.key==='Enter'){ e.preventDefault(); submitAssistantInput(); }
  });
})();

function noteTypeCls(t){
  var map={'Email Sent':'nt-email-sent','Email Received':'nt-email-received','Initial Call':'nt-initial-call','Follow-up':'nt-follow-up','Post-Trip Follow-up':'nt-follow-up','General':'nt-general','Trip Import':'nt-blue','Text Message Sent':'nt-text-message','Text Message Received':'nt-text-message','Lead':'nt-lead','Mailchimp Email Sent':'nt-mailchimp','Facebook Message':'nt-facebook'};
  return map[t]||'nt-general';
}
function openNoteExpand(ts, text, noteType){
  var overlay = document.getElementById('note-expand-overlay');
  var tsEl    = document.getElementById('note-expand-ts');
  var bodyEl  = document.getElementById('note-expand-body');
  tsEl.innerHTML = ts + (noteType ? ' <span class="note-type-badge '+noteTypeCls(noteType)+'">'+noteType+'</span>' : '');

// ── Auto-save every 5 minutes ────────────────────────────────────────────
function startAutosave(){
  // Every actual change already calls saveDB() immediately (see saveClient,
  // saveTask, delTrip, etc.) — a blind periodic re-save of each tab's
  // in-memory db would clobber newer data written by OTHER open tabs since
  // this tab last loaded, silently erasing anything added there. Don't add
  // one back without a cross-tab freshness check.

  // Google Drive backup every 5 minutes. Uses a silent token refresh (no login
  // redirect) so it works even if the user never manually clicked Backup/Restore
  // in this tab — as long as they've signed in at some point on this device.
  setInterval(function(){ runAutoDriveBackup(); }, 5 * 60 * 1000);

  // Also back up whenever the tab is hidden/backgrounded or the page is being
  // unloaded — this is the case that matters most on mobile, where someone edits
  // a record then switches apps or closes the tab well before any timer fires.
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'hidden') runAutoDriveBackup();
  });
  window.addEventListener('pagehide', function(){ runAutoDriveBackup(); });
}

let _autoBackupInFlight = false;
async function runAutoDriveBackup(){
  if(_autoBackupInFlight) return;
  const token = await getDriveTokenSilent();
  if(!token){
    debugLog('Auto-backup skipped — not signed in on this device (no valid token or refresh token)');
    updateSyncStatusDisplay();
    return;
  }
  _autoBackupInFlight = true;
  debugLog('Running auto Drive backup...');
  try{ driveToken = token; await driveBackup(true); debugLog('Auto Drive backup finished'); } // silent=true suppresses button text change
  finally{ _autoBackupInFlight = false; }
}
// Same as Lock (lockApp(), defined at the top level outside bootApp), but
// explicitly saves first — a defensive localStorage save (everything's
// already saved after each edit, but this covers any gap) plus a
// best-effort, silent Google Drive backup (same silent/non-redirecting
// path as the auto-backup-on-tab-hide behavior, so it never hijacks the
// screen with a Google login prompt) before ending the session. Must live
// in here (bootApp's scope), not alongside lockApp, since it calls saveDB/
// runAutoDriveBackup/debugLog — all local to this scope.
async function closeApp(){
  saveDB();
  try{ await runAutoDriveBackup(); }catch(e){ debugLog('Close: Drive backup skipped — '+e.message); }
  lockApp();
}

// ── Assistant chat widget ────────────────────────────────────────────────
// A small agentic loop against Claude: the browser never holds an API key
// (that lives server-side in the Vercel proxy, api/claude-messages.js,
// same pattern as Drive/Mailchimp) and the model never writes or runs
// arbitrary code — it can only call this fixed set of tools, each of which
// maps straight onto an existing CRM action. Every mutating tool calls
// snapshot() first, so any assistant-made change is undoable with the same
// Undo button as everything else in the app.
const ASSISTANT_SYSTEM_PROMPT = 'You are the in-app assistant for a travel agency CRM. Help the user look up and update their own clients, trips, and follow-up tasks using only the provided tools. Always resolve a client by name to a clientId with find_clients before acting on them — if more than one client matches, ask which one rather than guessing. Be concise. After taking an action, briefly confirm what you did.';

const ASSISTANT_TOOLS = [
  {
    name: 'find_clients',
    description: 'Search clients by name or email substring (case-insensitive). Returns up to 10 matches with id, name, email, phone. Use this first to resolve which client the user means before adding a note, creating a task, or looking up trips for them.',
    input_schema: {
      type: 'object',
      properties: { query: { type: 'string', description: 'Name or email substring to search for' } },
      required: ['query']
    }
  },
  {
    name: 'find_trips',
    description: 'Search/filter trips. All filters are optional and combine together (AND). Returns up to 15 matches with id, client name, destination, dates, status, total value.',
    input_schema: {
      type: 'object',
      properties: {
        clientId: { type: 'string', description: 'Only trips linked to this client id (primary or additional)' },
        destination: { type: 'string', description: 'Substring match against destination' },
        status: { type: 'string', enum: ['Planning','Confirmed','Completed','Cancelled'] },
        departAfter: { type: 'string', description: 'YYYY-MM-DD, inclusive' },
        departBefore: { type: 'string', description: 'YYYY-MM-DD, inclusive' }
      }
    }
  },
  {
    name: 'add_client_note',
    description: 'Add a timestamped note to a client’s notes log.',
    input_schema: {
      type: 'object',
      properties: {
        clientId: { type: 'string' },
        text: { type: 'string' },
        noteType: { type: 'string', enum: NOTE_TYPES }
      },
      required: ['clientId','text']
    }
  },
  {
    name: 'create_task',
    description: 'Create a new Planner follow-up task, optionally linked to a client.',
    input_schema: {
      type: 'object',
      properties: {
        title: { type: 'string' },
        dueDate: { type: 'string', description: 'YYYY-MM-DD' },
        clientId: { type: 'string' },
        desc: { type: 'string' }
      },
      required: ['title']
    }
  },
  {
    name: 'create_client',
    description: 'Create a brand-new client record.',
    input_schema: {
      type: 'object',
      properties: {
        name: { type: 'string' },
        email: { type: 'string' },
        phone: { type: 'string' }
      },
      required: ['name','email']
    }
  }
];

// Executes one tool call against this app's own data/functions and returns a
// plain-object result (sent back to Claude as the tool_result). Never lets
// the model run its own code — this is the fixed, reviewable surface of
// what the assistant is allowed to do.
function runAssistantTool(name, input){
  input = input || {};
  if(name === 'find_clients'){
    var q = (input.query||'').toLowerCase();
    var matches = db.clients.filter(function(c){
      return (c.name||'').toLowerCase().indexOf(q)!==-1 || (c.email||'').toLowerCase().indexOf(q)!==-1;
    }).slice(0,10).map(function(c){ return {id:c.id, name:c.name, email:c.email, phone:c.phone}; });
    return {clients: matches};
  }
  if(name === 'find_trips'){
    var results = db.trips.filter(function(t){
      if(input.clientId && t.clientId!==input.clientId && (t.clientIds||[]).indexOf(input.clientId)===-1) return false;
      if(input.destination && (t.destination||'').toLowerCase().indexOf(input.destination.toLowerCase())===-1) return false;
      if(input.status && t.status!==input.status) return false;
      if(input.departAfter && !((t.departDate||'')>=input.departAfter)) return false;
      if(input.departBefore && !((t.departDate||'')<=input.departBefore)) return false;
      return true;
    }).slice(0,15).map(function(t){
      return {id:t.id, client:t.clientName, destination:t.destination, departDate:t.departDate, returnDate:t.returnDate, status:t.status, totalValue:t.totalValue};
    });
    return {trips: results};
  }
  if(name === 'add_client_note'){
    var client = db.clients.find(function(c){return c.id===input.clientId;});
    if(!client) return {error:'No client found with id '+input.clientId};
    if(!input.text) return {error:'Note text is required'};
    snapshot('Assistant: add note');
    db.clients = db.clients.map(function(c){
      if(c.id!==input.clientId) return c;
      var nl = Array.isArray(c.notesLog)?c.notesLog.slice():[];
      nl.push({ts:tsNow(), text:input.text, noteType:input.noteType||'General', source:'assistant'});
      return Object.assign({},c,{notesLog:nl});
    });
    saveDB();
    return {ok:true, message:'Note added to '+client.name};
  }
  if(name === 'create_task'){
    if(!input.title) return {error:'Task title is required'};
    snapshot('Assistant: create task');
    var task = {
      id:newId('PL',db.planner), title:input.title, dueDate:input.dueDate||'', done:false,
      clientId:input.clientId||'', desc:input.desc||'', completionNoteType:'General', createdAt:today()
    };
    db.planner.push(task);
    saveDB();
    return {ok:true, message:'Task created: '+task.title, taskId:task.id};
  }
  if(name === 'create_client'){
    if(!input.name || !input.email) return {error:'Both name and email are required'};
    snapshot('Assistant: create client');
    var newClient = {
      id:newId('C',db.clients), name:input.name, email:input.email, phone:input.phone||'',
      notesLog:[], mileageBalances:{}, hotelBalances:{}, creditCardBalances:{}
    };
    db.clients.push(newClient);
    saveDB();
    return {ok:true, message:'Client created: '+newClient.name, clientId:newClient.id};
  }
  return {error:'Unknown tool: '+name};
}

var assistantMessages = []; // in-memory only — resets on reload, not persisted to localStorage
function assistantMsgBubble(kind, text){
  var container = document.getElementById('assistant-messages');
  if(!container) return;
  var styles = {
    user: 'align-self:flex-end;background:#2563eb;color:#fff;border-radius:12px 12px 2px 12px',
    assistant: 'align-self:flex-start;background:#f3f4f6;color:#111;border-radius:12px 12px 12px 2px',
    action: 'align-self:stretch;background:#ecfdf5;color:#065f46;border-radius:8px;font-size:11px',
    error: 'align-self:stretch;background:#fef2f2;color:#991b1b;border-radius:8px;font-size:11px'
  };
  var div = document.createElement('div');
  div.style.cssText = 'padding:8px 10px;max-width:85%;white-space:pre-wrap;word-break:break-word;'+(styles[kind]||styles.assistant);
  div.textContent = text;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}
function describeToolResult(name, input, result){
  if(result && result.error) return '✗ '+result.error;
  if(result && result.message) return '✓ '+result.message;
  if(name==='find_clients') return 'Found '+((result.clients||[]).length)+' client(s) for "'+(input.query||'')+'"';
  if(name==='find_trips') return 'Found '+((result.trips||[]).length)+' trip(s)';
  return '✓ '+name+' done';
}
function setAssistantLoading(isLoading){
  var sendBtn = document.getElementById('assistant-send-btn');
  var input = document.getElementById('assistant-input');
  if(sendBtn){ sendBtn.disabled = isLoading; sendBtn.textContent = isLoading ? '...' : 'Send'; }
  if(input) input.disabled = isLoading;
}
async function callAssistantAPI(){
  const r = await fetch(DRIVE_AUTH_SERVER+'/api/claude-messages', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({messages:assistantMessages, tools:ASSISTANT_TOOLS, system:ASSISTANT_SYSTEM_PROMPT})
  });
  const data = await r.json();
  if(!r.ok) throw new Error((data && (data.error && data.error.message || data.error_description || data.error)) || 'Assistant request failed');
  return data;
}
async function handleAssistantReply(reply){
  assistantMessages.push({role:'assistant', content:reply.content});
  var textParts = (reply.content||[]).filter(function(b){return b.type==='text';}).map(function(b){return b.text;});
  if(textParts.length) assistantMsgBubble('assistant', textParts.join('\n'));

  var toolUses = (reply.content||[]).filter(function(b){return b.type==='tool_use';});
  if(!toolUses.length) return;

  var toolResults = toolUses.map(function(tu){
    var result;
    try{ result = runAssistantTool(tu.name, tu.input); }
    catch(e){ result = {error:e.message}; }
    assistantMsgBubble('action', describeToolResult(tu.name, tu.input||{}, result));
    return {type:'tool_result', tool_use_id:tu.id, content:JSON.stringify(result)};
  });
  render();
  assistantMessages.push({role:'user', content:toolResults});
  var nextReply = await callAssistantAPI();
  await handleAssistantReply(nextReply);
}
async function sendAssistantMessage(userText){
  assistantMsgBubble('user', userText);
  assistantMessages.push({role:'user', content:userText});
  setAssistantLoading(true);
  try{
    var reply = await callAssistantAPI();
    await handleAssistantReply(reply);
  }catch(e){
    assistantMsgBubble('error', 'Something went wrong: '+e.message);
  }
  setAssistantLoading(false);
}
