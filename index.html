<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miles Man CRM</title>
<script src="https://apis.google.com/js/api.js"></script>
<style>
html,body{margin:0;padding:0;height:100%;background:#fff;color:#111;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:14px}
*{box-sizing:border-box}
#app{display:flex;height:100vh}
#sidebar{width:210px;background:#f7f7f8;border-right:1px solid #e0e0e0;display:flex;flex-direction:column;flex-shrink:0}
.logo-area{padding:18px 16px 14px;border-bottom:1px solid #e0e0e0}
.logo-tag{font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:#2563eb;margin-bottom:2px}
.logo-name{font-size:17px;font-weight:700;color:#111}
.logo-sub{font-size:11px;color:#888;margin-top:3px}
nav{padding:10px 8px}
#sidebar{overflow-y:auto}
.nb{display:flex;align-items:center;gap:8px;width:100%;padding:9px 10px;border-radius:8px;border:none;background:transparent;color:#555;cursor:pointer;font-size:13px;font-family:inherit;text-align:left;margin-bottom:2px}
.nb:hover{background:#ebebed}
.nb.active{background:#dbeafe;color:#1d4ed8;font-weight:600}
.nc{margin-left:auto;font-size:10px;background:#e5e7eb;color:#555;border-radius:20px;padding:1px 7px}
.nb.active .nc{background:#bfdbfe;color:#1d4ed8}
.sb-footer{padding:12px;border-top:1px solid #e0e0e0;flex-shrink:0}
.sync-btn{width:100%;padding:7px;border-radius:7px;border:1px solid #d1d5db;background:#fff;color:#2563eb;cursor:pointer;font-size:12px;font-family:inherit;margin-bottom:6px}
.sync-btn.synced{color:#059669;border-color:#6ee7b7;background:#f0fdf4}
.io-row{display:flex;gap:5px;margin-bottom:8px}
.io-btn{flex:1;padding:6px;border-radius:6px;border:1px solid #e0e0e0;background:#fff;color:#555;cursor:pointer;font-size:11px;font-family:inherit}
.note-entry{margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #f0f0f0}
.note-entry:last-child{border-bottom:none;margin-bottom:0}
.note-ts{font-size:10px;font-weight:600;color:#2563eb;margin-bottom:4px;letter-spacing:.03em}
.note-txt{width:100%;padding:7px 10px;border-radius:6px;border:1px solid #e5e7eb;font-size:13px;font-family:inherit;color:#111;background:#fff;resize:vertical;box-sizing:border-box}
.note-ts-link{cursor:pointer;text-decoration:underline;color:#2563eb;font-size:10px;font-weight:600;letter-spacing:.03em;}
.note-type-sel{font-size:11px;padding:2px 6px;border-radius:5px;border:1px solid #d1d5db;background:#fff;color:#374151;font-family:inherit;cursor:pointer;margin-left:8px;}
.note-type-badge{display:inline-block;padding:1px 8px;border-radius:12px;font-size:10px;font-weight:600;margin-left:8px;vertical-align:middle;}
.nt-email-sent{background:#dbeafe;color:#1e40af;}
.nt-email-received{background:#d1fae5;color:#065f46;}
.nt-initial-call{background:#fef3c7;color:#92400e;}
.nt-follow-up{background:#f3e8ff;color:#6b21a8;}
.nt-general{background:#f3f4f6;color:#374151;}
.nt-text-message{background:#fce7f3;color:#9d174d;}
.nt-lead{background:#fef9c3;color:#713f12;}
.nt-blue{background:#dbeafe;color:#1e40af;}
.nt-mailchimp{background:#ede9fe;color:#5b21b6;}
.nt-facebook{background:#dbeafe;color:#1d4ed8;}
.note-ts-link:hover{color:#1d4ed8}
#note-expand-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:2000;display:none;align-items:center;justify-content:center;padding:20px}
#note-expand-overlay.open{display:flex}
#note-expand-box{background:#fff;border-radius:12px;padding:28px;width:100%;max-width:780px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.2)}
#note-expand-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-shrink:0}
#note-expand-ts{font-size:13px;font-weight:600;color:#2563eb}
#note-expand-close{background:none;border:none;cursor:pointer;color:#888;font-size:22px;line-height:1;font-family:inherit}
#note-expand-body{flex:1;overflow-y:auto;font-size:14px;color:#111;line-height:1.7;white-space:pre-wrap;word-break:break-word;border:1px solid #e5e7eb;border-radius:8px;padding:16px;background:#fafafa}
.footer-txt{font-size:10px;color:#aaa}
.menu-toggle-btn{width:100%;padding:8px;border-radius:7px;border:1px solid #e0e0e0;background:#fff;color:#374151;cursor:pointer;font-size:12px;font-weight:600;font-family:inherit;margin-bottom:4px;display:flex;align-items:center;justify-content:space-between}
.menu-toggle-btn:hover{background:#f7f7f8}
.menu-toggle-btn.open .menu-caret{transform:rotate(90deg);display:inline-block}
.menu-caret{font-size:10px;transition:transform .15s;display:inline-block}
.menu-group{padding-left:6px;border-left:2px solid #e5e7eb;margin-left:4px;margin-bottom:6px}

/* ── Mobile nav ── */
#mobile-nav-toggle{display:none;position:fixed;top:12px;left:12px;z-index:1200;background:#2563eb;color:#fff;border:none;border-radius:8px;padding:8px 12px;font-size:18px;cursor:pointer;line-height:1}
#sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1100}

@media(max-width:700px){
  #mobile-nav-toggle{display:block}
  #sidebar{position:fixed;left:-220px;top:0;bottom:0;z-index:1150;transition:left .2s ease;box-shadow:4px 0 20px rgba(0,0,0,.15);overflow-y:auto}
  #sidebar.open{left:0}
  #sidebar-overlay.open{display:block}
  #main{padding:56px 14px 80px;width:100%}
  #app{flex-direction:column}

  /* Stack tables on mobile */
  table,thead,tbody,th,td,tr{display:block}
  thead tr{display:none}
  td{padding:4px 8px;font-size:13px;border-bottom:none}
  td:before{font-size:10px;font-weight:700;color:#888;text-transform:uppercase;display:block;margin-bottom:1px}
  tr{border:1px solid #e5e7eb;border-radius:8px;margin-bottom:8px;padding:8px;background:#fff}

  /* Client table mobile labels */
  .tbl-wrap table tr td:nth-child(1):before{content:'Client'}
  .tbl-wrap table tr td:nth-child(2):before{content:'Contact'}
  .tbl-wrap table tr td:nth-child(3):before{content:'Trips'}
  .tbl-wrap table tr td:nth-child(4):before{content:'Notes'}
  .tbl-wrap table tr td:nth-child(5):before{content:'Joined'}

  /* Planner table mobile labels (overrides the client labels above by class specificity) */
  .tbl-wrap table.tbl-planner tr td:nth-child(1):before{content:none}
  .tbl-wrap table.tbl-planner tr td:nth-child(2):before{content:'Client'}
  .tbl-wrap table.tbl-planner tr td:nth-child(3):before{content:'Task'}
  .tbl-wrap table.tbl-planner tr td:nth-child(4):before{content:'Due Date'}
  .tbl-wrap table.tbl-planner tr td:nth-child(5):before{content:'Trip'}

  /* Stats grid 2 col on mobile */
  .stats-grid{grid-template-columns:repeat(2,1fr)}

  /* Two col becomes one col */
  .two-col{grid-template-columns:1fr}
  .email-two-col{grid-template-columns:1fr}
  .fg{grid-template-columns:1fr}
  .full{grid-column:1}

  /* Modal full screen */
  .modal{width:100%;max-height:95vh;border-radius:12px 12px 0 0;position:fixed;bottom:0;left:0;right:0}
  .overlay{align-items:flex-end}

  /* Page header stack */
  .page-hdr{flex-direction:column;align-items:flex-start;gap:10px}

  /* Calendar */
  .cal-grid{gap:1px}
  .cal-cell{min-height:50px;padding:2px}
  .cal-trip{font-size:9px;padding:1px 3px}
  .cal-month-label{font-size:13px;min-width:120px}
  .cal-nav-btn{padding:4px 8px;font-size:12px}

  /* Search row stack */
  .search-row{flex-direction:column}

  /* Report filter stack */
  .report-filter{flex-direction:column}
  .report-filter input,.report-filter select{width:100%}
}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:8px}
.cal-header-cell{text-align:center;font-size:11px;font-weight:700;color:#888;padding:6px 0;text-transform:uppercase;letter-spacing:.05em}
.cal-cell{min-height:80px;border:1px solid #e5e7eb;border-radius:6px;padding:4px;background:#fff;vertical-align:top}
.cal-cell.today{background:#eff6ff;border-color:#93c5fd}
.cal-cell.other-month{background:#f9f9f9;opacity:.6}
.cal-day-num{font-size:11px;font-weight:600;color:#888;margin-bottom:3px}
.cal-day-num.today-num{background:#2563eb;color:#fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:10px}
.cal-trip{font-size:10px;padding:2px 5px;border-radius:3px;margin-bottom:2px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.cal-trip-start{background:#dbeafe;color:#1e40af;border-left:3px solid #2563eb}
.template-card{border:1px solid #e5e7eb;border-radius:8px;padding:12px 16px;cursor:pointer;margin-bottom:8px;transition:border-color .15s}
.template-card:hover,.template-card.selected{border-color:#2563eb;background:#eff6ff}
.template-card-name{font-size:13px;font-weight:600;color:#111}
.template-card-desc{font-size:11px;color:#888;margin-top:2px}
.email-preview{border:1px solid #e5e7eb;border-radius:8px;padding:16px;background:#fafafa;font-size:13px;line-height:1.7;white-space:pre-wrap;min-height:120px;color:#111}
.email-two-col{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start}
.vendor-card{border:1px solid #e5e7eb;border-radius:10px;padding:16px;margin-bottom:10px;background:#fff}
.vendor-card:hover{border-color:#2563eb;box-shadow:0 2px 8px rgba(37,99,235,.08)}
.vendor-type-supplier{background:#dbeafe;color:#1e40af}
.vendor-type-referral{background:#d1fae5;color:#065f46}
.vendor-stat{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:#555;background:#f3f4f6;border-radius:6px;padding:3px 10px;margin-right:6px;margin-top:6px}
.cal-trip-end{background:#d1fae5;color:#065f46;border-left:3px solid #059669}
.cal-trip-span{background:#f3f4f6;color:#374151;border-left:3px solid #9ca3af}
.cal-nav{display:flex;align-items:center;gap:12px}
.cal-nav-btn{padding:6px 14px;border-radius:7px;border:1px solid #d1d5db;background:#fff;cursor:pointer;font-size:13px;font-family:inherit;color:#374151}
.cal-nav-btn:hover{background:#f3f4f6}
.cal-month-label{font-size:16px;font-weight:700;color:#111;min-width:160px;text-align:center}
.report-filter{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;align-items:flex-end}
.report-filter label{font-size:11px;font-weight:600;color:#666;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:4px}
.report-filter input,.report-filter select{padding:8px 11px;border-radius:7px;border:1px solid #d1d5db;font-size:13px;font-family:inherit;color:#111;background:#fafafa}
.report-run-btn{padding:9px 18px;border-radius:8px;border:none;background:#2563eb;color:#fff;cursor:pointer;font-size:13px;font-weight:600;font-family:inherit}
.report-export-btn{padding:9px 18px;border-radius:8px;border:1px solid #d1d5db;background:#fff;color:#374151;cursor:pointer;font-size:13px;font-family:inherit}
.report-table{width:100%;border-collapse:collapse;margin-top:4px}
.report-table th{text-align:left;padding:9px 12px;font-size:11px;font-weight:600;color:#888;border-bottom:1px solid #e5e7eb;text-transform:uppercase;letter-spacing:.05em}
.report-table td{padding:10px 12px;font-size:13px;color:#444;border-bottom:1px solid #f0f0f0;vertical-align:top}
.report-table td.note-cell{max-width:500px;white-space:pre-wrap;word-break:break-word;line-height:1.5}
.rpt-tab-btn{padding:10px 16px;border:none;background:none;color:#888;cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;border-bottom:2px solid transparent}
.rpt-tab-btn.active{color:#2563eb;border-bottom-color:#2563eb}
.rpt-tab-btn:hover{color:#374151}
#main{flex:1;overflow-y:auto;padding:24px 28px;background:#fff}
.page-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.page-title{font-size:22px;font-weight:700;color:#111}
.add-btn{padding:9px 18px;border-radius:8px;border:none;background:#2563eb;color:#fff;cursor:pointer;font-size:13px;font-weight:600;font-family:inherit}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat{background:#f7f7f8;border:1px solid #e5e7eb;border-radius:10px;padding:14px 16px}
.stat-lbl{font-size:11px;color:#888;margin-bottom:4px}
.stat-val{font-size:24px;font-weight:700;color:#111}
.two-col{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:16px}
.card-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.card-title{font-size:14px;font-weight:600;color:#111}
.view-all{font-size:12px;color:#2563eb;background:none;border:none;cursor:pointer;font-family:inherit}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:9px 12px;font-size:11px;font-weight:600;color:#888;border-bottom:1px solid #e5e7eb;white-space:nowrap;text-transform:uppercase;letter-spacing:.05em}
td{padding:10px 12px;font-size:13px;color:#444;border-bottom:1px solid #f0f0f0;vertical-align:middle}
td.n{color:#111;font-weight:600}
tr:last-child td{border-bottom:none}
.tbl-wrap{border:1px solid #e5e7eb;border-radius:10px;overflow:hidden}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600}
.b-green{background:#d1fae5;color:#065f46}
.b-amber{background:#fef3c7;color:#92400e}
.b-blue{background:#dbeafe;color:#1e40af}
.b-red{background:#fee2e2;color:#991b1b}
.b-gray{background:#f3f4f6;color:#374151}
.av{width:30px;height:30px;border-radius:50%;background:#dbeafe;color:#1e40af;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.search-row{display:flex;gap:8px;margin-bottom:14px}
.search-row input,.search-row select{padding:8px 12px;border-radius:8px;border:1px solid #d1d5db;font-size:13px;font-family:inherit;color:#111;background:#fff}
.search-row input{flex:1}
.cli-row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;cursor:pointer;margin-bottom:3px}
.cli-row:hover{background:#f7f7f8}
.trips-btn{padding:3px 10px;border-radius:20px;border:1px solid #d1d5db;background:#fff;color:#2563eb;cursor:pointer;font-size:11px;font-family:inherit}
.icon-btn{background:none;border:none;cursor:pointer;padding:4px 6px;border-radius:5px;font-size:15px}
.back-btn{background:none;border:none;color:#888;cursor:pointer;font-size:12px;font-family:inherit;padding:0;margin-top:3px;display:block}
.empty{padding:32px;text-align:center;color:#aaa;font-size:13px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:999}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:12px;border:1px solid #e5e7eb;padding:26px;width:620px;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.modal-wide{width:880px}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-title{font-size:17px;font-weight:700;color:#111}
.close-btn{background:none;border:none;cursor:pointer;color:#888;font-size:20px;font-family:inherit;line-height:1}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:4px}
.full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:11px;font-weight:600;color:#666;text-transform:uppercase;letter-spacing:.06em}
.field input,.field select,.field textarea{padding:8px 11px;border-radius:7px;border:1px solid #d1d5db;font-size:13px;font-family:inherit;color:#111;background:#fafafa}
.field textarea{resize:vertical;min-height:58px}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.cancel-btn{padding:9px 20px;border-radius:8px;border:1px solid #d1d5db;background:#fff;color:#555;cursor:pointer;font-family:inherit;font-size:13px}
.save-btn{padding:9px 20px;border-radius:8px;border:none;background:#2563eb;color:#fff;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600}
#toast{position:fixed;bottom:20px;right:20px;padding:11px 18px;border-radius:9px;font-size:13px;font-weight:600;z-index:1100;display:none}
.t-ok{background:#d1fae5;color:#065f46;border:1px solid #6ee7b7}
.t-err{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
.t-info{background:#dbeafe;color:#1e40af;border:1px solid #93c5fd}
</style>
</head>
<body>
<button id="mobile-nav-toggle">&#9776;</button>
<div id="sidebar-overlay"></div>
<div id="app">
  <div id="sidebar">
    <div class="logo-area">
      <div class="logo-tag">&#9992; Miles Man</div>
      <div class="logo-name">Client CRM</div>
      <div class="logo-sub" id="sync-lbl">&#9679; Saved locally</div>
    </div>
    <nav>
      <button class="nb active" id="nb-dashboard">&#128202; Dashboard</button>
      <button class="nb" id="nb-clients">&#128100; Clients <span class="nc" id="nc-clients">0</span></button>
      <button class="nb" id="nb-trips">&#9992;&#65039; Trips <span class="nc" id="nc-trips">0</span></button>
      <button class="nb" id="nb-vendors">&#127981; Suppliers <span class="nc" id="nc-vendors">0</span></button>
      <button class="nb" id="nb-planner">&#128203; Planner <span class="nc" id="nc-planner">0</span></button>
      <button class="nb" id="nb-reports">&#128202; Reports</button>
      <button class="nb" id="nb-calendar">&#128197; Calendar</button>
      <button class="nb" id="nb-email">&#9993;&#65039; Email</button>
    </nav>
    <div class="sb-footer">
      <button class="sync-btn" id="btn-undo" disabled style="color:#7c3aed;border-color:#c4b5fd;opacity:.4" title="Nothing to undo">&#8630; Undo</button>
      <button class="menu-toggle-btn" data-menu="menu-file">&#128193; File <span class="menu-caret">&#9656;</span></button>
      <div class="menu-group" id="menu-file" style="display:none">
        <button class="sync-btn" id="drive-btn" style="color:#1a73e8;border-color:#93c5fd">&#9729; Backup to Google Drive</button>
        <button class="sync-btn" id="drive-restore-btn" style="color:#1a73e8;border-color:#93c5fd">&#9729; Restore from Google Drive</button>
        <button class="sync-btn" id="btn-drive-signout" style="color:#888;border-color:#ddd;font-size:11px">&#9729;&#65039; Reset Drive Login</button>
        <button class="sync-btn" id="btn-reset-clean-folder" style="color:#888;border-color:#ddd;font-size:11px">&#128193; Choose Cleaned-File Save Folder</button>
        <div class="io-row">
          <button class="io-btn" id="btn-clients-csv">&#11015; Clients CSV</button>
          <button class="io-btn" id="btn-trips-csv">&#11015; Trips CSV</button>
        </div>
        <div class="io-row">
          <button class="io-btn" id="btn-backup">&#11015; Backup</button>
          <button class="io-btn" id="btn-restore">&#11014; Restore</button>
        </div>
      </div>

      <button class="menu-toggle-btn" data-menu="menu-email">&#9993;&#65039; Email <span class="menu-caret">&#9656;</span></button>
      <div class="menu-group" id="menu-email" style="display:none">
        <button class="sync-btn" id="outlook-btn">&#128424; Sync Outlook Emails</button>
        <button class="sync-btn" id="btn-mass-email" style="color:#7c3aed;border-color:#c4b5fd">&#128231; Email Clients</button>
        <button class="sync-btn" id="btn-email-quote" style="color:#7c3aed;border-color:#c4b5fd">&#128176; Email Quote</button>
        <button class="sync-btn" id="btn-log-mailchimp" style="color:#7c3aed;border-color:#c4b5fd">&#128226; Log Mailchimp Campaign</button>
        <button class="sync-btn" id="btn-sync-mailchimp" style="color:#7c3aed;border-color:#c4b5fd">&#128260; Sync Mailchimp Activity</button>
        <button class="sync-btn" id="btn-ms-signout" style="color:#888;border-color:#ddd;font-size:11px">&#128274; Reset Outlook Login</button>
      </div>

      <button class="menu-toggle-btn" data-menu="menu-import">&#128229; Import <span class="menu-caret">&#9656;</span></button>
      <div class="menu-group" id="menu-import" style="display:none">
        <button class="sync-btn" id="btn-import-suppliers-sb" style="color:#059669;border-color:#6ee7b7">&#127981; Import Suppliers CSV</button>
        <button class="sync-btn" id="btn-import-revenue" style="color:#059669;border-color:#6ee7b7">&#128178; Import Revenue CSV</button>
        <button class="sync-btn" id="btn-clean-import-revenue" style="color:#7c3aed;border-color:#c4b5fd">&#129529; Clean &amp; Import Revenue File</button>
        <button class="sync-btn" id="btn-import-csv" style="color:#059669;border-color:#6ee7b7">&#128203; Import Clients CSV</button>

function toLastFirst(name){
  if(!name) return '';

  var parts = name.split(/\s+/);
  if(parts.length < 2) return name;
  var first = parts.slice(0,-1).join(' ');
  var last = parts[parts.length-1];
  return last+', '+first;
}
function toFirstLast(name){
  if(!name) return '';

}

function extractDateFromText(text){
  if(!text) return '';
  // Match patterns like 7/19/26, 12/27/25, 5/29/26
  var m = text.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if(!m) return '';
  var mo=parseInt(m[1],10), da=parseInt(m[2],10), yr=parseInt(m[3],10);
  if(yr<100) yr += 2000;
  if(mo<1||mo>12||da<1||da>31) return '';
  return yr+'-'+String(mo).padStart(2,'0')+'-'+String(da).padStart(2,'0');
}

// ── Storage ───────────────────────────────────────────────────────────────
// Auto Drive backup fails silently (see runAutoDriveBackup) whenever the
// Google sign-in has expired — previously nothing surfaced that, so backups
// could silently stop for hours and a later "Restore from Drive" would then
// overwrite recent local work with that stale copy. This surfaces a warning
// in the sync-lbl instead, and keeps it visible across normal saves rather
// than letting every saveDB() call silently paper over it with "Saved".
const DRIVE_BACKUP_STALE_MS = 20*60*1000; // 20 min — well past the 5 min auto-backup interval
let _driveBackupStale = false;
function formatAgo(ms){
  var mins = Math.round(ms/60000);
  if(mins<60) return mins+'m ago';
  return Math.round(mins/60)+'h ago';
}
function computeDriveStale(){
  var everConnected = !!localStorage.getItem('mm_drive_refresh') || !!localStorage.getItem('mm_last_drive_backup');
  if(!everConnected) return false; // Drive backup was never set up on this device — nothing to warn about
  var lastBackup = parseInt(localStorage.getItem('mm_last_drive_backup')||'0',10);
  return !lastBackup || (Date.now()-lastBackup) > DRIVE_BACKUP_STALE_MS;
}
function updateSyncStatusDisplay(){
  var lbl=document.getElementById('sync-lbl');
  if(!lbl) return;
  _driveBackupStale = computeDriveStale();
  if(_driveBackupStale){
    var lastBackup = parseInt(localStorage.getItem('mm_last_drive_backup')||'0',10);
    var ageText = lastBackup ? formatAgo(Date.now()-lastBackup) : 'never';
    lbl.innerHTML = '&#9888;&#65039; Drive backup stale ('+ageText+')';
    lbl.title = 'Google Drive hasn\'t backed up recently — restoring now could overwrite recent local changes. Click "Backup to Google Drive" in the File menu to reconnect and sync.';
    lbl.style.color = '#dc2626';
  }
}
function saveDB(){
  try{
    localStorage.setItem(LS_KEY,JSON.stringify(db));
    var lbl=document.getElementById('sync-lbl');
    if(lbl){
      if(_driveBackupStale){
        updateSyncStatusDisplay();
      }else{
        var now=new Date();
        var timeStr=now.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
        lbl.innerHTML='&#9679; Saved '+timeStr;
        lbl.style.color='#059669';
        clearTimeout(window._syncLblTimer);
        window._syncLblTimer=setTimeout(function(){
          if(lbl) lbl.style.color='';
        },2000);
      }
    }
  }catch(e){}
}
function loadDB(){
  try{
    const d=JSON.parse(localStorage.getItem(LS_KEY)||'{}');
    db.clients=Array.isArray(d.clients)?d.clients:[];
    db.trips=Array.isArray(d.trips)?d.trips:[];
    db.vendors=Array.isArray(d.vendors)?d.vendors:[];
    db.planner=Array.isArray(d.planner)?d.planner:[];
    // Always normalize client names to 'Last, First' format on every load
    // (safe to run repeatedly since it skips names that already have a comma)
    var migrated=0;
    db.clients.forEach(function(c){
      if(c.name && !c.name.includes(',')){
        c.name=toLastFirst(c.name);
        migrated++;
      }
    });
    if(migrated>0){
      saveDB();
      console.log('[CRM] Normalized '+migrated+' client names to Last, First format');
    }
  }catch(e){db={clients:[],trips:[],vendors:[],planner:[]};}
}

    localStorage.setItem('mm_debug_log', JSON.stringify(prev));
  }catch(e){}
  // Update panel DOM, capped to prevent memory leak from unbounded node accumulation
  const log=$('debug-log');

    const line=document.createElement('div');
    line.style.borderBottom='1px solid #003322';
    line.style.padding='2px 0';
    line.textContent=entry;

    // Cap DOM nodes at 100 to match localStorage cap — remove oldest if exceeded
    while(log.children.length > 100){
      log.removeChild(log.firstChild);
    }
    log.scrollTop=log.scrollHeight;
  }
  console.log('[CRM]', msg);
}

// ── PKCE helpers ─────────────────────────────────────────────────────────
async function generateCodeVerifier(){
  const array = new Uint8Array(32);
  window.crypto.getRandomValues(array);
  return btoa(String.fromCharCode.apply(null, array))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
}
async function generateCodeChallenge(verifier){
  const encoder = new TextEncoder();
  const data = encoder.encode(verifier);
  const digest = await window.crypto.subtle.digest('SHA-256', data);
  return btoa(String.fromCharCode.apply(null, new Uint8Array(digest)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
}
async function msLogin(){
  const verifier = await generateCodeVerifier();
  const challenge = await generateCodeChallenge(verifier);
  localStorage.setItem('mm_pkce_verifier', verifier);
  debugLog('PKCE verifier generated, redirecting...');
  const params=new URLSearchParams({
    client_id:MS_CLIENT_ID,response_type:'code',redirect_uri:MS_REDIRECT,
    scope:MS_SCOPE,response_mode:'query',state:'outlooksync',
    code_challenge:challenge,code_challenge_method:'S256'
  });
  window.location.href='https://login.microsoftonline.com/'+MS_TENANT_ID+'/oauth2/v2.0/authorize?'+params.toString();
}
async function exchangeCodeForToken(code){

  debugLog('PKCE verifier found: '+(verifier?'yes ('+verifier.slice(0,10)+'...)':'NO - missing!'));
  const params = new URLSearchParams();
  params.set('client_id', MS_CLIENT_ID);
  params.set('grant_type', 'authorization_code');

  params.set('code_verifier', verifier);

    method:'POST',

  debugLog('Token response status: '+r.status+' error: '+(d.error||'none')+' desc: '+(d.error_description||'').slice(0,80));
  if(!r.ok) throw new Error(d.error_description||d.error||'Token exchange failed');
  localStorage.setItem('mm_ms_token',d.access_token);
  localStorage.setItem('mm_ms_expiry',String(Date.now()+(d.expires_in-60)*1000));

async function refreshMsToken(){

  params.set('grant_type', 'refresh_token');
  params.set('refresh_token', rt);
  params.set('scope', MS_SCOPE);
  const r=await fetch('https://login.microsoftonline.com/'+MS_TENANT_ID+'/oauth2/v2.0/token',{
    method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},

  });

  if(!r.ok) throw new Error(d.error_description||'Refresh failed');
  localStorage.setItem('mm_ms_token',d.access_token);
  localStorage.setItem('mm_ms_expiry',String(Date.now()+(d.expires_in-60)*1000));
  if(d.refresh_token) localStorage.setItem('mm_ms_refresh',d.refresh_token);
  return d.access_token;
}
async function getValidMsToken(autoRedirect){
  if(msTokenValid()) return getMsToken();
  const rt = localStorage.getItem('mm_ms_refresh');
  if(rt){
    try{ return await refreshMsToken(); }
    catch(e){
      debugLog('Refresh failed, clearing tokens');
      localStorage.removeItem('mm_ms_token');
      localStorage.removeItem('mm_ms_refresh');
      localStorage.removeItem('mm_ms_expiry');
    }
  }
  // Only redirect if explicitly requested (user clicked sync)
  if(autoRedirect){
    debugLog('Redirecting to Microsoft login...');
    msLogin(); // async - starts PKCE flow
  }
  return null;
}
// Fetches inbox + sent messages ONCE for the whole sync (not once per client).
// Graph doesn't reliably support filtering by from/emailAddress/address combined
// with $orderby (rejected as "too complex" even with advanced-query headers), so
// both folders are fetched by date range only and matched against clients in memory.
async function fetchMailbox(token,lastSyncDate){
  const errors = [];

  // No lastSyncDate means "full sync" — use a wide window (5 years) rather than
  // silently limiting to 90 days, since callers passing null expect everything.
  const since = lastSyncDate || (function(){
    const d = new Date();
    d.setFullYear(d.getFullYear()-5);
    return d.toISOString();
  })();
  const sinceParam = encodeURIComponent(since);

  debugLog('Fetching mailbox since: '+since.slice(0,10));

  // Follow @odata.nextLink to page through all results, up to a safety cap
  // so a single sync can't run forever on a huge mailbox.
  var truncated = false;
  async function fetchAllPages(url, label){
    var all = [];
    var next = url;
    var pages = 0;
    var MAX_PAGES = 80; // 80 x 100 = up to 8000 messages per folder, fetched once for the whole sync
    var headers = {Authorization:'Bearer '+token};
    while(next && pages < MAX_PAGES){
      pages++;
      let r = await fetch(next,{headers:headers});
      if(r.status===429){
        const retryAfter = parseInt(r.headers.get('Retry-After')||'2',10);
        debugLog(label+': throttled (429), retrying after '+retryAfter+'s...');
        await new Promise(res=>setTimeout(res,retryAfter*1000));
        r = await fetch(next,{headers:headers});
      }
      const d = await r.json();
      if(!r.ok){
        const msg=d.error&&d.error.message||'status '+r.status;
        debugLog(label+' error (page '+pages+'): '+msg);
        throw new Error(label+': '+msg);
      }
      all.push.apply(all,(d.value||[]));
      next = d['@odata.nextLink']||null;
    }
    if(next){
      debugLog(label+': stopped after '+MAX_PAGES+' pages ('+all.length+' messages) — there may be more');
      truncated = true;
    }
    return all;
  }

  let inbox=[];
  try{
    const u1 = 'https://graph.microsoft.com/v1.0/me/messages'+
      '?$select=subject,receivedDateTime,from,toRecipients,body,isDraft'+
      '&$orderby=receivedDateTime desc&$top=100'+
      '&$filter=receivedDateTime+ge+'+sinceParam;
    debugLog('Fetching inbox...');
    inbox = await fetchAllPages(u1,'Inbox');
    debugLog('Inbox: count='+inbox.length);
  }catch(e){ debugLog('Inbox error: '+e.message); errors.push('Inbox: '+e.message); }

  let sent=[];
  try{
    const u2 = 'https://graph.microsoft.com/v1.0/me/mailFolders/SentItems/messages'+
      '?$select=subject,receivedDateTime,from,toRecipients,ccRecipients,bccRecipients,body,isDraft'+
      '&$orderby=receivedDateTime desc&$top=100'+
      '&$filter=receivedDateTime+ge+'+sinceParam;
    debugLog('Fetching sent...');
    sent = await fetchAllPages(u2,'Sent');
    debugLog('Sent: count='+sent.length);
  }catch(e){ debugLog('Sent error: '+e.message); errors.push('Sent: '+e.message); }

  return {inbox:inbox,sent:sent,errors:errors,truncated:truncated};
}
function matchInbox(inbox,clientLower){
  return inbox.filter(function(m){
    return (m.from&&m.from.emailAddress&&m.from.emailAddress.address||'').toLowerCase()===clientLower;
  });
}
function matchSent(sent,clientLower){
  return sent.filter(function(m){
    const addrs=[].concat(m.toRecipients||[],m.ccRecipients||[],m.bccRecipients||[])
      .map(function(r){return(r.emailAddress&&r.emailAddress.address||'').toLowerCase();});
    return addrs.indexOf(clientLower)>=0;
  });
}
function stripHtml(html){
  return (html||'')
    .replace(/<style[^>]*>[\s\S]*?<\/style>/gi,'')
    .replace(/<script[^>]*>[\s\S]*?<\/script>/gi,'')
    .replace(/<[^>]+>/g,' ')
    .replace(/&nbsp;/g,' ').replace(/&amp;/g,'&')
    .replace(/&lt;/g,'<').replace(/&gt;/g,'>')
    .replace(/&quot;/g,'"').replace(/\s+/g,' ').trim();
}
function escHtml(v){
  return (v==null?'':String(v)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function emailToNote(msg){
  const dt=new Date(msg.receivedDateTime);
  const ts=dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})+' '+dt.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  const isSent=(msg.from&&msg.from.emailAddress&&msg.from.emailAddress.address||'').toLowerCase().includes('themilesman');
  const dir=isSent?'Sent':'Received';
  const noteType=isSent?'Email Sent':'Email Received';
  const subj=msg.subject||'(no subject)';
  const body=msg.body?stripHtml(msg.body.content||''):(msg.bodyPreview||'');
  return {ts:ts,text:dir+': '+subj+(body?'\n'+body:''),source:'outlook',msgId:msg.id,noteType:noteType};
}
async function syncOutlook(){
  const btn=$('outlook-btn');
  const orig=btn.textContent;
  btn.textContent='Syncing...'; btn.disabled=true;
  debugLog('=== Outlook Sync Started ===');
  try{
    let token=await getValidMsToken(true);
    if(!token){
      debugLog('Redirecting to login...');
      btn.textContent=orig;btn.disabled=false;return;
    }
    debugLog('Got token: '+token.slice(0,20)+'...');
    toast('Connected - fetching emails...','info');

    const clients=db.clients.filter(c=>c.email&&c.email.includes('@'));
    debugLog('Clients with email: '+clients.length+' ('+clients.map(c=>c.email).join(', ')+')');
    if(!clients.length){
      toast('Add clients with email addresses first','err');
      btn.textContent=orig;btn.disabled=false;return;
    }

    const lastSync=localStorage.getItem('mm_last_outlook_sync')||null;
    debugLog(lastSync?'Fetching emails since last sync: '+lastSync:'No previous sync found — fetching all emails');

    const syncStartedAt=new Date().toISOString();
    const mailbox=await fetchMailbox(token,lastSync);
    const clientErrors=mailbox.errors.slice();

    let totalNew=0;
    for(const client of clients){
      try{
        const clientLower=client.email.toLowerCase();
        const emails=matchInbox(mailbox.inbox,clientLower).concat(matchSent(mailbox.sent,clientLower));
        debugLog('Emails matched for '+client.email+': '+emails.length);
        if(!emails.length){continue;}

        emails.slice(0,3).forEach(function(m){
          debugLog('  Email: "'+m.subject+'" from '+m.from.emailAddress.address+' on '+m.receivedDateTime);
        });

        const existing=new Set((client.notesLog||[]).filter(n=>n.msgId).map(n=>n.msgId));
        const newNotes=emails.filter(m=>!existing.has(m.id)&&!m.isDraft).map(emailToNote);
        debugLog('New notes to add for '+client.email+': '+newNotes.length);

        if(newNotes.length){
          const notesLog=[...(client.notesLog||[]),...newNotes].sort((a,b)=>new Date(a.ts)-new Date(b.ts));
          db.clients=db.clients.map(c=>c.id===client.id?Object.assign({},c,{notesLog:notesLog}):c);
          totalNew+=newNotes.length;
        }
      }catch(e){
        debugLog('ERROR for '+client.email+': '+e.message);
        console.error('Email match error for '+client.email,e);
        clientErrors.push(client.email+' ('+e.message+')');
      }
    }
    if(mailbox.errors.length){
      debugLog('Not advancing last-sync marker due to fetch errors — this window will be retried next sync');
    }else{
      localStorage.setItem('mm_last_outlook_sync',syncStartedAt);
    }
    saveDB();render();
    btn.textContent=orig;btn.style.color='#059669';btn.style.borderColor='#6ee7b7';
    debugLog('=== Sync Complete: '+totalNew+' new emails, '+clientErrors.length+' error(s) ===');
    if(clientErrors.length){
      toast((totalNew?'Synced '+totalNew+' new emails, but ':'')+clientErrors.length+' error(s) — see Debug Log','err');
    }else if(mailbox.truncated){
      toast((totalNew?'Synced '+totalNew+' new emails, but ':'')+'mailbox has more history than one sync pass could cover — some older emails may be missing. See Debug Log.','err');
    }else{
      toast(totalNew?'Synced '+totalNew+' new emails':'No new emails found','ok');
    }
  }catch(e){
    debugLog('FATAL ERROR: '+e.message);
    console.error('Outlook sync error:',e);
    toast('Sync failed: '+e.message,'err');
    btn.textContent=orig;
  }
  btn.disabled=false;
}

async function getDriveToken(){
  // Return cached token if still valid
  const stored = localStorage.getItem('mm_drive_token');
  const expiry = parseInt(localStorage.getItem('mm_drive_expiry')||'0',10);
  if(stored && Date.now() < expiry) return stored;

  // Try refresh token
  const rt = localStorage.getItem('mm_drive_refresh');
  if(rt){
    try{
      const r = await fetch(DRIVE_AUTH_SERVER+'/api/drive-token',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({grant_type:'refresh_token',refresh_token:rt})
      });
      const d = await r.json();
      if(r.ok && d.access_token){
        localStorage.setItem('mm_drive_token', d.access_token);
        localStorage.setItem('mm_drive_expiry', String(Date.now()+(d.expires_in-60)*1000));
        if(d.refresh_token) localStorage.setItem('mm_drive_refresh', d.refresh_token);
        return d.access_token;
      }
    }catch(e){ debugLog('Drive refresh failed: '+e.message); }
    localStorage.removeItem('mm_drive_refresh');
  }

  // Need fresh login - use PKCE redirect flow
  await driveLogin();
  return null;
}

// Like getDriveToken(), but NEVER redirects to Google login — used for silent
// background auto-backup so we don't yank the user away from what they're doing.
// Returns null if there's no valid cached token and no refresh token to fall back on.
async function getDriveTokenSilent(){
  const stored = localStorage.getItem('mm_drive_token');
  const expiry = parseInt(localStorage.getItem('mm_drive_expiry')||'0',10);
  if(stored && Date.now() < expiry) return stored;

  const rt = localStorage.getItem('mm_drive_refresh');
  if(!rt) return null;
  try{
    const r = await fetch(DRIVE_AUTH_SERVER+'/api/drive-token',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({grant_type:'refresh_token',refresh_token:rt})
    });
    const d = await r.json();
    if(r.ok && d.access_token){
      localStorage.setItem('mm_drive_token', d.access_token);
      localStorage.setItem('mm_drive_expiry', String(Date.now()+(d.expires_in-60)*1000));
      if(d.refresh_token) localStorage.setItem('mm_drive_refresh', d.refresh_token);
      return d.access_token;
    }
  }catch(e){ debugLog('Silent Drive refresh failed: '+e.message); }
  return null;
}

let _pickerApiLoaded = false;
function loadPickerApi(){
  return new Promise(function(resolve){
    if(_pickerApiLoaded) return resolve();
    if(typeof gapi === 'undefined'){
      debugLog('Google API loader (apis.google.com/js/api.js) not available');
      return resolve();
    }
    gapi.load('picker', function(){ _pickerApiLoaded = true; resolve(); });
  });
}

async function openDrivePicker(onPicked){
  const token = await getDriveToken();
  if(!token){ toast('Sign in to Google Drive first','error'); return; } // driveLogin() already redirected if needed
  await loadPickerApi();
  if(typeof google === 'undefined' || !google.picker){
    toast('Drive picker failed to load — check your connection','error');
    return;
  }
  const appId = DRIVE_CLIENT_ID.split('-')[0]; // project number prefix of the OAuth client ID
  const view = new google.picker.DocsView()
    .setIncludeFolders(true)
    .setSelectFolderEnabled(false);
  const picker = new google.picker.PickerBuilder()
    .setAppId(appId)
    .setOAuthToken(token)
    .addView(view)
    .setCallback(function(data){
      if(data.action === google.picker.Action.PICKED){
        const file = data.docs[0];
        onPicked({ name: file.name, url: file.url });
      }
    })
    .build();
  picker.setVisible(true);
}

async function driveLogin(){
  const verifier = await generateCodeVerifier();
  const challenge = await generateCodeChallenge(verifier);
  localStorage.setItem('mm_drive_pkce', verifier);
  localStorage.setItem('mm_drive_action', 'pending'); // remember to continue after redirect
  const params = new URLSearchParams({
    client_id:            DRIVE_CLIENT_ID,
    redirect_uri:         DRIVE_REDIRECT,
    response_type:        'code',
    scope:                DRIVE_SCOPE,
    state:                'drive_auth',
    code_challenge:       challenge,
    code_challenge_method:'S256',
    access_type:          'offline',
    prompt:               'consent'
  });
  debugLog('Redirecting to Google Drive login...');
  window.location.href = 'https://accounts.google.com/o/oauth2/v2/auth?'+params.toString();
}

function checkDriveRedirect(){
  const params = new URLSearchParams(window.location.search);
  const code  = params.get('code');
  const state = params.get('state');
  if(!code || state !== 'drive_auth') return;

  window.history.replaceState({},'',window.location.pathname);
  const verifier = localStorage.getItem('mm_drive_pkce')||'';
  debugLog('Drive auth code received, exchanging...');

  fetch(DRIVE_AUTH_SERVER+'/api/drive-token',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      grant_type:    'authorization_code',
      code:          code,
      redirect_uri:  DRIVE_REDIRECT,
      code_verifier: verifier
    })
  }).then(function(r){return r.json();}).then(function(d){
    if(d.access_token){
      localStorage.setItem('mm_drive_token',   d.access_token);
      localStorage.setItem('mm_drive_expiry',  String(Date.now()+(d.expires_in-60)*1000));
      if(d.refresh_token) localStorage.setItem('mm_drive_refresh', d.refresh_token);
      localStorage.removeItem('mm_drive_pkce');
      driveToken = d.access_token;
      debugLog('Drive token obtained successfully');
      toast('Google Drive connected!','ok');
      // Auto-trigger pending action
      var action = localStorage.getItem('mm_drive_action');
      localStorage.removeItem('mm_drive_action');
      if(action==='backup') driveBackup();
      else if(action==='restore') driveRestore();
    } else {
      debugLog('Drive token exchange failed: '+(d.error||'unknown'));
      if(d.error === 'invalid_grant'){
        toast('Google Drive sign-in expired mid-way — please try again','err');
      } else {
        toast('Google Drive auth failed: '+(d.error_description||d.error),'err');
      }
    }
  }).catch(function(e){
    debugLog('Drive token exchange error: '+e.message);
    toast('Drive auth error: '+e.message,'err');
  });
}
async function findBackupFile(token){
  const q=encodeURIComponent("name='"+BACKUP_FILENAME+"' and trashed=false");
  const r=await fetch('https://www.googleapis.com/drive/v3/files?q='+q+'&orderBy=modifiedTime desc&fields=files(id,name,modifiedTime)',{
    headers:{Authorization:'Bearer '+token}
  });
  const d=await r.json();
  const files = d.files||[];
  if(files.length>1){
    debugLog('WARNING: found '+files.length+' files named "'+BACKUP_FILENAME+'" in Drive — using most recent ('+files[0].modifiedTime+'). Other copies may be stale duplicates worth deleting manually in Drive.');
  }
  return files[0]||null;
}
async function driveBackup(silent){
  const btn=$('drive-btn');
  if(!silent){btn.textContent='Saving...';btn.disabled=true;debugLog('Manual backup clicked...');}
  try{
    if(!driveToken){
      localStorage.setItem('mm_drive_action','backup');
      if(!silent) debugLog('No token cached — requesting one...');
      driveToken=await getDriveToken();
    }
    if(!driveToken){
      if(!silent) debugLog('No token available — redirecting to Google login');
      btn.textContent='Backup to Google Drive';if(!silent)btn.disabled=false;return;
    }
    if(!silent) debugLog('Token OK, uploading backup...');
    const content=JSON.stringify(db,null,2);
    const existing=await findBackupFile(driveToken);
    if(existing){
      const r=await fetch('https://www.googleapis.com/upload/drive/v3/files/'+existing.id+'?uploadType=media',{
        method:'PATCH',headers:{Authorization:'Bearer '+driveToken,'Content-Type':'application/json'},body:content
      });
      if(!silent) debugLog('Manual backup PATCH status: '+r.status);
      if(!r.ok){ throw new Error('Drive returned '+r.status+' on backup upload'); }
    }else{
      const meta=new Blob([JSON.stringify({name:BACKUP_FILENAME,mimeType:'application/json'})],{type:'application/json'});
      const data=new Blob([content],{type:'application/json'});
      const form=new FormData();form.append('metadata',meta);form.append('file',data);
      const r=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{
        method:'POST',headers:{Authorization:'Bearer '+driveToken},body:form
      });
      if(!silent) debugLog('Manual backup POST status: '+r.status);
      if(!r.ok){ throw new Error('Drive returned '+r.status+' on backup upload'); }
    }
    if(!silent){btn.textContent='Backed up to Drive';btn.style.color='#059669';btn.style.borderColor='#6ee7b7';}
    var nowStr=new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
    localStorage.setItem('mm_last_drive_backup', String(Date.now()));
    _driveBackupStale=false;
    var lbl=document.getElementById('sync-lbl');
    if(lbl){ lbl.innerHTML='&#9729; Drive synced '+nowStr; lbl.title=''; lbl.style.color='#1a73e8'; }
    if(!silent){ debugLog('Manual backup finished successfully at '+nowStr); toast('Drive backup saved at '+nowStr,'ok'); }
    console.log('[CRM] Drive backup complete at', nowStr);
  }catch(e){
    console.error(e);driveToken=null;
    if(!silent){ debugLog('Manual backup FAILED: '+e.message); toast('Drive backup failed: '+e,'err'); btn.textContent='Backup to Google Drive'; }
  }
  if(!silent) btn.disabled=false;
}
async function driveRestore(){

    // reused directly here and silently fail against the Drive API).

    }
  }catch(e){
    console.error(e);driveToken=null;
    debugLog('Restore: exception — '+(e&&e.message?e.message:String(e)));
    if(String(e).includes('popup_blocked')){toast('Redirecting to Google login...','info');}
    else{toast('Restore failed: '+e,'err');}
  }
  if(btn){btn.textContent='Restore from Google Drive';btn.disabled=false;}
}

// ── Mailchimp Activity Sync ─────────────────────────────────────────────────
// Mailchimp's API has no CORS support, so this goes through the same
// milesman-auth Vercel proxy used for Google Drive (api/mailchimp.js there
// holds the API key server-side). Pulls each client's send/open/click
// activity for one chosen Mailchimp audience and logs it to their notesLog,
// the same way Outlook sync does.
const MAILCHIMP_LIST_KEY = 'mm_mailchimp_list_id';

// Minimal MD5 (RFC 1321) — Mailchimp's per-member endpoints are keyed by

  function ff(a,b,c,d,x,s,t){return cmn((b&c)|(~b&d),a,b,x,s,t);}
  function gg(a,b,c,d,x,s,t){return cmn((b&d)|(c&~d),a,b,x,s,t);}
  function hh(a,b,c,d,x,s,t){return cmn(b^c^d,a,b,x,s,t);}

      a=ff(a,b,c,d,x[i+4],7,-176418897);d=ff(d,a,b,c,x[i+5],12,1200080426);c=ff(c,d,a,b,x[i+6],17,-1473231341);b=ff(b,c,d,a,x[i+7],22,-45705983);

      a=ff(a,b,c,d,x[i+12],7,1804603682);d=ff(d,a,b,c,x[i+13],12,-40341101);c=ff(c,d,a,b,x[i+14],17,-1502002290);b=ff(b,c,d,a,x[i+15],22,1236535329);
      a=gg(a,b,c,d,x[i+1],5,-165796510);d=gg(d,a,b,c,x[i+6],9,-1069501632);c=gg(c,d,a,b,x[i+11],14,643717713);b=gg(b,c,d,a,x[i],20,-373897302);
      a=gg(a,b,c,d,x[i+5],5,-701558691);d=gg(d,a,b,c,x[i+10],9,38016083);c=gg(c,d,a,b,x[i+15],14,-660478335);b=gg(b,c,d,a,x[i+4],20,-405537848);

      a=hh(a,b,c,d,x[i+5],4,-378558);d=hh(d,a,b,c,x[i+8],11,-2022574463);c=hh(c,d,a,b,x[i+11],16,1839030562);b=hh(b,c,d,a,x[i+14],23,-35309556);
      a=hh(a,b,c,d,x[i+1],4,-1530992060);d=hh(d,a,b,c,x[i+4],11,1272893353);c=hh(c,d,a,b,x[i+7],16,-155497632);b=hh(b,c,d,a,x[i+10],23,-1094730640);
      a=hh(a,b,c,d,x[i+13],4,681279174);d=hh(d,a,b,c,x[i],11,-358537222);c=hh(c,d,a,b,x[i+3],16,-722521979);b=hh(b,c,d,a,x[i+6],23,76029189);
      a=hh(a,b,c,d,x[i+9],4,-640364487);d=hh(d,a,b,c,x[i+12],11,-421815835);c=hh(c,d,a,b,x[i+15],16,530742520);b=hh(b,c,d,a,x[i+2],23,-995338651);
      a=ii(a,b,c,d,x[i],6,-198630844);d=ii(d,a,b,c,x[i+7],10,1126891415);c=ii(c,d,a,b,x[i+14],15,-1416354905);b=ii(b,c,d,a,x[i+5],21,-57434055);
      a=ii(a,b,c,d,x[i+12],6,1700485571);d=ii(d,a,b,c,x[i+3],10,-1894986606);c=ii(c,d,a,b,x[i+10],15,-1051523);b=ii(b,c,d,a,x[i+1],21,-2054922799);
      a=ii(a,b,c,d,x[i+8],6,1873313359);d=ii(d,a,b,c,x[i+15],10,-30611744);c=ii(c,d,a,b,x[i+6],15,-1560198380);b=ii(b,c,d,a,x[i+13],21,1309151649);
      a=ii(a,b,c,d,x[i+4],6,-145523070);d=ii(d,a,b,c,x[i+11],10,-1120210379);c=ii(c,d,a,b,x[i+2],15,718787259);b=ii(b,c,d,a,x[i+9],21,-343485551);

  function rhex(n){
    var hexChr='0123456789abcdef',s='';
    for(var j=0;j<4;j++) s+=hexChr.charAt((n>>(j*8+4))&0x0f)+hexChr.charAt((n>>(j*8))&0x0f);
    return s;
  }
  var utf8=unescape(encodeURIComponent(str));
  var bytes=[];
  for(var i=0;i<utf8.length;i++) bytes.push(utf8.charCodeAt(i));
  var bitLen=bytes.length*8;
  var x=[];
  for(i=0;i<bitLen;i+=8) x[i>>5]|=(bytes[i/8]&0xff)<<(i%32);
  return coreMD5(x,bitLen).map(rhex).join('');

async function mailchimpProxyGet(path){
  const r = await fetch(DRIVE_AUTH_SERVER+'/api/mailchimp?path='+encodeURIComponent(path));
  const d = await r.json();
  if(!r.ok){
    var err = new Error((d && (d.detail||d.error_description||d.title)) || ('Mailchimp API returned '+r.status));
    err.status = r.status;
    throw err;
  }
  return d;
}

async function pickMailchimpList(){
  const d = await mailchimpProxyGet('/lists?count=100');
  const lists = d.lists||[];
  if(!lists.length) throw new Error('No audiences found in this Mailchimp account');
  if(lists.length===1){
    localStorage.setItem(MAILCHIMP_LIST_KEY, lists[0].id);
    debugLog('Mailchimp: auto-selected only audience "'+lists[0].name+'"');
    return lists[0].id;
  }
  return new Promise(function(resolve, reject){
    var opts = lists.map(function(l){
      var count = l.stats&&l.stats.member_count!=null ? l.stats.member_count : '?';
      return '<option value="'+l.id+'">'+l.name+' ('+count+' members)</option>';
    }).join('');
    $('modal').innerHTML =
      '<div class="modal-hdr"><div class="modal-title">Choose Mailchimp Audience</div><button class="close-btn" id="modal-close">&#x2715;</button></div>'+
      '<div class="fg"><div class="field full"><label>Audience to sync from</label><select id="mc-list-pick">'+opts+'</select></div></div>'+
      '<div class="form-actions"><button class="cancel-btn" id="modal-cancel">Cancel</button><button class="save-btn" id="mc-list-pick-save">Use This Audience</button></div>';
    $('overlay').classList.add('open');
    function cancelPick(){ closeModal(); reject(new Error('No audience selected')); }
    $('modal-close').addEventListener('click', cancelPick);
    $('modal-cancel').addEventListener('click', cancelPick);
    $('mc-list-pick-save').addEventListener('click', function(){
      var id = $('mc-list-pick').value;
      localStorage.setItem(MAILCHIMP_LIST_KEY, id);
      closeModal();
      resolve(id);
    });
  });
}

async function getMailchimpListId(){
  var id = localStorage.getItem(MAILCHIMP_LIST_KEY);
  return id || await pickMailchimpList();
}

// Fetches the most recently SENT campaign and its full body (plain_text,
// falling back to stripped HTML — verified against the real API that
// plain_text is populated directly, no stripping needed in practice).
async function getLatestSentCampaign(){
  const d = await mailchimpProxyGet('/campaigns?count=1&sort_field=send_time&sort_dir=DESC&status=sent');
  const c = (d.campaigns||[])[0];
  if(!c) throw new Error('No sent campaigns found in this Mailchimp account');
  const content = await mailchimpProxyGet('/campaigns/'+c.id+'/content');
  var body = (content.plain_text||'').trim();
  if(!body && content.html) body = stripHtml(content.html);
  return {
    id: c.id,
    subject: (c.settings && (c.settings.subject_line || c.settings.title)) || '(no subject)',
    sendTime: c.send_time,
    body: body
  };
}

async function syncMailchimpEmails(){
  const btn=$('btn-sync-mailchimp');
  const orig=btn?btn.textContent:'';
  if(btn){btn.textContent='Syncing...';btn.disabled=true;}
  try{
    debugLog('=== Mailchimp Sync Started ===');
    const listId = await getMailchimpListId();
    debugLog('Mailchimp: using audience '+listId);

    const campaign = await getLatestSentCampaign();
    debugLog('Mailchimp: latest campaign "'+campaign.subject+'" sent '+campaign.sendTime+' ('+campaign.body.length+' body chars)');

    const clients = db.clients.filter(function(c){return c.email && c.email.includes('@');});
    if(!clients.length){ toast('Add clients with email addresses first','err'); if(btn){btn.textContent=orig;btn.disabled=false;} return; }

    const mcKey = 'sent|'+campaign.id;
    const dt = new Date(campaign.sendTime);
    const ts = !isNaN(dt) ? dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})+' '+dt.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}) : tsNow();
    const noteText = 'Mailchimp: '+campaign.subject+(campaign.body?'\n'+campaign.body:'');

    var totalNew=0, notRecipient=0, errors=0;
    for(const client of clients){
      try{
        const already = (client.notesLog||[]).some(function(n){return n.mcKey===mcKey;});
        if(already) continue;

        const hash = md5hex(client.email.trim().toLowerCase());
        var feed;
        try{
          feed = await mailchimpProxyGet('/lists/'+listId+'/members/'+hash+'/activity-feed?count=50');
        }catch(feedErr){
          feed = await mailchimpProxyGet('/lists/'+listId+'/members/'+hash+'/activity?count=50');
        }
        const items = feed.activity||[];
        const wasSent = items.some(function(it){
          var action = it.activity_type || it.action;
          return action==='sent' && it.campaign_id===campaign.id;
        });
        if(!wasSent){ notRecipient++; continue; }

        const note = {ts:ts, text:noteText, noteType:'Mailchimp Email Sent', source:'mailchimp', mcKey:mcKey};
        const notesLog = (client.notesLog||[]).concat([note]);
        db.clients = db.clients.map(function(c){return c.id===client.id?Object.assign({},c,{notesLog:notesLog}):c;});
        totalNew++;
      }catch(e){
        if(e && e.status===404){ notRecipient++; }
        else { errors++; debugLog('Mailchimp: error for '+client.email+' — '+(e&&e.message||e)); }
      }
    }

    saveDB(); render();
    debugLog('=== Mailchimp Sync Complete: '+totalNew+' new notes, '+notRecipient+' not recipients, '+errors+' error(s) ===');
    toast((totalNew?'Logged latest campaign for '+totalNew+' client'+(totalNew!==1?'s':''):'No new clients to log (already logged, or not a recipient)')+(errors?' — '+errors+' error(s), see Debug Log':''), errors?'err':'ok');
  }catch(e){
    console.error('Mailchimp sync error:', e);
    debugLog('Mailchimp sync FATAL: '+(e&&e.message||e));
    toast('Mailchimp sync failed: '+(e&&e.message||e),'err');
  }
  if(btn){btn.textContent=orig;btn.disabled=false;}
}

// ── Clean Supplier File ───────────────────────────────────────────────────
// Cleans a raw supplier/revenue spreadsheet export (CSV or Excel) using a
// fixed set of rules, then saves the result as a CSV to Google Drive. Does
// not touch db/localStorage — this is a standalone file utility.
let _xlsxLibPromise=null;
function loadXlsxLib(){
  if(!_xlsxLibPromise){
    _xlsxLibPromise=new Promise(function(resolve,reject){
      if(window.XLSX){resolve(window.XLSX);return;}
      var s=document.createElement('script');
      s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
      s.onload=function(){resolve(window.XLSX);};
      s.onerror=function(){reject(new Error('Failed to load the Excel parser library'));};
      document.head.appendChild(s);
    });
  }
  return _xlsxLibPromise;
}
function isEmptyCell(v){
  return v===undefined || v===null || String(v).trim()==='';
}
// Loads a CSV or Excel file into an array of rows (each row an array of
// cell strings), row 0 being whatever is in the file's first row.
function loadTableFromFile(file){
  return new Promise(function(resolve,reject){
    var isExcel = /\.(xlsx|xls)$/i.test(file.name);
    var reader = new FileReader();
    reader.onerror=function(){reject(new Error('Could not read the file'));};
    if(isExcel){
      reader.onload=async function(ev){
        try{
          var XLSX = await loadXlsxLib();
          var wb = XLSX.read(ev.target.result, {type:'array'});
          if(!wb.SheetNames.length){reject(new Error('No sheets found in the Excel file'));return;}
          // Some exports (e.g. QuickBooks Desktop) put an instructions/cover
          // sheet first. Use whichever sheet actually has the most rows
          // rather than assuming the data is on the first one.
          var best = null;
          wb.SheetNames.forEach(function(name){
            var rows = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, defval:'', raw:false, blankrows:false});
            if(!best || rows.length>best.rows.length) best = {name:name, rows:rows};
          });
          if(!best.rows.length){reject(new Error('No data found in any sheet of the Excel file'));return;}
          resolve(best.rows);
        }catch(err){ reject(new Error('Could not parse Excel file: '+err.message)); }
      };
      reader.readAsArrayBuffer(file);
    } else {
      reader.onload=function(ev){
        try{
          var text = ev.target.result;
          var lines = text.split(/\r\n|\n|\r/).filter(function(l){return l.trim()!=='';});
          if(!lines.length){reject(new Error('File appears to be empty'));return;}
          resolve(lines.map(parseCSVLine));
        }catch(err){ reject(new Error('Could not parse CSV file: '+err.message)); }
      };
      reader.readAsText(file);
    }
  });
}
// Applies the fixed cleanup pipeline: drop rows with no value in column E,
// drop columns with no value in any data row, drop rows with an empty
// Class, then drop rows where Name exactly equals Class. Shared by both
// Clean Supplier File and Clean Revenue File — Clean Revenue File's
// cleanup was a strict subset of this, so there was no reason to keep two
// separate pipelines.
function cleanImportTable(rows){
  if(!rows.length) throw new Error('File appears to be empty');
  var header = rows[0];
  var body = rows.slice(1);

  var removedNoColE = 0;
  body = body.filter(function(row){
    var keep = !isEmptyCell(row[4]);
    if(!keep) removedNoColE++;
    return keep;
  });

  var numCols = header.length;
  var colHasValue = new Array(numCols).fill(false);
  body.forEach(function(row){
    for(var i=0;i<numCols;i++){ if(!isEmptyCell(row[i])) colHasValue[i]=true; }
  });
  var keepColIdx = [];
  for(var i=0;i<numCols;i++){ if(colHasValue[i]) keepColIdx.push(i); }
  var removedCols = numCols - keepColIdx.length;
  header = keepColIdx.map(function(i){return header[i];});
  body = body.map(function(row){ return keepColIdx.map(function(i){return row[i]!==undefined?row[i]:'';}); });

  var classIdx = header.findIndex(function(h){return (h||'').toString().trim().toLowerCase()==='class';});
  var nameIdx  = header.findIndex(function(h){return (h||'').toString().trim().toLowerCase()==='name';});
  if(classIdx===-1) throw new Error('Required "class" column not found in the file');
  if(nameIdx===-1) throw new Error('Required "name" column not found in the file');

  var removedEmptyClass = 0;
  body = body.filter(function(row){
    var keep = !isEmptyCell(row[classIdx]);
    if(!keep) removedEmptyClass++;
    return keep;
  });

  var removedNameEqClass = 0;
  body = body.filter(function(row){
    var n=(row[nameIdx]||'').toString().trim();
    var c=(row[classIdx]||'').toString().trim();
    var keep = !(n && c && n===c);
    if(!keep) removedNameEqClass++;
    return keep;
  });

  return {header:header, rows:body, stats:{
    removedNoColE:removedNoColE, removedCols:removedCols,
    removedEmptyClass:removedEmptyClass, removedNameEqClass:removedNameEqClass
  }};
}
function rowsToCSV(header, rows){
  function esc(v){
    v = v===undefined||v===null ? '' : String(v);
    if(/[",\n\r]/.test(v)) return '"'+v.replace(/"/g,'""')+'"';
    return v;
  }
  var lines = [header.map(esc).join(',')];
  rows.forEach(function(row){ lines.push(row.map(esc).join(',')); });
  return lines.join('\r\n');
}
// Saves cleaned CSVs directly into a folder the user picks once (e.g. a
// Google-Drive-for-desktop synced folder like "G:\My Drive\..."), via the
// File System Access API, instead of the browser's default Downloads
// folder. The chosen folder handle is persisted in IndexedDB (localStorage
// can't store handles) so later saves go straight there with no dialog,
// as long as the browser still grants permission. Chrome/Edge only.
const CLEAN_FILE_DIR_KEY = 'mm-clean-file-dir';
function idbGetHandle(key){
  return new Promise(function(resolve,reject){
    var req = indexedDB.open('mm-fs-handles', 1);
    req.onupgradeneeded = function(){ req.result.createObjectStore('handles'); };
    req.onsuccess = function(){
      var tx = req.result.transaction('handles','readonly');
      var getReq = tx.objectStore('handles').get(key);
      getReq.onsuccess = function(){ resolve(getReq.result||null); };
      getReq.onerror = function(){ reject(getReq.error); };
    };
    req.onerror = function(){ reject(req.error); };
  });
}
function idbSetHandle(key, value){
  return new Promise(function(resolve,reject){
    var req = indexedDB.open('mm-fs-handles', 1);
    req.onupgradeneeded = function(){ req.result.createObjectStore('handles'); };
    req.onsuccess = function(){
      var tx = req.result.transaction('handles','readwrite');
      tx.objectStore('handles').put(value, key);
      tx.oncomplete = function(){ resolve(); };
      tx.onerror = function(){ reject(tx.error); };
    };
    req.onerror = function(){ reject(req.error); };
  });
}
// Picks (or re-picks) the save folder. Must be called directly from a real
// click handler with no async work before it — showDirectoryPicker() needs
// an active user gesture, and a chain of awaits (file reads, library loads,
// cleaning) burns through that window, which is exactly what caused
// "Must be handling a user gesture to show a file picker" when this used
// to be triggered lazily from inside the clean-file flow.
async function chooseCleanFileSaveFolder(){
  if(!window.showDirectoryPicker){
    toast("This browser can't choose a save folder (needs Chrome or Edge)",'err');
    return;
  }
  try{
    var handle = await window.showDirectoryPicker({id:'mm-clean-file-dir', mode:'readwrite'});
    await idbSetHandle(CLEAN_FILE_DIR_KEY, handle);
    toast('Cleaned files will now save to "'+handle.name+'"','ok');
  }catch(err){
    if(err && err.name==='AbortError'){ toast('Cancelled — save folder unchanged','info'); return; }
    toast('Could not set save folder: '+err.message,'err');
  }
}
// Read-only lookup used by the clean-file flows themselves. Deliberately
// does NOT call showDirectoryPicker or requestPermission — both need a
// fresh user gesture that's no longer reliably available by this point in
// the flow. If no folder is set (or access was revoked), it throws and
// tells the user to use the dedicated "Choose Save Folder" button instead.
async function getCleanFileSaveDir(){
  var handle = await idbGetHandle(CLEAN_FILE_DIR_KEY);
  if(!handle){
    throw new Error('No save folder chosen yet — click "Choose Cleaned-File Save Folder" in the File menu first, then try again');
  }
  var perm = await handle.queryPermission({mode:'readwrite'});
  if(perm!=='granted'){
    throw new Error('Save folder access was revoked — click "Choose Cleaned-File Save Folder" in the File menu to reconnect it');
  }
  return handle;
}
async function saveCsvToChosenFolder(filename, content){
  var dirHandle = await getCleanFileSaveDir();
  var fileHandle = await dirHandle.getFileHandle(filename, {create:true});
  var writable = await fileHandle.createWritable();
  await writable.write(content);
  await writable.close();
  return dirHandle.name;
}
// Cleans a raw supplier/revenue export (CSV or Excel) and feeds the result
// straight into the same client/supplier-matching + trip-creation pipeline
// as "Import Revenue CSV" (extractRevenueRow/startRevenueImport, defined
// below) — no more manual save-then-reupload round trip. Also best-effort
// saves the cleaned CSV to the chosen folder as an audit copy; that step
// is skipped (not fatal) if no save folder has been chosen yet.
function cleanAndImportRevenue(){
  const i=document.createElement('input');
  i.type='file'; i.accept='.csv,.xlsx,.xls';
  i.onchange=async function(e){
    const file=e.target.files[0];
    if(!file) return;
    try{
      debugLog('Clean & Import Revenue: reading '+file.name);
      const tableRows = await loadTableFromFile(file);
      let result;
      try{
        result = cleanImportTable(tableRows);
      }catch(err){
        toast(err.message,'err');
        debugLog('Clean & Import Revenue: '+err.message);
        return;
      }
      const s = result.stats;
      const summary = 'Removed '+s.removedNoColE+' row'+(s.removedNoColE!==1?'s':'')+' with no value in column E, '+
        s.removedCols+' empty column'+(s.removedCols!==1?'s':'')+', '+
        s.removedEmptyClass+' row'+(s.removedEmptyClass!==1?'s':'')+' with no Class, and '+
        s.removedNameEqClass+' row'+(s.removedNameEqClass!==1?'s':'')+' where Name matched Class. '+
        result.rows.length+' row'+(result.rows.length!==1?'s':'')+' remain.';
      debugLog('Clean & Import Revenue: '+summary);
      if(!confirm(summary+'\n\nImport these as revenue trips (matching or creating clients and suppliers)?')){
        toast('Clean & Import Revenue cancelled','info');
        return;
      }

      try{
        const csv = rowsToCSV(result.header, result.rows);
        const outName = file.name.replace(/\.(csv|xlsx|xls)$/i,'')+'-cleaned.csv';
        const folderName = await saveCsvToChosenFolder(outName, csv);
        debugLog('Clean & Import Revenue: also saved cleaned CSV to "'+folderName+'"');
      }catch(saveErr){
        debugLog('Clean & Import Revenue: skipped saving cleaned CSV — '+saveErr.message);
      }

      const hdrsLower = result.header.map(function(h){return (h||'').toString().toLowerCase().trim();});
      function getCol(row, names, fallbackIdx){
        for(var i=0;i<names.length;i++){
          var idx=hdrsLower.indexOf(names[i]);
          if(idx>=0) return (row[idx]||'').toString().trim();
        }
        return fallbackIdx!==undefined ? (row[fallbackIdx]||'').toString().trim() : '';
      }
      const revenueRows=[];
      result.rows.forEach(function(cols){
        const row=extractRevenueRow(getCol, cols);
        if(row) revenueRows.push(row);
      });
      startRevenueImport(revenueRows);
    }catch(err){
      console.error(err);
      debugLog('Clean & Import Revenue FAILED: '+err.message);
      toast('Clean & Import Revenue failed: '+err.message,'err');
    }
  };
  i.click();
}

function fmtDate(s){
  if(!s) return '';
  var d = new Date(s+'T12:00:00');
  if(isNaN(d)) return s;
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}
function computeNights(depart,ret){
  if(!depart||!ret) return '';
  var d1=new Date(depart+'T12:00:00'), d2=new Date(ret+'T12:00:00');
  if(isNaN(d1)||isNaN(d2)) return '';
  var diff=Math.round((d2-d1)/(1000*60*60*24));
  return diff>0?diff:'';
}
// Copies rendered HTML to the clipboard by selecting a hidden contenteditable
// node and running execCommand('copy') — synchronous, so it can't lose a race
// with the mailto: navigation that follows it (unlike the async Clipboard API,
// whose write can silently not finish before the OS hands off to the mail
// client). Returns whether the copy actually succeeded so callers can be
// honest with the user instead of always claiming success.
function copyHtmlToClipboard(html){
  var container = document.createElement('div');
  container.style.position='fixed';
  container.style.left='-99999px';
  container.style.top='0';
  container.setAttribute('contenteditable','true');
  container.innerHTML = html;
  document.body.appendChild(container);
  var range = document.createRange();
  range.selectNodeContents(container);
  var sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  var ok = false;
  try{ ok = document.execCommand('copy'); }
  catch(e){ debugLog('Clipboard copy failed: '+e.message); }
  sel.removeAllRanges();
  document.body.removeChild(container);
  return ok;
}

      fld('Ship','<select id="eq-ship"><option value="">-- Select cruise line first --</option></select>')+

        fld('Itinerary / Destinations',inp('eq-itinerary','text','','e.g. Eastern Caribbean: Miami, San Juan, St. Thomas'),true)+
        fld('Return Date',inp('eq-return-date','date',''))+
        fld('Number of Guests',inp('eq-guests','number','2'))+
        fld('Deposit Amount',inp('eq-deposit','text','','e.g. 500'))+
        fld('Payment Deadline Date',inp('eq-payment-deadline','date',''))+
        fld('Final Payment Date',inp('eq-final-payment','date',''))+
      '</div>'+
      '<div class="field full"><label>Pricing</label>'+
        '<div id="quote-table-wrap" style="border:1px solid #e5e7eb;border-radius:8px;padding:10px;overflow-x:auto;background:#fafafa">'+
          '<div style="color:#aaa;font-size:12px">Select a cruise line to build the pricing table</div>'+
        '</div>'+
      '</div>'+
      '<div class="field full"><label>Additional Notes</label><textarea id="eq-notes" rows="3" placeholder="Optional extra details to include in the email"></textarea></div>'+
      '<div class="field full" id="eq-preview-wrap" style="display:none">'+
        '<label>Preview</label>'+
        '<iframe id="eq-preview-frame" style="width:100%;height:420px;border:1px solid #e5e7eb;border-radius:8px;background:#fff"></iframe>'+
      '</div>'+
    '</div>'+
    '<div class="form-actions"><button class="cancel-btn" id="modal-cancel">Cancel</button><button class="cancel-btn" id="eq-preview">Preview</button><button class="save-btn" id="eq-send">Email Quote</button></div>';

  $('overlay').classList.add('open');
  $('modal-close').addEventListener('click', closeModal);
  $('modal-cancel').addEventListener('click', closeModal);

  document.getElementById('eq-cruise-line').addEventListener('change', function(){
    var cl = this.value;
    var shipSel = document.getElementById('eq-ship');
    var ships = SHIPS_BY_CRUISE_LINE[cl]||[];
    shipSel.innerHTML = '<option value="">-- Select ship --</option>'+ships.map(function(s){return '<option value="'+s+'">'+s+'</option>';}).join('');
    document.getElementById('quote-table-wrap').innerHTML = cl ? quoteTableHtml(cl) : '<div style="color:#aaa;font-size:12px">Select a cruise line to build the pricing table</div>';
    document.getElementById('eq-template-fields').style.display = QUOTE_TEMPLATE_LINES.indexOf(cl)!==-1 ? 'block' : 'none';
    document.getElementById('eq-preview-wrap').style.display = 'none';
  });

  // Reads the pricing grid + form fields and builds everything the send/preview
  // actions need: the plain-text summary lines (always) and, for template
  // lines, the {cabin,fareType/farePackage,price,...} entries the HTML
  // builders expect.
  function collectQuoteData(){
    var cruiseLine = gv('eq-cruise-line');
    if(!cruiseLine){toast('Select a cruise line','err');return null;}
    var ship = gv('eq-ship');
    var sailingDate = gv('eq-sailing-date');
    var clientId = gv('eq-client');
    var client = clientId ? db.clients.find(function(c){return c.id===clientId;}) : null;
    var notes = gv('eq-notes');

    var cfg = getQuoteConfig(cruiseLine);
    var cols = cfg.priceCols.concat(cfg.insuranceCols).concat(cfg.addonCols);
    var rows = quoteRowLabels(cfg);
    var cellsByKey = {};
    document.querySelectorAll('.quote-cell').forEach(function(el){
      cellsByKey[el.dataset.cabin+'|'+el.dataset.col] = el.value.trim();
    });
    var lines = [];
    var templateEntries = [];
    rows.forEach(function(rowLabel){
      var cellVals = cols.map(function(c){return cellsByKey[rowLabel+'|'+c]||'';});
      if(!cellVals.some(function(v){return v;})) return;
      lines.push(rowLabel+': '+cols.map(function(c,i){return c+' '+(cellVals[i]||'-');}).join(', '));
      var price = cellsByKey[rowLabel+'|Price'];
      if(!price) return;
      if(cruiseLine==='Virgin Voyages'){
        var parts = rowLabel.split(' — ');
        templateEntries.push({cabin:parts[0], fareType:parts[1]||'', price:price, gratuities:cellsByKey[rowLabel+'|Gratuities'], protection:cellsByKey[rowLabel+'|Insurance']});
      }else if(cruiseLine==='Princess'){
        var farePackage = cellsByKey[rowLabel+'|Princess Premier'] ? 'Princess Premier' : (cellsByKey[rowLabel+'|Princess Plus'] ? 'Princess Plus' : 'Standard');
        templateEntries.push({cabin:rowLabel, farePackage:farePackage, price:price, cancellation:cellsByKey[rowLabel+'|Cancellation Insurance'], platinum:cellsByKey[rowLabel+'|Platinum Insurance'], princessPlus:cellsByKey[rowLabel+'|Princess Plus'], princessPremier:cellsByKey[rowLabel+'|Princess Premier']});
      }
    });
    if(!lines.length){toast('Enter at least one price','err');return null;}

    var meta = {
      clientFirstName: client?getFirstName(client.name):'',
      ship: ship,
      itinerary: gv('eq-itinerary'),
      departDate: sailingDate,
      returnDate: gv('eq-return-date'),
      nights: computeNights(sailingDate, gv('eq-return-date')),
      guests: gv('eq-guests'),
      depositAmount: gv('eq-deposit'),
      paymentDeadline: gv('eq-payment-deadline'),
      finalPaymentDate: gv('eq-final-payment')
    };

    return {cruiseLine:cruiseLine, ship:ship, sailingDate:sailingDate, client:client, notes:notes, lines:lines, templateEntries:templateEntries, meta:meta};
  }

  function buildTemplateHtml(d){
    return d.cruiseLine==='Virgin Voyages' ? virginVoyagesQuoteHtml(d.templateEntries, d.meta) : princessQuoteHtml(d.templateEntries, d.meta);
  }
  function buildTemplateBodyHtml(d){
    return d.cruiseLine==='Virgin Voyages' ? virginVoyagesQuoteBodyHtml(d.templateEntries, d.meta) : princessQuoteBodyHtml(d.templateEntries, d.meta);
  }

  document.getElementById('eq-preview').addEventListener('click', function(){
    var d = collectQuoteData();
    if(!d) return;
    if(QUOTE_TEMPLATE_LINES.indexOf(d.cruiseLine)===-1){toast('Preview is only available for Virgin Voyages and Princess quotes','err');return;}
    if(!d.templateEntries.length){toast('Enter a price in at least one row','err');return;}
    var html = buildTemplateHtml(d);
    var wrap = document.getElementById('eq-preview-wrap');
    wrap.style.display = 'block';
    document.getElementById('eq-preview-frame').srcdoc = html;
    wrap.scrollIntoView({behavior:'smooth', block:'nearest'});
  });

  function logQuoteNote(d, subject){
    if(!d.client) return;
    var ts = tsNow();
    var noteBody = ['Cruise Line: '+d.cruiseLine];
    if(d.ship) noteBody.push('Ship: '+d.ship);
    if(d.sailingDate) noteBody.push('Sailing Date: '+d.sailingDate);
    noteBody.push('');
    noteBody = noteBody.concat(d.lines);
    var note = {ts:ts, text:'Quote: '+subject+'\n'+noteBody.join('\n'), noteType:'Email Sent'};
    db.clients = db.clients.map(function(c){
      if(c.id!==d.client.id) return c;
      var notesLog = Array.isArray(c.notesLog)?c.notesLog.concat([note]):[note];
      return Object.assign({},c,{notesLog:notesLog});
    });
    saveDB(); render();
  }
  document.getElementById('eq-send').addEventListener('click', function(){
    var d = collectQuoteData();
    if(!d) return;
    var subject = d.cruiseLine+' Cruise Quote'+(d.ship?' - '+d.ship:'');
    var isTemplateLine = QUOTE_TEMPLATE_LINES.indexOf(d.cruiseLine)!==-1;

    if(isTemplateLine && !d.templateEntries.length){toast('Enter a price in at least one row','err');return;}

    if(isTemplateLine){
      var bodyHtml = buildTemplateBodyHtml(d);
      var copied = copyHtmlToClipboard(bodyHtml);
      var mailto = 'mailto:'+(d.client&&d.client.email?encodeURIComponent(d.client.email):'')+'?subject='+encodeURIComponent(subject);
      window.location.href = mailto;
      if(copied){
        toast('Quote copied — paste into the email body in Outlook (Ctrl+V)'+(d.client?' for '+d.client.name:''),'ok');
      }else{
        toast('Could not copy the quote automatically — click Preview, then select all (Ctrl+A) and copy (Ctrl+C) from there to paste into Outlook','err');
      }
    }else{
      var bodyParts = ['Cruise Line: '+d.cruiseLine];
      if(d.ship) bodyParts.push('Ship: '+d.ship);
      if(d.sailingDate) bodyParts.push('Sailing Date: '+d.sailingDate);
      bodyParts.push('');
      bodyParts=bodyParts.concat(d.lines);
      if(d.notes){bodyParts.push('');bodyParts.push(d.notes);}
      var body = bodyParts.join('\n');
      var mailto2 = 'mailto:'+(d.client&&d.client.email?encodeURIComponent(d.client.email):'')+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
      window.location.href = mailto2;
      toast('Opening Outlook with quote'+(d.client?' for '+d.client.name:''),'ok');
    }

    logQuoteNote(d, subject);
    closeModal();
  });
}
