async function syncMailchimpEmails(){
  const btn=$('btn-sync-mailchimp');
  const orig=btn?btn.textContent:'';
  if(btn){btn.textContent='Syncing...';btn.disabled=true;}
  try{
    debugLog('=== Mailchimp Sync Started ===');
    const listId = await getMailchimpListId();
    debugLog('Mailchimp: using audience '+listId);

    const campaign = await getLatestSentCampaign();
    debugLog('Mailchimp: latest campaign "'+campaign.subject+'" sent '+campaign.sendTime+' ('+campaign.body.length+' body chars)');

    const clients = db.clients.filter(function(c){return c.email && c.email.includes('@');});
    if(!clients.length){ toast('Add clients with email addresses first','err'); if(btn){btn.textContent=orig;btn.disabled=false;} return; }

    const mcKey = 'sent|'+campaign.id;
    const dt = new Date(campaign.sendTime);
    const ts = !isNaN(dt) ? dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})+' '+dt.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}) : tsNow();
    const noteText = 'Mailchimp: '+campaign.subject+(campaign.body?'\n'+campaign.body:'');

    var totalNew=0, notRecipient=0, errors=0;
    for(const client of clients){
      try{
        const already = (client.notesLog||[]).some(function(n){return n.mcKey===mcKey;});
        if(already) continue;

        const hash = md5hex(client.email.trim().toLowerCase());
        var feed;
        try{
          feed = await mailchimpProxyGet('/lists/'+listId+'/members/'+hash+'/activity-feed?count=50');
        }catch(feedErr){
          feed = await mailchimpProxyGet('/lists/'+listId+'/members/'+hash+'/activity?count=50');
        }
        const items = feed.activity||[];
        const wasSent = items.some(function(it){
          var action = it.activity_type || it.action;
          return action==='sent' && it.campaign_id===campaign.id;
        });
        if(!wasSent){ notRecipient++; continue; }

        const note = {ts:ts, text:noteText, noteType:'Mailchimp Email Sent', source:'mailchimp', mcKey:mcKey};
        const notesLog = (client.notesLog||[]).concat([note]);
        db.clients = db.clients.map(function(c){return c.id===client.id?Object.assign({},c,{notesLog:notesLog}):c;});
        totalNew++;
      }catch(e){
        if(e && e.status===404){ notRecipient++; }
        else { errors++; debugLog('Mailchimp: error for '+client.email+' — '+(e&&e.message||e)); }
      }
    }

    saveDB(); render();
    debugLog('=== Mailchimp Sync Complete: '+totalNew+' new notes, '+notRecipient+' not recipients, '+errors+' error(s) ===');
    toast((totalNew?'Logged latest campaign for '+totalNew+' client'+(totalNew!==1?'s':''):'No new clients to log (already logged, or not a recipient)')+(errors?' — '+errors+' error(s), see Debug Log':''), errors?'err':'ok');
  }catch(e){
    console.error('Mailchimp sync error:', e);
    debugLog('Mailchimp sync FATAL: '+(e&&e.message||e));
    toast('Mailchimp sync failed: '+(e&&e.message||e),'err');
  }
  if(btn){btn.textContent=orig;btn.disabled=false;}
}

// ── Clean Supplier File ───────────────────────────────────────────────────
// Cleans a raw supplier/revenue spreadsheet export (CSV or Excel) using a
// fixed set of rules, then saves the result as a CSV to Google Drive. Does
// not touch db/localStorage — this is a standalone file utility.
let _xlsxLibPromise=null;
function loadXlsxLib(){
  if(!_xlsxLibPromise){
    _xlsxLibPromise=new Promise(function(resolve,reject){
      if(window.XLSX){resolve(window.XLSX);return;}
      var s=document.createElement('script');
      s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
      s.onload=function(){resolve(window.XLSX);};
      s.onerror=function(){reject(new Error('Failed to load the Excel parser library'));};
      document.head.appendChild(s);
    });
  }
  return _xlsxLibPromise;
}
function isEmptyCell(v){
  return v===undefined || v===null || String(v).trim()==='';
}
// Loads a CSV or Excel file into an array of rows (each row an array of
// cell strings), row 0 being whatever is in the file's first row.
function loadTableFromFile(file){
  return new Promise(function(resolve,reject){
    var isExcel = /\.(xlsx|xls)$/i.test(file.name);
    var reader = new FileReader();
    reader.onerror=function(){reject(new Error('Could not read the file'));};
    if(isExcel){
      reader.onload=async function(ev){
        try{
          var XLSX = await loadXlsxLib();
          var wb = XLSX.read(ev.target.result, {type:'array'});
          if(!wb.SheetNames.length){reject(new Error('No sheets found in the Excel file'));return;}
          // Some exports (e.g. QuickBooks Desktop) put an instructions/cover
          // sheet first. Use whichever sheet actually has the most rows
          // rather than assuming the data is on the first one.
          var best = null;
          wb.SheetNames.forEach(function(name){
            var rows = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, defval:'', raw:false, blankrows:false});
            if(!best || rows.length>best.rows.length) best = {name:name, rows:rows};
          });
          if(!best.rows.length){reject(new Error('No data found in any sheet of the Excel file'));return;}
          resolve(best.rows);
        }catch(err){ reject(new Error('Could not parse Excel file: '+err.message)); }
      };
      reader.readAsArrayBuffer(file);
    } else {
      reader.onload=function(ev){
        try{
          var text = ev.target.result;
          var lines = text.split(/\r\n|\n|\r/).filter(function(l){return l.trim()!=='';});
          if(!lines.length){reject(new Error('File appears to be empty'));return;}
          resolve(lines.map(parseCSVLine));
        }catch(err){ reject(new Error('Could not parse CSV file: '+err.message)); }
      };
      reader.readAsText(file);
    }
  });
}
// Applies the fixed cleanup pipeline: drop rows with no value in column E,
// drop columns with no value in any data row, drop rows with an empty
// Class, then drop rows where Name exactly equals Class. Shared by both
// Clean Supplier File and Clean Revenue File — Clean Revenue File's
// cleanup was a strict subset of this, so there was no reason to keep two
// separate pipelines.
function cleanImportTable(rows){
  if(!rows.length) throw new Error('File appears to be empty');
  var header = rows[0];
  var body = rows.slice(1);

  var removedNoColE = 0;
  body = body.filter(function(row){
    var keep = !isEmptyCell(row[4]);
    if(!keep) removedNoColE++;
    return keep;
  });

  var numCols = header.length;
  var colHasValue = new Array(numCols).fill(false);
  body.forEach(function(row){
    for(var i=0;i<numCols;i++){ if(!isEmptyCell(row[i])) colHasValue[i]=true; }
  });
  var keepColIdx = [];
  for(var i=0;i<numCols;i++){ if(colHasValue[i]) keepColIdx.push(i); }
  var removedCols = numCols - keepColIdx.length;
  header = keepColIdx.map(function(i){return header[i];});
  body = body.map(function(row){ return keepColIdx.map(function(i){return row[i]!==undefined?row[i]:'';}); });

  var classIdx = header.findIndex(function(h){return (h||'').toString().trim().toLowerCase()==='class';});
  var nameIdx  = header.findIndex(function(h){return (h||'').toString().trim().toLowerCase()==='name';});
  if(classIdx===-1) throw new Error('Required "class" column not found in the file');
  if(nameIdx===-1) throw new Error('Required "name" column not found in the file');

  // A blank Class isn't fatal on its own — extractRevenueRow falls back to
  // Name as the client when Class is empty. Only drop the row here if BOTH
  // are blank, since then there's no client to fall back to at all.
  var removedEmptyClass = 0;
  body = body.filter(function(row){
    var keep = !isEmptyCell(row[classIdx]) || !isEmptyCell(row[nameIdx]);
    if(!keep) removedEmptyClass++;
    return keep;
  });

  var removedNameEqClass = 0;
  body = body.filter(function(row){
    var n=(row[nameIdx]||'').toString().trim();
    var c=(row[classIdx]||'').toString().trim();
    var keep = !(n && c && n===c);
    if(!keep) removedNameEqClass++;
    return keep;
  });

  return {header:header, rows:body, stats:{
    removedNoColE:removedNoColE, removedCols:removedCols,
    removedEmptyClass:removedEmptyClass, removedNameEqClass:removedNameEqClass
  }};
}
function rowsToCSV(header, rows){
  function esc(v){
    v = v===undefined||v===null ? '' : String(v);
    if(/[",\n\r]/.test(v)) return '"'+v.replace(/"/g,'""')+'"';
    return v;
  }
  var lines = [header.map(esc).join(',')];
  rows.forEach(function(row){ lines.push(row.map(esc).join(',')); });
  return lines.join('\r\n');
}
// Saves cleaned CSVs directly into a folder the user picks once (e.g. a
// Google-Drive-for-desktop synced folder like "G:\My Drive\..."), via the
// File System Access API, instead of the browser's default Downloads
// folder. The chosen folder handle is persisted in IndexedDB (localStorage
// can't store handles) so later saves go straight there with no dialog,
// as long as the browser still grants permission. Chrome/Edge only.
const CLEAN_FILE_DIR_KEY = 'mm-clean-file-dir';
function idbGetHandle(key){
  return new Promise(function(resolve,reject){
    var req = indexedDB.open('mm-fs-handles', 1);
    req.onupgradeneeded = function(){ req.result.createObjectStore('handles'); };
    req.onsuccess = function(){
      var tx = req.result.transaction('handles','readonly');
      var getReq = tx.objectStore('handles').get(key);
      getReq.onsuccess = function(){ resolve(getReq.result||null); };
      getReq.onerror = function(){ reject(getReq.error); };
    };
    req.onerror = function(){ reject(req.error); };
  });
}
function idbSetHandle(key, value){
  return new Promise(function(resolve,reject){
    var req = indexedDB.open('mm-fs-handles', 1);
    req.onupgradeneeded = function(){ req.result.createObjectStore('handles'); };
    req.onsuccess = function(){
      var tx = req.result.transaction('handles','readwrite');
      tx.objectStore('handles').put(value, key);
      tx.oncomplete = function(){ resolve(); };
      tx.onerror = function(){ reject(tx.error); };
    };
    req.onerror = function(){ reject(req.error); };
  });
}
// Picks (or re-picks) the save folder. Must be called directly from a real
// click handler with no async work before it — showDirectoryPicker() needs
// an active user gesture, and a chain of awaits (file reads, library loads,
// cleaning) burns through that window, which is exactly what caused
// "Must be handling a user gesture to show a file picker" when this used
// to be triggered lazily from inside the clean-file flow.
async function chooseCleanFileSaveFolder(){
  if(!window.showDirectoryPicker){
    toast("This browser can't choose a save folder (needs Chrome or Edge)",'err');
    return;
  }
  try{
    var handle = await window.showDirectoryPicker({id:'mm-clean-file-dir', mode:'readwrite'});
    await idbSetHandle(CLEAN_FILE_DIR_KEY, handle);
    toast('Cleaned files will now save to "'+handle.name+'"','ok');
  }catch(err){
    if(err && err.name==='AbortError'){ toast('Cancelled — save folder unchanged','info'); return; }
    toast('Could not set save folder: '+err.message,'err');
  }
}
// Read-only lookup used by the clean-file flows themselves. Deliberately
// does NOT call showDirectoryPicker or requestPermission — both need a
// fresh user gesture that's no longer reliably available by this point in
// the flow. If no folder is set (or access was revoked), it throws and
// tells the user to use the dedicated "Choose Save Folder" button instead.
async function getCleanFileSaveDir(){
  var handle = await idbGetHandle(CLEAN_FILE_DIR_KEY);
  if(!handle){
    throw new Error('No save folder chosen yet — click "Choose Cleaned-File Save Folder" in the File menu first, then try again');
  }
  var perm = await handle.queryPermission({mode:'readwrite'});
  if(perm!=='granted'){
    throw new Error('Save folder access was revoked — click "Choose Cleaned-File Save Folder" in the File menu to reconnect it');
  }
  return handle;
}
async function saveCsvToChosenFolder(filename, content){
  var dirHandle = await getCleanFileSaveDir();
  var fileHandle = await dirHandle.getFileHandle(filename, {create:true});
  var writable = await fileHandle.createWritable();
  await writable.write(content);
  await writable.close();
  return dirHandle.name;
}
// Cleans a raw supplier/revenue export (CSV or Excel) and feeds the result
// straight into the same client/supplier-matching + trip-creation pipeline
// as "Import Revenue CSV" (extractRevenueRow/startRevenueImport, defined
// below) — no more manual save-then-reupload round trip. Also best-effort
// saves the cleaned CSV to the chosen folder as an audit copy; that step
// is skipped (not fatal) if no save folder has been chosen yet.
function cleanAndImportRevenue(){
  const i=document.createElement('input');
  i.type='file'; i.accept='.csv,.xlsx,.xls';
  i.onchange=async function(e){
    const file=e.target.files[0];
    if(!file) return;
    try{
      debugLog('Clean & Import Revenue: reading '+file.name);
      const tableRows = await loadTableFromFile(file);
      let result;
      try{
        result = cleanImportTable(tableRows);
      }catch(err){
        toast(err.message,'err');
        debugLog('Clean & Import Revenue: '+err.message);
        return;
      }
      const s = result.stats;
      const summary = 'Removed '+s.removedNoColE+' row'+(s.removedNoColE!==1?'s':'')+' with no value in column E, '+
        s.removedCols+' empty column'+(s.removedCols!==1?'s':'')+', '+
        s.removedEmptyClass+' row'+(s.removedEmptyClass!==1?'s':'')+' with no Class and no Name, and '+
        s.removedNameEqClass+' row'+(s.removedNameEqClass!==1?'s':'')+' where Name matched Class. '+
        result.rows.length+' row'+(result.rows.length!==1?'s':'')+' remain.';
      debugLog('Clean & Import Revenue: '+summary);
      if(!confirm(summary+'\n\nImport these as revenue trips (matching or creating clients and suppliers)?')){
        toast('Clean & Import Revenue cancelled','info');
        return;
      }

      try{
        const csv = rowsToCSV(result.header, result.rows);
        const outName = file.name.replace(/\.(csv|xlsx|xls)$/i,'')+'-cleaned.csv';
        const folderName = await saveCsvToChosenFolder(outName, csv);
        debugLog('Clean & Import Revenue: also saved cleaned CSV to "'+folderName+'"');
      }catch(saveErr){
        debugLog('Clean & Import Revenue: skipped saving cleaned CSV — '+saveErr.message);
      }

      const hdrsLower = result.header.map(function(h){return (h||'').toString().toLowerCase().trim();});
      function getCol(row, names, fallbackIdx){
        for(var i=0;i<names.length;i++){
          var idx=hdrsLower.indexOf(names[i]);
          if(idx>=0) return (row[idx]||'').toString().trim();
        }
        return fallbackIdx!==undefined ? (row[fallbackIdx]||'').toString().trim() : '';
      }
      const revenueRows=[];
      result.rows.forEach(function(cols){
        const row=extractRevenueRow(getCol, cols);
        if(row) revenueRows.push(row);
      });
      startRevenueImport(revenueRows);
    }catch(err){
      console.error(err);
      debugLog('Clean & Import Revenue FAILED: '+err.message);
      toast('Clean & Import Revenue failed: '+err.message,'err');
    }
  };
  i.click();
}

function computeNights(depart,ret){
  if(!depart||!ret) return '';
  var d1=new Date(depart+'T12:00:00'), d2=new Date(ret+'T12:00:00');
  if(isNaN(d1)||isNaN(d2)) return '';
  var diff=Math.round((d2-d1)/(1000*60*60*24));
  return diff>0?diff:'';
}
// Copies rendered HTML to the clipboard by selecting a hidden contenteditable
// node and running execCommand('copy') — synchronous, so it can't lose a race
// with the mailto: navigation that follows it (unlike the async Clipboard API,
// whose write can silently not finish before the OS hands off to the mail
// client). Returns whether the copy actually succeeded so callers can be
// honest with the user instead of always claiming success.
function copyHtmlToClipboard(html){
  var container = document.createElement('div');
  container.style.position='fixed';
  container.style.left='-99999px';
  container.style.top='0';
  container.setAttribute('contenteditable','true');
  container.innerHTML = html;
  document.body.appendChild(container);
  var range = document.createRange();
  range.selectNodeContents(container);
  var sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  var ok = false;
  try{ ok = document.execCommand('copy'); }
  catch(e){ debugLog('Clipboard copy failed: '+e.message); }
  sel.removeAllRanges();
  document.body.removeChild(container);
  return ok;
}

// ── Save a quote PDF to Google Drive ────────────────────────────────────
// Every time a quote is emailed, a PDF copy of the same body (the styled
// template for Virgin Voyages/Princess, or a simple text rendering for any
// other line) gets rendered client-side with html2pdf.js and uploaded into
// a "Miles Man Quotes" Drive folder — a record separate from the note
// logged on the client. Runs fire-and-forget right after the mailto: opens
// so sending the quote itself never waits on rendering/upload; failures
// (no Drive token, network) just toast/log rather than blocking anything.
let _html2pdfLibPromise=null;
function loadHtml2PdfLib(){
  if(!_html2pdfLibPromise){
    _html2pdfLibPromise=new Promise(function(resolve,reject){
      if(window.html2pdf){resolve(window.html2pdf);return;}
      var s=document.createElement('script');
      s.src='https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.2/dist/html2pdf.bundle.min.js';
      s.onload=function(){resolve(window.html2pdf);};
      s.onerror=function(){reject(new Error('Failed to load html2pdf.js'));};
      document.head.appendChild(s);
    });
  }
  return _html2pdfLibPromise;
}
function plainQuoteBodyHtml(bodyParts, subject){
  return '<div style="font-family:Arial,sans-serif;font-size:14px;color:#111;padding:24px;max-width:600px">'+

    '<div style="white-space:pre-wrap;line-height:1.6">'+bodyParts.map(escHtml).join('\n')+'</div>'+
  '</div>';

// Triggers a browser download of a PDF blob — used for the referral
// certificate, since mailto: links have no way to attach a file
// automatically; downloading it here is the closest thing to "attached",
// and the file lands in Downloads ready to drag into the Outlook compose
// window that mailto: opens right alongside it.
function downloadPdfBlob(blob, filename){
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}
async function generateQuotePdfBlob(bodyHtml){
  var html2pdfLib = await loadHtml2PdfLib();
  var container = document.createElement('div');
  // Positioned off left/top would seem like the obvious way to keep this
  // invisible, but html2canvas renders a blank (0-height) canvas for
  // anything placed far outside the viewport, and the same happens with
  // opacity:0 or visibility:hidden — it needs to be somewhere the browser
  // actually paints. A negative z-index keeps it on-screen at (0,0) but
  // tucked behind the app's own (opaque) content, invisible in practice
  // without breaking the capture. Explicit width/height/windowWidth/
  // windowHeight (matched to the container's real rendered size, forced
  // via the offsetHeight read below) are also required — without them
  // html2canvas falls back to measuring the whole window and gets 0.
  container.style.cssText='position:fixed;top:0;left:0;width:650px;background:#fff;z-index:-1';
  container.innerHTML = bodyHtml;
  document.body.appendChild(container);
  void container.offsetHeight; // force layout before measuring
  var w = container.scrollWidth, h = container.scrollHeight;
  try{
    return await html2pdfLib().set({
      margin:10, image:{type:'jpeg',quality:0.95},
      html2canvas:{scale:2, width:w, height:h, windowWidth:w, windowHeight:h},
      jsPDF:{unit:'pt', format:'letter'}
    }).from(container).outputPdf('blob');
  } finally {
    document.body.removeChild(container);
  }
}
// Same html2canvas-into-jsPDF approach as generateQuotePdfBlob, but wider
// and landscape — report tables can run to 5-10+ columns (combined points
// across several travelers, invoice line items), which a 650px portrait
// page would just clip.
async function generateReportPdfBlob(bodyHtml){
  var html2pdfLib = await loadHtml2PdfLib();
  var container = document.createElement('div');
  container.style.cssText='position:fixed;top:0;left:0;width:1000px;background:#fff;z-index:-1';
  container.innerHTML = bodyHtml;
  document.body.appendChild(container);
  void container.offsetHeight;
  var w = container.scrollWidth, h = container.scrollHeight;
  try{
    return await html2pdfLib().set({
      margin:20, image:{type:'jpeg',quality:0.95},
      html2canvas:{scale:2, width:w, height:h, windowWidth:w, windowHeight:h},
      jsPDF:{unit:'pt', format:'letter', orientation:'landscape'}
    }).from(container).outputPdf('blob');
  } finally {
    document.body.removeChild(container);
  }
}

const DRIVE_QUOTES_FOLDER_NAME = 'Miles Man Quotes';
let _driveQuotesFolderId = null;
async function getOrCreateDriveQuotesFolder(token){
  if(_driveQuotesFolderId) return _driveQuotesFolderId;
  var q = encodeURIComponent("name='"+DRIVE_QUOTES_FOLDER_NAME+"' and mimeType='application/vnd.google-apps.folder' and trashed=false");
  var r = await fetch('https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id,name)',{headers:{Authorization:'Bearer '+token}});
  var d = await r.json();
  if(!r.ok) throw new Error('Drive returned '+r.status+' looking up quotes folder');
  if(d.files && d.files.length){ _driveQuotesFolderId = d.files[0].id; return _driveQuotesFolderId; }
  var cr = await fetch('https://www.googleapis.com/drive/v3/files',{
    method:'POST', headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
    body: JSON.stringify({name:DRIVE_QUOTES_FOLDER_NAME, mimeType:'application/vnd.google-apps.folder'})
  });
  var created = await cr.json();
  if(!cr.ok) throw new Error('Drive returned '+cr.status+' creating quotes folder');
  _driveQuotesFolderId = created.id;
  return _driveQuotesFolderId;
}
async function saveQuotePdfToDrive(d, bodyHtml, subject){
  try{
    debugLog('Quote PDF: rendering "'+subject+'"...');
    var blob = await generateQuotePdfBlob(bodyHtml);
    // Silent variant deliberately — this runs unattended right after the
    // mailto: opens, so it must never force-redirect the page to Google's
    // login screen if Drive isn't connected yet (that would hijack the tab
    // away from the email the user is actually trying to send).
    var token = await getDriveTokenSilent();
    if(!token){
      debugLog('Quote PDF: Google Drive not connected — skipped saving (connect via File menu > Backup to Google Drive)');
      toast('Quote PDF not saved — connect Google Drive first (File menu)','info');
      return;
    }
    var folderId = await getOrCreateDriveQuotesFolder(token);
    var filenameParts = [d.client?d.client.name:'Quote', d.cruiseLine||'Quote', d.sailingDate||today()];
    var filename = (filenameParts.join('.')+'.pdf').replace(/[\\/:*?"<>|]/g,'-');
    var meta = new Blob([JSON.stringify({name:filename, mimeType:'application/pdf', parents:[folderId]})], {type:'application/json'});
    var form = new FormData(); form.append('metadata', meta); form.append('file', blob);
    var r = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink', {
      method:'POST', headers:{Authorization:'Bearer '+token}, body:form
    });
    if(!r.ok) throw new Error('Drive returned '+r.status+' saving quote PDF');
    debugLog('Quote PDF saved to Google Drive: "'+filename+'"');
    toast('Quote PDF saved to Google Drive','ok');
  }catch(e){
    console.error(e);
    debugLog('Quote PDF save failed: '+e.message);
    toast('Could not save quote PDF to Drive: '+e.message,'err');
  }
}

    var sailingDate = gv('eq-sailing-date');
    var clientId = gv('eq-client');
    var client = clientId ? db.clients.find(function(c){return c.id===clientId;}) : null;
    var notes = gv('eq-notes');

    var cfg = getQuoteConfig(cruiseLine);
    var cols = cfg.priceCols.concat(cfg.insuranceCols).concat(cfg.addonCols);
    var rows = quoteRowLabels(cfg);
    var cellsByKey = {};
    document.querySelectorAll('.quote-cell').forEach(function(el){
      cellsByKey[el.dataset.cabin+'|'+el.dataset.col] = el.value.trim();
    });
    var lines = [];
    var templateEntries = [];
    rows.forEach(function(rowLabel){
      var cellVals = cols.map(function(c){return cellsByKey[rowLabel+'|'+c]||'';});
      if(!cellVals.some(function(v){return v;})) return;
      lines.push(rowLabel+': '+cols.map(function(c,i){return c+' '+(cellVals[i]||'-');}).join(', '));
      var price = cellsByKey[rowLabel+'|Price'];
      if(!price) return;
      if(cruiseLine==='Virgin Voyages'){
        var parts = rowLabel.split(' — ');
        templateEntries.push({cabin:parts[0], fareType:parts[1]||'', price:price, gratuities:cellsByKey[rowLabel+'|Gratuities'], protection:cellsByKey[rowLabel+'|Insurance']});
      }else if(cruiseLine==='Princess'){
        templateEntries.push({
          cabin:rowLabel,
          price:price,
          fareWithCancellation: cellsByKey[rowLabel+'|Cancellation Insurance'],
          fareWithPlatinum: cellsByKey[rowLabel+'|Platinum Insurance'],
          princessPlus:cellsByKey[rowLabel+'|Princess Plus'],
          princessPremier:cellsByKey[rowLabel+'|Princess Premier']
        });
      }else if(['Royal Caribbean','Ritz Carlton Yachts','Seabourn','Explora Journeys','Windstar'].indexOf(cruiseLine)!==-1){
        templateEntries.push({
          cabin:rowLabel,
          price:price,
          insurance: cellsByKey[rowLabel+'|Insurance'],
          addons: cellsByKey[rowLabel+'|Add-ons']
        });
      }
    });
    if(!lines.length){toast('Enter at least one price','err');return null;}

    var adults = gv('eq-adults');
    var children = gv('eq-children');
    var guestsParts = [];
    if(adults) guestsParts.push(adults+' Adult'+(adults==='1'?'':'s'));
    if(children && children!=='0') guestsParts.push(children+' Child'+(children==='1'?'':'ren'));

    var meta = {
      clientFirstName: client?getFirstName(client.name):'',
      ship: ship,
      itinerary: gv('eq-itinerary'),
      departDate: sailingDate,
      returnDate: gv('eq-return-date'),
      nights: computeNights(sailingDate, gv('eq-return-date')),
      guests: guestsParts.join(', '),
      depositAmount: gv('eq-deposit'),
      paymentDeadline: gv('eq-payment-deadline'),
      finalPaymentDate: gv('eq-final-payment'),
      notes: notes
    };

    return {cruiseLine:cruiseLine, ship:ship, sailingDate:sailingDate, client:client, notes:notes, lines:lines, templateEntries:templateEntries, meta:meta};
  }

  function buildTemplateHtml(d){
    if(d.cruiseLine==='Virgin Voyages') return virginVoyagesQuoteHtml(d.templateEntries, d.meta);
    if(d.cruiseLine==='Royal Caribbean') return royalCaribbeanQuoteHtml(d.templateEntries, d.meta);
    if(d.cruiseLine==='Ritz Carlton Yachts') return ritzCarltonYachtsQuoteHtml(d.templateEntries, d.meta);
    if(d.cruiseLine==='Seabourn') return seabournQuoteHtml(d.templateEntries, d.meta);
    if(d.cruiseLine==='Explora Journeys') return exploraJourneysQuoteHtml(d.templateEntries, d.meta);
    if(d.cruiseLine==='Windstar') return windstarQuoteHtml(d.templateEntries, d.meta);
    return princessQuoteHtml(d.templateEntries, d.meta);
  }
  function buildTemplateBodyHtml(d){
    if(d.cruiseLine==='Virgin Voyages') return virginVoyagesQuoteBodyHtml(d.templateEntries, d.meta);
    if(d.cruiseLine==='Royal Caribbean') return royalCaribbeanQuoteBodyHtml(d.templateEntries, d.meta);
    if(d.cruiseLine==='Ritz Carlton Yachts') return ritzCarltonYachtsQuoteBodyHtml(d.templateEntries, d.meta);
    if(d.cruiseLine==='Seabourn') return seabournQuoteBodyHtml(d.templateEntries, d.meta);
    if(d.cruiseLine==='Explora Journeys') return exploraJourneysQuoteBodyHtml(d.templateEntries, d.meta);
    if(d.cruiseLine==='Windstar') return windstarQuoteBodyHtml(d.templateEntries, d.meta);
    return princessQuoteBodyHtml(d.templateEntries, d.meta);
  }

  document.getElementById('eq-preview').addEventListener('click', function(){
    var d = collectQuoteData();
    if(!d) return;
    if(QUOTE_TEMPLATE_LINES.indexOf(d.cruiseLine)===-1){toast('Preview is only available for '+QUOTE_TEMPLATE_LINES.join(', ')+' quotes','err');return;}
    if(!d.templateEntries.length){toast('Enter a price in at least one row','err');return;}
    var html = buildTemplateHtml(d);
    var wrap = document.getElementById('eq-preview-wrap');
    wrap.style.display = 'block';
    document.getElementById('eq-preview-frame').srcdoc = html;
    wrap.scrollIntoView({behavior:'smooth', block:'nearest'});
  });

  function logQuoteNote(d, subject){
    if(!d.client) return;
    var ts = tsNow();
    var noteBody = ['Cruise Line: '+d.cruiseLine];
    if(d.ship) noteBody.push('Ship: '+d.ship);
    if(d.sailingDate) noteBody.push('Sailing Date: '+d.sailingDate);
    noteBody.push('');
    noteBody = noteBody.concat(d.lines);
    var note = {ts:ts, text:'Quote: '+subject+'\n'+noteBody.join('\n'), noteType:'Email Sent'};
    db.clients = db.clients.map(function(c){
      if(c.id!==d.client.id) return c;
      var notesLog = Array.isArray(c.notesLog)?c.notesLog.concat([note]):[note];
      return Object.assign({},c,{notesLog:notesLog});
    });
    saveDB(); render();
  }
  document.getElementById('eq-send').addEventListener('click', function(){
    var d = collectQuoteData();
    if(!d) return;
    var subject = d.cruiseLine+' Cruise Quote'+(d.ship?' - '+d.ship:'');
    var isTemplateLine = QUOTE_TEMPLATE_LINES.indexOf(d.cruiseLine)!==-1;

    if(isTemplateLine && !d.templateEntries.length){toast('Enter a price in at least one row','err');return;}

    if(isTemplateLine){
      var bodyHtml = buildTemplateBodyHtml(d);
      var copied = copyHtmlToClipboard(bodyHtml);
      var mailto = 'mailto:'+(d.client&&d.client.email?mailtoAddr(d.client.email):'')+'?subject='+encodeURIComponent(subject);
      window.location.href = mailto;
      if(copied){
        toast('Quote copied — paste into the email body in Outlook (Ctrl+V)'+(d.client?' for '+d.client.name:''),'ok');
      }else{
        toast('Could not copy the quote automatically — click Preview, then select all (Ctrl+A) and copy (Ctrl+C) from there to paste into Outlook','err');
      }
      saveQuotePdfToDrive(d, bodyHtml, subject);
    }else{
      var bodyParts = ['Cruise Line: '+d.cruiseLine];
      if(d.ship) bodyParts.push('Ship: '+d.ship);
      if(d.sailingDate) bodyParts.push('Sailing Date: '+d.sailingDate);
      bodyParts.push('');
      bodyParts=bodyParts.concat(d.lines);
      if(d.notes){bodyParts.push('');bodyParts.push(d.notes);}
      var body = bodyParts.join('\n');
      var mailto2 = 'mailto:'+(d.client&&d.client.email?mailtoAddr(d.client.email):'')+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
      window.location.href = mailto2;
      toast('Opening Outlook with quote'+(d.client?' for '+d.client.name:''),'ok');
      saveQuotePdfToDrive(d, plainQuoteBodyHtml(bodyParts, subject), subject);
    }

    logQuoteNote(d, subject);
  });
}

    itineraryDetailRow('Travel Dates', datesLine) +
    itineraryDetailRow('Passengers', opts.passengers);
  // Other trip records linked via Linked Trips (same overall multi-city
  // vacation, see saveTrip()) — each rendered as one row, tripName if it has

  var linkedTripsRows = (opts.linkedTrips||[]).map(function(lt){
    var label = lt.tripName || lt.destination || 'Linked trip';

  // Flight/Hotel/Cruise prefer the actual Booked Trip Details entries
  // (real flight segments, hotel stays, cruise cabins) whenever that
  // section has anything recorded — only falling back to the trip's

    var flightRows = (opts.airline||opts.origin) ? (

    return itineraryDetailRow(label, val);

  var cruiseRows = itineraryDetailRow('Cruise Line', opts.cruiseLine) +

    itineraryDetailRow('Return Date', opts.cruiseReturnDate) +

  var carRentalRows = itineraryDetailRow('Company', opts.carRentalCompany) +

    itineraryDetailRow('Dropoff', [opts.carDropoffLocation,opts.carDropoffDate].filter(Boolean).join(' — ')) +
    itineraryDetailRow('Confirmation Number', opts.carConfirmationNumber);
  var tourEntries = opts.tourEntries || [];
  var toursBoxesHtml = tourEntries.map(function(t, i){
    var rows = itineraryDetailRow('Vendor', t.vendor) +
      itineraryDetailRow('Description', t.description) +

    return itineraryDetailBox(tourEntries.length>1 ? 'Tour '+(i+1)+' Details' : 'Tour Details', rows);

  var themeParkRows = itineraryDetailRow('Park', opts.themePark) +

  return ''+

function tripToItineraryOpts(trip, client, extraNotes){
  var sup = trip.supplierId ? db.vendors.find(function(v){return v.id===trip.supplierId;}) : null;
  var b = trip.booked || {};
  var air = b.airline||{}, cru = b.cruise||{}, car = b.carRental||{}, tp = b.themePark||{}, tra = b.train||{}, bus = b.bus||{};
  var tourEntries = Array.isArray(b.tours) ? b.tours : (b.tours && Object.keys(b.tours).length ? [b.tours] : []);
  // Booked Trip Details is the source of truth whenever it actually has
  // something recorded for a category — a trip can have real flight
  // segments/hotel stays/cabins there that the top-level basic fields
  // (trip.airline/trip.hotel/trip.cruiseLine, filled in on the simpler
  // "basics" tab) never reflect. Those top-level fields stay as the
  // fallback for a trip that only ever used the basic form and never
  // touched Booked Trip Details for that category at all.
  var flightSegments = Array.isArray(air.segments) ? air.segments : [];
  var hotelEntries = Array.isArray(b.hotel) ? b.hotel : (b.hotel && Object.keys(b.hotel).length ? [b.hotel] : []);
  var cruiseCabins = Array.isArray(cru.cabins) ? cru.cabins : ((cru.cabinType||cru.peopleInCabin) ? [{cabinType:cru.cabinType||'', peopleInCabin:cru.peopleInCabin||0}] : []);
  // clientId is the primary/billing contact, clientIds is every additional
  // traveler linked to the same trip (see saveTrip()) — both together are
  // the full passenger list for this itinerary.
  var passengerIds = [trip.clientId].concat(trip.clientIds||[]).filter(Boolean);
  var passengerNames = passengerIds.map(function(cid){
    var c = db.clients.find(function(x){return x.id===cid;});
    return c ? (toFirstLast(c.name)||c.name||'') : '';
  }).filter(Boolean);
  var linkedTrips = (trip.linkedTripIds||[]).map(function(tid){
    var t = db.trips.find(function(x){return x.id===tid;});
    return t ? {destination:t.destination||'', departDate:t.departDate||'', returnDate:t.returnDate||'', tripName:(t.booked&&t.booked.tripName)||''} : null;
  }).filter(Boolean);
  return {
    clientFirstName: client?getFirstName(client.name):'',
    passengers: joinNames(passengerNames),
    linkedTrips: linkedTrips,
    tripName: b.tripName||'',
    destination: trip.destination||'',
    origin: trip.origin||'',
    departDate: trip.departDate||'',
    returnDate: trip.returnDate||'',
    airline: trip.airline||'',
    flightClass: trip.flightClass||'',
    hotel: trip.hotel||'',
    hotelNights: trip.hotelNights?(trip.hotelNights+(trip.hotelNights===1?' night':' nights')):'',
    cruiseLine: cru.cruiseLine||trip.cruiseLine||'',
    shipName: cru.shipName||trip.shipName||'',
    flightSegments: flightSegments,
    flightConfirmationNumber: air.confirmationNumber||'',
    hotelEntries: hotelEntries,
    cruiseConfirmationNumber: cru.confirmationNumber||'',
    cruiseSailingDate: cru.sailingDate?fmtDate(cru.sailingDate):'',
    cruiseReturnDate: cru.returnDate?fmtDate(cru.returnDate):'',
    cruiseNights: cru.nights?(cru.nights+(cru.nights===1?' night':' nights')):'',
    cruiseDeparturePort: cru.departurePort||'',
    cruiseReturnPort: cru.returnPort||'',
    cruiseLoyaltyNumber: cru.loyaltyNumber||'',
    cruiseCabins: cruiseCabins,
    carRentalCompany: car.company||'',
    carSize: car.carSize||'',
    carPickupLocation: car.pickupLocation||'',
    carDropoffLocation: car.dropoffLocation||'',
    carPickupDate: car.pickupDate?fmtDate(car.pickupDate):'',
    carDropoffDate: car.dropoffDate?fmtDate(car.dropoffDate):'',
    carConfirmationNumber: car.confirmationNumber||'',
    tourEntries: tourEntries,
    themePark: tp.park||'',
    themeParkTicketType: tp.ticketType||'',
    themeParkConfirmationNumber: tp.confirmationNumber||'',
    trainDepartureCity: tra.departureCity||'',
    trainArrivalCity: tra.arrivalCity||'',
    trainDepartureDate: tra.departureDate?fmtDate(tra.departureDate):'',
    trainReturnDate: tra.returnDate?fmtDate(tra.returnDate):'',
    trainClassOfService: tra.classOfService||'',
    trainConfirmationNumber: tra.confirmationNumber||'',
    busDepartureCity: bus.departureCity||'',
    busArrivalCity: bus.arrivalCity||'',
    busDepartureDate: bus.departureDate?fmtDate(bus.departureDate):'',
    busReturnDate: bus.returnDate?fmtDate(bus.returnDate):'',
    busClassOfService: bus.classOfService||'',
    busConfirmationNumber: bus.confirmationNumber||'',
    bookingRef: trip.bookingRef||'',
    supplierName: (sup?sup.name:trip.supplierName)||'',
    // Points Used and Total Trip Value are sourced from Booked Trip Details
    // (tripBookedPoints/tripBookedPriceTotal), not the trip's top-level
    // pointsUsed/totalValue/cashPaid — those get set directly from the
    // revenue import and aren't meant to be quoted back to the client.
    pointsUsed: (function(){var p=tripBookedPoints(trip);return p?fmt(p):'';})(),
    totalValue: (function(){var v=tripBookedPriceTotal(trip);return v?('$'+money(v)):'';})(),
    notes: trip.notes||'',
    extraNotes: extraNotes||''
  };
}

function parseCSVLine(line){
  const result=[];let cur='',inQuote=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch==='"'){inQuote=!inQuote;}
    else if(ch===','&&!inQuote){result.push(cur.trim());cur='';}
    else{cur+=ch;}
  }
  result.push(cur.trim());
  return result;
}

// Given a getCol(row,names,fallbackIdx) accessor and one tokenized row,
// builds the revenue-import row object (client/supplier matching
// included), or returns null if the row should be skipped. Shared by
// "Import Revenue CSV" (importRevenue, header-or-positional getCol) and
// "Clean & Import Revenue File" (cleanAndImportRevenue, header-only getCol
// since cleaned data always has a header row).
function extractRevenueRow(getCol, cols){
  if(cols.length<3) return null;

  const date    = getCol(cols,['date'],0);
  const invoiceNum = getCol(cols,['num','invoice'],1);
  const memo    = getCol(cols,['memo','description'],2);
  const nameVal = getCol(cols,['name'],3);
  const shipDate= getCol(cols,['ship date','shipdate'],4);  // col4 = Ship Date (new) -> trip start date
  const classVal= getCol(cols,['item'],5);        // col5 = Item (was col4)
  const clientFromClass = getCol(cols,['class'],6) || (cols[6]||'').trim(); // col6 = Class (was col5)
  const amtStr  = getCol(cols,['amount','sales price'],9) ||
                  getCol(cols,['amount','sales price'],8) ||
                  cols[cols.length-1]||'';
  const amt     = parseFloat(amtStr.replace(/[$,"]/g,''))||0;

  if(!nameVal||amt===0) return null;

  // Class (normalized to Last, First) is the client whenever it's present.
  // If Name differs from Class, Name is very likely the supplier being paid —
  // check for that. Class blank falls back to Name as the client. Never skip
  // a row over a Name/Class mismatch.
  var nameNormalized  = toLastFirst(nameVal);
  var classNormalized = clientFromClass ? toLastFirst(clientFromClass) : '';
  var namesMatch = classNormalized && nameNormalized.toLowerCase()===classNormalized.toLowerCase();

  var clientName   = classNormalized || nameNormalized;
  var supplierId   = '';
  var supplierName = '';
  var product      = classVal;

  if(!namesMatch){
    // Try to match nameVal against a known supplier first (most common case:
    // Name = supplier being paid, Class = the client the cost is for). If
    // nothing matches, Name is still presumed to be the supplier — leave
    // supplierId blank but keep the candidate name so finalizeImport() can
    // create that Supplier record on the fly instead of silently dropping
    // the link.
    var matchedSupplier = db.vendors.find(function(v){
      return (v.name||'').toLowerCase().trim()===nameVal.toLowerCase().trim();
    });
    if(matchedSupplier){
      supplierId   = matchedSupplier.id;
      supplierName = matchedSupplier.name;
    } else {
      supplierName = nameVal.trim();
    }
  }

  // Also try to enrich supplier from the product/item text — exact match only,
  // no loose 'contains' matching (loose matching caused wrong suppliers like Melio/Marriott
  // to collide on short substrings). Only used if we don't already have a supplier match or
  // candidate name (a substring guess should never override the Name-based candidate above).
  if(!supplierId && !supplierName && classVal){
    var prodParts = classVal.split(':');
    for(var pi=0;pi<prodParts.length;pi++){
      var seg = prodParts[pi].trim().toLowerCase();
      if(seg.length<3) continue; // skip too-short segments that risk false matches
      var sup = db.vendors.find(function(v){
        var vl=(v.name||'').toLowerCase();
        return vl===seg;
      });
      if(sup){supplierId=sup.id;supplierName=sup.name;break;}
    }
  }

  debugLog('Revenue row: name='+nameVal+' class='+clientFromClass+' -> client='+clientName+' supplier='+supplierName+' amt='+amt+(namesMatch?'':' (name/class differ)'));

  return {
    name:clientName,
    isSupplierName:!!supplierName,
    supplierName:supplierName,
    supplierId:supplierId,
    product:product,
    amt:amt,
    date:date,
    shipDate:shipDate,
    memo:memo,
    item:classVal,
    invoiceNum:invoiceNum
  };
}
// Shared tail: given fully-built revenue rows, fuzzy-matches each row's
// client name against existing clients and kicks off the unmatched-client
// resolution modal, ending in finalizeImport() — which creates trips,
// links suppliers, and updates client revenue. Choosing "+ Add as new
// client" in that modal is what folds client creation into this same flow.
function startRevenueImport(rows){
  if(!rows.length){toast('No valid rows found','err');return;}

  const unmatchedNames=[];
  const autoResolutions={};

  function fuzzyMatchClient(name){
    if(!name) return null;
    const nl=name.toLowerCase().trim();
    // Get first/last regardless of input format (handles 'Last, First' or 'First Last')
    const inputFirst=getFirstName(nl).toLowerCase();
    const inputLast=getLastName(nl).toLowerCase();
    // Exact match against stored 'Last, First' format
    var m=db.clients.find(c=>(c.name||'').toLowerCase().trim()===nl); if(m) return m;
    // Match by comparing first+last regardless of how input or stored name is formatted
    if(inputFirst && inputLast && inputFirst!==inputLast){
      m=db.clients.find(function(c){
        var cFirst=getFirstName(c.name).toLowerCase();
        var cLast=getLastName(c.name).toLowerCase();
        return cFirst===inputFirst && cLast===inputLast;
      });
      if(m) return m;
    }
    return null;
  }

  rows.forEach(function(row){
    if(autoResolutions[row.name]!==undefined||unmatchedNames.includes(row.name)) return;
    const matched=fuzzyMatchClient(row.name);
    if(matched){ autoResolutions[row.name]=matched.id; }
    else { unmatchedNames.push(row.name); }
  });

  window._importState={rows,unmatchedNames,resolutions:autoResolutions,cursor:0};
  processImportQueue();
}
function importRevenue(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.csv';
  inp.onchange=function(e){
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=function(ev){
      try{
        const lines=ev.target.result.split('\n').map(l=>l.trim()).filter(l=>l);
        if(lines.length<2){toast('File appears empty','err');return;}

        // Detect delimiter
        const delim = lines[0].includes('\t') ? '\t' : ',';
        const split = function(line){
          if(delim===',') return parseCSVLine(line); // handles quoted fields with commas
          return line.split(delim).map(function(c){return c.replace(/^"|"$/g,'').trim();});
        };

        // Detect header row
        const hdrs = split(lines[0]).map(function(h){return h.toLowerCase().trim();});
        const looksLikeHeader = hdrs.some(function(h){return ['name','date','amount','num','qty','memo','item'].includes(h);});
        const startRow = looksLikeHeader ? 1 : 0;
        debugLog('Revenue import: total lines='+lines.length+' startRow='+startRow+' expected data rows='+(lines.length-startRow));

        // Column indices (header-based or positional)
        // Positional: col0=date, col1=invoice, col2=memo/description, col3=name/supplier,
        //             col4=product/class, col5=client(class), col6=qty, col7=price, col8=total
        function getCol(row, names, fallbackIdx){
          if(looksLikeHeader){
            for(var i=0;i<names.length;i++){
              var idx=hdrs.indexOf(names[i]);
              if(idx>=0) return (row[idx]||'').trim();
            }
            return '';
          }
          return (row[fallbackIdx]||'').trim();
        }

        const rows=[];
        for(var i=startRow;i<lines.length;i++){
          const cols=split(lines[i]);
          const row=extractRevenueRow(getCol, cols);
          if(row) rows.push(row);
        }

        startRevenueImport(rows);
      }catch(err){console.error(err);toast('Could not read CSV: '+err.message,'err');}
    };r.readAsText(f);
  };inp.click();
}

function processImportQueue(){
  const state=window._importState;
  if(!state)return;
  while(state.cursor<state.unmatchedNames.length){
    const name=state.unmatchedNames[state.cursor];
    if(state.resolutions[name]!==undefined){state.cursor++;continue;}
    showImportMatchModal(name);return;
  }
  finalizeImport();
}
