// "Smith, John Michael" -> "John Smith" (drops any middle name/initial —
// used for the referred-person mention, which reads oddly with a middle
// name included: "John Michael Smith recently mentioned your name...").
function toFirstLastNoMiddle(name){
  if(!name) return '';
  var first = (getFirstName(name)||'').split(/\s+/)[0]||'';
  var last = getLastName(name)||'';
  return (first+' '+last).trim();
}
// "A" / "A and B" / "A, B, and C" — for greeting/mentioning multiple people.
function joinNames(names){
  names = names.filter(Boolean);
  if(!names.length) return '';
  if(names.length===1) return names[0];
  if(names.length===2) return names[0]+' and '+names[1];
  return names.slice(0,-1).join(', ')+', and '+names[names.length-1];
}
function fillTemplate(body, clients, referredClients){
  clients = Array.isArray(clients) ? clients : (clients?[clients]:[]);
  referredClients = Array.isArray(referredClients) ? referredClients : (referredClients?[referredClients]:[]);
  var firstNames = joinNames(clients.map(function(c){return getFirstName(c.name)||c.name||'';}));
  var fullNames = joinNames(clients.map(function(c){return toFirstLast(c.name)||'';}));
  var referredNames = joinNames(referredClients.map(function(c){return toFirstLastNoMiddle(c.name)||c.name||'';}));
  return body
    .replace(/{{firstName}}/g, firstNames)
    .replace(/{{fullName}}/g, fullNames)
    .replace(/{{email}}/g, clients[0]?clients[0].email||'':'')
    .replace(/{{referredName}}/g, referredNames);
}
// Records one referral-credit row per (referrer, referred person) pair on
// each referrer's client record — shown/edited in the Referral Credits
// section of the client form (name, date, $100 default, used checkbox,
// certificate number). A single email send now always produces exactly one
// certificate (see referralCreditEmailBodyHtml) shared by every referrer
// named on it, so every row recorded here — regardless of which referrer or
// referred person it's for — carries that same certNumber.
// One physical certificate can carry rows on more than one client's record
// (every referrer named on it gets a matching row — see
// addReferralCreditEntries), so checking a row "Used" only means something
// if every row sharing that same certNumber, on every client, agrees. Called
// after saving a client whose referralCredits may have just changed a Used
// checkbox; propagates that row's used value onto any other client's row(s)
// with the same certNumber (in either direction — marking used, or
// un-marking it, both need to stay in sync since they represent one
// certificate, not independent ones).
function syncReferralCreditUsedAcrossClients(changedClientId, referralCredits){
  var usedByCertNumber = {};
  (referralCredits||[]).forEach(function(rc){
    if(rc.certNumber!=null) usedByCertNumber[rc.certNumber] = rc.used;
  });
  if(!Object.keys(usedByCertNumber).length) return;
  db.clients = db.clients.map(function(c){
    if(c.id===changedClientId || !Array.isArray(c.referralCredits) || !c.referralCredits.length) return c;
    var changed = false;
    var updated = c.referralCredits.map(function(rc){
      if(rc.certNumber!=null && usedByCertNumber.hasOwnProperty(rc.certNumber) && rc.used!==usedByCertNumber[rc.certNumber]){
        changed = true;
        return Object.assign({}, rc, {used: usedByCertNumber[rc.certNumber]});
      }
      return rc;
    });
    return changed ? Object.assign({}, c, {referralCredits: updated}) : c;
  });
}
function addReferralCreditEntries(referrers, referredClients, certNumber){
  var d = today();
  var rowsByReferrerId = {};
  referrers.forEach(function(r){
    rowsByReferrerId[r.id] = referredClients.map(function(rf){
      return {referredName: toFirstLastNoMiddle(rf.name)||rf.name||'', date:d, amount:100, used:false, certNumber:certNumber};
    });
  });
  db.clients = db.clients.map(function(c){
    var newRows = rowsByReferrerId[c.id];
    if(!newRows) return c;
    var existing = Array.isArray(c.referralCredits) ? c.referralCredits : [];
    return Object.assign({}, c, {referralCredits: existing.concat(newRows)});
  });
}

// referral credit emails (never reused, never reset) — peek shows what the
// next one(s) would be for preview purposes without consuming them; consume
// is called exactly once per actually-sent/logged email (see
// renderReferralCreditPreview's finalize()), advancing the counter for real.
function peekNextCertificateNumber(){
  return parseInt(localStorage.getItem('mm_next_certificate_number')||'1',10);

function consumeCertificateNumbers(count){
  var start = peekNextCertificateNumber();
  localStorage.setItem('mm_next_certificate_number', String(start+count));
  var nums = [];
  for(var i=0;i<count;i++) nums.push(start+i);

}

  });

    var body = fillTemplate(selTemplate.body, selClient, null);
    var subject = fillTemplate(selTemplate.subject, selClient, null);
    renderPreviewArea(selClient.email||'(no email on file)', subject, body, selClient.email?[selClient.email]:[], [selClient]);

  document.getElementById('email-client-sel').addEventListener('change',function(){
    selClient = db.clients.find(function(c){return c.id===this.value;},this)||null;

  function bindReferrerChecklist(){
    document.querySelectorAll('.email-referrer-cb').forEach(function(cb){
      cb.checked = selReferrers.some(function(c){return c.id===cb.value;});
      cb.addEventListener('change',function(){
        var c = db.clients.find(function(x){return x.id===cb.value;});
        if(!c) return;
        if(cb.checked){ if(!selReferrers.some(function(x){return x.id===c.id;})) selReferrers.push(c); }
        else{ selReferrers = selReferrers.filter(function(x){return x.id!==c.id;}); }
        updatePreview();
      });
    });

  function bindReferredChecklist(){
    document.querySelectorAll('.email-referred-cb').forEach(function(cb){
      cb.checked = selReferredClients.some(function(c){return c.id===cb.value;});
      cb.addEventListener('change',function(){
        var c = db.clients.find(function(x){return x.id===cb.value;});
        if(!c) return;
        if(cb.checked){ if(!selReferredClients.some(function(x){return x.id===c.id;})) selReferredClients.push(c); }
        else{ selReferredClients = selReferredClients.filter(function(x){return x.id!==c.id;}); }
        updatePreview();

    var payingOnly = document.getElementById('email-filter-paying').checked;

    });
  });
}

// ── Vendor CSV Import ────────────────────────────────────────────────────
// Expected columns (flexible): Name, Type, Category, Contact, Email, Phone, Website, Notes
function importVendorsCSV(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.csv,.tsv,.txt';
  inp.onchange=function(e){
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=function(ev){
      try{
        const raw=ev.target.result;
        const lines=raw.split('\n').map(l=>l.trim()).filter(l=>l);
        if(!lines.length){toast('File appears empty','err');return;}

        const delim = lines[0].includes('\t') ? '\t' : ',';
        const split = function(line){
          if(delim===','){ return parseCSVLine(line); }
          return line.split(delim).map(function(c){return c.replace(/^"|"$/g,'').trim();});
        };

        const hdrs = split(lines[0]).map(function(h){return h.toLowerCase().trim();});
        const looksLikeHeader = hdrs.some(function(h){return ['name','date','amount','num','qty','memo','item','class'].includes(h);});
        const startRow = looksLikeHeader ? 1 : 0;
        debugLog('Revenue import: total lines='+lines.length+' startRow='+startRow+' expected data rows='+(lines.length-startRow));

        function getCol(row, names, fallbackIdx){
          if(looksLikeHeader){
            for(var i=0;i<names.length;i++){
              var idx=hdrs.indexOf(names[i]);
              if(idx>=0) return (row[idx]||'').trim();
            }
            return '';
          }
          return (row[fallbackIdx]||'').trim();
        }

        // Same layout as revenue import:
        // col0=date,col1=invoice,col2=memo,col3=name,col4=ship date,col5=item,col6=class,col7=qty,col8=price,col9=amount
        var vendorMap = {}; // name.toLowerCase() -> {name, clientNames:[], rows:[]}

        for(var i=startRow;i<lines.length;i++){
          var cols=split(lines[i]);
          if(cols.length<4){
            debugLog('Revenue SILENT SKIP (too few cols) row '+i+': cols='+cols.length+' rawLine='+JSON.stringify(lines[i].slice(0,100)));
            continue;
          }

          var date    = getCol(cols,['date'],0);
          var memo    = getCol(cols,['memo','description'],2);
          var nameVal = getCol(cols,['name'],3);
          var itemVal = getCol(cols,['item'],5);
          var classVal= getCol(cols,['class'],6) || (cols[6]||'').trim();
          var amtStr  = getCol(cols,['amount','sales price'],9) ||
                        getCol(cols,['amount','sales price'],8) ||
                        cols[cols.length-1]||'';
          var amount  = parseFloat(amtStr.replace(/[$,"]/g,''))||0;

          if(!nameVal) continue;

          // Rule: if Name !== Class, Name is treated as a supplier
          var nameLower = nameVal.toLowerCase().trim();
          var classLower = classVal.toLowerCase().trim();
          if(nameLower === classLower || !classVal){
            debugLog('Supplier import skip: name='+nameVal+' class='+classVal);
            continue;
          }
          debugLog('Supplier import row: name='+nameVal+' class='+classVal);

          var key = nameLower;
          if(!vendorMap[key]) vendorMap[key]={name:nameVal, clientNames:[], rows:[]};
          if(classVal && !vendorMap[key].clientNames.includes(classVal)){
            vendorMap[key].clientNames.push(classVal);
          }
          vendorMap[key].rows.push({
            date:date, description:memo, productType:itemVal,
            clientName:classVal, amount:amount
          });
        }

        // Fuzzy match client by name (handles Last,First and First Last)
        function matchClient(cn){
          if(!cn) return null;
          var cLower=cn.toLowerCase().trim();
          var cFirst=getFirstName(cLower);
          var cLast=getLastName(cLower);
          return db.clients.find(function(c){
            var full=(c.name||'').toLowerCase().trim();
            var first=getFirstName(full);
            var last=getLastName(full);
            if(full===cLower) return true;
            if(cFirst&&cLast&&cFirst!==cLast&&first===cFirst&&last===cLast) return true;
            return false;
          });
        }

        var added=0, skipped=0, tripsAdded=0;
        Object.keys(vendorMap).forEach(function(key){
          var vm = vendorMap[key];
          var exists = db.vendors.find(function(v){return(v.name||'').toLowerCase()===key;});
          var clientIds = [];
          vm.clientNames.forEach(function(cn){
            var matched=matchClient(cn);
            if(matched && !clientIds.includes(matched.id)) clientIds.push(matched.id);
          });

          if(exists){
            clientIds.forEach(function(cid){
              if(!(exists.clientIds||[]).includes(cid)){
                if(!exists.clientIds) exists.clientIds=[];
                exists.clientIds.push(cid);
              }
            });
            skipped++;
          } else {
            db.vendors.push({
              id:newId('V',db.vendors),
              name:vm.name,
              type:'Supplier',
              category:'',
              primaryClientName:vm.clientNames[0]||'',
              contactName:'',email:'',phone:'',website:'',notes:'',notesLog:[],
              clientIds:clientIds
            });
            added++;
          }

          vm.rows.forEach(function(row){
            if(!row.clientName) return;
            var client=matchClient(row.clientName);
            if(!client) return;
            if(!client.notesLog) client.notesLog=[];
            var dupKey=(row.date+'|'+vm.name+'|'+row.description).toLowerCase();
            var alreadyImported=client.notesLog.some(function(n){return (n.importKey||'')===dupKey;});
            if(alreadyImported) return;
            var noteText=vm.name+(row.description?' - '+row.description:'')+(row.date?' ('+row.date+')':'')+(row.amount?' $'+row.amount:'');
            client.notesLog.push({ts:new Date().toLocaleString(),text:noteText,noteType:'Trip Import',importKey:dupKey});
            tripsAdded++;
          });
        });

        snapshot('Import suppliers');
        saveDB();render();
        toast('Imported '+added+' supplier'+(added!==1?'s':'')+(skipped?' ('+skipped+' updated)':'')+(tripsAdded?' · '+tripsAdded+' trip notes added':''),'ok');
      }catch(err){console.error(err);toast('Could not read CSV: '+err.message,'err');}
    };r.readAsText(f);
  };inp.click();
}

// ── Vendor helpers ───────────────────────────────────────────────────────
const VENDOR_TYPES = ['Supplier','Referral Partner','DMC'];
const VENDOR_CATS  = ['Airline','Hotel','Cruise Line','Car Rental','Tour Operator','Other'];

function getVendorStats(vendor){
  var stats = {trips:0, revenue:0, clients:[], tripList:[]};

  // Primary: trips directly linked via supplierId
  db.trips.forEach(function(t){
    var matchSupplier = t.supplierId === vendor.id;
    var matchAir = vendor.category==='Airline' && t.airline && t.airline.toLowerCase()===vendor.name.toLowerCase();
    var matchHot = vendor.category==='Hotel'   && t.hotel   && t.hotel.toLowerCase()===vendor.name.toLowerCase();
    if(matchSupplier || matchAir || matchHot){
      stats.revenue += (t.totalValue||0);
      if(!stats.clients.includes(t.clientName)) stats.clients.push(t.clientName);
      stats.tripList.push(t);
    }
  });

  // Linked clients (referral partners) — only count them in the client list,
  // do NOT pull in their unrelated trips (those are only shown if supplierId explicitly matches, handled above)
  (vendor.clientIds||[]).forEach(function(cid){
    var c = db.clients.find(function(x){return x.id===cid;});
    if(c && !stats.clients.includes(c.name)) stats.clients.push(c.name);
  });

  // Count distinct invoice numbers (falls back to trip id if no invoice number)
  var seenInvoices = {};
  stats.tripList.forEach(function(t){
    var key = t.invoiceNum || t.id;
    if(!seenInvoices[key]){ seenInvoices[key]=true; stats.trips++; }
  });

  return stats;
}

function openVendorDetail(id){
  var v = db.vendors.find(function(x){return x.id===id;});
  if(!v) return;
  var stats = getVendorStats(v);
  var typeCls = v.type==='Referral Partner' ? 'vendor-type-referral' : 'vendor-type-supplier';

  // Build full transaction table
  var txRows = stats.tripList.map(function(t){
    var st = t.status||'Planning';
    if(st==='Completed' && t.departDate && t.departDate>=today()) st='Upcoming';
    var scls={'Confirmed':'b-green','Planning':'b-amber','Completed':'b-blue','Cancelled':'b-red','Upcoming':'b-amber'}[st]||'b-gray';
    return '<tr>'+
      '<td style="padding:8px 12px;font-size:13px;color:#111;font-weight:500">'+t.clientName+'</td>'+
      '<td style="padding:8px 12px;font-size:13px;color:#374151">'+t.destination+'</td>'+
      '<td style="padding:8px 12px;font-size:12px;color:#888;white-space:nowrap">'+t.departDate+(t.returnDate?' → '+t.returnDate:'')+'</td>'+
      '<td style="padding:8px 12px"><span class="badge '+scls+'">'+st+'</span></td>'+

      '<td style="padding:8px 12px;font-size:13px;font-weight:600;color:#111">$'+money(t.totalValue||0)+'</td>'+
      '<td style="padding:8px 12px;font-size:12px;color:#888">'+(t.product||'—')+'</td>'+

  $('modal').innerHTML =
    '<div class="modal-hdr">'+
      '<div>'+
        '<div class="modal-title">'+v.name+'</div>'+

          '<span class="badge '+typeCls+'" style="margin-right:6px">'+v.type+'</span>'+
          (v.category?'<span class="badge b-gray">'+v.category+'</span>':'')+
        '</div>'+
      '</div>'+
      '<button class="close-btn" id="modal-close">&#x2715;</button>'+
    '</div>'+
    (v.primaryClientName?'<div style="font-size:13px;color:#2563eb;font-weight:600;margin-bottom:12px">&#128100; '+v.primaryClientName+'</div>':'')+
    '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px">'+
      '<div class="stat" id="stat-vendor-tx"><div class="stat-lbl">Transactions</div><div class="stat-val">'+stats.tripList.length+'</div></div>'+
      '<div class="stat" id="stat-vendor-cash"><div class="stat-lbl">Cash Paid</div><div class="stat-val">$'+money(totalCash)+'</div></div>'+
      '<div class="stat" id="stat-vendor-value"><div class="stat-lbl">Total Value</div><div class="stat-val">$'+money(totalRevenue)+'</div></div>'+
    '</div>'+
    (txRows ?
      '<div class="tbl-wrap" id="vendor-tx-table" style="max-height:400px;overflow-y:auto">'+'<table>'+
        '<thead><tr>'+
          '<th>Client</th><th>Destination</th><th>Dates</th><th>Status</th><th>Cash Paid</th><th>Total Value</th><th>Product</th><th>Trip ID</th>'+
        '</tr></thead>'+
        '<tbody>'+txRows+'</tbody>'+
      '</table></div>'

      var s = getVendorStats(v);
      return {cells:[v.name||'',v.type||'',s.tripList.length,'$'+money(s.tripList.reduce(function(a,t){return a+(t.totalValue||0);},0))],onClick:function(){openVendorForm(v.id);}};
    }));
  });
  var vendorTripHeaders = ['Client','Destination','Depart','Supplier','Total Value'];

    var sup = t.supplierId ? db.vendors.find(function(v){return v.id===t.supplierId;}) : null;
    return {cells:[t.clientName||'',t.destination||'',t.departDate||'—',(sup?sup.name:t.supplierName)||'—','$'+money(t.totalValue)],onClick:function(){openTripForm(t.id);}};
  }
  var statVendorsTrips = $('stat-vendors-trips');

      var c = db.clients.find(function(x){return x.name===name;});
      return {cells:[name,(c&&c.email)||''],onClick:function(){ if(c) openClientForm(c.id); }};
    }));

      var txt = el.textContent.toLowerCase();

      cbs.forEach(function(cb){ cb.checked = !allChecked; });
      updateDeleteBtnS();

      saveDB(); render();
      toast('Deleted '+ids.length+' supplier'+(ids.length!==1?'s':''),'ok');
    });
  }
}

function renderCalendar(){
  var now = window._calDate || new Date();
  window._calDate = now;
  var year = now.getFullYear();
  var month = now.getMonth();
  var monthName = now.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  var todayStr = today();

  // First and last day of month
  var firstDay = new Date(year, month, 1);
  var lastDay  = new Date(year, month+1, 0);
  var startDow = firstDay.getDay(); // 0=Sun

  // Build trip lookup: date -> [{trip, type}]
  var tripMap = {};
  function addToMap(dateStr, trip, type){
    if(!tripMap[dateStr]) tripMap[dateStr] = [];
    tripMap[dateStr].push({trip:trip, type:type});
  }
  db.trips.forEach(function(t){
    if(!t.departDate || t.status==='Cancelled') return;
    var start = new Date(t.departDate+'T12:00:00');
    var end   = t.returnDate ? new Date(t.returnDate+'T12:00:00') : start;
    var cur   = new Date(start);
    var dayCount = 0;
    while(cur <= end && dayCount < 60){
      var ds = cur.toISOString().slice(0,10);
      var type = cur.getTime()===start.getTime() ? 'start' : (cur.getTime()===end.getTime() ? 'end' : 'span');
      if(start.getTime()===end.getTime()) type='start';
      addToMap(ds, t, type);
      cur.setDate(cur.getDate()+1);
      dayCount++;
    }
  });

  // Build calendar grid HTML
  var days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var headerCells = days.map(function(d){return '<div class="cal-header-cell">'+d+'</div>';}).join('');

  var cells = '';
  // Pad start
  for(var i=0;i<startDow;i++){
    var prevDate = new Date(year, month, -startDow+i+1);
    cells += '<div class="cal-cell other-month"><div class="cal-day-num">'+prevDate.getDate()+'</div></div>';
  }
  // Days of month
  for(var d=1;d<=lastDay.getDate();d++){
    var dateStr = year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var isToday = dateStr===todayStr;
    var trips   = tripMap[dateStr]||[];
    var dayNumHtml = isToday
      ? '<div class="cal-day-num today-num">'+d+'</div>'
      : '<div class="cal-day-num">'+d+'</div>';
    var tripHtml = trips.slice(0,3).map(function(entry){
      var t=entry.trip, tp=entry.type;
      var cls='cal-trip cal-trip-'+(tp==='start'?'start':tp==='end'?'end':'span');
      var label=(tp==='start'?'▶ ':tp==='end'?'■ ':'  ')+t.clientName+(t.destination?' → '+t.destination.split(',')[0]:'');
      return '<div class="'+cls+'" data-trip-id="'+t.id+'" title="'+t.clientName+': '+t.destination+(tp==='start'?' (departs)':tp==='end'?' (returns)':'')+'">'+label+'</div>';
    }).join('');
    if(trips.length>3) tripHtml+='<div style="font-size:9px;color:#888">+' +(trips.length-3)+' more</div>';
    cells+='<div class="cal-cell'+(isToday?' today':'')+'" data-date="'+dateStr+'" style="cursor:pointer">'+dayNumHtml+tripHtml+'</div>';
  }
  // Pad end
  var totalCells = startDow + lastDay.getDate();
  var endPad = totalCells % 7 === 0 ? 0 : 7-(totalCells%7);
  for(var i=1;i<=endPad;i++){
    cells+='<div class="cal-cell other-month"><div class="cal-day-num">'+i+'</div></div>';
  }

  $('main').innerHTML =
    '<div class="page-hdr">'+
      '<div class="page-title">Calendar</div>'+
      '<div class="cal-nav">'+
        '<button class="cal-nav-btn" id="cal-prev">&#8592; Prev</button>'+
        '<div class="cal-month-label">'+monthName+'</div>'+
        '<button class="cal-nav-btn" id="cal-next">Next &#8594;</button>'+
        '<button class="cal-nav-btn" id="cal-today">Today</button>'+
      '</div>'+
    '</div>'+
    '<div class="cal-grid">'+headerCells+cells+'</div>';

  // Nav button handlers
  document.getElementById('cal-prev').addEventListener('click',function(){
    window._calDate=new Date(year,month-1,1);renderCalendar();
  });
  document.getElementById('cal-next').addEventListener('click',function(){
    window._calDate=new Date(year,month+1,1);renderCalendar();
  });
  document.getElementById('cal-today').addEventListener('click',function(){
    window._calDate=new Date();renderCalendar();
  });

  // Trip click → open edit form
  document.querySelectorAll('.cal-trip[data-trip-id]').forEach(function(el){
    el.addEventListener('click',function(e){
      e.stopPropagation();
      openTripForm(el.dataset.tripId);
    });
  });

  document.querySelectorAll('.cal-cell[data-date]').forEach(function(cell){
    cell.addEventListener('click', function(){
      openDayTripsModal(cell.dataset.date, tripMap[cell.dataset.date]||[]);
    });
  });
}

    closeModal();

// "Points deployed" totals the actual redemption entries recorded in a
// trip's Booked Trip Details (every section's Points Used entries, plus
// each hotel stay's amount) — the granular, per-program figures — not the
// simple top-level Points Used field on the basic trip form, which is a
// separate, less precise number that isn't rolled into this.
function tripBookedPoints(t){
  var b = (t && t.booked) || {};
  var total = 0;
  function sumPts(arr){
    return (Array.isArray(arr) ? arr : []).reduce(function(a,p){return a+(Number(p&&p.amount)||0);},0);
  }
  total += sumPts(b.airline && b.airline.pts);
  total += sumPts(b.cruise && b.cruise.pts);
  total += sumPts(b.carRental && b.carRental.pts);
  total += sumPts(b.toursPts);
  total += sumPts(b.themePark && b.themePark.pts);
  total += sumPts(b.train && b.train.pts);
  total += sumPts(b.bus && b.bus.pts);
  // A hotel entry's points moved from a single program/amount pair to a
  // pts list (like every other section); an old, not-yet-resaved entry
  // only has the amount field, so fall back to that when pts is absent.
  var hotels = Array.isArray(b.hotel) ? b.hotel : [];
  total += hotels.reduce(function(a,h){
    if(!h) return a;
    if(Array.isArray(h.pts) && h.pts.length) return a + sumPts(h.pts);
    return a + (Number(h.amount)||0);
  },0);
  return total;
}
// The itinerary email's "Total Trip Value" sums every Booked Trip Details
// category's own price field, deliberately never the trip's top-level
// totalValue — that field (and cashPaid) gets set directly from the revenue
// import's Amount column and isn't meant to be quoted back to the client,
// while each category's price is entered by hand specifically to describe
// what that piece of the booking cost.
function tripBookedPriceTotal(t){
  var b = (t && t.booked) || {};
  var total = 0;
  function num(x){ return Number(x)||0; }
  total += num(b.airline && b.airline.price);
  total += num(b.cruise && b.cruise.price);
  total += num(b.carRental && b.carRental.price);
  total += num(b.themePark && b.themePark.price);
  total += num(b.train && b.train.price);
  total += num(b.bus && b.bus.price);
  var hotels = Array.isArray(b.hotel) ? b.hotel : [];
  total += hotels.reduce(function(a,h){return a+num(h&&h.price);},0);
  var tours = Array.isArray(b.tours) ? b.tours : [];
  total += tours.reduce(function(a,x){return a+num(x&&x.price);},0);
  return total;
}

function sortArrow(col){
  var tripSortCol = window._tripSortCol || 'id';
  var tripSortDir = window._tripSortDir || 'desc';
  if(tripSortCol!==col) return '';
  return tripSortDir==='asc' ? ' &#9650;' : ' &#9660;';
}

// Generic drill-down modal for a page-level stat tile: shows the list of
// records that add up to that number, each row clickable to open the real
// record. Used by every top-level page's stats (Dashboard, Clients, Trips,
// Suppliers, Planner) — NOT by stats that already live inside another open
// modal (vendor detail, invoice detail), since this app has a single shared
// modal container and can't nest one on top of another; those instead just
// scroll to/highlight the breakdown table already shown alongside them.
function openStatDrilldownModal(title, headers, rows){
  var bodyRows = rows.map(function(r,i){
    return '<tr class="stat-drilldown-row" data-idx="'+i+'" style="cursor:pointer">'+
      r.cells.map(function(c){return '<td style="padding:8px 12px;font-size:13px;color:#374151">'+c+'</td>';}).join('')+
    '</tr>';
  }).join('');
  $('modal').innerHTML =
    '<div class="modal-hdr"><div class="modal-title">'+title+'</div><button class="close-btn" id="modal-close">&#x2715;</button></div>'+
    (rows.length
      ? '<div class="tbl-wrap" style="max-height:440px;overflow-y:auto"><table><thead><tr>'+headers.map(function(h){return '<th>'+h+'</th>';}).join('')+'</tr></thead><tbody>'+bodyRows+'</tbody></table></div>'
      : '<div class="empty">No records</div>')+
    '<div class="form-actions"><button class="cancel-btn" id="modal-close2">Close</button></div>';
  $('overlay').classList.add('open');
  $('modal-close').addEventListener('click', closeModal);
  $('modal-close2').addEventListener('click', closeModal);
  document.querySelectorAll('.stat-drilldown-row').forEach(function(tr){
    tr.addEventListener('click', function(){
      var r = rows[Number(this.dataset.idx)];
      closeModal();
      if(r.onClick) r.onClick();
    });
  });
}
// Scrolls to and briefly highlights an already-visible breakdown table —
// used for stats that live inside a modal that's already showing that same
// table (vendor detail, invoice detail), where opening a second modal isn't
// possible.
function flashDrilldownTarget(el){
  if(!el) return;
  el.scrollIntoView({behavior:'smooth', block:'nearest'});
  var prevOutline = el.style.outline, prevOffset = el.style.outlineOffset;
  el.style.outline = '2px solid #2563eb';
  el.style.outlineOffset = '2px';
  setTimeout(function(){ el.style.outline = prevOutline; el.style.outlineOffset = prevOffset; }, 900);
}

      '<thead><tr>'+
        '<th>Client</th><th>Destination</th><th>Product</th><th>Supplier</th><th>Status</th><th style="text-align:right">Cash Paid</th><th style="text-align:right">Total Value</th>'+

    '<div class="form-actions"><button class="cancel-btn" id="modal-close2">Close</button></div>';

  $('overlay').classList.add('open');

  $('modal-close2').addEventListener('click', closeModal);

function renderTrips(){
  var tripSortCol = window._tripSortCol || 'id';
  var tripSortDir = window._tripSortDir || 'desc';
  const selC=db.clients.find(function(c){return c.id===selCid;});
  const q=fSearch.toLowerCase();
  let list=db.trips.filter(function(t){
    const ms=!q||(t.clientName||'').toLowerCase().includes(q)||(t.destination||'').toLowerCase().includes(q)||(t.bookingRef||'').toLowerCase().includes(q);
    return ms&&(!fStatus||t.status===fStatus)&&(!selCid||t.clientId===selCid);
  });
  // Sort
  list = list.slice().sort(function(a,b){
    var av, bv;
    if(tripSortCol==='status'){
      av=displayStatus(a); bv=displayStatus(b);
    } else if(tripSortCol==='id'){
      // Default sort (newest added first) — compare the numeric part of
      // the id (T1, T2, ...T10...) rather than the string, since string
      // comparison would put "T10" before "T9".
      av=parseInt((a.id||'').replace(/\D/g,''),10)||0;
      bv=parseInt((b.id||'').replace(/\D/g,''),10)||0;
    } else {
      av=a[tripSortCol]; bv=b[tripSortCol];
    }
    if(typeof av==='number'||typeof bv==='number'){
      av=Number(av)||0; bv=Number(bv)||0;
    } else {
      av=(av||'').toString().toLowerCase(); bv=(bv||'').toString().toLowerCase();
    }
    if(av<bv) return tripSortDir==='asc'?-1:1;
    if(av>bv) return tripSortDir==='asc'?1:-1;

  document.querySelectorAll('.sort-th').forEach(function(th){
    th.addEventListener('click', function(){

      if(window._tripSortCol === col){
        window._tripSortDir = (window._tripSortDir==='asc') ? 'desc' : 'asc';
      } else {
        window._tripSortCol = col;
        window._tripSortDir = 'asc';
      }
      debugLog('Trip sort: col='+window._tripSortCol+' dir='+window._tripSortDir);
      renderTrips();
    });
  });
  $('trip-search').addEventListener('input',function(){
    var pos=this.selectionStart;
    fSearch=this.value;
    renderTrips();
    var el=$('trip-search');
    if(el){el.focus();try{el.setSelectionRange(pos,pos);}catch(e){}}
  });
  $('trip-status-filter').addEventListener('change',function(){fStatus=this.value;renderTrips();});
  if($('btn-back')) $('btn-back').addEventListener('click',function(){selCid=null;render();});
  document.querySelectorAll('.trip-sup-link').forEach(function(el){
    el.addEventListener('click', function(e){
      e.stopPropagation();
      go('vendors');
      setTimeout(function(){openVendorForm(el.dataset.vendorId);},100);
    });
  });
  document.querySelectorAll('.trip-invoice-link').forEach(function(el){
    el.addEventListener('click', function(e){
      e.stopPropagation();
      openInvoiceDetail(el.dataset.invoice);
    });
  });
  document.querySelectorAll('.edit-trip').forEach(function(btn){
    btn.addEventListener('click',function(){openTripForm(btn.dataset.id);});
  });
  document.querySelectorAll('.del-trip').forEach(function(btn){
    btn.addEventListener('click',function(){delTrip(btn.dataset.id);});
  });
  document.querySelectorAll('#main .open-client').forEach(function(span){
    span.addEventListener('click',function(e){
      e.stopPropagation();
      openClientForm(span.dataset.id);
    });
  });
  document.querySelectorAll('.trip-list-row').forEach(function(row){
    row.addEventListener('click',function(e){
      if(e.target.closest('input, button, .open-client, .trip-sup-link, .trip-invoice-link')) return;
      openTripForm(row.dataset.tripId);
    });
  });

  // Checkbox handling
  var checkAll = document.getElementById('trip-check-all');
  var delBtn   = document.getElementById('btn-delete-checked-trips');
  var selBtn   = document.getElementById('btn-select-all-trips');

  function updateDeleteBtn(){
    var checked = document.querySelectorAll('.trip-row-cb:checked');
    if(delBtn) delBtn.style.display = checked.length ? 'inline-block' : 'none';
    if(selBtn) selBtn.textContent = checked.length === document.querySelectorAll('.trip-row-cb').length ? 'Deselect All' : 'Select All';
    if(checkAll) checkAll.checked = checked.length === document.querySelectorAll('.trip-row-cb').length && checked.length > 0;
    if(checkAll) checkAll.indeterminate = checked.length > 0 && checked.length < document.querySelectorAll('.trip-row-cb').length;
  }

  if(checkAll){
    checkAll.addEventListener('change', function(){
      document.querySelectorAll('.trip-row-cb').forEach(function(cb){ cb.checked = checkAll.checked; });
      updateDeleteBtn();
    });
  }
  if(selBtn){
    selBtn.addEventListener('click', function(){
      var cbs = document.querySelectorAll('.trip-row-cb');
      var allChecked = document.querySelectorAll('.trip-row-cb:checked').length === cbs.length;
      cbs.forEach(function(cb){ cb.checked = !allChecked; });
      updateDeleteBtn();
    });
  }
  document.querySelectorAll('.trip-row-cb').forEach(function(cb){
    cb.addEventListener('change', updateDeleteBtn);
  });
  if(delBtn){
    delBtn.addEventListener('click', function(){
      var ids = Array.from(document.querySelectorAll('.trip-row-cb:checked')).map(function(cb){return cb.dataset.id;});
      if(!ids.length) return;
      if(!confirm('Delete '+ids.length+' trip'+(ids.length!==1?'s':'')+' ?')) return;
      snapshot('Delete '+ids.length+' trip'+(ids.length!==1?'s':''));
      db.trips = db.trips.filter(function(t){ return !ids.includes(t.id); });
      saveDB(); render();
      toast('Deleted '+ids.length+' trip'+(ids.length!==1?'s':''),'ok');
    });
  }
}

function selOpts(opts,val){return opts.map(function(o){return '<option value="'+o+'"'+(o===val?' selected':'')+'>'+o+'</option>';}).join('');}
function fld(label,html,full){return '<div class="field'+(full?' full':'')+'"><label>'+label+'</label>'+html+'</div>';}
function inp(id,type,val,ph){return '<input id="'+id+'" type="'+(type||'text')+'" value="'+(val||'').toString().replace(/"/g,'&quot;')+'" placeholder="'+(ph||'')+'">';}
function sel(id,opts,val){return '<select id="'+id+'"><option value="">Select...</option>'+selOpts(opts,val)+'</select>';}
// statusList can be a flat array (same options for every row) or an object
// keyed by brand name (each row gets that brand's real status tier names).
function statusOptionsFor(statusList,name){
  if(!statusList) return [];
  return Array.isArray(statusList)?statusList:(statusList[name]||[]);
}
// Collapsed by default unless the client/trip already has a balance set
// somewhere in this grid — existing data should never be hidden by
// default, only the common case of an all-empty section. See
// bindBalanceGridToggles() for the click handler (delegated on the
// containing modal, since this grid is re-rendered in more than one form).
function balanceGrid(label,idPrefix,list,data,statusList){
  var hasData = !!data && Object.keys(data).some(function(k){
    var v = data[k];
    if(v==null || v==='') return false;
    return statusList ? !!(v.balance||v.status) : true;
  });
  var gridId = idPrefix+'-grid';
  return '<div class="field full">'+
    '<label class="balance-grid-toggle" data-target="'+gridId+'" style="cursor:pointer;user-select:none;display:flex;align-items:center;gap:6px">'+
      '<span class="balance-grid-arrow" style="display:inline-block;font-size:10px;transition:transform .15s;transform:rotate('+(hasData?'90':'0')+'deg)">&#9656;</span>'+
      label+
    '</label>'+
    '<div id="'+gridId+'" style="display:'+(hasData?'grid':'none')+';grid-template-columns:repeat(auto-fill,minmax('+(statusList?'300px':'220px')+',1fr));gap:8px;border:1px solid #e5e7eb;border-radius:8px;padding:10px;background:#fafafa">'+
      list.map(function(name,i){
        var entry=(data&&data[name])||{};
        var bal=statusList?(entry.balance||''):((data&&data[name])||'');
        var status=statusList?(entry.status||''):'';
        var opts=statusOptionsFor(statusList,name);
        var isOther=status&&statusList&&opts.indexOf(status)===-1;
        var statusHtml=statusList?('<select id="'+idPrefix+'-st-'+i+'" class="balance-status-sel" data-custom-id="'+idPrefix+'-st-custom-'+i+'" style="width:110px;padding:5px 8px;border:1px solid #d1d5db;border-radius:6px;font-size:12px;font-family:inherit">'+
          '<option value="">Status...</option>'+opts.map(function(s){return '<option value="'+s+'"'+(s===status?' selected':'')+'>'+s+'</option>';}).join('')+
          '<option value="Other"'+(isOther?' selected':'')+'>Other</option>'+
          '</select>'+
          '<input id="'+idPrefix+'-st-custom-'+i+'" type="text" value="'+(isOther?status.toString().replace(/"/g,'&quot;'):'')+'" placeholder="Enter status" style="width:100px;padding:5px 8px;border:1px solid #d1d5db;border-radius:6px;font-size:12px;font-family:inherit;display:'+(isOther?'inline-block':'none')+'">'):'';
        return '<div style="display:flex;align-items:center;gap:8px">'+
          '<span style="flex:1;font-size:12px;color:#374151">'+name+'</span>'+
          '<input id="'+idPrefix+'-'+i+'" class="balance-num-input" type="text" inputmode="numeric" value="'+(bal?Number(bal).toLocaleString():'')+'" placeholder="0" style="width:90px;padding:5px 8px;border:1px solid #d1d5db;border-radius:6px;font-size:12px;font-family:inherit">'+
          statusHtml+
        '</div>';
      }).join('')+
    '</div>'+
  '</div>';
}
// Delegated on the modal (rather than bound per-toggle) since balanceGrid()
// output gets replaced wholesale when the trip form's Client dropdown
// changes — a delegated listener on the stable modal container keeps
// working across that re-render without needing to be re-bound. Called
// once per form open (openClientForm/openTripForm); harmless if it stacks
// across repeated opens in the same session, same as the other delegated
// modal-level listeners in this file (e.g. refreshBookedTripSummary).
function bindBalanceGridToggles(){
  $('modal').addEventListener('click', function(e){
    var toggle = e.target.closest ? e.target.closest('.balance-grid-toggle') : null;
    if(!toggle) return;
    var target = document.getElementById(toggle.dataset.target);
    if(!target) return;
    var arrow = toggle.querySelector('.balance-grid-arrow');
    var isOpen = target.style.display !== 'none';
    target.style.display = isOpen ? 'none' : 'grid';
    if(arrow) arrow.style.transform = 'rotate('+(isOpen?'0':'90')+'deg)';
  });
}
// A plain has/doesn't-have checklist — unlike balanceGrid above, there's no
// balance number or status per card, just presence. checkedList is an array
// of card name strings (client.airlineCreditCards / client.hotelCreditCards).
// Shared by both the airline- and hotel-branded card checklists below —
// cardsByBrand groups card names under their brand (airline or hotel chain).
function brandedCardsChecklist(label, idPrefix, cardsByBrand, checkedList){
  checkedList = checkedList || [];
  return '<div class="field full"><label>'+label+' <span class="hint" style="text-transform:none;font-weight:400">(which '+label.toLowerCase()+' does this client hold)</span></label>'+
    '<div style="border:1px solid #e5e7eb;border-radius:8px;padding:10px;max-height:240px;overflow-y:auto;background:#fafafa">'+
      Object.keys(cardsByBrand).map(function(brand){
        return '<div style="margin-bottom:8px">'+
          '<div style="font-size:11px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.03em;margin-bottom:3px">'+brand+'</div>'+
          cardsByBrand[brand].map(function(card){
            var checked = checkedList.indexOf(card)!==-1;
            return '<label style="display:flex;align-items:center;gap:8px;padding:2px 0;font-size:13px;cursor:pointer">'+
              '<input type="checkbox" class="'+idPrefix+'-cc-cb" value="'+card.replace(/"/g,'&quot;')+'" '+(checked?'checked':'')+' style="width:14px;height:14px">'+
              '<span>'+card+'</span>'+
            '</label>';
          }).join('')+
        '</div>';
      }).join('')+
    '</div>'+
  '</div>';
}
function readCardChecklist(idPrefix){
  return Array.from(document.querySelectorAll('.'+idPrefix+'-cc-cb:checked')).map(function(cb){return cb.value;});
}
function airlineCreditCardsGrid(idPrefix, checkedList){
  return brandedCardsChecklist('Airline Credit Cards', idPrefix, AIRLINE_CREDIT_CARDS, checkedList);
}
function hotelCreditCardsGrid(idPrefix, checkedList){
  return brandedCardsChecklist('Hotel Credit Cards', idPrefix, HOTEL_CREDIT_CARDS, checkedList);
}
function readBalanceGrid(idPrefix,list,statusList){
  var out={};
  list.forEach(function(name,i){
    var v=gn(idPrefix+'-'+i);
    var s=statusList?gv(idPrefix+'-st-'+i):'';
    if(s==='Other') s=gv(idPrefix+'-st-custom-'+i);
    if(statusList){
      if(v||s) out[name]={balance:v||0,status:s||''};
    }else if(v){
      out[name]=v;
    }
  });
  return out;
}

function addNoteEntry(){
  const log=$('notes-log');
  // Must target the "No notes yet" placeholder specifically by id — the
  // previous 'div[style]' selector matched ANY styled div in the container,
  // including an existing note's own header row (ts/type/delete), silently
  // stripping it when a new note was added alongside existing ones.
  const empty=document.getElementById('notes-log-empty');
  if(empty) empty.remove();
  const idx=log.querySelectorAll('.note-entry').length;
  const div=document.createElement('div');
  div.className='note-entry';div.id='note-entry-'+idx;
  div.innerHTML=
    '<div style="display:flex;align-items:center;margin-bottom:4px">'+
      '<span class="note-ts" style="font-size:10px;font-weight:600;color:#2563eb;letter-spacing:.03em">'+tsNow()+'</span>'+
      '<select class="note-type-sel" id="note-type-'+idx+'">'+
        '<option value="">-- Type --</option>'+
        '<option value="Email Sent">Email Sent</option>'+
        '<option value="Email Received">Email Received</option>'+
        '<option value="Initial Call">Initial Call</option>'+
        '<option value="Follow-up">Follow-up</option>'+
        '<option value="Post-Trip Follow-up">Post-Trip Follow-up</option>'+
        '<option value="General">General</option>'+
        '<option value="Trip Import">Trip Import</option>'+
        '<option value="Text Message Sent">Text Message Sent</option>'+'<option value="Text Message Received">Text Message Received</option>'+'<option value="Lead">Lead</option>'+
        '<option value="Facebook Message">Facebook Message</option>'+
      '</select>'+
      '<button class="del-note-btn" title="Delete note" style="margin-left:auto;background:none;border:none;cursor:pointer;color:#dc2626;font-size:15px;padding:2px 6px;border-radius:4px;line-height:1">&#128465;&#65039;</button>'+
    '</div>'+
    '<textarea class="note-txt" id="note-txt-'+idx+'" rows="2" placeholder="Type your note here..."></textarea>';

  div.querySelector('textarea').focus();

// ── Booked Trip Details ──────────────────────────────────────────────────
// A confirmed-booking recap, organized into the same categories as the
// Book a Trip form's "Type of Travel Needed" checkboxes (Airline, Hotel,
// Cruise, Car Rental, Tours, Theme Park, Train, Bus), each with its own
// confirmation number. Stored as trip.booked = {airline,hotel,cruise,
// carRental,tours,themePark,train,bus}, kept separate from the trip's existing
// top-level fields (airline/destination/departDate/etc., which stay the
// at-a-glance summary used everywhere else in the app — Trips list,
// Calendar, exports) so nothing else has to change to support this.
function pointsProgramOptionsHtml(selected){
  function opts(list){ return list.map(function(o){return '<option value="'+o+'"'+(o===selected?' selected':'')+'>'+o+'</option>';}).join(''); }
  return '<option value="">Select...</option>'+
    '<optgroup label="Airlines">'+opts(AIRLINES)+'</optgroup>'+
    '<optgroup label="Hotels">'+opts(HOTELS)+'</optgroup>'+
    '<optgroup label="Credit Cards">'+opts(CREDIT_CARDS)+'</optgroup>';
}
// Points Used entries are a dynamic add/remove list (same pattern as hotel/
// tour/cabin/flight entries) rather than the old fixed-3-block layout, so
// any section can record any number of redemptions — a booking often mixes
// more than one program (e.g. airline miles plus a transferred credit-card
// balance). One shared list per section (not per sub-entry like a flight
// segment or hotel stay), same as Confirmation Number/Price/Notes.
function pointsEntryRowInnerHtml(entry){
  entry = entry || {};
  return '<div style="display:flex;justify-content:flex-end;margin-bottom:4px">'+
      '<button type="button" class="del-points-entry-btn" style="background:none;border:none;color:#dc2626;cursor:pointer;font-size:12px">&#128465;&#65039; Remove</button>'+
    '</div>'+
    '<div style="display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px">'+
      '<div class="field"><label>Program</label><select class="points-entry-program">'+pointsProgramOptionsHtml(entry.program)+'</select></div>'+
      '<div class="field"><label>Points/Miles Used</label><input class="points-entry-amount" type="number" value="'+(entry.amount||'')+'"></div>'+
      '<div class="field"><label>Cost ($)</label><input class="points-entry-cost" type="number" value="'+(entry.cost||'')+'"></div>'+
    '</div>';
}
function pointsEntryRowHtml(entry){
  return '<div class="points-entry-row" style="border:1px solid #e5e7eb;border-radius:8px;padding:12px;margin-bottom:10px;background:#fafafa">'+pointsEntryRowInnerHtml(entry)+'</div>';
}
function pointsEntriesListHtml(entries, emptyId){
  return entries.length ? entries.map(pointsEntryRowHtml).join('') : '<div id="'+emptyId+'" style="color:#aaa;font-size:12px;padding:6px 0">No points/miles redemptions added yet</div>';
}
// Takes the container element directly (not an id) so the same function
// works for a page-level container (document.getElementById(...)) as well
// as any future per-entry nested container — querySelectorAll only ever
// searches that element's own descendants, so callers naturally stay
// isolated from each other without extra scoping logic.
function readPointsEntriesFrom(containerEl){
  if(!containerEl) return [];
  return Array.from(containerEl.querySelectorAll('.points-entry-row')).map(function(row){
    return {
      program: (row.querySelector('.points-entry-program')||{}).value||'',
      amount: Number((row.querySelector('.points-entry-amount')||{}).value)||0,
      cost: Number((row.querySelector('.points-entry-cost')||{}).value)||0
    };
  }).filter(function(e){ return e.program||e.amount||e.cost; });
}
// Same row markup as pointsEntriesListHtml but with a class-marked (not
// id-marked) empty placeholder, since this is used inside a per-hotel-entry
// nested list — the hotel entries themselves are a dynamic list, so more
// than one of these can exist on the page at once and can't share an id.
function pointsEntriesListHtmlNoId(entries){
  return (entries && entries.length) ? entries.map(pointsEntryRowHtml).join('') : '<div class="pts-entries-empty" style="color:#aaa;font-size:12px;padding:6px 0">No points/miles redemptions added yet</div>';
}

// Aggregates every Points Used entry across every Booked Trip Details
// section (Airline/Hotel/Cruise/Car Rental/Tours/Theme Park/Train/Bus) by
// program, plus every section's Price($) field and every points entry's own
// Cost($) — both represent real cash spent — into one rollup. Recomputed
// live off the current form state (see refreshBookedTripSummary()), not a
// static snapshot, so it stays accurate while the form is being filled in.
function computeBookedTripSummary(bd){
  var allPts = []
    .concat(bd.airline.pts||[])
    .concat([].concat.apply([], (bd.hotel||[]).map(function(h){return h.pts||[];})))
    .concat(bd.cruise.pts||[])
    .concat(bd.carRental.pts||[])
    .concat(bd.toursPts||[])
    .concat(bd.themePark.pts||[])
    .concat(bd.train.pts||[])
    .concat(bd.bus.pts||[]);
  var byProgram = {};
  allPts.forEach(function(p){
    if(!p.program && !p.amount && !p.cost) return;
    var key = p.program || '(no program selected)';
    if(!byProgram[key]) byProgram[key] = {program:key, points:0};
    byProgram[key].points += Number(p.amount)||0;
  });
  var rows = Object.keys(byProgram).map(function(k){return byProgram[k];}).sort(function(a,b){return b.points-a.points;});
  var totalPtsCost = allPts.reduce(function(a,p){return a+(Number(p.cost)||0);},0);
  var totalPrice = (bd.airline.price||0)
    + (bd.hotel||[]).reduce(function(a,h){return a+(h.price||0);},0)
    + (bd.cruise.price||0)
    + (bd.carRental.price||0)
    + (bd.tours||[]).reduce(function(a,t){return a+(t.price||0);},0)
    + (bd.themePark.price||0)
    + (bd.train.price||0)
    + (bd.bus.price||0);
  return {rows:rows, totalCash: totalPrice + totalPtsCost};
}

function openTripForm(id){
  const d=id?(db.trips.find(function(t){return t.id===id;})||{}):{};
  const initCid=d.clientId||selCid||'';
  const copts=[...db.clients].sort(function(a,b){return (a.name||'').toLowerCase().localeCompare((b.name||'').toLowerCase());}).map(function(c){return '<option value="'+c.id+'"'+(c.id===initCid?' selected':'')+'>'+c.name+' ('+c.id+')</option>';}).join('');
  const vopts=[...db.vendors].sort(function(a,b){return (a.name||'').toLowerCase().localeCompare((b.name||'').toLowerCase());}).map(function(v){return '<option value="'+v.id+'"'+(v.id===d.supplierId?' selected':'')+'>'+v.name+'</option>';}).join('');
  const additionalClientChecks=[...db.clients].sort(function(a,b){return (a.name||'').toLowerCase().localeCompare((b.name||'').toLowerCase());}).map(function(c){
    var checked=(d.clientIds||[]).includes(c.id)?'checked':'';
    return '<label style="display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px;cursor:pointer">'+
      '<input type="checkbox" class="trip-client-cb" value="'+c.id+'" '+checked+' style="width:14px;height:14px">'+
      '<span>'+c.name+'</span>'+
    '</label>';
  }).join('');
  // Every OTHER trip, for grouping separate trip records that are really one
  // bigger multi-city vacation (e.g. a NYC leg + a Paris leg) — linking is
  // kept in sync on both sides by saveTrip(), so checking a trip here also
  // adds this trip to *its* Linked Trips list, and unchecking removes it
  // from both.
  const linkedTripChecks=[...db.trips].filter(function(t){return t.id!==id;}).sort(function(a,b){return (b.departDate||'').localeCompare(a.departDate||'');}).map(function(t){
    var checked=(d.linkedTripIds||[]).includes(t.id)?'checked':'';
    var label=[t.destination||'(no destination)',t.departDate||'',t.clientName||''].filter(Boolean).join(' — ');
    return '<label style="display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px;cursor:pointer">'+
      '<input type="checkbox" class="trip-link-cb" value="'+t.id+'" '+checked+' style="width:14px;height:14px">'+
      '<span>'+escHtml(label)+'</span>'+
    '</label>';
  }).join('');
  $('modal').innerHTML=
    '<div class="modal-hdr"><div class="modal-title">'+(id?'Edit Trip':'Add Trip')+'</div><button class="close-btn" id="modal-close">&#x2715;</button></div>'+
    '<div class="fg">'+
      fld('Client','<select id="tc"><option value="">Select client...</option>'+copts+'</select>',true)+
      fld('Supplier','<select id="tsup"><option value="">None</option>'+vopts+'</select>')+
      '<div class="field full"><label>Additional Clients <span class="hint" style="text-transform:none;font-weight:400">(if more than one client is on this trip)</span></label>'+
        '<div style="border:1px solid #e5e7eb;border-radius:8px;padding:10px;max-height:180px;overflow-y:auto;background:#fafafa">'+
          (additionalClientChecks || '<div style="color:#aaa;font-size:12px">No clients yet</div>')+
        '</div>'+
      '</div>'+
      '<div class="field full"><label>Linked Trips <span class="hint" style="text-transform:none;font-weight:400">(other trip records that are part of the same overall vacation, e.g. a multi-city itinerary)</span></label>'+
        '<div style="border:1px solid #e5e7eb;border-radius:8px;padding:10px;max-height:180px;overflow-y:auto;background:#fafafa">'+
          (linkedTripChecks || '<div style="color:#aaa;font-size:12px">No other trips yet</div>')+
        '</div>'+
      '</div>'+
      fld('Origin',inp('tor','text',d.origin,'e.g. JFK'))+fld('Destination',inp('tde','text',d.destination,'e.g. Tokyo, Japan'))+
      fld('Depart Date',inp('tdd','date',d.departDate))+fld('Return Date',inp('trd','date',d.returnDate))+
      fld('Status',sel('tst',STATUSES,d.status||'Planning'))+fld('Trip Type',sel('tty',TYPES,d.type||'Leisure'))+
      fld('Airline',sel('tai',AIRLINES,d.airline))+fld('Class of Service',sel('tcl',CLASSES,d.flightClass||'Economy'))+
      fld('Hotel Brand',sel('tho',HOTELS,d.hotel))+fld('Hotel Nights',inp('thn','number',d.hotelNights||0))+
      fld('Cruise Line',sel('tcr',CRUISE_LINES,d.cruiseLine))+fld('Ship Name','<select id="tship">'+shipOptionsHtml(d.cruiseLine,d.shipName)+'</select>')+
      fld('Points Used',inp('tpu','number',d.pointsUsed||0))+fld('Cash Paid ($)',inp('tcp','number',d.cashPaid||0))+
      fld('Total Value ($)',inp('tva','number',d.totalValue||0))+fld('Invoice Number',inp('tbr','text',d.bookingRef,'e.g. INV-10234'))+
      fld('Invoice Date',inp('tinv','date',d.invoiceDate))+
      fld('Product',inp('tpr','text',d.product,'e.g. Airline Booking:Roundtrip Intl Business'))+
      '<div id="trip-balance-sections">'+tripBalanceSectionsHtml(initCid)+'</div>'+
      fld('Notes','<textarea id="tno">'+(d.notes||'')+'</textarea>',true)+
      bookedTripDetailsHtml(d.booked)+
    '</div>'+
    '<div class="form-actions"><button class="cancel-btn" id="modal-cancel">Cancel</button><button class="save-btn" id="modal-save-trip" data-id="'+(id||'')+'">Save Trip</button></div>';
  $('modal').classList.add('modal-wide');
  $('overlay').classList.add('open');
  $('modal-close').addEventListener('click',closeModal);
  $('modal-cancel').addEventListener('click',closeModal);
  $('modal-save-trip').addEventListener('click',function(){saveTrip(this.dataset.id);});
  $('tc').addEventListener('change',function(){
    document.getElementById('trip-balance-sections').innerHTML = tripBalanceSectionsHtml(this.value);
    bindTripBalanceListeners();
  });
  $('tcr').addEventListener('change',function(){
    document.getElementById('tship').innerHTML = shipOptionsHtml(this.value,'');
  });
  bindTripBalanceListeners();
  bindBookedTripDetailsListeners();
}

function saveTrip(id){
  const clientId=gv('tc'),dest=gv('tde');
  if(!clientId||!dest){toast('Client and destination are required','err');return;}
  const airNumPax=Number(gv('tb-air-num-pax'))||0;
  const airPaxSelEl=document.getElementById('tb-air-passengers');
  const airPaxCount=airPaxSelEl?airPaxSelEl.selectedOptions.length:0;
  if(airNumPax && airPaxCount!==airNumPax){
    toast('Airline: '+airPaxCount+' passenger'+(airPaxCount!==1?'s':'')+' selected but Number of Passengers is '+airNumPax+' — they must match','err');
    return;
  }
  snapshot(id?'Edit trip':'Add trip');
  const client=db.clients.find(function(c){return c.id===clientId;});
  const supplierId=gv('tsup');
  const supplier=supplierId?db.vendors.find(function(v){return v.id===supplierId;}):null;
  // clientId/clientName stay the primary/billing contact (revenue, CSV export,
  // and invoice-dedup logic all key off this) — clientIds is purely additional
  // travelers linked to the same trip so it also shows on their own records.
  const additionalClientIds=Array.from(document.querySelectorAll('.trip-client-cb:checked')).map(function(cb){return cb.value;}).filter(function(cid){return cid!==clientId;});
  const linkedTripIds=Array.from(document.querySelectorAll('.trip-link-cb:checked')).map(function(cb){return cb.value;});
  // Captured before db.trips gets overwritten below — this is the sync diff's
  // "before" state for the linkedTripIds two-way sync at the end of this function.
  const oldLinkedTripIds=id?((db.trips.find(function(t){return t.id===id;})||{}).linkedTripIds||[]):[];
  const data={clientId:clientId,clientName:client?client.name:'',clientIds:additionalClientIds,linkedTripIds:linkedTripIds,supplierId:supplierId,supplierName:supplier?supplier.name:'',origin:gv('tor'),destination:dest,departDate:gv('tdd'),returnDate:gv('trd'),status:gv('tst')||'Planning',type:gv('tty')||'Leisure',airline:gv('tai'),flightClass:gv('tcl')||'Economy',hotel:gv('tho'),hotelNights:gn('thn'),cruiseLine:gv('tcr'),shipName:gv('tship'),pointsUsed:gn('tpu'),cashPaid:gn('tcp'),totalValue:gn('tva'),bookingRef:gv('tbr'),invoiceDate:gv('tinv'),product:gv('tpr'),notes:gv('tno'),booked:readBookedTripDetails()};
  if(client){
    client.mileageBalances=readBalanceGrid('mb',AIRLINES,AIRLINE_STATUS);
    client.hotelBalances=readBalanceGrid('hb',HOTELS,HOTEL_STATUS);
    client.creditCardBalances=readBalanceGrid('cb',CREDIT_CARDS);
    client.airlineCreditCards=readCardChecklist('facc');
    client.hotelCreditCards=readCardChecklist('fhcc');
  }
  if(supplier && !(supplier.clientIds||[]).includes(clientId)){
    if(!supplier.clientIds) supplier.clientIds=[];
    supplier.clientIds.push(clientId);
  }
  if(id){
    db.trips=db.trips.map(function(t){return t.id===id?Object.assign({},t,data):t;});
    toast('Trip updated');
  }else{
    data.id=newId('T',db.trips);
    db.trips.push(data);
    if(client) client.totalTrips=(client.totalTrips||0)+1;
    toast('Trip added');
  }
  // Keep Linked Trips symmetric: checking a trip here also adds this trip to
  // *its* list, and unchecking removes this trip from it — otherwise the
  // link would only be visible from the side it was set on.
  const finalTripId=id||data.id;
  const linksToAdd=linkedTripIds.filter(function(tid){return oldLinkedTripIds.indexOf(tid)===-1;});
  const linksToRemove=oldLinkedTripIds.filter(function(tid){return linkedTripIds.indexOf(tid)===-1;});
  db.trips.forEach(function(t){
    if(t.id===finalTripId) return;
    if(linksToAdd.indexOf(t.id)!==-1){
      t.linkedTripIds=t.linkedTripIds||[];
      if(t.linkedTripIds.indexOf(finalTripId)===-1) t.linkedTripIds.push(finalTripId);
    }
    if(linksToRemove.indexOf(t.id)!==-1){
      t.linkedTripIds=(t.linkedTripIds||[]).filter(function(x){return x!==finalTripId;});
    }
  });
  saveDB();closeModal();render();
}

function delClient(id){
  const c=db.clients.find(function(x){return x.id===id;});
  if(!c||!confirm('Delete '+c.name+' and all their trips?'))return;
  snapshot('Delete client: '+c.name);
  db.clients=db.clients.filter(function(x){return x.id!==id;});
  db.trips=db.trips.filter(function(t){return t.clientId!==id;});
  if(selCid===id) selCid=null;
  saveDB();toast('Client deleted');render();
}

function delTrip(id){
  if(!confirm('Delete this trip?'))return;
  snapshot('Delete trip');
  db.trips=db.trips.filter(function(t){return t.id!==id;});
  saveDB();toast('Trip deleted');render();
}

function plannerSortArrow(col){
  var c = window._plannerSortCol || 'dueDate';
  var d = window._plannerSortDir || 'asc';
  if(c!==col) return '';
  return d==='asc' ? ' &#9650;' : ' &#9660;';
}

function renderPlanner(){
  var statusFilter = window._plannerStatus||'';
  var dateFilter = window._plannerDateFilter!==undefined?window._plannerDateFilter:'today-overdue';
  var plannerSortCol = window._plannerSortCol || 'dueDate';
  var plannerSortDir = window._plannerSortDir || 'asc';
  var tasks = db.planner.filter(function(t){
    // Marking a task done removes it from the planner view entirely — the
    // only way to see completed tasks is explicitly picking the Done filter.
    if(statusFilter==='done'){ if(!t.done) return false; }
    else if(t.done) return false;
    if(dateFilter==='today-overdue' && !(t.dueDate && t.dueDate<=today())) return false;
    return true;
  }).sort(function(a,b){
    if(!!a.done !== !!b.done) return a.done ? 1 : -1;
    var av, bv;
    if(plannerSortCol==='client'){
      av=(clientName(a)||'').toLowerCase();
      bv=(clientName(b)||'').toLowerCase();
    } else {
      av=(a[plannerSortCol]||'').toString().toLowerCase();
      bv=(b[plannerSortCol]||'').toString().toLowerCase();
    }
    if(av<bv) return plannerSortDir==='asc'?-1:1;
    if(av>bv) return plannerSortDir==='asc'?1:-1;
    return 0;
  });
  var openCount = db.planner.filter(function(t){return !t.done;}).length;

  function clientName(t){
    var cs=taskClients(t);
    return cs.length ? cs.map(function(c){return c.name;}).join(', ') : null;
  }

    var cs=taskClients(t);

  }

  function entityBadges(t){
    var out=[];
    if(t.vendorId){
      var v=db.vendors.find(function(x){return x.id===t.vendorId;});

    }
    if(t.tripId){
      var tr=db.trips.find(function(x){return x.id===t.tripId;});
      if(tr) out.push('<span class="badge b-amber planner-trip-link" data-id="'+tr.id+'" style="cursor:pointer" title="Open trip">&#9992;&#65039; '+(tr.destination||'Trip')+'</span>');
    }

  }

  $('main').innerHTML =
    '<div class="page-hdr" style="display:grid;grid-template-columns:1fr auto 1fr">'+

      '<div></div>'+
    '</div>'+
    '<div class="stats-grid" style="grid-template-columns:repeat(2,1fr)">'+
      '<div class="stat" id="stat-planner-open"><div class="stat-lbl">Open Tasks</div><div class="stat-val">'+openCount+'</div></div>'+
      '<div class="stat" id="stat-planner-total"><div class="stat-lbl">Total Tasks</div><div class="stat-val">'+db.planner.length+'</div></div>'+
    '</div>'+
    '<div class="search-row">'+
      '<input id="planner-search" placeholder="Search tasks..."/>'+
      '<select id="planner-status-filter">'+
        '<option value=""'+(statusFilter===''?' selected':'')+'>Open</option>'+
        '<option value="done"'+(statusFilter==='done'?' selected':'')+'>Done</option>'+
      '</select>'+
      '<select id="planner-date-filter">'+
        '<option value=""'+(dateFilter===''?' selected':'')+'>All Dates</option>'+
        '<option value="today-overdue"'+(dateFilter==='today-overdue'?' selected':'')+'>Today &amp; Overdue</option>'+
      '</select>'+
    '</div>'+
    (tasks.length ? '<div class="tbl-wrap"><table class="tbl-planner"><thead><tr>'+
      '<th style="width:32px"></th>'+
      '<th class="sort-th-pl" data-sort="client" style="cursor:pointer">Client'+plannerSortArrow('client')+'</th>'+
      '<th>Phone</th>'+
      '<th>Email</th>'+
      '<th class="sort-th-pl" data-sort="title" style="cursor:pointer">Task'+plannerSortArrow('title')+'</th>'+
      '<th class="sort-th-pl" data-sort="dueDate" style="cursor:pointer">Due Date'+plannerSortArrow('dueDate')+'</th>'+
      '<th>Trip</th>'+
      '<th></th>'+
    '</tr></thead><tbody>'+tasks.map(function(t){
      var overdue = t.dueDate && !t.done && t.dueDate < today();
      var badgesHtml = entityBadges(t);
      // Phone/Email columns reflect just the primary linked client — the
      // Client column itself lists every linked client (see clientLinksHtml).
      var cid = taskClientId(t);
      var linkedClient = cid ? db.clients.find(function(x){return x.id===cid;}) : null;
      var cPhone = linkedClient ? linkedClient.phone : '';
      // Tasks only ever get their own stored email once the task form is
      // saved with a client selected — plenty of existing tasks are linked

        '<td>'+

        '</td>'+
      '</tr>';
    }).join('')+'</tbody></table></div>' : '<div class="empty">No tasks yet — add one to start planning follow-ups tied to clients, suppliers, or trips</div>');

  $('btn-add-task').addEventListener('click', function(){openTaskForm();});
  function taskRow(t){

  var taskHeaders = ['Task','Due Date','Client','Status'];
  var statPlannerOpen = $('stat-planner-open');
  if(statPlannerOpen) statPlannerOpen.addEventListener('click', function(){

  });
  var statPlannerTotal = $('stat-planner-total');
  if(statPlannerTotal) statPlannerTotal.addEventListener('click', function(){

  $('planner-search').addEventListener('input', function(){
    var qv = this.value.toLowerCase();
    document.querySelectorAll('[data-task-id]').forEach(function(row){
      var txt = row.textContent.toLowerCase();
      row.style.display = !qv || txt.includes(qv) ? '' : 'none';

  document.querySelectorAll('.sort-th-pl').forEach(function(th){

  document.querySelectorAll('.task-done-cb').forEach(function(cb){

      if(row){

  document.querySelectorAll('.edit-task').forEach(function(btn){

// Two-level grouping: audience (Travel Agent / Consumer) first, then
// category (Airline/Hotel/etc.) within each — a bookmark missing `audience`
// is treated as Consumer so bookmarks saved before this field existed still
// show up sensibly rather than vanishing from both sections.
function bookmarkSectionHtml(audience, bookmarks){
  var items = bookmarks.filter(function(b){ return (b.audience||'Consumer')===audience; });
  if(!items.length) return '';
  var byCat = {};
  items.forEach(function(b){
    var cat = b.category || 'Other';
    (byCat[cat] = byCat[cat] || []).push(b);
  });
  var cats = BOOKMARK_CATEGORIES.filter(function(c){ return byCat[c]; });
  Object.keys(byCat).forEach(function(c){ if(cats.indexOf(c)===-1) cats.push(c); });
  return '<div style="margin-bottom:28px">'+
    '<div style="font-size:16px;font-weight:700;color:#111;margin-bottom:12px;padding-bottom:6px;border-bottom:2px solid #2563eb">'+escHtml(audience)+'</div>'+
    cats.map(function(cat){
      return '<div style="margin-bottom:16px">'+
        '<div style="font-size:12px;font-weight:700;color:#666;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px">'+escHtml(cat)+'</div>'+
        bookmarkTableHtml(byCat[cat])+
      '</div>';
    }).join('')+
  '</div>';
}
function renderBookmarks(){
  var bookmarks = [...db.bookmarks].sort(function(a,b){return (a.name||'').toLowerCase().localeCompare((b.name||'').toLowerCase());});
  $('main').innerHTML =

      '<button class="add-btn" id="btn-add-bookmark">+ Add Bookmark</button>'+
    '</div></div>'+
    (bookmarks.length ?
      bookmarkSectionHtml('Travel Agent', bookmarks) + bookmarkSectionHtml('Consumer', bookmarks)
      : '<div class="empty">No bookmarks yet — save links to airline sites, visa/documentation portals, or other travel tools you use often</div>');

  $('btn-add-bookmark').addEventListener('click', function(){openBookmarkForm();});
  $('btn-seed-bookmarks').addEventListener('click', seedDefaultBookmarks);
  document.querySelectorAll('.edit-bookmark').forEach(function(btn){
    btn.addEventListener('click', function(){openBookmarkForm(this.dataset.id);});
  });
  document.querySelectorAll('.del-bookmark').forEach(function(btn){
    btn.addEventListener('click', function(){deleteBookmark(this.dataset.id);});
  });
  // target="_blank" alone isn't always honored for links clicked from a
  // file:// page — force the new-tab behavior explicitly via window.open
  // rather than relying on the browser's handling of the attribute.
  document.querySelectorAll('.bookmark-link').forEach(function(a){
    a.addEventListener('click', function(e){
      e.preventDefault();
      window.open(a.href, '_blank', 'noopener,noreferrer');

  $('modal').innerHTML=

      fld('Audience', '<select id="bm-audience">'+selOpts(BOOKMARK_AUDIENCES,d.audience||'Consumer')+'</select>')+

      '<button class="save-btn" id="modal-save-bookmark" data-id="'+(id||'')+'">Save Bookmark</button>'+

// Adds the DEFAULT_BOOKMARKS starter pack, skipping any name+category+

// Every linked client's email (primary + additional), comma-joined — comma
// is the mailto: multi-recipient separator, so this string can be dropped
// straight into an "Email in Outlook" link with no further work.
function linkedClientEmailsStr(clientId, additionalIds){
  var ids = [];
  if(clientId) ids.push(clientId);
  (additionalIds||[]).forEach(function(cid){ if(cid && ids.indexOf(cid)===-1) ids.push(cid); });
  return ids.map(function(cid){
    var c = db.clients.find(function(x){return x.id===cid;});
    return c && c.email;
  }).filter(Boolean).join(', ');
}
function openTaskForm(id){
  var d = id ? (db.planner.find(function(t){return t.id===id;})||{}) : {};
  // Existing tasks linked to a client before this task ever had its own
  // Email field (or ones the client dropdown was never re-touched on)
  // otherwise show up with a blank Email despite being linked — fall back
  // to every linked client's email so the field reflects reality on open,
  // not just after re-selecting clients.
  var displayEmail = d.email || linkedClientEmailsStr(d.clientId, d.clientIds);
  var sortedClients = [...db.clients].sort(function(a,b){return (a.name||'').toLowerCase().localeCompare((b.name||'').toLowerCase());});
  var sortedVendors = [...db.vendors].sort(function(a,b){return (a.name||'').toLowerCase().localeCompare((b.name||'').toLowerCase());});
  var sortedTrips = [...db.trips].sort(function(a,b){return (b.departDate||'').localeCompare(a.departDate||'');});

  var clientOpts = sortedClients.map(function(c){return '<option value="'+c.id+'"'+(c.id===d.clientId?' selected':'')+'>'+c.name+'</option>';}).join('');
  var vendorOpts = sortedVendors.map(function(v){return '<option value="'+v.id+'"'+(v.id===d.vendorId?' selected':'')+'>'+v.name+'</option>';}).join('');
  var tripOpts = sortedTrips.map(function(t){
    var c = db.clients.find(function(x){return x.id===t.clientId;});
    var label = (t.destination||'Trip')+(c?' — '+c.name:'')+(t.departDate?' ('+t.departDate+')':'');
    return '<option value="'+t.id+'"'+(t.id===d.tripId?' selected':'')+'>'+label+'</option>';
  }).join('');
  // Linked Client (tk-client) stays the primary contact — drives the Email
  // autofill and is the one client a single-id lookup like taskClientId
  // wants — while this checkbox list is every additional client also on the
  // task, same clientId/clientIds split the trip form already uses.
  var additionalClientChecks = sortedClients.map(function(c){

    return '<label style="display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px;cursor:pointer">'+
      '<input type="checkbox" class="task-client-cb" value="'+c.id+'" '+checked+' style="width:14px;height:14px">'+
      '<span>'+c.name+'</span>'+
    '</label>';
  }).join('');

  $('modal').innerHTML=
    '<div class="modal-hdr"><div class="modal-title">'+(id?'Edit Task':'Add Task')+'</div><button class="close-btn" id="modal-close">&#x2715;</button></div>'+
    '<div class="fg">'+
      fld('Task Title', inp('tk-title','text',d.title,'e.g. Follow up on quote'), true)+
      fld('Email','<div style="display:flex;align-items:center;gap:8px">'+inp('tk-email','email',displayEmail)+
        '<span id="tk-email-link">'+(displayEmail?('<a href="mailto:'+mailtoAddr(displayEmail)+'" title="Email in Outlook" style="color:#2563eb;text-decoration:none;font-size:16px;flex-shrink:0">&#9993;&#65039;</a>'):'')+'</span>'+
      '</div>')+
      fld('Due Date', inp('tk-due','date',d.dueDate))+
      fld('Time', inp('tk-time','time',d.dueTime))+
      fld('Status','<select id="tk-done"><option value="0"'+(!d.done?' selected':'')+'>Open</option><option value="1"'+(d.done?' selected':'')+'>Done</option></select>')+
      fld('Completion Note Type', sel('tk-note-type', NOTE_TYPES, d.completionNoteType||'General'))+
      fld('Linked Client','<select id="tk-client"><option value="">None</option>'+clientOpts+'</select>')+
      '<div class="field full"><label>Additional Clients <span class="hint" style="text-transform:none;font-weight:400">(if more than one client is tied to this task)</span></label>'+
        '<div style="border:1px solid #e5e7eb;border-radius:8px;padding:10px;max-height:180px;overflow-y:auto;background:#fafafa">'+
          (additionalClientChecks || '<div style="color:#aaa;font-size:12px">No clients yet</div>')+
        '</div>'+

// Linking clients on the task form also carries over their email(s) — the
// primary Linked Client plus every checked Additional Client — so the
// Email field (and its "Email in Outlook" mailto link, which can carry more
// than one recipient as a comma-separated list) stays in sync with whoever
// is actually linked instead of needing to be typed by hand. Re-runs on
// every change to either the primary select or an additional-client
// checkbox, so adding/removing a linked client updates it immediately.
function refreshTaskEmailFromLinkedClients(){
  var emailInput = document.getElementById('tk-email');
  if(!emailInput) return;
  var clientSel = document.getElementById('tk-client');
  var clientId = clientSel ? clientSel.value : '';
  var additionalIds = Array.from(document.querySelectorAll('.task-client-cb:checked')).map(function(cb){return cb.value;});
  var emails = linkedClientEmailsStr(clientId, additionalIds);
  if(emails){
    emailInput.value = emails;
    updateTaskEmailLinkDisplay();
  }
}
function updateTaskEmailLinkDisplay(){
  var emailInput = document.getElementById('tk-email');
  var linkSpan = document.getElementById('tk-email-link');
  if(!emailInput || !linkSpan) return;
  var val = emailInput.value.trim();
  linkSpan.innerHTML = val ? '<a href="mailto:'+mailtoAddr(val)+'" title="Email in Outlook" style="color:#2563eb;text-decoration:none;font-size:16px;flex-shrink:0">&#9993;&#65039;</a>' : '';
}
// Saves the current task as-is, then opens a fresh blank task form for the
// user to schedule next — carrying forward the same client/supplier/trip
// links and leaving a history trail (the just-saved task's title + notes)
// in the new task's description, so context isn't lost between follow-ups.
function saveTaskAndNew(id){
  var title = gv('tk-title');
  if(!title){toast('Task title is required','err');return;}
  var email = gv('tk-email');
  var clientId = gv('tk-client');
  var additionalClientIds = Array.from(document.querySelectorAll('.task-client-cb:checked')).map(function(cb){return cb.value;});
  var vendorId = gv('tk-vendor');
  var tripId = gv('tk-trip');
  var noteType = gv('tk-note-type');
  var desc = gv('tk-desc');

  saveTask(id);

  openTaskForm();
  document.getElementById('tk-title').value = title;
  document.getElementById('tk-email').value = email;
  var clientSel=document.getElementById('tk-client'); if(clientSel) clientSel.value=clientId;
  document.querySelectorAll('.task-client-cb').forEach(function(cb){ cb.checked = additionalClientIds.indexOf(cb.value)!==-1; });
  var vendorSel=document.getElementById('tk-vendor'); if(vendorSel) vendorSel.value=vendorId;
  var tripSel=document.getElementById('tk-trip'); if(tripSel) tripSel.value=tripId;
  var noteTypeSel=document.getElementById('tk-note-type'); if(noteTypeSel) noteTypeSel.value=noteType;
  document.getElementById('tk-desc').value = 'Follow-up to: "'+title+'"'+(desc?'\n'+desc:'');
  document.getElementById('tk-title').focus();
}

function saveTask(id){
  var title = gv('tk-title');
  if(!title){toast('Task title is required','err');return;}
  snapshot(id?'Edit task':'Add task');
  var wasDone = false;
  if(id){
    var existing = db.planner.find(function(t){return t.id===id;});
    wasDone = existing ? !!existing.done : false;
  }
  var clientId = gv('tk-client');
  // clientId stays the primary contact (drives the task's Email autofill and
  // is what a single-id lookup like taskClientId wants) — clientIds is every
  // additional client also tied to the task, same split the trip form uses.
  var additionalClientIds = Array.from(document.querySelectorAll('.task-client-cb:checked')).map(function(cb){return cb.value;}).filter(function(cid){return cid!==clientId;});
  var data = {
    title:title,
    email:gv('tk-email'),
    dueDate:gv('tk-due'),
    dueTime:gv('tk-time'),
    done: gv('tk-done')==='1',
    completionNoteType: gv('tk-note-type')||'General',
    clientId: clientId,
    clientIds: additionalClientIds,
    vendorId: gv('tk-vendor'),
    tripId: gv('tk-trip'),
    desc: gv('tk-desc')
  };
  if(id){
    db.planner = db.planner.map(function(t){return t.id===id?Object.assign({},t,data):t;});
    toast('Task updated');
  } else {
    data.id = newId('PL', db.planner);
    data.createdAt = today();
    db.planner.push(data);
    toast('Task added');
  }
  if(!wasDone && data.done) logTaskCompletionNote(db.planner.find(function(t){return t.id===(id||data.id);}));
  saveDB();closeModal();render();
}

// skipRender: the planner checkbox handler passes true so checking a task
// off updates that row in place (still checked/struck-through, still there
// to delete if it was a mistake) instead of the whole list immediately
// re-filtering it out of view.
function toggleTaskDone(id, skipRender){
  var task = db.planner.find(function(t){return t.id===id;});
  if(!task) return;
  var wasDone = !!task.done;
  snapshot('Toggle task');
  db.planner = db.planner.map(function(t){return t.id===id?Object.assign({},t,{done:!t.done}):t;});
  if(!wasDone) logTaskCompletionNote(db.planner.find(function(t){return t.id===id;}));
  saveDB();
  if(!skipRender) render();
}

// Marking a task done logs it as a note on every linked client's record, so
// closing out a follow-up leaves a trail on each client without extra steps.
function logTaskCompletionNote(task){
  if(!task) return;
  var taskCids = taskClientIds(task);
  if(!taskCids.length) return;
  var text = 'Task completed: '+task.title+(task.desc?('\n'+task.desc):'');
  db.clients = db.clients.map(function(c){
    if(taskCids.indexOf(c.id)===-1) return c;
    var nl = Array.isArray(c.notesLog)?c.notesLog.slice():[];
    nl.push({ts:tsNow(),text:text,noteType:task.completionNoteType||'General',source:'planner'});
    return Object.assign({},c,{notesLog:nl});
  });
}

function deleteTask(id){
  if(!confirm('Delete this task?')) return;
  snapshot('Delete task');
  db.planner = db.planner.filter(function(t){return t.id!==id;});
  saveDB();render();
  toast('Task deleted');
}

      fld('Note Type', sel('task-note-type', ['Email Sent','Email Received','Initial Call','Follow-up','General','Text Message Sent','Text Message Received','Lead','Facebook Message'], 'General'))+
      fld('Note', '<textarea id="task-note-txt" rows="5" placeholder="Add a note for the linked client, supplier, and/or trip..."></textarea>', true)+
