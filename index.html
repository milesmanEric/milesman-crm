function parseCSVLine(line){
  const result=[];let cur='',inQuote=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch==='"'){inQuote=!inQuote;}
    else if(ch===','&&!inQuote){result.push(cur.trim());cur='';}
    else{cur+=ch;}
  }
  result.push(cur.trim());
  return result;
}

// Given a getCol(row,names,fallbackIdx) accessor and one tokenized row,
// builds the revenue-import row object (client/supplier matching
// included), or returns null if the row should be skipped. Shared by
// "Import Revenue CSV" (importRevenue, header-or-positional getCol) and
// "Clean & Import Revenue File" (cleanAndImportRevenue, header-only getCol
// since cleaned data always has a header row).
function extractRevenueRow(getCol, cols){
  if(cols.length<3) return null;

  const date    = getCol(cols,['date'],0);
  const invoiceNum = getCol(cols,['num','invoice'],1);
  const memo    = getCol(cols,['memo','description'],2);
  const nameVal = getCol(cols,['name'],3);
  const shipDate= getCol(cols,['ship date','shipdate'],4);  // col4 = Ship Date (new) -> trip start date
  const classVal= getCol(cols,['item'],5);        // col5 = Item (was col4)
  const clientFromClass = getCol(cols,['class'],6) || (cols[6]||'').trim(); // col6 = Class (was col5)
  const amtStr  = getCol(cols,['amount','sales price'],9) ||
                  getCol(cols,['amount','sales price'],8) ||
                  cols[cols.length-1]||'';
  const amt     = parseFloat(amtStr.replace(/[$,"]/g,''))||0;

  if(!nameVal||amt===0) return null;

  // Class (normalized to Last, First) is the client whenever it's present.
  // If Name differs from Class, Name is very likely the supplier being paid —
  // check for that. Class blank falls back to Name as the client. Never skip
  // a row over a Name/Class mismatch.
  var nameNormalized  = toLastFirst(nameVal);
  var classNormalized = clientFromClass ? toLastFirst(clientFromClass) : '';
  var namesMatch = classNormalized && nameNormalized.toLowerCase()===classNormalized.toLowerCase();

  var clientName   = classNormalized || nameNormalized;
  var supplierId   = '';
  var supplierName = '';
  var product      = classVal;

  if(!namesMatch){
    // Try to match nameVal against a known supplier first (most common case:
    // Name = supplier being paid, Class = the client the cost is for).
    var matchedSupplier = db.vendors.find(function(v){
      return (v.name||'').toLowerCase().trim()===nameVal.toLowerCase().trim();
    });
    if(matchedSupplier){
      supplierId   = matchedSupplier.id;
      supplierName = matchedSupplier.name;
    }
  }

  // Also try to enrich supplier from the product/item text — exact match only,
  // no loose 'contains' matching (loose matching caused wrong suppliers like Melio/Marriott
  // to collide on short substrings). Only used if we don't already have a supplier match.
  if(!supplierId && classVal){
    var prodParts = classVal.split(':');
    for(var pi=0;pi<prodParts.length;pi++){
      var seg = prodParts[pi].trim().toLowerCase();
      if(seg.length<3) continue; // skip too-short segments that risk false matches
      var sup = db.vendors.find(function(v){
        var vl=(v.name||'').toLowerCase();
        return vl===seg;
      });
      if(sup){supplierId=sup.id;supplierName=sup.name;break;}
    }
  }

  debugLog('Revenue row: name='+nameVal+' class='+clientFromClass+' -> client='+clientName+' supplier='+supplierName+' amt='+amt+(namesMatch?'':' (name/class differ)'));

  return {
    name:clientName,
    isSupplierName:!!supplierName,
    supplierName:supplierName,
    supplierId:supplierId,
    product:product,
    amt:amt,
    date:date,
    shipDate:shipDate,
    memo:memo,
    item:classVal,
    invoiceNum:invoiceNum
  };
}
// Shared tail: given fully-built revenue rows, fuzzy-matches each row's
// client name against existing clients and kicks off the unmatched-client
// resolution modal, ending in finalizeImport() — which creates trips,
// links suppliers, and updates client revenue. Choosing "+ Add as new
// client" in that modal is what folds client creation into this same flow.
function startRevenueImport(rows){
  if(!rows.length){toast('No valid rows found','err');return;}

  const unmatchedNames=[];
  const autoResolutions={};

  function fuzzyMatchClient(name){
    if(!name) return null;
    const nl=name.toLowerCase().trim();
    // Get first/last regardless of input format (handles 'Last, First' or 'First Last')
    const inputFirst=getFirstName(nl).toLowerCase();
    const inputLast=getLastName(nl).toLowerCase();
    // Exact match against stored 'Last, First' format
    var m=db.clients.find(c=>(c.name||'').toLowerCase().trim()===nl); if(m) return m;
    // Match by comparing first+last regardless of how input or stored name is formatted
    if(inputFirst && inputLast && inputFirst!==inputLast){
      m=db.clients.find(function(c){
        var cFirst=getFirstName(c.name).toLowerCase();
        var cLast=getLastName(c.name).toLowerCase();
        return cFirst===inputFirst && cLast===inputLast;
      });
      if(m) return m;
    }
    return null;
  }

  rows.forEach(function(row){
    if(autoResolutions[row.name]!==undefined||unmatchedNames.includes(row.name)) return;
    const matched=fuzzyMatchClient(row.name);
    if(matched){ autoResolutions[row.name]=matched.id; }
    else { unmatchedNames.push(row.name); }
  });

  window._importState={rows,unmatchedNames,resolutions:autoResolutions,cursor:0};
  processImportQueue();
}
function importRevenue(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.csv';
  inp.onchange=function(e){
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=function(ev){
      try{
        const lines=ev.target.result.split('\n').map(l=>l.trim()).filter(l=>l);
        if(lines.length<2){toast('File appears empty','err');return;}

        // Detect delimiter
        const delim = lines[0].includes('\t') ? '\t' : ',';
        const split = function(line){
          if(delim===',') return parseCSVLine(line); // handles quoted fields with commas
          return line.split(delim).map(function(c){return c.replace(/^"|"$/g,'').trim();});
        };

        // Detect header row
        const hdrs = split(lines[0]).map(function(h){return h.toLowerCase().trim();});
        const looksLikeHeader = hdrs.some(function(h){return ['name','date','amount','num','qty','memo','item'].includes(h);});
        const startRow = looksLikeHeader ? 1 : 0;
        debugLog('Revenue import: total lines='+lines.length+' startRow='+startRow+' expected data rows='+(lines.length-startRow));

        // Column indices (header-based or positional)
        // Positional: col0=date, col1=invoice, col2=memo/description, col3=name/supplier,
        //             col4=product/class, col5=client(class), col6=qty, col7=price, col8=total
        function getCol(row, names, fallbackIdx){
          if(looksLikeHeader){
            for(var i=0;i<names.length;i++){
              var idx=hdrs.indexOf(names[i]);
              if(idx>=0) return (row[idx]||'').trim();
            }
            return '';
          }
          return (row[fallbackIdx]||'').trim();
        }

        const rows=[];
        for(var i=startRow;i<lines.length;i++){
          const cols=split(lines[i]);
          const row=extractRevenueRow(getCol, cols);
          if(row) rows.push(row);
        }

        startRevenueImport(rows);
      }catch(err){console.error(err);toast('Could not read CSV: '+err.message,'err');}
    };r.readAsText(f);
  };inp.click();
}

function processImportQueue(){
  const state=window._importState;
  if(!state)return;
  while(state.cursor<state.unmatchedNames.length){
    const name=state.unmatchedNames[state.cursor];
    if(state.resolutions[name]!==undefined){state.cursor++;continue;}
    showImportMatchModal(name);return;
  }
  finalizeImport();
}

function showImportMatchModal(name){
  const overlay=$('import-match-overlay');
  $('import-match-name').textContent='No client found matching: "'+name+'"';
  const sel=$('import-match-sel');
  const sorted=[...db.clients].sort((a,b)=>{
    const al=(a.name||'').trim().split(' ').pop().toLowerCase();
    const bl=(b.name||'').trim().split(' ').pop().toLowerCase();
    return al.localeCompare(bl);
  });
  sel.innerHTML='<option value="">Select existing client...</option>'+sorted.map(c=>'<option value="'+c.id+'">'+c.name+'</option>').join('');
  overlay.style.display='flex';

  $('import-match-add').onclick=function(){
    const newCid=newId('C',db.clients);
    db.clients.push({id:newCid,name:toLastFirst(name),email:'',phone:'',location:'',preferredAirline:'',preferredHotel:'',notesLog:[],joined:today(),totalTrips:0,totalRevenue:0});
    saveDB();
    window._importState.resolutions[name]=newCid;
    overlay.style.display='none';
    window._importState.cursor++;
    processImportQueue();
  };
  $('import-match-use').onclick=function(){
    const cid=sel.value;
    if(!cid){toast('Please select a client or skip','err');return;}
    window._importState.resolutions[name]=cid;
    overlay.style.display='none';
    window._importState.cursor++;
    processImportQueue();
  };
  $('import-match-skip').onclick=function(){
    window._importState.resolutions[name]=null;
    overlay.style.display='none';
    window._importState.cursor++;
    processImportQueue();
  };
}

function finalizeImport(){
  const state=window._importState;
  let imported=0,skipped=0,totalRev=0,relinked=0;
  var seenInBatch={}; // track signature counts seen so far in THIS import batch
  state.rows.forEach(function(row){
    // Find client by name
    const cl=row.name.toLowerCase().trim();
    const parts=cl.split(/\s+/);
    const first=parts[0]||'';
    const last=parts[parts.length-1]||'';
    let cid=null;

    // Check resolution from match modal first
    if(state.resolutions[row.name]!==undefined){
      cid=state.resolutions[row.name];
    }

    // Get first/last regardless of format
    const rowFirst = getFirstName(cl);
    const rowLast = getLastName(cl);

    // Fuzzy match if no resolution — exact or both-names-match only
    if(!cid){
      const direct=db.clients.find(function(c){
        const fn=(c.name||'').toLowerCase().trim();
        if(fn===cl) return true;
        if(rowFirst&&rowLast&&rowFirst!==rowLast){
          var cFirst=getFirstName(c.name);
          var cLast=getLastName(c.name);
          if(cFirst===rowFirst && cLast===rowLast) return true;
        }
        return false;
      });
      if(direct) cid=direct.id;
    }

    if(!cid){debugLog('Revenue: no client match for '+row.name);skipped++;return;}

    const client=db.clients.find(c=>c.id===cid);
    if(!client){skipped++;return;}

    // Build a signature for this row, and count how many times this exact signature
    // has already appeared earlier in THIS batch (to allow legitimate repeated line items)
    var sig = cid+'|'+(row.invoiceNum||'')+'|'+(row.supplierId||'')+'|'+row.amt+'|'+(row.date?row.date.slice(0,10):today());
    var occurrenceIndex = seenInBatch[sig] || 0; // how many times we've already seen this sig in this batch
    seenInBatch[sig] = occurrenceIndex + 1;

    // Count how many matching trips already exist in db.trips with this exact signature
    var existingMatchCount = db.trips.filter(function(t){
      if(row.invoiceNum && t.invoiceNum){
        return t.clientId===cid && t.invoiceNum===row.invoiceNum && t.cashPaid===row.amt;
      }
      return t.clientId===cid &&
             t.supplierId===(row.supplierId||'') &&
             t.cashPaid===row.amt &&
             (t.departDate||'').slice(0,10)===(row.date?row.date.slice(0,10):today());
    }).length;

    // Only treat as duplicate if we've already accounted for at least as many occurrences
    // as already exist in db.trips (this allows legitimate repeated line items within a batch)
    var dupExists = occurrenceIndex < existingMatchCount;
    if(dupExists){
      // Backfill: the matching trip may have been imported before its supplier
      // existed in the Suppliers list (so it has no supplierId), and this row
      // can now resolve one. Without this, a supplier added later can never
      // get credit for trips imported earlier — every re-import just sees an
      // existing duplicate and skips it, forever.
      if(row.supplierId){
        var dupTrip = db.trips.find(function(t){
          if(row.invoiceNum && t.invoiceNum){
            return t.clientId===cid && t.invoiceNum===row.invoiceNum && t.cashPaid===row.amt && !t.supplierId;
          }
          return t.clientId===cid && !t.supplierId && t.cashPaid===row.amt &&
                 (t.departDate||'').slice(0,10)===(row.date?row.date.slice(0,10):today());
        });
        if(dupTrip){
          dupTrip.supplierId=row.supplierId;
          dupTrip.supplierName=row.supplierName;
          var supx=db.vendors.find(function(v){return v.id===row.supplierId;});
          if(supx&&!(supx.clientIds||[]).includes(cid)){
            if(!supx.clientIds)supx.clientIds=[];
            supx.clientIds.push(cid);
          }
          relinked++;
          debugLog('Revenue: backfilled supplier link for existing trip '+dupTrip.id+' -> '+row.supplierName);
          return;
        }
      }
      debugLog('Revenue: duplicate skipped for '+client.name);skipped++;return;
    }

    // Build destination: use memo, or supplier+date, or 'Imported Trip'
    const tripId=newId('T',db.trips);
    const dest=row.memo||(row.supplierName?row.supplierName+(row.date?' '+row.date:''):'Imported Trip');
    // Use Ship Date column as trip start date if available, else fall back to extracted/invoice date
    let tripDate=today();
    if(row.shipDate){
      try{const d=new Date(row.shipDate);if(!isNaN(d))tripDate=d.toISOString().slice(0,10);}catch(e){}
    } else {
      var extractedDate = extractDateFromText(dest);
      if(extractedDate){
        tripDate = extractedDate;
      } else if(row.date){
        try{const d=new Date(row.date);if(!isNaN(d))tripDate=d.toISOString().slice(0,10);}catch(e){}
      }
    }

    db.trips.push({
      id:tripId,clientId:cid,clientName:client.name,
      destination:dest,origin:'',departDate:tripDate,returnDate:tripDate,
      status:'Completed',type:'Leisure',airline:'',flightClass:'',hotel:'',
      hotelNights:0,pointsUsed:0,cashPaid:row.amt,totalValue:row.amt,
      bookingRef:row.invoiceNum||'',notes:row.memo||'',product:row.product||'',
      supplierId:row.supplierId||'',supplierName:row.supplierName||'',
      invoiceNum:row.invoiceNum||''
    });

    // Link client to supplier
    if(row.supplierId){
      var sup=db.vendors.find(function(v){return v.id===row.supplierId;});
      if(sup&&!(sup.clientIds||[]).includes(cid)){
        if(!sup.clientIds)sup.clientIds=[];
        sup.clientIds.push(cid);
      }
    }

    // Update client revenue
    const newRev=(client.totalRevenue||0)+row.amt;
    db.clients=db.clients.map(c=>c.id===cid?Object.assign({},c,{totalRevenue:newRev}):c);

    imported++;totalRev+=row.amt;
  });
  snapshot('Import trips');
  saveDB();render();
  window._importState=null;
  toast('Imported '+imported+' trips — $'+totalRev.toLocaleString()+
    (relinked?', relinked '+relinked+' existing trip'+(relinked!==1?'s':'')+' to a supplier':'')+
    (skipped?' ('+skipped+' skipped)':''),'ok');
}

function importCSV(){
  const i=document.createElement('input');i.type='file';i.accept='.csv';
  i.onchange=function(e){
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=function(ev){
      try{
        const lines=ev.target.result.split('\n').map(function(l){return l.trim();}).filter(function(l){return l;});
        if(lines.length<2){toast('CSV appears empty','err');return;}
        const headers=lines[0].split(',').map(function(h){return h.replace(/"/g,'').trim().toLowerCase();});
        const nameIdx=headers.findIndex(function(h){return h.includes('name');});
        const emailIdx=headers.findIndex(function(h){return h.includes('email');});
        const phoneIdx=headers.findIndex(function(h){return h.includes('phone');});
        const locIdx=headers.findIndex(function(h){return h.includes('location')||h.includes('city');});
        if(nameIdx===-1){toast('No name column found in CSV','err');return;}
        let added=0,skipped=0,enriched=0;
        for(let i=1;i<lines.length;i++){
          const cols=lines[i].split(',');
          const clean=cols.map(function(c){return (c||'').replace(/^"|"$/g,'').trim();});
          const name=clean[nameIdx]||'';
          const email=emailIdx>=0?(clean[emailIdx]||''):'';
          const phone=phoneIdx>=0?(clean[phoneIdx]||''):'';
          const location=locIdx>=0?(clean[locIdx]||''):'';
          if(!name){skipped++;continue;}
          const nameFirst=getFirstName(name).toLowerCase();
          const nameLast=getLastName(name).toLowerCase();
          const existing=db.clients.find(function(c){
            if(email && c.email && c.email.toLowerCase()===email.toLowerCase()) return true;
            var cFull=(c.name||'').toLowerCase().trim();
            if(cFull===name.toLowerCase().trim()) return true; // exact match, any format
            var cFirst=getFirstName(c.name).toLowerCase();
            var cLast=getLastName(c.name).toLowerCase();
            // Format-independent match: same first+last regardless of "First Last" vs "Last, First"
            return nameFirst && nameLast && nameFirst!==nameLast && cFirst===nameFirst && cLast===nameLast;
          });
          if(existing){
            // Duplicate — fill in any fields the existing record is missing, don't create a new client
            var filled=[];
            if(email && !existing.email){existing.email=email;filled.push('email');}
            if(phone && !existing.phone){existing.phone=phone;filled.push('phone');}
            if(location && !existing.location){existing.location=location;filled.push('location');}
            if(filled.length){
              debugLog('Client import: enriched '+existing.name+' with '+filled.join(', ')+' from duplicate row');
              enriched++;
            } else {
              debugLog('Client import skip (duplicate, no new info): '+name);
            }
            skipped++;
            continue;
          }
          db.clients.push({id:newId('C',db.clients),name:toLastFirst(name),email:email,phone:phone,location:location,preferredAirline:'',preferredHotel:'',notes:'',joined:today(),totalTrips:0,notesLog:[]});
          added++;
        }
        snapshot('Import contacts');
        saveDB();render();
        toast('Imported '+added+' contacts'+(skipped?' ('+skipped+' skipped)':'')+(enriched?', enriched '+enriched+' existing':'')+' ✓');
      }catch(err){toast('Could not read CSV: '+err.message,'err');}
    };r.readAsText(f);
  };i.click();
}

// ── Book a Trip Form PDF import ──────────────────────────────────────────
// Imports "Book a Trip" Google Form submissions exported as PDFs (the Google
// Forms Notification add-on emails one PDF per submission, laid out as a
// list of "Question label" / "Answer" pairs). Only maps recognized labels
// onto fields that already exist on the client record (name, email, phone,
// address/location, and — if present in a given form — birthdate, preferred
// airline/hotel/cruise line). Every other question (number of travelers,
// trip dates, points balances, room type, etc.) has no matching client
// field and is intentionally left unmapped rather than inventing a new one.
//
// Label matching is text-based against the exact question wording of the
// "Miles Man Travel Info Form" template — if the form's questions are
// reworded later, the labels below need to be updated to match.
const PDFJS_VERSION='6.1.200';
let _pdfjsLibPromise=null;
function loadPdfJs(){
  if(!_pdfjsLibPromise){
    _pdfjsLibPromise=import('https://cdn.jsdelivr.net/npm/pdfjs-dist@'+PDFJS_VERSION+'/build/pdf.min.mjs').then(function(lib){
      lib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@'+PDFJS_VERSION+'/build/pdf.worker.min.mjs';
      return lib;
    });
  }
  return _pdfjsLibPromise;
}
async function extractPdfText(arrayBuffer){
  const pdfjsLib=await loadPdfJs();
  const pdf=await pdfjsLib.getDocument({data:arrayBuffer}).promise;
  let text='';
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const content=await page.getTextContent();
    text+=content.items.map(function(it){return it.str;}).join(' ')+' ';
  }
  return text.replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/\s+/g,' ').trim();
}
// Every question label in the template, used as boundaries so we know where
// one answer ends and the next question starts. `find` overrides the default
// substring search when a label could otherwise collide with another
// (e.g. "Address" is a substring of "Email address").
const TRIP_FORM_LABELS=[
  {label:'Your name'},
  {label:'Email address'},
  {label:'Phone number'},
  {label:'Address', find:function(lower){var m=/(?<!email )address/.exec(lower); return m?m.index:-1;}},
  {label:'How many travelers?'},
  {label:"Other travelers' names and ages"},
  {label:'Please list all airline points balances you have in your name. Do not list account numbers.'},
  {label:"Please list all airline points balances you have in your spouse's name. Do not list account numbers. Type N/A if not applicable."},
  {label:'Please list all hotel points balances you have in your name. Do not list account numbers.'},
  {label:'Please list all credit card points balances you have in your name. Do not list account numbers, but do list specific card (i.e. Chase Sapphire Reserve)'},
  {label:'If looking for hotel, what types of hotels will you consider?'},
  {label:'Do you need a rental car?'},
  {label:'How many people are traveling?'},
  {label:'For Airfare, preferred departure date'},
  {label:'For Airfare, preferred return date'},
  {label:'Are your dates flexible?'},
  {label:'For Airfare: Departure and Arrival Cities'},
  {label:'For airfare: Will you consider alternate airports?'},
  {label:'For airfare: do you only want non-stop flights?'},
  {label:'For airfare, what class of service?'},
  {label:'For Hotel: Number of nights'},
  {label:'For Hotel: Room type'},
  {label:'For Hotel: Number of Beds'},
  {label:'For Hotel: How many rooms?'},
  {label:'Birthdate'},
  {label:'Date of Birth'},
  {label:'Preferred Airline'},
  {label:'Preferred Hotel'},
  {label:'Preferred Cruise Line'}
];
function findLabelIndex(lower,entry){
  return entry.find ? entry.find(lower) : lower.indexOf(entry.label.toLowerCase());
}
function extractLabelValue(flatText,targetLabel){
  const lower=flatText.toLowerCase();
  const target=TRIP_FORM_LABELS.find(function(e){return e.label===targetLabel;});
  if(!target) return '';
  const startIdx=findLabelIndex(lower,target);
  if(startIdx===-1) return '';
  const afterLabel=startIdx+target.label.length;
  let nextIdx=flatText.length;
  TRIP_FORM_LABELS.forEach(function(e){
    if(e.label===targetLabel) return;
    const idx=findLabelIndex(lower.slice(afterLabel),e);
    if(idx!==-1){
      const abs=afterLabel+idx;
      if(abs<nextIdx) nextIdx=abs;
    }
  });
  return flatText.slice(afterLabel,nextIdx).trim();
}
function matchOption(val,opts){
  if(!val) return '';
  const found=opts.find(function(o){return o.toLowerCase()===val.toLowerCase().trim();});
  return found||'';
}
// Parses free-text answers like "UNITED: Lawrence 34,213" into
// {United:34213}. Only recognizes names already in the given option list
// (AIRLINES or HOTELS); anything else in the text (traveler names, etc.) is
// ignored rather than guessed at. Assumes the option name and its number
// appear in that order, which holds for airline/hotel brand names.
function extractPointsBalances(text,optionsList){
  if(!text) return null;
  const out={};
  optionsList.forEach(function(opt){
    const re=new RegExp(opt.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'[^\\d]*([\\d][\\d,]*)','i');
    const m=re.exec(text);
    if(m){
      const n=parseInt(m[1].replace(/,/g,''),10);
      if(!isNaN(n)) out[opt]=n;
    }
  });
  return Object.keys(out).length?out:null;
}
// Same as extractPointsBalances but wraps each number in the {balance,status}
// shape used by mileageBalances/hotelBalances (status left blank — the form
// doesn't ask for elite status).
function extractBalanceObjects(text,optionsList){
  const raw=extractPointsBalances(text,optionsList);
  if(!raw) return null;
  const out={};
  Object.keys(raw).forEach(function(k){ out[k]={balance:raw[k],status:''}; });
  return out;
}
// Credit card names are often written in a different word order than the
// canonical CREDIT_CARDS entries (e.g. "Platinum American Express" for "Amex
// Platinum"), so this matches all significant words regardless of order
// instead of requiring an exact substring.
function extractCreditCardBalances(text){
  if(!text) return null;
  const normalized=text.replace(/american express/gi,'Amex');
  const out={};
  CREDIT_CARDS.forEach(function(card){
    const words=card.split(/\s+/);
    const allPresent=words.every(function(w){
      return new RegExp('\\b'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i').test(normalized);
    });
    if(allPresent){
      const m=/([\d][\d,]*)/.exec(normalized);
      if(m){
        const n=parseInt(m[1].replace(/,/g,''),10);
        if(!isNaN(n)) out[card]=n;
      }
    }
  });
  return Object.keys(out).length?out:null;
}
// Adds any newly-found balances without touching an entry that already has
// a recorded balance on the client. Shared by mileageBalances/hotelBalances
// ({balance,status} objects).
function mergeBalanceObjects(existingBalances,newBalances){
  const merged=Object.assign({},existingBalances||{});
  const added=[];
  Object.keys(newBalances||{}).forEach(function(name){
    if(!merged[name]||!merged[name].balance){
      merged[name]=newBalances[name];
      added.push(name);
    }
  });
  return {merged:merged,added:added};
}
// Same, but for creditCardBalances, which stores plain numbers rather than
// {balance,status} objects.
function mergeCreditCardBalances(existingBalances,newBalances){
  const merged=Object.assign({},existingBalances||{});
  const added=[];
  Object.keys(newBalances||{}).forEach(function(card){
    if(!merged[card]){
      merged[card]=newBalances[card];
      added.push(card);
    }
  });
  return {merged:merged,added:added};
}
async function importTripFormPDF(){
  const i=document.createElement('input');i.type='file';i.accept='application/pdf';i.multiple=true;
  i.onchange=async function(e){
    const files=Array.from(e.target.files||[]);
    if(!files.length) return;
    let added=0,enriched=0,skipped=0,failed=0;
    for(const file of files){
      try{
        const buf=await file.arrayBuffer();
        const flatText=await extractPdfText(buf);

        const name=extractLabelValue(flatText,'Your name');
        const email=extractLabelValue(flatText,'Email address');
        const phone=extractLabelValue(flatText,'Phone number');
        const location=extractLabelValue(flatText,'Address');
        const birthdate=extractLabelValue(flatText,'Birthdate')||extractLabelValue(flatText,'Date of Birth');
        const preferredAirline=matchOption(extractLabelValue(flatText,'Preferred Airline'),AIRLINES);
        const preferredHotel=matchOption(extractLabelValue(flatText,'Preferred Hotel'),HOTELS);
        const preferredCruiseLine=matchOption(extractLabelValue(flatText,'Preferred Cruise Line'),CRUISE_LINES);
        const mileageBalances=extractBalanceObjects(extractLabelValue(flatText,'Please list all airline points balances you have in your name. Do not list account numbers.'),AIRLINES);
        const hotelBalances=extractBalanceObjects(extractLabelValue(flatText,'Please list all hotel points balances you have in your name. Do not list account numbers.'),HOTELS);
        const creditCardBalances=extractCreditCardBalances(extractLabelValue(flatText,'Please list all credit card points balances you have in your name. Do not list account numbers, but do list specific card (i.e. Chase Sapphire Reserve)'));

        if(!name&&!email){debugLog('Trip form PDF: no name or email found in '+file.name);skipped++;continue;}

        const nameFirst=getFirstName(name).toLowerCase();
        const nameLast=getLastName(name).toLowerCase();
        const existing=db.clients.find(function(c){
          if(email && c.email && c.email.toLowerCase()===email.toLowerCase()) return true;
          if(!name) return false;
          const cFull=(c.name||'').toLowerCase().trim();
          if(cFull===name.toLowerCase().trim()) return true;
          const cFirst=getFirstName(c.name).toLowerCase();
          const cLast=getLastName(c.name).toLowerCase();
          return nameFirst && nameLast && nameFirst!==nameLast && cFirst===nameFirst && cLast===nameLast;
        });

        const fieldsToFill={email:email,phone:phone,location:location,birthdate:birthdate,preferredAirline:preferredAirline,preferredHotel:preferredHotel,preferredCruiseLine:preferredCruiseLine};

        if(existing){
          const filled=[];
          Object.keys(fieldsToFill).forEach(function(k){
            if(fieldsToFill[k] && !existing[k]){existing[k]=fieldsToFill[k];filled.push(k);}
          });
          if(mileageBalances){
            const merge=mergeBalanceObjects(existing.mileageBalances,mileageBalances);
            if(merge.added.length){existing.mileageBalances=merge.merged;filled.push('mileageBalances ('+merge.added.join(', ')+')');}
          }
          if(hotelBalances){
            const merge=mergeBalanceObjects(existing.hotelBalances,hotelBalances);
            if(merge.added.length){existing.hotelBalances=merge.merged;filled.push('hotelBalances ('+merge.added.join(', ')+')');}
          }
          if(creditCardBalances){
            const merge=mergeCreditCardBalances(existing.creditCardBalances,creditCardBalances);
            if(merge.added.length){existing.creditCardBalances=merge.merged;filled.push('creditCardBalances ('+merge.added.join(', ')+')');}
          }
          if(filled.length){debugLog('Trip form PDF: enriched '+existing.name+' with '+filled.join(', ')+' from '+file.name);enriched++;}
          skipped++;
          continue;
        }

        if(!name){skipped++;continue;} // no name to create a new client with

        db.clients.push(Object.assign({id:newId('C',db.clients),name:toLastFirst(name),email:'',phone:'',location:'',preferredAirline:'',preferredHotel:'',preferredCruiseLine:'',mileageBalances:mileageBalances||{},hotelBalances:hotelBalances||{},creditCardBalances:creditCardBalances||{},notes:'',joined:today(),totalTrips:0,totalRevenue:0,notesLog:[]},fieldsToFill));
        added++;
      }catch(err){
        debugLog('Trip form PDF error for '+file.name+': '+err.message);
        console.error('Trip form PDF error for '+file.name,err);
        failed++;
      }
    }
    snapshot('Import trip form PDF');
    saveDB();render();
    toast('Trip form PDF import: '+added+' new client'+(added!==1?'s':'')+(enriched?', enriched '+enriched+' existing':'')+(skipped?' ('+skipped+' skipped)':'')+(failed?', '+failed+' failed to parse — see Debug Log':''),failed?'err':'ok');
  };
  i.click();
}

function getInvoiceReportData(){
  var fromDate = (document.getElementById('rpt-inv-from')||{}).value||'';
  var toDate   = (document.getElementById('rpt-inv-to')||{}).value||'';
  var supplierId = (document.getElementById('rpt-inv-supplier')||{}).value||'';
  var clientId = (document.getElementById('rpt-inv-client')||{}).value||'';

  // Group trips by invoice number
  var groups = {};
  db.trips.forEach(function(t){
    if(supplierId && t.supplierId !== supplierId) return;
    if(clientId && t.clientId !== clientId) return;
    var tripDate = t.departDate||'';
    if(fromDate && tripDate < fromDate) return;
    if(toDate   && tripDate > toDate)   return;
    var key = t.invoiceNum || t.bookingRef || ('(no invoice) '+t.id);
    if(!groups[key]) groups[key] = {invoiceNum:key, trips:[], totalValue:0, totalCash:0};
    groups[key].trips.push(t);
    groups[key].totalValue += (t.totalValue||0);
    groups[key].totalCash  += (t.cashPaid||0);
  });

  var rows = Object.keys(groups).map(function(k){ return groups[k]; });
  rows.sort(function(a,b){
    var ad = (a.trips[0]&&a.trips[0].departDate)||'';
    var bd = (b.trips[0]&&b.trips[0].departDate)||'';
    return bd.localeCompare(ad);
  });
  return rows;
}

    return;
  }

  var grandTotal = groups.reduce(function(a,g){return a+g.totalValue;},0);
  var grandCash = groups.reduce(function(a,g){return a+g.totalCash;},0);

  window._invoiceReportRows = groups;
  var rowsHtml = '';
  groups.forEach(function(g, gi){

      rowsHtml += '<tr class="rpt-inv-row" style="cursor:pointer" data-trip-id="'+t.id+'">'+

  });

  container.innerHTML =
    '<div style="font-size:13px;color:#888;margin-bottom:10px">'+groups.length+' invoice'+(groups.length!==1?'s':'')+' · '+db.trips.length+' trip rows · Grand Total: <strong style="color:#111">$'+Number(grandTotal).toLocaleString()+'</strong></div>'+

function exportInvoiceReport(){
  var groups = getInvoiceReportData();
  if(!groups.length){ toast('No data to export','err'); return; }
  var esc = function(v){ var s=String(v==null?'':v); return s.includes(',')||s.includes('"')||s.includes('\n')?'"'+s.replace(/"/g,'""')+'"':s; };
  var headers = ['Invoice #','Client','Destination','Date','Supplier','Value'];
  var rows = [];
  groups.forEach(function(g){
    g.trips.forEach(function(t){
      rows.push([g.invoiceNum, t.clientName, t.destination, t.departDate, t.supplierName||'', t.totalValue||0]);
    });
    rows.push(['', '', '', '', 'Invoice Total', g.totalValue]);
  });
  var csv = [headers].concat(rows).map(function(r){return r.map(esc).join(',');}).join('\n');
  var b = new Blob([csv],{type:'text/csv'});
  var a = document.createElement('a'); a.href=URL.createObjectURL(b); a.download='milesman-invoice-report.csv'; a.click();
  toast('Report exported ✓');
}

function getReportData(){
  var fromDate = (document.getElementById('rpt-from')||{}).value||'';
  var toDate   = (document.getElementById('rpt-to')||{}).value||'';
  var noteType = (document.getElementById('rpt-type')||{}).value||'';
  var clientId = (document.getElementById('rpt-client')||{}).value||'';

  var rows = [];

  // Include trip records (when filter is blank or set to 'Trips')
  if(!noteType || noteType==='Trips'){
    db.trips.forEach(function(t){
      if(clientId && t.clientId !== clientId) return;
      var tripDate = t.departDate||'';
      if(fromDate && tripDate < fromDate) return;
      if(toDate   && tripDate > toDate)   return;
      var supplierTxt = t.supplierName ? ' via '+t.supplierName : '';
      var text = (t.destination||'Trip')+supplierTxt+(t.invoiceNum?' (Invoice #'+t.invoiceNum+')':'')+' — $'+Number(t.totalValue||0).toLocaleString();
      rows.push({
        client: t.clientName||'',
        email: '',
        ts: tripDate,
        type: 'Trips',
        text: text,
        tripId: t.id
      });
    });
  }

  // Include notes from clients (skip Trip Import - those are legacy, trips now come from db.trips)
  if(!noteType || noteType!=='Trips'){
    db.clients.forEach(function(c){
      if(clientId && c.id !== clientId) return;
      (c.notesLog||[]).forEach(function(n){
        if((n.noteType||'')==='Trip Import') return; // legacy - trips now in db.trips
        var noteDateRaw = n.ts;
        var noteDate = '';
        try{ noteDate = new Date(noteDateRaw).toISOString().slice(0,10); }catch(e){}
        if(fromDate && noteDate && noteDate < fromDate) return;
        if(toDate   && noteDate && noteDate > toDate)   return;
        if(!(n.noteType||'')) return;
        if(noteType && (n.noteType||'') !== noteType) return;
        rows.push({
          client: c.name,
          email:  c.email||'',
          ts:     n.ts,
          type:   n.noteType||'',
          text:   n.text||''
        });
      });
    });
  }

  // Sort by timestamp/date descending
  rows.sort(function(a,b){ return new Date(b.ts)-new Date(a.ts); });
  return rows;
}

// ── Vendor CSV Import ────────────────────────────────────────────────────
// Expected columns (flexible): Name, Type, Category, Contact, Email, Phone, Website, Notes
function importVendorsCSV(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.csv,.tsv,.txt';
  inp.onchange=function(e){
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=function(ev){
      try{
        const raw=ev.target.result;
        const lines=raw.split('\n').map(l=>l.trim()).filter(l=>l);
        if(!lines.length){toast('File appears empty','err');return;}

        const delim = lines[0].includes('\t') ? '\t' : ',';
        const split = function(line){
          if(delim===','){ return parseCSVLine(line); }
          return line.split(delim).map(function(c){return c.replace(/^"|"$/g,'').trim();});
        };

        const hdrs = split(lines[0]).map(function(h){return h.toLowerCase().trim();});
        const looksLikeHeader = hdrs.some(function(h){return ['name','date','amount','num','qty','memo','item','class'].includes(h);});
        const startRow = looksLikeHeader ? 1 : 0;
        debugLog('Revenue import: total lines='+lines.length+' startRow='+startRow+' expected data rows='+(lines.length-startRow));

        function getCol(row, names, fallbackIdx){
          if(looksLikeHeader){
            for(var i=0;i<names.length;i++){
              var idx=hdrs.indexOf(names[i]);
              if(idx>=0) return (row[idx]||'').trim();
            }
            return '';
          }
          return (row[fallbackIdx]||'').trim();
        }

        // Same layout as revenue import:
        // col0=date,col1=invoice,col2=memo,col3=name,col4=ship date,col5=item,col6=class,col7=qty,col8=price,col9=amount
        var vendorMap = {}; // name.toLowerCase() -> {name, clientNames:[], rows:[]}

        for(var i=startRow;i<lines.length;i++){
          var cols=split(lines[i]);
          if(cols.length<4){
            debugLog('Revenue SILENT SKIP (too few cols) row '+i+': cols='+cols.length+' rawLine='+JSON.stringify(lines[i].slice(0,100)));
            continue;
          }

          var date    = getCol(cols,['date'],0);
          var memo    = getCol(cols,['memo','description'],2);
          var nameVal = getCol(cols,['name'],3);
          var itemVal = getCol(cols,['item'],5);
          var classVal= getCol(cols,['class'],6) || (cols[6]||'').trim();
          var amtStr  = getCol(cols,['amount','sales price'],9) ||
                        getCol(cols,['amount','sales price'],8) ||
                        cols[cols.length-1]||'';
          var amount  = parseFloat(amtStr.replace(/[$,"]/g,''))||0;

          if(!nameVal) continue;

          // Rule: if Name !== Class, Name is treated as a supplier
          var nameLower = nameVal.toLowerCase().trim();
          var classLower = classVal.toLowerCase().trim();
          if(nameLower === classLower || !classVal){
            debugLog('Supplier import skip: name='+nameVal+' class='+classVal);
            continue;
          }
          debugLog('Supplier import row: name='+nameVal+' class='+classVal);

          var key = nameLower;
          if(!vendorMap[key]) vendorMap[key]={name:nameVal, clientNames:[], rows:[]};
          if(classVal && !vendorMap[key].clientNames.includes(classVal)){
            vendorMap[key].clientNames.push(classVal);
          }
          vendorMap[key].rows.push({
            date:date, description:memo, productType:itemVal,
            clientName:classVal, amount:amount
          });
        }

        // Fuzzy match client by name (handles Last,First and First Last)
        function matchClient(cn){
          if(!cn) return null;
          var cLower=cn.toLowerCase().trim();
          var cFirst=getFirstName(cLower);
          var cLast=getLastName(cLower);
          return db.clients.find(function(c){
            var full=(c.name||'').toLowerCase().trim();
            var first=getFirstName(full);
            var last=getLastName(full);
            if(full===cLower) return true;
            if(cFirst&&cLast&&cFirst!==cLast&&first===cFirst&&last===cLast) return true;
            return false;
          });
        }

        var added=0, skipped=0, tripsAdded=0;
        Object.keys(vendorMap).forEach(function(key){
          var vm = vendorMap[key];
          var exists = db.vendors.find(function(v){return(v.name||'').toLowerCase()===key;});
          var clientIds = [];
          vm.clientNames.forEach(function(cn){
            var matched=matchClient(cn);
            if(matched && !clientIds.includes(matched.id)) clientIds.push(matched.id);
          });

          if(exists){
            clientIds.forEach(function(cid){
              if(!(exists.clientIds||[]).includes(cid)){
                if(!exists.clientIds) exists.clientIds=[];
                exists.clientIds.push(cid);
              }
            });
            skipped++;
          } else {
            db.vendors.push({
              id:newId('V',db.vendors),
              name:vm.name,
              type:'Supplier',
              category:'',
              primaryClientName:vm.clientNames[0]||'',
              contactName:'',email:'',phone:'',website:'',notes:'',notesLog:[],
              clientIds:clientIds
            });
            added++;
          }

          vm.rows.forEach(function(row){
            if(!row.clientName) return;
            var client=matchClient(row.clientName);
            if(!client) return;
            if(!client.notesLog) client.notesLog=[];
            var dupKey=(row.date+'|'+vm.name+'|'+row.description).toLowerCase();
            var alreadyImported=client.notesLog.some(function(n){return (n.importKey||'')===dupKey;});
            if(alreadyImported) return;
            var noteText=vm.name+(row.description?' - '+row.description:'')+(row.date?' ('+row.date+')':'')+(row.amount?' $'+row.amount:'');
            client.notesLog.push({ts:new Date().toLocaleString(),text:noteText,noteType:'Trip Import',importKey:dupKey});
            tripsAdded++;
          });
        });

        snapshot('Import suppliers');
        saveDB();render();
        toast('Imported '+added+' supplier'+(added!==1?'s':'')+(skipped?' ('+skipped+' updated)':'')+(tripsAdded?' · '+tripsAdded+' trip notes added':''),'ok');
      }catch(err){console.error(err);toast('Could not read CSV: '+err.message,'err');}
    };r.readAsText(f);
  };inp.click();
}

// ── Vendor helpers ───────────────────────────────────────────────────────
const VENDOR_TYPES = ['Supplier','Referral Partner','DMC'];
const VENDOR_CATS  = ['Airline','Hotel','Cruise Line','Car Rental','Tour Operator','Other'];

function getVendorStats(vendor){
  var stats = {trips:0, revenue:0, clients:[], tripList:[]};

  // Primary: trips directly linked via supplierId
  db.trips.forEach(function(t){
    var matchSupplier = t.supplierId === vendor.id;
    var matchAir = vendor.category==='Airline' && t.airline && t.airline.toLowerCase()===vendor.name.toLowerCase();
    var matchHot = vendor.category==='Hotel'   && t.hotel   && t.hotel.toLowerCase()===vendor.name.toLowerCase();
    if(matchSupplier || matchAir || matchHot){
      stats.revenue += (t.totalValue||0);
      if(!stats.clients.includes(t.clientName)) stats.clients.push(t.clientName);
      stats.tripList.push(t);
    }
  });

  // Linked clients (referral partners) — only count them in the client list,
  // do NOT pull in their unrelated trips (those are only shown if supplierId explicitly matches, handled above)
  (vendor.clientIds||[]).forEach(function(cid){
    var c = db.clients.find(function(x){return x.id===cid;});
    if(c && !stats.clients.includes(c.name)) stats.clients.push(c.name);
  });

  // Count distinct invoice numbers (falls back to trip id if no invoice number)
  var seenInvoices = {};
  stats.tripList.forEach(function(t){
    var key = t.invoiceNum || t.id;
    if(!seenInvoices[key]){ seenInvoices[key]=true; stats.trips++; }
  });

  return stats;
}

      '<div class="stat"><div class="stat-lbl">Transactions</div><div class="stat-val">'+stats.tripList.length+'</div></div>'+
      '<div class="stat"><div class="stat-lbl">Cash Paid</div><div class="stat-val">$'+Number(totalCash).toLocaleString()+'</div></div>'+
      '<div class="stat"><div class="stat-lbl">Total Value</div><div class="stat-val">$'+Number(totalRevenue).toLocaleString()+'</div></div>'+
    '</div>'+
    (txRows ?
      '<div class="tbl-wrap" style="max-height:400px;overflow-y:auto"><table>'+
        '<thead><tr>'+
          '<th>Client</th><th>Destination</th><th>Dates</th><th>Status</th><th>Cash Paid</th><th>Total Value</th><th>Trip ID</th>'+

function saveVendor(id){
  var name = gv('vn');
  if(!name){toast('Supplier name is required','err');return;}
  var clientIds = Array.from(document.querySelectorAll('.vendor-client-cb:checked')).map(function(cb){return cb.value;});
  // Collect notes from form
  var notesLog = [];
  document.querySelectorAll('[id^="vne-"]').forEach(function(el){
    var txt=(el.querySelector('.vnote-txt')||{}).value||'';
    var typ=(el.querySelector('.vnote-type-sel')||{}).value||'';
    var tsEl=el.querySelector('.note-ts');
    if(el.id==='vne-new'){
      if(txt.trim()) notesLog.push({ts:new Date().toLocaleString(),text:txt.trim(),noteType:typ});
    } else {
      if(txt.trim()) notesLog.push({ts:tsEl?tsEl.textContent:'',text:txt.trim(),noteType:typ});
    }
  });
  var data = {
    name:name, type:gv('vtype'), category:gv('vcat'),
    notesLog:notesLog, contactName:gv('vcn'), email:gv('vem'), phone:gv('vph'),
    website:gv('vwb'), notes:gv('vno'), clientIds:clientIds
  };
  if(id){
    db.vendors = db.vendors.map(function(v){return v.id===id ? Object.assign({},v,data) : v;});
    toast('Vendor updated');
  } else {
    data.id = newId('V', db.vendors);
    db.vendors.push(data);
    toast('Vendor added');
  }
  saveDB(); closeModal(); render();
}

function delVendor(id){
  var v = db.vendors.find(function(x){return x.id===id;});
  if(!v || !confirm('Delete vendor '+v.name+'?')) return;
  db.vendors = db.vendors.filter(function(x){return x.id!==id;});
  saveDB(); toast('Vendor deleted'); render();
}

function renderCalendar(){
  var now = window._calDate || new Date();
  window._calDate = now;
  var year = now.getFullYear();
  var month = now.getMonth();
  var monthName = now.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  var todayStr = new Date().toISOString().slice(0,10);

  // First and last day of month
  var firstDay = new Date(year, month, 1);
  var lastDay  = new Date(year, month+1, 0);
  var startDow = firstDay.getDay(); // 0=Sun

  // Build trip lookup: date -> [{trip, type}]
  var tripMap = {};
  function addToMap(dateStr, trip, type){
    if(!tripMap[dateStr]) tripMap[dateStr] = [];
    tripMap[dateStr].push({trip:trip, type:type});
  }
  db.trips.forEach(function(t){
    if(!t.departDate) return;
    var start = new Date(t.departDate+'T12:00:00');
    var end   = t.returnDate ? new Date(t.returnDate+'T12:00:00') : start;
    var cur   = new Date(start);
    var dayCount = 0;
    while(cur <= end && dayCount < 60){
      var ds = cur.toISOString().slice(0,10);
      var type = cur.getTime()===start.getTime() ? 'start' : (cur.getTime()===end.getTime() ? 'end' : 'span');
      if(start.getTime()===end.getTime()) type='start';
      addToMap(ds, t, type);
      cur.setDate(cur.getDate()+1);
      dayCount++;
    }
  });

  // Build calendar grid HTML
  var days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var headerCells = days.map(function(d){return '<div class="cal-header-cell">'+d+'</div>';}).join('');

  var cells = '';
  // Pad start
  for(var i=0;i<startDow;i++){
    var prevDate = new Date(year, month, -startDow+i+1);
    cells += '<div class="cal-cell other-month"><div class="cal-day-num">'+prevDate.getDate()+'</div></div>';
  }
  // Days of month
  for(var d=1;d<=lastDay.getDate();d++){
    var dateStr = year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var isToday = dateStr===todayStr;
    var trips   = tripMap[dateStr]||[];
    var dayNumHtml = isToday
      ? '<div class="cal-day-num today-num">'+d+'</div>'
      : '<div class="cal-day-num">'+d+'</div>';
    var tripHtml = trips.slice(0,3).map(function(entry){
      var t=entry.trip, tp=entry.type;
      var cls='cal-trip cal-trip-'+(tp==='start'?'start':tp==='end'?'end':'span');
      var label=(tp==='start'?'▶ ':tp==='end'?'■ ':'  ')+t.clientName+(t.destination?' → '+t.destination.split(',')[0]:'');
      return '<div class="'+cls+'" data-trip-id="'+t.id+'" title="'+t.clientName+': '+t.destination+(tp==='start'?' (departs)':tp==='end'?' (returns)':'')+'">'+label+'</div>';
    }).join('');
    if(trips.length>3) tripHtml+='<div style="font-size:9px;color:#888">+' +(trips.length-3)+' more</div>';
    cells+='<div class="cal-cell'+(isToday?' today':'')+'" data-date="'+dateStr+'" style="cursor:pointer">'+dayNumHtml+tripHtml+'</div>';
  }
  // Pad end
  var totalCells = startDow + lastDay.getDate();
  var endPad = totalCells % 7 === 0 ? 0 : 7-(totalCells%7);
  for(var i=1;i<=endPad;i++){
    cells+='<div class="cal-cell other-month"><div class="cal-day-num">'+i+'</div></div>';
  }

  $('main').innerHTML =
    '<div class="page-hdr">'+
      '<div class="page-title">Calendar</div>'+
      '<div class="cal-nav">'+
        '<button class="cal-nav-btn" id="cal-prev">&#8592; Prev</button>'+
        '<div class="cal-month-label">'+monthName+'</div>'+
        '<button class="cal-nav-btn" id="cal-next">Next &#8594;</button>'+
        '<button class="cal-nav-btn" id="cal-today">Today</button>'+
      '</div>'+
    '</div>'+
    '<div class="cal-grid">'+headerCells+cells+'</div>';

  // Nav button handlers
  document.getElementById('cal-prev').addEventListener('click',function(){
    window._calDate=new Date(year,month-1,1);renderCalendar();
  });
  document.getElementById('cal-next').addEventListener('click',function(){
    window._calDate=new Date(year,month+1,1);renderCalendar();
  });
  document.getElementById('cal-today').addEventListener('click',function(){
    window._calDate=new Date();renderCalendar();
  });

  // Trip click → open edit form
  document.querySelectorAll('.cal-trip[data-trip-id]').forEach(function(el){
    el.addEventListener('click',function(e){
      e.stopPropagation();
      openTripForm(el.dataset.tripId);
    });
  });

  document.querySelectorAll('.cal-cell[data-date]').forEach(function(cell){
    cell.addEventListener('click', function(){
      openDayTripsModal(cell.dataset.date, tripMap[cell.dataset.date]||[]);
    });
  });
}

function openDayTripsModal(dateStr, entries){
  var dateObj = new Date(dateStr+'T12:00:00');
  var dateLabel = dateObj.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});

  // Dedupe trips (a trip can appear multiple times if it spans the date as start+end same day)
  var seen = {};
  var trips = [];
  entries.forEach(function(entry){
    if(!seen[entry.trip.id]){ seen[entry.trip.id]=true; trips.push(entry.trip); }
  });

  var rows = trips.map(function(t){
    var scls = {'Confirmed':'b-green','Planning':'b-amber','Completed':'b-blue','Cancelled':'b-red'}[t.status||'']||'b-gray';
    return '<tr class="day-trip-row" data-trip-id="'+t.id+'" style="cursor:pointer">'+
      '<td style="font-weight:600;color:#2563eb;text-decoration:underline">'+(t.clientName||'')+'</td>'+
      '<td>'+(t.destination||'')+'</td>'+
      '<td><span class="badge '+scls+'">'+(t.status||'')+'</span></td>'+

function renderClients(){
  const q=fSearch.toLowerCase();

  list = list.slice().sort(function(a,b){
    var av, bv;
    function liveRevenue(cid){return db.trips.filter(function(t){return t.clientId===cid;}).reduce(function(a,t){return a+(t.totalValue||0);},0);}
    if(clientSortCol==='trips'){
      av=countDistinctTrips(a.id); bv=countDistinctTrips(b.id);
    } else if(clientSortCol==='notes'){
      av=(a.notesLog||[]).length; bv=(b.notesLog||[]).length;

      av=liveRevenue(a.id); bv=liveRevenue(b.id);

      av=a[clientSortCol]; bv=b[clientSortCol];

      av=(av||'').toString().toLowerCase(); bv=(bv||'').toString().toLowerCase();

        '<div class="stat"><div class="stat-lbl">Total Trips</div><div class="stat-val">'+totalTrips+'</div></div>'+
      '</div>';
    })()+

      '<input id="client-search" placeholder="Search by name, email, location..." value="'+fSearch+'"/>'+

    });

  document.querySelectorAll('.client-sub-cb').forEach(function(cb){

  var selBtnC   = document.getElementById('btn-select-all-clients');

  function updateDeleteBtnC(){
    var checked = document.querySelectorAll('.client-row-cb:checked');
    var allCbs = document.querySelectorAll('.client-row-cb');
    if(delBtnC) delBtnC.style.display = checked.length ? 'inline-block' : 'none';
    if(selBtnC) selBtnC.textContent = checked.length === allCbs.length && allCbs.length>0 ? 'Deselect All' : 'Select All';
    if(checkAllC) checkAllC.checked = checked.length === allCbs.length && allCbs.length>0;
    if(checkAllC) checkAllC.indeterminate = checked.length > 0 && checked.length < allCbs.length;
  }

  if(checkAllC){
    checkAllC.addEventListener('change', function(){
      document.querySelectorAll('.client-row-cb').forEach(function(cb){ cb.checked = checkAllC.checked; });

    });

    cb.addEventListener('change', updateDeleteBtnC);

  if(delBtnC){

    });
  }

      '</tr></thead>'+

    '</table></div>'+
    '<div class="form-actions"><button class="cancel-btn" id="modal-close2">Close</button></div>';

  $('overlay').classList.add('open');

  function updateDeleteBtn(){
    var checked = document.querySelectorAll('.trip-row-cb:checked');

    if(selBtn) selBtn.textContent = checked.length === document.querySelectorAll('.trip-row-cb').length ? 'Deselect All' : 'Select All';
    if(checkAll) checkAll.checked = checked.length === document.querySelectorAll('.trip-row-cb').length && checked.length > 0;
    if(checkAll) checkAll.indeterminate = checked.length > 0 && checked.length < document.querySelectorAll('.trip-row-cb').length;
  }

  if(delBtn){

      toast('Deleted '+ids.length+' trip'+(ids.length!==1?'s':''),'ok');
    });
  }
}

function selOpts(opts,val){return opts.map(function(o){return '<option value="'+o+'"'+(o===val?' selected':'')+'>'+o+'</option>';}).join('');}
function fld(label,html,full){return '<div class="field'+(full?' full':'')+'"><label>'+label+'</label>'+html+'</div>';}
function inp(id,type,val,ph){return '<input id="'+id+'" type="'+(type||'text')+'" value="'+(val||'').toString().replace(/"/g,'&quot;')+'" placeholder="'+(ph||'')+'">';}
function sel(id,opts,val){return '<select id="'+id+'"><option value="">Select...</option>'+selOpts(opts,val)+'</select>';}
function balanceGrid(label,idPrefix,list,data,statusList){
  return '<div class="field full"><label>'+label+'</label>'+
    '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax('+(statusList?'300px':'220px')+',1fr));gap:8px;border:1px solid #e5e7eb;border-radius:8px;padding:10px;background:#fafafa">'+
      list.map(function(name,i){
        var entry=(data&&data[name])||{};
        var bal=statusList?(entry.balance||''):((data&&data[name])||'');
        var status=statusList?(entry.status||''):'';
        var isOther=status&&statusList&&statusList.indexOf(status)===-1;
        var statusHtml=statusList?('<select id="'+idPrefix+'-st-'+i+'" class="balance-status-sel" data-custom-id="'+idPrefix+'-st-custom-'+i+'" style="width:110px;padding:5px 8px;border:1px solid #d1d5db;border-radius:6px;font-size:12px;font-family:inherit">'+
          '<option value="">Status...</option>'+statusList.map(function(s){return '<option value="'+s+'"'+(s===status?' selected':'')+'>'+s+'</option>';}).join('')+
          '<option value="Other"'+(isOther?' selected':'')+'>Other</option>'+
          '</select>'+
          '<input id="'+idPrefix+'-st-custom-'+i+'" type="text" value="'+(isOther?status.toString().replace(/"/g,'&quot;'):'')+'" placeholder="Enter status" style="width:100px;padding:5px 8px;border:1px solid #d1d5db;border-radius:6px;font-size:12px;font-family:inherit;display:'+(isOther?'inline-block':'none')+'">'):'';
        return '<div style="display:flex;align-items:center;gap:8px">'+
          '<span style="flex:1;font-size:12px;color:#374151">'+name+'</span>'+
          '<input id="'+idPrefix+'-'+i+'" class="balance-num-input" type="text" inputmode="numeric" value="'+(bal?Number(bal).toLocaleString():'')+'" placeholder="0" style="width:90px;padding:5px 8px;border:1px solid #d1d5db;border-radius:6px;font-size:12px;font-family:inherit">'+
          statusHtml+
        '</div>';
      }).join('')+
    '</div>'+
  '</div>';
}
function readBalanceGrid(idPrefix,list,statusList){
  var out={};
  list.forEach(function(name,i){
    var v=gn(idPrefix+'-'+i);
    var s=statusList?gv(idPrefix+'-st-'+i):'';
    if(s==='Other') s=gv(idPrefix+'-st-custom-'+i);
    if(statusList){
      if(v||s) out[name]={balance:v||0,status:s||''};
    }else if(v){
      out[name]=v;
    }
  });
  return out;
}

    });

function saveClient(id){
  const name=toLastFirst(gv('fn')),email=gv('fe');
  if(!name||!email){toast('Name and email are required','err');return;}
  snapshot(id?'Edit client':'Add client');
  const entries=Array.from(document.querySelectorAll('.note-entry'));
  var noteEntryEls = Array.from(document.querySelectorAll('.note-entry'));
  const notesLog=noteEntryEls.map(function(el,i){
    const tsEl = el.querySelector('.note-ts-link') || el.querySelector('.note-ts');
    const ts=(tsEl||{}).textContent||'';
    const text=(el.querySelector('.note-txt')||{}).value||'';
    const typeEl=el.querySelector('.note-type-sel');
    const noteType=(typeEl&&typeEl.value)||'';
    return {ts:ts.trim(),text:text.trim(),noteType:noteType};
  }).filter(function(n){return n.text;});
  const mileageBalances=readBalanceGrid('mb',AIRLINES,ELITE_STATUS);
  const hotelBalances=readBalanceGrid('hb',HOTELS,ELITE_STATUS);
  const creditCardBalances=readBalanceGrid('cb',CREDIT_CARDS);
  const data={name:name,email:email,phone:gv('fp'),location:gv('fl'),birthdate:gv('fbd'),preferredAirline:gv('fpa'),preferredHotel:gv('fph'),preferredCruiseLine:gv('fpc'),mileageBalances:mileageBalances,hotelBalances:hotelBalances,creditCardBalances:creditCardBalances,notesLog:notesLog,isPayingClient:document.getElementById('f-paying')?document.getElementById('f-paying').checked:false,isSubscriber:document.getElementById('f-subscriber')?document.getElementById('f-subscriber').checked:false,attachments:window._currentClientAttachments||[]};
  if(id){
    db.clients=db.clients.map(function(c){return c.id===id?Object.assign({},c,data):c;});
    toast('Client updated');
  }else{
    db.clients.push(Object.assign({},data,{id:newId('C',db.clients),joined:today(),totalTrips:0}));
    toast('Client added');
  }
  saveDB();closeModal();render();
}

function saveTrip(id){
  const clientId=gv('tc'),dest=gv('tde');
  if(!clientId||!dest){toast('Client and destination are required','err');return;}
  snapshot(id?'Edit trip':'Add trip');
  const client=db.clients.find(function(c){return c.id===clientId;});
  const data={clientId:clientId,clientName:client?client.name:'',origin:gv('tor'),destination:dest,departDate:gv('tdd'),returnDate:gv('trd'),status:gv('tst')||'Planning',type:gv('tty')||'Leisure',airline:gv('tai'),flightClass:gv('tcl')||'Economy',hotel:gv('tho'),hotelNights:gn('thn'),pointsUsed:gn('tpu'),cashPaid:gn('tcp'),totalValue:gn('tva'),bookingRef:gv('tbr'),notes:gv('tno')};
  if(id){
    db.trips=db.trips.map(function(t){return t.id===id?Object.assign({},t,data):t;});
    toast('Trip updated');
  }else{
    data.id=newId('T',db.trips);
    db.trips.push(data);
    if(client) client.totalTrips=(client.totalTrips||0)+1;
    toast('Trip added');
  }
  saveDB();closeModal();render();
}

function delClient(id){
  const c=db.clients.find(function(x){return x.id===id;});
  if(!c||!confirm('Delete '+c.name+' and all their trips?'))return;
  snapshot('Delete client: '+c.name);
  db.clients=db.clients.filter(function(x){return x.id!==id;});
  db.trips=db.trips.filter(function(t){return t.clientId!==id;});
  if(selCid===id) selCid=null;
  saveDB();toast('Client deleted');render();
}

function delTrip(id){
  if(!confirm('Delete this trip?'))return;
  snapshot('Delete trip');
  db.trips=db.trips.filter(function(t){return t.id!==id;});
  saveDB();toast('Trip deleted');render();
}

// ── Planner ───────────────────────────────────────────────────────────────
function plannerSortArrow(col){
  var c = window._plannerSortCol || 'dueDate';
  var d = window._plannerSortDir || 'asc';
  if(c!==col) return '';
  return d==='asc' ? ' &#9650;' : ' &#9660;';
}

function renderPlanner(){
  var statusFilter = window._plannerStatus||'';
  var plannerSortCol = window._plannerSortCol || 'dueDate';
  var plannerSortDir = window._plannerSortDir || 'asc';
  var tasks = db.planner.filter(function(t){
    if(statusFilter==='open' && t.done) return false;
    if(statusFilter==='done' && !t.done) return false;
    return true;
  }).sort(function(a,b){
    if(!!a.done !== !!b.done) return a.done ? 1 : -1;
    var av, bv;
    if(plannerSortCol==='client'){
      av=(clientName(a)||'').toLowerCase();
      bv=(clientName(b)||'').toLowerCase();
    } else {
      av=(a[plannerSortCol]||'').toString().toLowerCase();
      bv=(b[plannerSortCol]||'').toString().toLowerCase();
    }
    if(av<bv) return plannerSortDir==='asc'?-1:1;
    if(av>bv) return plannerSortDir==='asc'?1:-1;
    return 0;
  });
  var openCount = db.planner.filter(function(t){return !t.done;}).length;

  function clientName(t){
    var cid=taskClientId(t);
    if(!cid) return null;
    var c=db.clients.find(function(x){return x.id===cid;});
    return c ? c.name : null;
  }

  function entityBadges(t){
    var out=[];
    if(t.vendorId){
      var v=db.vendors.find(function(x){return x.id===t.vendorId;});
      if(v) out.push('<span class="badge b-green">&#127981; '+v.name+'</span>');
    }
    if(t.tripId){
      var tr=db.trips.find(function(x){return x.id===t.tripId;});
      if(tr) out.push('<span class="badge b-amber planner-trip-link" data-id="'+tr.id+'" style="cursor:pointer" title="Open trip">&#9992;&#65039; '+(tr.destination||'Trip')+'</span>');
    }
    return out.join(' ');
  }

  $('main').innerHTML =
    '<div class="page-hdr" style="display:grid;grid-template-columns:1fr auto 1fr">'+
      '<div class="page-title">Planner</div>'+
      '<button class="add-btn" id="btn-add-task">+ Add Task</button>'+
      '<div></div>'+
    '</div>'+
    '<div class="stats-grid" style="grid-template-columns:repeat(2,1fr)">'+
      '<div class="stat"><div class="stat-lbl">Open Tasks</div><div class="stat-val">'+openCount+'</div></div>'+
      '<div class="stat"><div class="stat-lbl">Total Tasks</div><div class="stat-val">'+db.planner.length+'</div></div>'+
    '</div>'+
    '<div class="search-row">'+
      '<input id="planner-search" placeholder="Search tasks..."/>'+
      '<select id="planner-status-filter">'+
        '<option value=""'+(statusFilter===''?' selected':'')+'>All</option>'+
        '<option value="open"'+(statusFilter==='open'?' selected':'')+'>Open</option>'+
        '<option value="done"'+(statusFilter==='done'?' selected':'')+'>Done</option>'+
      '</select>'+
    '</div>'+
    (tasks.length ? '<div class="tbl-wrap"><table class="tbl-planner"><thead><tr>'+
      '<th style="width:32px"></th>'+
      '<th class="sort-th-pl" data-sort="title" style="cursor:pointer">Task'+plannerSortArrow('title')+'</th>'+
      '<th class="sort-th-pl" data-sort="dueDate" style="cursor:pointer">Due Date'+plannerSortArrow('dueDate')+'</th>'+
      '<th class="sort-th-pl" data-sort="client" style="cursor:pointer">Client'+plannerSortArrow('client')+'</th>'+
      '<th>Trip</th>'+
      '<th></th>'+
    '</tr></thead><tbody>'+tasks.map(function(t){
      var overdue = t.dueDate && !t.done && t.dueDate < today();
      var badgesHtml = entityBadges(t);
      var cid = taskClientId(t);
      var cName = clientName(t);
      return '<tr data-task-id="'+t.id+'">'+
        '<td style="width:32px"><input type="checkbox" class="task-done-cb" data-id="'+t.id+'" '+(t.done?'checked':'')+' style="width:15px;height:15px"></td>'+
        '<td>'+
          '<div class="task-title-link" data-id="'+t.id+'" style="font-size:14px;font-weight:600;color:'+(t.done?'#aaa':'#2563eb')+';cursor:pointer;text-decoration:'+(t.done?'line-through':'underline')+'">'+t.title+'</div>'+
          (t.desc ? '<div style="margin-top:4px;font-size:12px;color:#666">'+t.desc+'</div>' : '')+
        '</td>'+
        '<td style="white-space:nowrap;color:'+(overdue?'#dc2626':'#555')+'">'+(t.dueDate?t.dueDate+(overdue?' (overdue)':''):'<span style="color:#aaa">No due date</span>')+'</td>'+
        '<td>'+(cName?('<span class="planner-client-link" data-id="'+cid+'" style="color:#2563eb;cursor:pointer;text-decoration:underline">'+cName+'</span>'):'<span style="color:#aaa">No client linked</span>')+'</td>'+
        '<td>'+(badgesHtml||'')+'</td>'+
        '<td style="white-space:nowrap">'+
          '<button class="icon-btn edit-task" data-id="'+t.id+'" title="Edit task">&#9998;&#65039;</button>'+
          '<button class="icon-btn del-task" data-id="'+t.id+'" style="color:#dc2626" title="Delete task">&#128465;&#65039;</button>'+
        '</td>'+
      '</tr>';
    }).join('')+'</tbody></table></div>' : '<div class="empty">No tasks yet — add one to start planning follow-ups tied to clients, suppliers, or trips</div>');

  $('btn-add-task').addEventListener('click', function(){openTaskForm();});
  $('planner-search').addEventListener('input', function(){
    var qv = this.value.toLowerCase();
    document.querySelectorAll('[data-task-id]').forEach(function(row){
      var txt = row.textContent.toLowerCase();
      row.style.display = !qv || txt.includes(qv) ? '' : 'none';
    });
  });
  $('planner-status-filter').addEventListener('change', function(){ window._plannerStatus=this.value; renderPlanner(); });
  document.querySelectorAll('.sort-th-pl').forEach(function(th){
    th.addEventListener('click', function(){
      var col = th.dataset.sort;
      if(window._plannerSortCol === col){
        window._plannerSortDir = (window._plannerSortDir==='asc') ? 'desc' : 'asc';
      } else {
        window._plannerSortCol = col;
        window._plannerSortDir = 'asc';
      }
      renderPlanner();
    });
  });

  document.querySelectorAll('.task-done-cb').forEach(function(cb){
    cb.addEventListener('click', function(e){ e.stopPropagation(); });
    cb.addEventListener('change', function(){ toggleTaskDone(this.dataset.id); });
  });
  document.querySelectorAll('.task-title-link').forEach(function(el){
    el.addEventListener('click', function(){ openTaskForm(this.dataset.id); });
  });
  document.querySelectorAll('.planner-client-link').forEach(function(el){
    el.addEventListener('click', function(e){
      e.stopPropagation();
      var cid=this.dataset.id;
      go('clients'); setTimeout(function(){openClientForm(cid);},100);
    });
  });
  document.querySelectorAll('.planner-trip-link').forEach(function(el){
    el.addEventListener('click', function(e){
      e.stopPropagation();
      var tid=this.dataset.id;
      go('trips'); setTimeout(function(){openTripForm(tid);},100);
    });
  });
  document.querySelectorAll('.edit-task').forEach(function(btn){
    btn.addEventListener('click', function(){ openTaskForm(this.dataset.id); });
  });
  document.querySelectorAll('.del-task').forEach(function(btn){
    btn.addEventListener('click', function(){ deleteTask(this.dataset.id); });
  });
}

function openTaskForm(id){
  var d = id ? (db.planner.find(function(t){return t.id===id;})||{}) : {};
  var sortedClients = [...db.clients].sort(function(a,b){return (a.name||'').toLowerCase().localeCompare((b.name||'').toLowerCase());});
  var sortedVendors = [...db.vendors].sort(function(a,b){return (a.name||'').toLowerCase().localeCompare((b.name||'').toLowerCase());});
  var sortedTrips = [...db.trips].sort(function(a,b){return (b.departDate||'').localeCompare(a.departDate||'');});

  var clientOpts = sortedClients.map(function(c){return '<option value="'+c.id+'"'+(c.id===d.clientId?' selected':'')+'>'+c.name+'</option>';}).join('');
  var vendorOpts = sortedVendors.map(function(v){return '<option value="'+v.id+'"'+(v.id===d.vendorId?' selected':'')+'>'+v.name+'</option>';}).join('');
  var tripOpts = sortedTrips.map(function(t){
    var c = db.clients.find(function(x){return x.id===t.clientId;});
    var label = (t.destination||'Trip')+(c?' — '+c.name:'')+(t.departDate?' ('+t.departDate+')':'');
    return '<option value="'+t.id+'"'+(t.id===d.tripId?' selected':'')+'>'+label+'</option>';
  }).join('');

  $('modal').innerHTML=
    '<div class="modal-hdr"><div class="modal-title">'+(id?'Edit Task':'Add Task')+'</div><button class="close-btn" id="modal-close">&#x2715;</button></div>'+
    '<div class="fg">'+
      fld('Task Title', inp('tk-title','text',d.title,'e.g. Follow up on quote'), true)+
      fld('Due Date', inp('tk-due','date',d.dueDate))+
      fld('Status','<select id="tk-done"><option value="0"'+(!d.done?' selected':'')+'>Open</option><option value="1"'+(d.done?' selected':'')+'>Done</option></select>')+
      fld('Linked Client','<select id="tk-client"><option value="">None</option>'+clientOpts+'</select>')+
      fld('Linked Supplier','<select id="tk-vendor"><option value="">None</option>'+vendorOpts+'</select>')+
      fld('Linked Trip','<select id="tk-trip"><option value="">None</option>'+tripOpts+'</select>')+
      fld('Description', '<textarea id="tk-desc" rows="3">'+(d.desc||'')+'</textarea>', true)+
    '</div>'+
    '<div class="form-actions"><button class="cancel-btn" id="modal-cancel">Cancel</button><button class="save-btn" id="modal-save-task" data-id="'+(id||'')+'">Save Task</button></div>';

  $('modal').classList.add('modal-wide');
  $('overlay').classList.add('open');
  $('modal-close').addEventListener('click', closeModal);
  $('modal-cancel').addEventListener('click', closeModal);
  $('modal-save-task').addEventListener('click', function(){ saveTask(this.dataset.id); });
}

function saveTask(id){
  var title = gv('tk-title');
  if(!title){toast('Task title is required','err');return;}
  snapshot(id?'Edit task':'Add task');
  var wasDone = false;
  if(id){
    var existing = db.planner.find(function(t){return t.id===id;});
    wasDone = existing ? !!existing.done : false;
  }
  var data = {
    title:title,
    dueDate:gv('tk-due'),
    done: gv('tk-done')==='1',
    clientId: gv('tk-client'),
    vendorId: gv('tk-vendor'),
    tripId: gv('tk-trip'),
    desc: gv('tk-desc')
  };
  if(id){
    db.planner = db.planner.map(function(t){return t.id===id?Object.assign({},t,data):t;});
    toast('Task updated');
  } else {
    data.id = newId('PL', db.planner);
    data.createdAt = today();
    db.planner.push(data);
    toast('Task added');
  }
  if(!wasDone && data.done) logTaskCompletionNote(db.planner.find(function(t){return t.id===(id||data.id);}));
  saveDB();closeModal();render();
}

function toggleTaskDone(id){
  var task = db.planner.find(function(t){return t.id===id;});
  if(!task) return;
  var wasDone = !!task.done;
  snapshot('Toggle task');
  db.planner = db.planner.map(function(t){return t.id===id?Object.assign({},t,{done:!t.done}):t;});
  if(!wasDone) logTaskCompletionNote(db.planner.find(function(t){return t.id===id;}));
  saveDB();render();
}

// Marking a task done logs it as a note on the linked client record, so
// closing out a follow-up leaves a trail on the client without extra steps.
function logTaskCompletionNote(task){
  if(!task) return;
  var taskCid = taskClientId(task);
  if(!taskCid) return;
  var client = db.clients.find(function(c){return c.id===taskCid;});
  if(!client) return;
  var text = 'Task completed: '+task.title+(task.desc?('\n'+task.desc):'');
  db.clients = db.clients.map(function(c){
    if(c.id!==taskCid) return c;
    var nl = Array.isArray(c.notesLog)?c.notesLog.slice():[];
    nl.push({ts:tsNow(),text:text,noteType:'General',source:'planner'});
    return Object.assign({},c,{notesLog:nl});
  });
}

function deleteTask(id){
  if(!confirm('Delete this task?')) return;
  snapshot('Delete task');
  db.planner = db.planner.filter(function(t){return t.id!==id;});
  saveDB();render();
  toast('Task deleted');
}

// Clicking a task opens this "notes" window — a note typed here is appended to
// the notesLog of every client/supplier linked to the task (and to the linked
// trip's notes field), not stored on the task itself.
function openTaskNotes(id){
  var task = db.planner.find(function(t){return t.id===id;});
  if(!task) return;
  var taskCid = taskClientId(task);
  var client = taskCid ? db.clients.find(function(c){return c.id===taskCid;}) : null;
  var vendor = task.vendorId ? db.vendors.find(function(v){return v.id===task.vendorId;}) : null;
  var trip = task.tripId ? db.trips.find(function(t){return t.id===task.tripId;}) : null;

  var links = [];
  if(client) links.push('<span class="badge b-blue task-link-jump" data-jump="client" data-id="'+client.id+'" style="cursor:pointer">&#128100; '+client.name+'</span>');
  if(vendor) links.push('<span class="badge b-green task-link-jump" data-jump="vendor" data-id="'+vendor.id+'" style="cursor:pointer">&#127981; '+vendor.name+'</span>');
  if(trip) links.push('<span class="badge b-amber task-link-jump" data-jump="trip" data-id="'+trip.id+'" style="cursor:pointer">&#9992;&#65039; '+(trip.destination||'Trip')+'</span>');
  var linksHTML = links.length ? links.join(' ') : '<span style="color:#aaa;font-size:12px">No client, supplier, or trip linked — edit the task to add a link.</span>';

  $('modal').innerHTML=
    '<div class="modal-hdr"><div class="modal-title">'+task.title+'</div><button class="close-btn" id="modal-close">&#x2715;</button></div>'+
    '<div class="field full" style="margin-bottom:14px"><label>Linked to</label><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">'+linksHTML+'</div></div>'+
    '<div class="fg">'+
      fld('Note Type', sel('task-note-type', ['Email Sent','Email Received','Initial Call','Follow-up','General','Text Message','Lead'], 'General'))+
      fld('Note', '<textarea id="task-note-txt" rows="5" placeholder="Add a note for the linked client, supplier, and/or trip..."></textarea>', true)+
    '</div>'+
    '<div class="form-actions"><button class="cancel-btn" id="modal-cancel">Cancel</button><button class="save-btn" id="modal-save-task-note" data-id="'+task.id+'">Save Note</button></div>';

  $('overlay').classList.add('open');
  $('modal-close').addEventListener('click', closeModal);
  $('modal-cancel').addEventListener('click', closeModal);
  $('modal-save-task-note').addEventListener('click', function(){ saveTaskNote(this.dataset.id); });
  document.querySelectorAll('.task-link-jump').forEach(function(el){
    el.addEventListener('click', function(){
      var kind = el.dataset.jump, jid = el.dataset.id;
      closeModal();
      if(kind==='client'){ go('clients'); setTimeout(function(){openClientForm(jid);},100); }
      else if(kind==='vendor'){ go('vendors'); setTimeout(function(){openVendorForm(jid);},100); }
      else if(kind==='trip'){ go('trips'); setTimeout(function(){openTripForm(jid);},100); }
    });
  });
}

function saveTaskNote(id){
  var task = db.planner.find(function(t){return t.id===id;});
  if(!task) return;
  var text = gv('task-note-txt');
  if(!text){toast('Note text is required','err');return;}
  if(!task.clientId && !task.vendorId && !task.tripId){
    toast('This task has no linked client, supplier, or trip','err');
    return;
  }
  var noteType = gv('task-note-type')||'General';
  snapshot('Add task note');
  var ts = tsNow();
  var count = 0;
  var taskCid = taskClientId(task);
  if(taskCid){
    db.clients = db.clients.map(function(c){
      if(c.id!==taskCid) return c;
      var nl = Array.isArray(c.notesLog)?c.notesLog.slice():[];
      nl.push({ts:ts,text:text,noteType:noteType,source:'planner'});
      return Object.assign({},c,{notesLog:nl});
    });
    count++;
  }
  if(task.vendorId){
    db.vendors = db.vendors.map(function(v){
      if(v.id!==task.vendorId) return v;
      var nl = Array.isArray(v.notesLog)?v.notesLog.slice():[];
      nl.push({ts:ts,text:text,noteType:noteType,source:'planner'});
      return Object.assign({},v,{notesLog:nl});
    });
    count++;
  }
  if(task.tripId){
    db.trips = db.trips.map(function(t){
      if(t.id!==task.tripId) return t;
      var appended = t.notes ? t.notes+'\n\n['+ts+'] '+text : '['+ts+'] '+text;
      return Object.assign({},t,{notes:appended});
    });
    count++;
  }
  saveDB();closeModal();render();
  toast('Note added to '+count+' linked record'+(count!==1?'s':''),'ok');
}

// ── Check for MS OAuth redirect ───────────────────────────────────────────
(function checkMsRedirect(){
  const params=new URLSearchParams(window.location.search);
  const code=params.get('code');
  const state=params.get('state');
  if(code&&state==='outlooksync'){
    window.history.replaceState({},'',window.location.pathname);
    debugLog('Got auth code, exchanging for token...');
    exchangeCodeForToken(code).then(function(){
      debugLog('Token exchange SUCCESS - auto-syncing emails...');
      toast('Outlook connected - syncing emails...','info');
      $('outlook-btn').style.color='#059669';
      $('outlook-btn').style.borderColor='#6ee7b7';
      // Auto-run sync immediately after login
      syncOutlook();
    }).catch(function(e){
      debugLog('Token exchange FAILED: '+e.message);
      toast('Outlook auth failed: '+e.message,'err');
    });
  }
})();

// Each binding is independent — if one element is missing or a handler throws
// during setup, it's logged and skipped, but every OTHER button still gets wired up.
function bindClick(id, handler){
  try{
    var el = document.getElementById(id);
    if(!el){ debugLog('Button bind skipped — #'+id+' not found in DOM'); return; }
    el.addEventListener('click', handler);
  }catch(e){
    debugLog('Button bind FAILED for #'+id+': '+e.message);
  }
}

// ── Auto-save every 5 minutes ────────────────────────────────────────────
function startAutosave(){
  // Every actual change already calls saveDB() immediately (see saveClient,
  // saveTask, delTrip, etc.) — a blind periodic re-save of each tab's
  // in-memory db would clobber newer data written by OTHER open tabs since
  // this tab last loaded, silently erasing anything added there. Don't add
  // one back without a cross-tab freshness check.

  // Google Drive backup every 5 minutes. Uses a silent token refresh (no login
  // redirect) so it works even if the user never manually clicked Backup/Restore
  // in this tab — as long as they've signed in at some point on this device.
  setInterval(function(){ runAutoDriveBackup(); }, 5 * 60 * 1000);

  // Also back up whenever the tab is hidden/backgrounded or the page is being
  // unloaded — this is the case that matters most on mobile, where someone edits
  // a record then switches apps or closes the tab well before any timer fires.
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'hidden') runAutoDriveBackup();
  });
  window.addEventListener('pagehide', function(){ runAutoDriveBackup(); });
}

let _autoBackupInFlight = false;
async function runAutoDriveBackup(){
  if(_autoBackupInFlight) return;
  const token = await getDriveTokenSilent();
  if(!token){
    debugLog('Auto-backup skipped — not signed in on this device (no valid token or refresh token)');
    return;
  }
  _autoBackupInFlight = true;
  debugLog('Running auto Drive backup...');
  try{ driveToken = token; await driveBackup(true); debugLog('Auto Drive backup finished'); } // silent=true suppresses button text change
  finally{ _autoBackupInFlight = false; }
}
