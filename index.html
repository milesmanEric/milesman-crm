function finalizeImport(){
  const state=window._importState;
  let imported=0,skipped=0,totalRev=0,relinked=0;
  var seenInBatch={}; // track signature counts seen so far in THIS import batch
  var suppliersCreated=0;
  state.rows.forEach(function(row){
    // Create the Supplier first if this row named one that doesn't exist
    // yet (extractRevenueRow() already decided Name is the supplier, but
    // only sets supplierId when an existing record matched it) — before any
    // client/trip creation below, so the trip is never left pointing at a
    // supplier name with no actual Supplier record behind it. Re-checks
    // db.vendors fresh each row, so multiple rows naming the same new
    // supplier within this batch dedupe onto the one record created for
    // the first of them.
    if(row.supplierName && !row.supplierId){
      var newSupplier=db.vendors.find(function(v){return (v.name||'').toLowerCase().trim()===row.supplierName.toLowerCase().trim();});
      if(!newSupplier){
        newSupplier={id:newId('V',db.vendors),name:row.supplierName,type:'Supplier',category:'',clientIds:[],website:'',notes:'',notesLog:[]};
        db.vendors.push(newSupplier);
        suppliersCreated++;
        debugLog('Revenue: created new Supplier "'+newSupplier.name+'" ('+newSupplier.id+')');
      }
      row.supplierId=newSupplier.id;
    }

    // Find client by name
    const cl=row.name.toLowerCase().trim();
    const parts=cl.split(/\s+/);
    const first=parts[0]||'';
    const last=parts[parts.length-1]||'';
    let cid=null;

    // Check resolution from match modal first
    if(state.resolutions[row.name]!==undefined){
      cid=state.resolutions[row.name];
    }

    // Get first/last regardless of format
    const rowFirst = getFirstName(cl);
    const rowLast = getLastName(cl);

    // Fuzzy match if no resolution — exact or both-names-match only
    if(!cid){
      const direct=db.clients.find(function(c){
        const fn=(c.name||'').toLowerCase().trim();
        if(fn===cl) return true;
        if(rowFirst&&rowLast&&rowFirst!==rowLast){
          var cFirst=getFirstName(c.name);
          var cLast=getLastName(c.name);
          if(cFirst===rowFirst && cLast===rowLast) return true;
        }
        return false;
      });
      if(direct) cid=direct.id;
    }

    if(!cid){debugLog('Revenue: no client match for '+row.name);skipped++;return;}

    const client=db.clients.find(c=>c.id===cid);
    if(!client){skipped++;return;}

    // Build a signature for this row, and count how many times this exact signature
    // has already appeared earlier in THIS batch (to allow legitimate repeated line items)
    var sig = cid+'|'+(row.invoiceNum||'')+'|'+(row.supplierId||'')+'|'+row.amt+'|'+(row.date?row.date.slice(0,10):today());
    var occurrenceIndex = seenInBatch[sig] || 0; // how many times we've already seen this sig in this batch
    seenInBatch[sig] = occurrenceIndex + 1;

    // Count how many matching trips already exist in db.trips with this exact signature
    var existingMatchCount = db.trips.filter(function(t){
      if(row.invoiceNum && t.invoiceNum){
        return t.clientId===cid && t.invoiceNum===row.invoiceNum && t.cashPaid===row.amt;
      }
      return t.clientId===cid &&
             t.supplierId===(row.supplierId||'') &&
             t.cashPaid===row.amt &&
             (t.departDate||'').slice(0,10)===(row.date?row.date.slice(0,10):today());
    }).length;

    // Only treat as duplicate if we've already accounted for at least as many occurrences
    // as already exist in db.trips (this allows legitimate repeated line items within a batch)
    var dupExists = occurrenceIndex < existingMatchCount;
    if(dupExists){
      // Backfill: the matching trip may be missing data that this later
      // import pass can now fill in — a supplier (if it was added to the
      // Suppliers list after this trip was first imported) and/or an
      // invoiceDate (a field added after older trips were already
      // imported, so they were never given one). Without this, a re-import
      // of the exact same file just sees an existing duplicate and skips
      // it every time, and a trip imported before invoiceDate existed can
      // never pick one up — the original row.date is only ever available
      // during import, never stored on its own once departDate is set.
      var dupTrip = db.trips.find(function(t){
        if(row.invoiceNum && t.invoiceNum){
          return t.clientId===cid && t.invoiceNum===row.invoiceNum && t.cashPaid===row.amt;
        }
        return t.clientId===cid && t.cashPaid===row.amt &&
               (t.departDate||'').slice(0,10)===(row.date?row.date.slice(0,10):today());
      });
      var backfilled=[];
      if(dupTrip){
        if(row.supplierId && !dupTrip.supplierId){
          dupTrip.supplierId=row.supplierId;
          dupTrip.supplierName=row.supplierName;
          var supx=db.vendors.find(function(v){return v.id===row.supplierId;});
          if(supx&&!(supx.clientIds||[]).includes(cid)){
            if(!supx.clientIds)supx.clientIds=[];
            supx.clientIds.push(cid);
          }
          backfilled.push('supplier -> '+row.supplierName);
        }
        if(row.date && !dupTrip.invoiceDate){
          var rowInvoiceDate='';
          try{const d=new Date(row.date);if(!isNaN(d))rowInvoiceDate=d.toISOString().slice(0,10);}catch(e){}
          if(rowInvoiceDate){ dupTrip.invoiceDate=rowInvoiceDate; backfilled.push('invoiceDate -> '+rowInvoiceDate); }
        }
      }
      if(backfilled.length){
        relinked++;
        debugLog('Revenue: backfilled '+backfilled.join(', ')+' for existing trip '+dupTrip.id);
      } else {
        debugLog('Revenue: duplicate skipped for '+client.name);
      }
      skipped++;
      return;
    }

    // Build destination: use memo, or supplier+date, or 'Imported Trip'
    const tripId=newId('T',db.trips);
    const dest=row.memo||(row.supplierName?row.supplierName+(row.date?' '+row.date:''):'Imported Trip');
    // Use Ship Date column as trip start date if available, else fall back to extracted/invoice date
    let tripDate=today();
    if(row.shipDate){
      try{const d=new Date(row.shipDate);if(!isNaN(d))tripDate=d.toISOString().slice(0,10);}catch(e){}
    } else {
      var extractedDate = extractDateFromText(dest);
      if(extractedDate){
        tripDate = extractedDate;
      } else if(row.date){
        try{const d=new Date(row.date);if(!isNaN(d))tripDate=d.toISOString().slice(0,10);}catch(e){}
      }
    }
    // Separate from tripDate/departDate on purpose — departDate prioritizes
    // Ship Date (the travel date) when present, but the "By Invoice #"
    // report also needs the actual transaction/booking date (the source
    // file's own "Date" column) to filter by, since those two dates can
    // legitimately fall in different reporting periods (e.g. booked in one
    // month, travel happens the next).
    let invoiceDate='';
    if(row.date){
      try{const d=new Date(row.date);if(!isNaN(d))invoiceDate=d.toISOString().slice(0,10);}catch(e){}
    }

    db.trips.push({
      id:tripId,clientId:cid,clientName:client.name,
      destination:dest,origin:'',departDate:tripDate,returnDate:tripDate,invoiceDate:invoiceDate,
      status:'Completed',type:'Leisure',airline:'',flightClass:'',hotel:'',
      hotelNights:0,pointsUsed:0,cashPaid:row.amt,totalValue:row.amt,
      bookingRef:row.invoiceNum||'',notes:row.memo||'',product:row.product||'',
      supplierId:row.supplierId||'',supplierName:row.supplierName||'',
      invoiceNum:row.invoiceNum||''
    });

    // Link client to supplier
    if(row.supplierId){
      var sup=db.vendors.find(function(v){return v.id===row.supplierId;});
      if(sup&&!(sup.clientIds||[]).includes(cid)){
        if(!sup.clientIds)sup.clientIds=[];
        sup.clientIds.push(cid);
      }
    }

    // Update client revenue
    const newRev=(client.totalRevenue||0)+row.amt;
    db.clients=db.clients.map(c=>c.id===cid?Object.assign({},c,{totalRevenue:newRev}):c);

    imported++;totalRev+=row.amt;
  });
  snapshot('Import trips');
  saveDB();render();
  window._importState=null;
  toast('Imported '+imported+' trips — $'+money(totalRev)+
    (suppliersCreated?', created '+suppliersCreated+' new supplier'+(suppliersCreated!==1?'s':''):'')+
    (relinked?', backfilled '+relinked+' existing trip'+(relinked!==1?'s':''):'')+
    (skipped?' ('+skipped+' skipped)':''),'ok');
}

function importCSV(){
  const i=document.createElement('input');i.type='file';i.accept='.csv';
  i.onchange=function(e){
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=function(ev){
      try{
        const lines=ev.target.result.split('\n').map(function(l){return l.trim();}).filter(function(l){return l;});
        if(lines.length<2){toast('CSV appears empty','err');return;}
        const headers=lines[0].split(',').map(function(h){return h.replace(/"/g,'').trim().toLowerCase();});
        const nameIdx=headers.findIndex(function(h){return h.includes('name');});
        const emailIdx=headers.findIndex(function(h){return h.includes('email');});
        const phoneIdx=headers.findIndex(function(h){return h.includes('phone');});
        const locIdx=headers.findIndex(function(h){return h.includes('location')||h.includes('city');});
        if(nameIdx===-1){toast('No name column found in CSV','err');return;}
        let added=0,skipped=0,enriched=0;
        for(let i=1;i<lines.length;i++){
          const cols=lines[i].split(',');
          const clean=cols.map(function(c){return (c||'').replace(/^"|"$/g,'').trim();});
          const name=clean[nameIdx]||'';
          const email=emailIdx>=0?(clean[emailIdx]||''):'';
          const phone=phoneIdx>=0?(clean[phoneIdx]||''):'';
          const location=locIdx>=0?(clean[locIdx]||''):'';
          if(!name){skipped++;continue;}
          const nameFirst=getFirstName(name).toLowerCase();
          const nameLast=getLastName(name).toLowerCase();
          const existing=db.clients.find(function(c){
            if(email && c.email && c.email.toLowerCase()===email.toLowerCase()) return true;
            var cFull=(c.name||'').toLowerCase().trim();
            if(cFull===name.toLowerCase().trim()) return true; // exact match, any format
            var cFirst=getFirstName(c.name).toLowerCase();
            var cLast=getLastName(c.name).toLowerCase();
            // Format-independent match: same first+last regardless of "First Last" vs "Last, First"
            return nameFirst && nameLast && nameFirst!==nameLast && cFirst===nameFirst && cLast===nameLast;
          });
          if(existing){
            // Duplicate — fill in any fields the existing record is missing, don't create a new client
            var filled=[];
            if(email && !existing.email){existing.email=email;filled.push('email');}
            if(phone && !existing.phone){existing.phone=phone;filled.push('phone');}
            if(location && !existing.location){existing.location=location;filled.push('location');}
            if(filled.length){
              debugLog('Client import: enriched '+existing.name+' with '+filled.join(', ')+' from duplicate row');
              enriched++;
            } else {
              debugLog('Client import skip (duplicate, no new info): '+name);
            }
            skipped++;
            continue;
          }
          db.clients.push({id:newId('C',db.clients),name:toLastFirst(name),email:email,phone:phone,location:location,preferredAirline:'',preferredHotel:'',notes:'',joined:today(),totalTrips:0,notesLog:[]});
          added++;
        }
        snapshot('Import contacts');
        saveDB();render();
        toast('Imported '+added+' contacts'+(skipped?' ('+skipped+' skipped)':'')+(enriched?', enriched '+enriched+' existing':'')+' ✓');
      }catch(err){toast('Could not read CSV: '+err.message,'err');}
    };r.readAsText(f);
  };i.click();
}

// ── Formspree intake form import ──────────────────────────────────────────
// Imports submissions exported (as CSV) from the Formspree dashboard behind
// intake-form.html — matches/enriches a client record by name+email, same
// as importCSV, then also creates a follow-up Planner task from whatever
// trip-request fields were filled in. Doesn't create a Trip record directly
// — a form submission is a request, not a confirmed booking, so it becomes
// a task to review and turn into a real trip once quoted/booked.
// Shared per-submission processing, used by both the manual CSV importer
// (importFormspreeSubmissions) and the automatic Outlook email importer
// (checkForNewTripFormEmails). getVal(name) abstracts the field lookup so
// each caller can supply its own source — a CSV row lookup, or a parsed
// notification-email key/value object — without duplicating this logic.
function processTripFormRow(getVal, counters){
  // Reads the per-brand "Airline - American" / "Airline Status - American"
  // style fields the intake form's balance grids submit, matching the
  // exact field names buildBalanceGrid() in intake-form.html generates.
  // A status of "Other" means the traveler typed a custom status into
  // the paired "... Status Other - American" field instead of picking
  // from the real tier list — use that free text instead.
  function extractBalances(list, prefix, includeStatus){
    var out = {};
    list.forEach(function(brand){
      var bal = parseFloat((getVal(prefix+' - '+brand)||'').replace(/[,$]/g,''))||0;
      var status = includeStatus ? getVal(prefix+' Status - '+brand) : '';
      if(status==='Other'){
        var customStatus = getVal(prefix+' Status Other - '+brand);
        if(customStatus) status = customStatus;
      }
      if(bal || status) out[brand] = includeStatus ? {balance:bal, status:status} : bal;
    });
    return Object.keys(out).length ? out : null;
  }
  // Reads the "Airline Credit Card - <card name>" checkboxes the intake
  // form's airlineCreditCardsHtml() submits — a plain has/doesn't-have
  // checklist (unlike the balance grids above), so this just checks
  // presence, no balance or status.
  function extractCardChecklist(cardsByBrand, prefix){
    var out = [];
    Object.keys(cardsByBrand).forEach(function(brand){
      cardsByBrand[brand].forEach(function(card){
        if(getVal(prefix+' - '+card)) out.push(card);
      });
    });
    return out.length ? out : null;
  }
  // "Other" for a Preferred Airline/Hotel/Cruise Line select means the
  // real value is in the paired "... Other" free-text field.
  function resolveOther(value, otherValue){
    return value==='Other' && otherValue ? otherValue : value;
  }

  var name = getVal('Full Name');
  if(!name){ counters.skipped++; return; }
  var email = getVal('Email');
  var phone = getVal('Phone');
  var streetAddress = getVal('Street Address');
  var city = getVal('City');
  var state = getVal('State');
  var zip = getVal('Zip Code');
  var birthdate = getVal('Birthdate');
  var countryOfCitizenship = getVal('Country of Citizenship');
  var countryOfBirth = getVal('Country of Birth');
  var referredBy = getVal('Referred By');
  var referredByDetail = getVal('Referred By Detail');
  var preferredAirline = resolveOther(getVal('Preferred Airline'), getVal('Preferred Airline Other'));
  var preferredHotel = resolveOther(getVal('Preferred Hotel'), getVal('Preferred Hotel Other'));
  var preferredCruiseLine = resolveOther(getVal('Preferred Cruise Line'), getVal('Preferred Cruise Line Other'));
  var mileageBalances = extractBalances(AIRLINES, 'Airline', true);
  var hotelBalances = extractBalances(HOTELS, 'Hotel', true);
  var cruiseBalances = extractBalances(CRUISE_LINES, 'Cruise', true);
  var carRentalBalances = extractBalances(CAR_RENTALS, 'Car Rental', true);
  var creditCardBalances = extractBalances(CREDIT_CARDS, 'Credit Card', false);
  var airlineCreditCards = extractCardChecklist(AIRLINE_CREDIT_CARDS, 'Airline Credit Card');
  var hotelCreditCards = extractCardChecklist(HOTEL_CREDIT_CARDS, 'Hotel Credit Card');

  var nameFirst=getFirstName(name).toLowerCase(), nameLast=getLastName(name).toLowerCase();
  var client = db.clients.find(function(c){
    if(email && c.email && c.email.toLowerCase()===email.toLowerCase()) return true;
    if((c.name||'').toLowerCase().trim()===name.toLowerCase().trim()) return true;
    var cFirst=getFirstName(c.name).toLowerCase(), cLast=getLastName(c.name).toLowerCase();
    return nameFirst && nameLast && nameFirst!==nameLast && cFirst===nameFirst && cLast===nameLast;
  });

  if(client){
    var filled=[];
    if(email && !client.email){client.email=email;filled.push('email');}
    if(phone && !client.phone){client.phone=phone;filled.push('phone');}
    if(streetAddress && !client.streetAddress){client.streetAddress=streetAddress;filled.push('streetAddress');}
    if(city && !client.city){client.city=city;filled.push('city');}
    if(state && !client.state){client.state=state;filled.push('state');}
    if(zip && !client.zip){client.zip=zip;filled.push('zip');}
    if(birthdate && !client.birthdate){client.birthdate=birthdate;filled.push('birthdate');}
    if(countryOfCitizenship && !client.countryOfCitizenship){client.countryOfCitizenship=countryOfCitizenship;filled.push('countryOfCitizenship');}
    if(countryOfBirth && !client.countryOfBirth){client.countryOfBirth=countryOfBirth;filled.push('countryOfBirth');}
    if(referredBy && !client.referredBy){client.referredBy=referredBy;client.referredByDetail=referredByDetail;filled.push('referredBy');}
    if(preferredAirline && !client.preferredAirline){client.preferredAirline=preferredAirline;filled.push('preferredAirline');}
    if(preferredHotel && !client.preferredHotel){client.preferredHotel=preferredHotel;filled.push('preferredHotel');}
    if(preferredCruiseLine && !client.preferredCruiseLine){client.preferredCruiseLine=preferredCruiseLine;filled.push('preferredCruiseLine');}
    if(mileageBalances){
      var mm=mergeBalanceObjects(client.mileageBalances,mileageBalances);
      if(mm.added.length){client.mileageBalances=mm.merged;filled.push('mileageBalances ('+mm.added.join(', ')+')');}
    }
    if(hotelBalances){
      var hm=mergeBalanceObjects(client.hotelBalances,hotelBalances);
      if(hm.added.length){client.hotelBalances=hm.merged;filled.push('hotelBalances ('+hm.added.join(', ')+')');}
    }
    if(cruiseBalances){
      var cbm=mergeBalanceObjects(client.cruiseBalances,cruiseBalances);
      if(cbm.added.length){client.cruiseBalances=cbm.merged;filled.push('cruiseBalances ('+cbm.added.join(', ')+')');}
    }
    if(carRentalBalances){
      var crbm=mergeBalanceObjects(client.carRentalBalances,carRentalBalances);
      if(crbm.added.length){client.carRentalBalances=crbm.merged;filled.push('carRentalBalances ('+crbm.added.join(', ')+')');}
    }
    if(creditCardBalances){
      var cm=mergeCreditCardBalances(client.creditCardBalances,creditCardBalances);
      if(cm.added.length){client.creditCardBalances=cm.merged;filled.push('creditCardBalances ('+cm.added.join(', ')+')');}
    }
    if(airlineCreditCards){
      var accm=mergeCardChecklist(client.airlineCreditCards,airlineCreditCards);
      if(accm.added.length){client.airlineCreditCards=accm.merged;filled.push('airlineCreditCards ('+accm.added.join(', ')+')');}
    }
    if(hotelCreditCards){
      var hccm=mergeCardChecklist(client.hotelCreditCards,hotelCreditCards);
      if(hccm.added.length){client.hotelCreditCards=hccm.merged;filled.push('hotelCreditCards ('+hccm.added.join(', ')+')');}
    }
    if(filled.length) counters.enriched++;
  } else {
    client = {id:newId('C',db.clients), name:toLastFirst(name), email:email, phone:phone,
      streetAddress:streetAddress, city:city, state:state, zip:zip,
      birthdate:birthdate, countryOfCitizenship:countryOfCitizenship, countryOfBirth:countryOfBirth, referredBy:referredBy, referredByDetail:referredByDetail,
      preferredAirline:preferredAirline, preferredHotel:preferredHotel, preferredCruiseLine:preferredCruiseLine,
      mileageBalances:mileageBalances||{}, hotelBalances:hotelBalances||{}, cruiseBalances:cruiseBalances||{}, carRentalBalances:carRentalBalances||{}, creditCardBalances:creditCardBalances||{}, airlineCreditCards:airlineCreditCards||[], hotelCreditCards:hotelCreditCards||[],
      notes:'', joined:today(), totalTrips:0, notesLog:[]};
    db.clients.push(client);
    counters.added++;
  }

  var destination = getVal('Destination');
  var airline = resolveOther(getVal('Airline'), getVal('Airline Other'));
  var cruiseLine = resolveOther(getVal('Cruise Line'), getVal('Cruise Line Other'));
  var hotelBrand = resolveOther(getVal('Hotel Brand'), getVal('Hotel Brand Other'));
  var carRentalCompany = resolveOther(getVal('Car Rental Company'), getVal('Car Rental Company Other'));
  var themePark = getVal('Theme Park');
  var tourVendor = resolveOther(getVal('Tour Vendor'), getVal('Tour Vendor Other'));
  // Depart/Return Date only exist in the Airline Details section, which is
  // hidden unless "Airline" is checked — a cruise-only or car-rental-only
  // request still has real dates (Sailing Date, Pickup/Dropoff Date), so
  // fall back to those rather than leaving the trip's departDate blank.
  // departDate drives the Calendar view (trips with no departDate are
  // skipped entirely), sorting, and "Upcoming" status, so this isn't
  // cosmetic — a blank departDate makes the trip invisible on the Calendar.
  var tripDepartDate = getVal('Depart Date') || getVal('Sailing Date') || getVal('Pickup Date') || getVal('Hotel Check-in Date') || getVal('Train Departure Date') || getVal('Bus Departure Date');
  var tripReturnDate = getVal('Return Date') || getVal('Dropoff Date') || getVal('Train Return Date') || getVal('Bus Return Date');
  var tripLines=[];
  function addLine(label,val){ if(val) tripLines.push(label+': '+val); }
  var travelNeeded = ['Airline','Hotel','Tours','Cruise','Car Rental','Theme Park Tickets','Train','Bus'].filter(function(t){return getVal('Need - '+t);}).join(', ');
  addLine('Type of Travel Needed', travelNeeded);
  addLine('Tour Vendor', tourVendor);
  addLine('Tours Description', getVal('Tours Description'));
  addLine('Airline', airline);
  addLine('Origin', getVal('Origin'));
  addLine('Destination', destination);
  addLine('Trip Direction', getVal('Trip Direction'));
  if(getVal('Trip Direction')==='Multi-city'){
    var cityStops=[];
    for(var ci=1; ci<=20; ci++){
      var cityVal = getVal('City '+ci);
      if(!cityVal) continue;
      var cityDate = getVal('City '+ci+' Departure Date');
      cityStops.push(cityVal+(cityDate?' ('+cityDate+')':''));
    }
    addLine('Multi-City Stops', cityStops.join(' → '));
  }
  addLine('Depart Date', getVal('Depart Date'));
  addLine('Return Date', getVal('Return Date'));
  addLine('Trip Type', getVal('Trip Type'));
  addLine('Cruise Line', cruiseLine);
  addLine('Ship Name', getVal('Ship Name'));
  addLine('Cruise Nights', getVal('Cruise Nights'));
  addLine('Sailing Date', getVal('Sailing Date'));
  addLine('Departure Port', getVal('Departure Port'));
  addLine('Cabin Type', getVal('Cabin Type'));
  addLine('People In Cabin', getVal('People In Cabin'));
  addLine('Cruise Loyalty Number', getVal('Cruise Loyalty Number'));
  addLine('Cruisetour', getVal('Cruisetour'));
  addLine('Class of Service', getVal('Class of Service'));
  addLine('Non-Stop Flights Only', getVal('Non-Stop Flights Only'));
  addLine('Hotel Location', getVal('Hotel Location'));
  addLine('Hotel Brand', hotelBrand);
  addLine('Hotel Check-in Date', getVal('Hotel Check-in Date'));
  addLine('Hotel Nights', getVal('Hotel Nights'));
  addLine('Room Type', getVal('Room Type'));
  addLine('People Per Room', getVal('People Per Room'));
  addLine('Number of Rooms', getVal('Number of Rooms'));
  addLine('Car Rental Company', carRentalCompany);
  addLine('Car Size', getVal('Car Size'));
  addLine('Pickup Location', getVal('Pickup Location'));
  addLine('Dropoff Location', getVal('Dropoff Location'));
  addLine('Pickup Date', getVal('Pickup Date'));
  addLine('Dropoff Date', getVal('Dropoff Date'));
  addLine('Pickup Time', getVal('Pickup Time'));
  addLine('Dropoff Time', getVal('Dropoff Time'));
  addLine('Payment Preference', getVal('Payment Preference'));
  addLine('Number of Travelers', getVal('Number of Travelers'));
  addLine('Notes', getVal('Notes'));
  addLine('Trip Insurance', getVal('Trip Insurance'));
  addLine('Theme Park', themePark);
  addLine('Theme Park Ticket Type', getVal('Theme Park Ticket Type'));
  addLine('Train Departure Date', getVal('Train Departure Date'));
  addLine('Train Return Date', getVal('Train Return Date'));
  addLine('Train Departure City', getVal('Train Departure City'));
  addLine('Train Arrival City', getVal('Train Arrival City'));
  addLine('Train Class of Service', getVal('Train Class of Service'));
  addLine('Bus Departure Date', getVal('Bus Departure Date'));
  addLine('Bus Return Date', getVal('Bus Return Date'));
  addLine('Bus Departure City', getVal('Bus Departure City'));
  addLine('Bus Arrival City', getVal('Bus Arrival City'));
  addLine('Bus Class of Service', getVal('Bus Class of Service'));

  // Companion travelers (Traveler 2+) get their own client record too —
  // matched/enriched by name the same way the primary contact is, just
  // without email/phone/location/referred-by since the form doesn't
  // collect those per-traveler (only the primary contact has them).
  // Every companion's client id also gets linked onto the trip record
  // created below (clientId stays the primary/billing contact).
  var linkedClientIds = [];
  var travelerCount = parseInt(getVal('Number of Travelers'),10)||1;
  for(var tn=2; tn<=travelerCount; tn++){
    var tp='Traveler '+tn;
    var tName=getVal(tp+' - Full Name');
    if(!tName) continue;
    var tBirthdate=getVal(tp+' - Birthdate');
    var tCountryOfCitizenship=getVal(tp+' - Country of Citizenship');
    var tCountryOfBirth=getVal(tp+' - Country of Birth');
    var tAirline=resolveOther(getVal(tp+' - Preferred Airline'), getVal(tp+' - Preferred Airline Other'));
    var tHotel=resolveOther(getVal(tp+' - Preferred Hotel'), getVal(tp+' - Preferred Hotel Other'));
    var tCruise=resolveOther(getVal(tp+' - Preferred Cruise Line'), getVal(tp+' - Preferred Cruise Line Other'));
    var tAirlineBal=extractBalances(AIRLINES,tp+' Airline',true);
    var tHotelBal=extractBalances(HOTELS,tp+' Hotel',true);
    var tCruiseBal=extractBalances(CRUISE_LINES,tp+' Cruise',true);
    var tCarRentalBal=extractBalances(CAR_RENTALS,tp+' Car Rental',true);
    var tCcBal=extractBalances(CREDIT_CARDS,tp+' Credit Card',false);
    var tAirlineCc=extractCardChecklist(AIRLINE_CREDIT_CARDS, tp+' Airline Credit Card');
    var tHotelCc=extractCardChecklist(HOTEL_CREDIT_CARDS, tp+' Hotel Credit Card');

    var tFirst=getFirstName(tName).toLowerCase(), tLast=getLastName(tName).toLowerCase();
    var tClient = db.clients.find(function(c){
      if((c.name||'').toLowerCase().trim()===tName.toLowerCase().trim()) return true;
      var cFirst=getFirstName(c.name).toLowerCase(), cLast=getLastName(c.name).toLowerCase();
      return tFirst && tLast && tFirst!==tLast && cFirst===tFirst && cLast===tLast;
    });

    if(tClient){
      var tFilled=[];
      if(tBirthdate && !tClient.birthdate){tClient.birthdate=tBirthdate;tFilled.push('birthdate');}
      if(tCountryOfCitizenship && !tClient.countryOfCitizenship){tClient.countryOfCitizenship=tCountryOfCitizenship;tFilled.push('countryOfCitizenship');}
      if(tCountryOfBirth && !tClient.countryOfBirth){tClient.countryOfBirth=tCountryOfBirth;tFilled.push('countryOfBirth');}
      if(tAirline && !tClient.preferredAirline){tClient.preferredAirline=tAirline;tFilled.push('preferredAirline');}
      if(tHotel && !tClient.preferredHotel){tClient.preferredHotel=tHotel;tFilled.push('preferredHotel');}
      if(tCruise && !tClient.preferredCruiseLine){tClient.preferredCruiseLine=tCruise;tFilled.push('preferredCruiseLine');}
      if(tAirlineBal){var tmm=mergeBalanceObjects(tClient.mileageBalances,tAirlineBal); if(tmm.added.length){tClient.mileageBalances=tmm.merged;tFilled.push('mileageBalances');}}
      if(tHotelBal){var thm=mergeBalanceObjects(tClient.hotelBalances,tHotelBal); if(thm.added.length){tClient.hotelBalances=thm.merged;tFilled.push('hotelBalances');}}
      if(tCruiseBal){var tcbm=mergeBalanceObjects(tClient.cruiseBalances,tCruiseBal); if(tcbm.added.length){tClient.cruiseBalances=tcbm.merged;tFilled.push('cruiseBalances');}}
      if(tCarRentalBal){var tcrbm=mergeBalanceObjects(tClient.carRentalBalances,tCarRentalBal); if(tcrbm.added.length){tClient.carRentalBalances=tcrbm.merged;tFilled.push('carRentalBalances');}}
      if(tCcBal){var tcm=mergeCreditCardBalances(tClient.creditCardBalances,tCcBal); if(tcm.added.length){tClient.creditCardBalances=tcm.merged;tFilled.push('creditCardBalances');}}
      if(tAirlineCc){var taccm=mergeCardChecklist(tClient.airlineCreditCards,tAirlineCc); if(taccm.added.length){tClient.airlineCreditCards=taccm.merged;tFilled.push('airlineCreditCards');}}
      if(tHotelCc){var thccm=mergeCardChecklist(tClient.hotelCreditCards,tHotelCc); if(thccm.added.length){tClient.hotelCreditCards=thccm.merged;tFilled.push('hotelCreditCards');}}
      if(tFilled.length) counters.enriched++;
    } else {
      tClient = {id:newId('C',db.clients), name:toLastFirst(tName), email:'', phone:'',
        birthdate:tBirthdate, countryOfCitizenship:tCountryOfCitizenship, countryOfBirth:tCountryOfBirth, preferredAirline:tAirline, preferredHotel:tHotel, preferredCruiseLine:tCruise,
        mileageBalances:tAirlineBal||{}, hotelBalances:tHotelBal||{}, cruiseBalances:tCruiseBal||{}, carRentalBalances:tCarRentalBal||{}, creditCardBalances:tCcBal||{}, airlineCreditCards:tAirlineCc||[], hotelCreditCards:tHotelCc||[],
        notes:'', joined:today(), totalTrips:0, notesLog:[]};
      db.clients.push(tClient);
      counters.added++;
    }
    linkedClientIds.push(tClient.id);
    tripLines.push('Traveling with: '+tClient.name+' (client '+tClient.id+')');
  }

  // Match the requested Airline/Cruise Line/Hotel Brand/Car Rental Company/
  // Theme Park/Tour Vendor against existing Supplier records by exact name,
  // same as the revenue importer's supplier matching (extractRevenueRow) —
  // never creates a new vendor, only links the client onto one that's
  // already there. A trip only has one supplier slot, so the first match
  // wins in that priority order; every match still gets the client linked
  // onto it regardless. Tours Description is deliberately excluded — it's
  // freeform text, not a name from a fixed list, so there's no safe exact
  // match.
  function matchVendorByName(n){
    if(!n) return null;
    return db.vendors.find(function(v){return (v.name||'').toLowerCase().trim()===n.toLowerCase().trim();}) || null;
  }
  function linkClientToVendor(vendor){
    if(!vendor) return;
    if(!vendor.clientIds) vendor.clientIds=[];
    if(!vendor.clientIds.includes(client.id)){
      vendor.clientIds.push(client.id);
      debugLog('Trip form: linked '+client.name+' to existing supplier '+vendor.name);
    }
  }
  var airlineVendor = matchVendorByName(airline);
  var cruiseVendor = matchVendorByName(cruiseLine);
  var hotelVendor = matchVendorByName(hotelBrand);
  var carRentalVendor = matchVendorByName(carRentalCompany);
  var themeParkVendor = matchVendorByName(themePark);
  var tourVendorMatch = matchVendorByName(tourVendor);
  [airlineVendor, cruiseVendor, hotelVendor, carRentalVendor, themeParkVendor, tourVendorMatch].forEach(linkClientToVendor);
  var primarySupplier = airlineVendor || cruiseVendor || hotelVendor || carRentalVendor || themeParkVendor || tourVendorMatch || null;

  var newTripId = null;
  if(destination || tripLines.length){
    newTripId = newId('T', db.trips);
    db.trips.push({
      id:newTripId, clientId:client.id, clientName:client.name, clientIds:linkedClientIds,
      origin:getVal('Origin'), destination:destination,
      departDate:tripDepartDate, returnDate:tripReturnDate,
      status:'Planning', type:getVal('Trip Type')||'Leisure',
      airline:airline, flightClass:getVal('Class of Service'), hotel:hotelBrand,
      hotelNights:parseInt(getVal('Hotel Nights'),10)||0,
      cruiseLine:cruiseLine, shipName:getVal('Ship Name'),
      pointsUsed:0, cashPaid:0, totalValue:0, bookingRef:'', product:'',
      supplierId:primarySupplier?primarySupplier.id:'', supplierName:primarySupplier?primarySupplier.name:'',
      notes: tripLines.join('\n')
    });
    counters.tripsCreated++;
  }

  if(tripLines.length){
    db.planner.push({
      id:newId('PL',db.planner),
      title:'New trip request'+(destination?': '+destination:''),
      dueDate:today(), done:false, clientId:client.id, tripId:newTripId,
      completionNoteType:'General',
      desc: tripLines.join('\n'),
      createdAt: today()
    });
    counters.tasksCreated++;
  }
}

function importFormspreeSubmissions(){
  const i=document.createElement('input');
  i.type='file'; i.accept='.csv,.xlsx,.xls';
  i.onchange=async function(e){
    const file=e.target.files[0];
    if(!file) return;
    try{
      const rows = await loadTableFromFile(file);
      if(!rows.length){toast('File appears to be empty','err');return;}
      const hdrsLower = rows[0].map(function(h){return (h||'').toString().trim().toLowerCase();});
      function col(row, name){
        var idx = hdrsLower.indexOf(name.toLowerCase());
        return idx>=0 ? (row[idx]||'').toString().trim() : '';
      }
      var counters = {added:0, enriched:0, tasksCreated:0, tripsCreated:0, skipped:0};
      for(var ri=1; ri<rows.length; ri++){
        var row = rows[ri];
        processTripFormRow(function(name){ return col(row, name); }, counters);
      }
      snapshot('Import Formspree submissions');
      saveDB(); render();
      toast('Imported '+counters.added+' new client'+(counters.added!==1?'s':'')+(counters.enriched?', enriched '+counters.enriched+' existing':'')+', created '+counters.tripsCreated+' trip'+(counters.tripsCreated!==1?'s':'')+' and '+counters.tasksCreated+' follow-up task'+(counters.tasksCreated!==1?'s':'')+(counters.skipped?' ('+counters.skipped+' skipped)':''),'ok');
    }catch(err){
      console.error(err);
      toast('Could not read file: '+err.message,'err');
    }
  };
  i.click();
}

// ── Auto-import trip form emails ────────────────────────────────────────
// submit-form.com emails a "New submission for Book a trip" notification
// per booking request. Its plain-text body is one long run of "Label
// Value Label Value..." with no delimiter — an empty field just runs
// straight into the next label — so extractLabelValue-style one-at-a-time
// searching breaks. Instead this builds the complete set of field labels
// the intake form can possibly submit (mirroring the exact name="..."
// patterns in intake-form.html), finds every label that actually occurs
// in the email text in one pass, and takes each match's value as the text
// up to the next matched label. Longest labels are tried first so a
// prefix like "Referred By" can't shadow "Referred By Detail".
// The notification service's exact wording between "New submission" and
// "Book a trip" has changed at least once already ("for" vs "-"), so match
// loosely on the stable start/end phrases rather than the whole literal
// string.
var TRIPFORM_EMAIL_SUBJECT_RE = /^New submission\b.*\bBook a trip$/i;
function buildTripFormFieldLabels(){
  var labels = ['Full Name','Email','Phone','Street Address','City','State','Zip Code','Number of Travelers',
    'Birthdate','Country of Citizenship','Country of Birth','Referred By','Referred By Detail',
    'Preferred Airline','Preferred Airline Other','Preferred Hotel','Preferred Hotel Other',
    'Preferred Cruise Line','Preferred Cruise Line Other'];
  function addBalanceLabels(prefix, list, includeStatus){
    list.forEach(function(brand){
      labels.push(prefix+' - '+brand);
      if(includeStatus){ labels.push(prefix+' Status - '+brand); labels.push(prefix+' Status Other - '+brand); }
    });
  }
  function addCardChecklistLabels(cardsByBrand, prefix){
    Object.keys(cardsByBrand).forEach(function(brand){
      cardsByBrand[brand].forEach(function(card){ labels.push(prefix+' - '+card); });
    });
  }
  addBalanceLabels('Airline', AIRLINES, true);
  addBalanceLabels('Hotel', HOTELS, true);
  addBalanceLabels('Cruise', CRUISE_LINES, true);
  addBalanceLabels('Car Rental', CAR_RENTALS, true);
  addBalanceLabels('Credit Card', CREDIT_CARDS, false);
  addCardChecklistLabels(AIRLINE_CREDIT_CARDS, 'Airline Credit Card');
  addCardChecklistLabels(HOTEL_CREDIT_CARDS, 'Hotel Credit Card');
  labels.push('Need - Airline','Need - Hotel','Need - Tours','Need - Cruise','Need - Car Rental','Need - Theme Park Tickets','Need - Train','Need - Bus',
    'Airline','Airline Other','Origin','Destination','Trip Direction','Depart Date','Return Date','Class of Service','Non-Stop Flights Only','Trip Type',
    'Cruise Line','Cruise Line Other','Ship Name','Cruise Nights','Sailing Date','Departure Port','Cabin Type','People In Cabin','Cruise Loyalty Number','Cruisetour',
    'Hotel Location','Hotel Brand','Hotel Brand Other','Hotel Check-in Date','Hotel Nights','Room Type','People Per Room','Number of Rooms',
    'Car Rental Company','Car Rental Company Other','Car Size','Pickup Location','Dropoff Location','Pickup Date','Dropoff Date','Pickup Time','Dropoff Time',
    'Theme Park','Theme Park Ticket Type','Tour Vendor','Tour Vendor Other',
    'Train Departure Date','Train Return Date','Train Departure City','Train Arrival City','Train Class of Service',
    'Bus Departure Date','Bus Return Date','Bus Departure City','Bus Arrival City','Bus Class of Service',
    'Payment Preference','Tours Description','Notes','Trip Insurance');
  for(var ci=1; ci<=20; ci++){ labels.push('City '+ci, 'City '+ci+' Departure Date'); }
  for(var tn=2; tn<=12; tn++){
    var p = 'Traveler '+tn;
    labels.push(p+' - Full Name', p+' - Birthdate', p+' - Country of Citizenship', p+' - Country of Birth',
      p+' - Preferred Airline', p+' - Preferred Airline Other', p+' - Preferred Hotel', p+' - Preferred Hotel Other',
      p+' - Preferred Cruise Line', p+' - Preferred Cruise Line Other');
    addBalanceLabels(p+' Airline', AIRLINES, true);
    addBalanceLabels(p+' Hotel', HOTELS, true);
    addBalanceLabels(p+' Cruise', CRUISE_LINES, true);
    addBalanceLabels(p+' Car Rental', CAR_RENTALS, true);
    addBalanceLabels(p+' Credit Card', CREDIT_CARDS, false);
    addCardChecklistLabels(AIRLINE_CREDIT_CARDS, p+' Airline Credit Card');
    addCardChecklistLabels(HOTEL_CREDIT_CARDS, p+' Hotel Credit Card');
  }
  return labels;
}
var _tripFormLabelRegex = null;
function tripFormLabelRegex(){
  if(_tripFormLabelRegex) return _tripFormLabelRegex;
  var labels = buildTripFormFieldLabels().slice().sort(function(a,b){return b.length-a.length;});
  var pattern = labels.map(function(l){return l.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}).join('|');
  // A short label like "Airline" would otherwise match mid-word inside a
  // typed value like "Alaska Airlines" — require the match not be
  // immediately followed by another letter.
  _tripFormLabelRegex = new RegExp('(?:'+pattern+')(?![A-Za-z])', 'g');
  return _tripFormLabelRegex;
}
// Every "X" / "X Other" pair (Preferred Airline, Hotel Brand, etc. — including
// per-traveler variants), computed once and cached alongside the regex.
var _tripFormOtherPairBases = null;
function tripFormOtherPairBases(){
  if(_tripFormOtherPairBases) return _tripFormOtherPairBases;
  var labels = buildTripFormFieldLabels();
  var labelSet = {};
  labels.forEach(function(l){ labelSet[l] = true; });
  _tripFormOtherPairBases = labels.filter(function(l){ return labelSet[l+' Other']; });
  return _tripFormOtherPairBases;
}
var TRIPFORM_OTHER_SENTINEL = 'OTHERVALUE';
function parseTripFormEmailText(flatText){
  // "Notes" is always the last real field, so without this the email
  // service's own footer/CTA text after the table would get appended to
  // whatever the traveler typed in Notes.
  var footerIdx = flatText.search(/Go to dashboard/i);
  if(footerIdx !== -1) flatText = flatText.slice(0, footerIdx);
  // When a select-with-"Other" field's value is literally "Other" (e.g. the
  // traveler picked "Other" for Hotel Brand), the flattened text reads
  // "Hotel Brand Other Hotel Brand Other <specify text>" — indistinguishable
  // from "Hotel Brand" having no value followed by the separate "Hotel
  // Brand Other" label. Swap that specific "Other" token for a sentinel so
  // it can't be mistaken for the start of the paired label; mapped back to
  // "Other" once matching is done.
  tripFormOtherPairBases().forEach(function(base){
    var other = base+' Other';
    flatText = flatText.split(base+' Other '+other).join(base+' '+TRIPFORM_OTHER_SENTINEL+' '+other);
  });
  var regex = tripFormLabelRegex();
  regex.lastIndex = 0;
  var matches = [];
  var m;
  while((m = regex.exec(flatText))){
    matches.push({label:m[0], start:m.index, end:m.index+m[0].length});
  }
  var row = {};
  for(var i=0; i<matches.length; i++){
    var start = matches[i].end;
    var end = (i+1<matches.length) ? matches[i+1].start : flatText.length;
    if(!(matches[i].label in row)){
      var val = flatText.slice(start, end).trim();
      row[matches[i].label] = val===TRIPFORM_OTHER_SENTINEL ? 'Other' : val;
    }
  }
  return row;
}
// Polls the connected Outlook inbox for new "Book a trip" submission
// emails and imports each one through the same logic as the manual CSV
// import. silent=true (used by the timer and the on-load check) never
// triggers an Outlook login redirect — it just skips quietly until the
// user has connected via the Debug Panel's "Sync Outlook Emails" button.
async function checkForNewTripFormEmails(silent){
  try{
    var token = await getValidMsToken(false);
    if(!token){
      if(!silent) toast('Connect Outlook first (Debug Panel > Sync Outlook Emails)','err');
      else debugLog('Trip form email check: skipped — Outlook not connected');
      return;
    }
    var lastCheck = localStorage.getItem('mm_last_tripform_check') || (function(){
      var d = new Date(); d.setDate(d.getDate()-1); return d.toISOString();
    })();
    var processedIds = JSON.parse(localStorage.getItem('mm_tripform_processed_ids')||'[]');
    var checkedAt = new Date().toISOString();

    var url = 'https://graph.microsoft.com/v1.0/me/messages'+
      '?$select=id,subject,receivedDateTime,body'+
      '&$orderby=receivedDateTime desc&$top=50'+
      '&$filter=receivedDateTime+ge+'+encodeURIComponent(lastCheck);
    var r = await fetch(url, {headers:{Authorization:'Bearer '+token}});
    var d = await r.json();
    if(!r.ok){
      debugLog('Trip form email check error: '+(d.error&&d.error.message||r.status));
      return;
    }
    debugLog('Trip form email check: fetched '+(d.value||[]).length+' message(s) since '+lastCheck);
    (d.value||[]).forEach(function(m){
      if(TRIPFORM_EMAIL_SUBJECT_RE.test((m.subject||'').trim())){
        debugLog('Trip form email check: found subject match — id='+m.id+' subject="'+m.subject+'" alreadyProcessed='+(processedIds.indexOf(m.id)!==-1)+' receivedDateTime='+m.receivedDateTime);
      }
    });
    var messages = (d.value||[]).filter(function(m){
      return TRIPFORM_EMAIL_SUBJECT_RE.test((m.subject||'').trim()) && processedIds.indexOf(m.id)===-1;
    });
    debugLog('Trip form email check: '+messages.length+' new submission email(s)');
    localStorage.setItem('mm_last_tripform_check', checkedAt);
    if(!messages.length) return;

    var counters = {added:0, enriched:0, tasksCreated:0, tripsCreated:0, skipped:0};
    messages.forEach(function(msg){
      var flatText = stripHtml(msg.body && msg.body.content || '');
      var row = parseTripFormEmailText(flatText);
      processTripFormRow(function(name){ return row[name]||''; }, counters);
      processedIds.push(msg.id);
    });
    if(processedIds.length > 500) processedIds = processedIds.slice(processedIds.length-500);
    localStorage.setItem('mm_tripform_processed_ids', JSON.stringify(processedIds));

    if(counters.tripsCreated || counters.added || counters.enriched){
      snapshot('Auto-import trip form emails');
      saveDB(); render();
      toast('Auto-imported '+counters.tripsCreated+' trip'+(counters.tripsCreated!==1?'s':'')+' from email ('+counters.added+' new client'+(counters.added!==1?'s':'')+')','ok');
    }
  }catch(e){
    debugLog('Trip form email check failed: '+e.message);
  }
}

// ── Auto-import contact form emails ─────────────────────────────────────
// The website's general "Miles Man Contact Form" (themilesman.com) emails a
// notification per submission, in the same flattened "Label Value Label
// Value..." layout as the trip form emails but with a much smaller, fixed
// field set: first_name, last_name, email, phone, message, followed by a
// "Submitted <time> - <date>" footer. Every submission becomes a lead: a
// client record (created or matched/enriched the same way processTripFormRow
// does), a "Lead" note with the inquiry text, and a follow-up Planner task.
const CONTACT_FORM_EMAIL_SUBJECT = 'New submission from Miles Man Contact Form';
function parseContactFormEmailText(flatText){
  var footerIdx = flatText.search(/\bSubmitted \d/i);
  if(footerIdx !== -1) flatText = flatText.slice(0, footerIdx);
  var labels = ['first_name','last_name','email','phone','message'];
  var regex = new RegExp('\\b(?:'+labels.join('|')+')\\b', 'gi');
  var matches = [];
  var m;
  while((m = regex.exec(flatText))){
    matches.push({label:m[0].toLowerCase(), start:m.index, end:m.index+m[0].length});
  }
  var row = {};
  for(var i=0; i<matches.length; i++){
    if(matches[i].label in row) continue; // first occurrence wins
    var start = matches[i].end;
    // "message" is always the last real field, so it runs to the end of the
    // text unconditionally — the inquiry text itself may well contain words
    // like "email" or "phone", which would otherwise be mistaken by this
    // same scan for the start of a later field and truncate the message.
    if(matches[i].label==='message'){
      row.message = flatText.slice(start).trim();
      break;
    }
    var end = matches[i+1] ? matches[i+1].start : flatText.length;
    row[matches[i].label] = flatText.slice(start, end).trim();
  }
  return row;
}
function processContactFormRow(row, counters){
  var firstName = (row.first_name||'').trim();
  var lastName = (row.last_name||'').trim();
  var name = (firstName+' '+lastName).trim();
  if(!name){ counters.skipped++; return; }
  var email = (row.email||'').trim();
  var phone = (row.phone||'').trim();
  var message = (row.message||'').trim();

  var nameFirst = firstName.toLowerCase(), nameLast = lastName.toLowerCase();
  var client = db.clients.find(function(c){
    if(email && c.email && c.email.toLowerCase()===email.toLowerCase()) return true;
    if((c.name||'').toLowerCase().trim()===name.toLowerCase().trim()) return true;
    var cFirst=getFirstName(c.name).toLowerCase(), cLast=getLastName(c.name).toLowerCase();
    return nameFirst && nameLast && nameFirst!==nameLast && cFirst===nameFirst && cLast===nameLast;
  });

  var leadNoteText = 'Contact form inquiry'+(message?': '+message:'');
  var ts = new Date().toLocaleString();

  if(client){
    if(email && !client.email) client.email = email;
    if(phone && !client.phone) client.phone = phone;
    if(!client.notesLog) client.notesLog = [];
    client.notesLog.push({ts:ts, text:leadNoteText, noteType:'Lead', source:'contact-form'});
    counters.enriched++;
  } else {
    client = {id:newId('C',db.clients), name:toLastFirst(name), email:email, phone:phone,
      streetAddress:'', city:'', state:'', zip:'', birthdate:'', countryOfCitizenship:'', countryOfBirth:'',
      referredBy:'', referredByDetail:'', preferredAirline:'', preferredHotel:'', preferredCruiseLine:'',
      mileageBalances:{}, hotelBalances:{}, cruiseBalances:{}, carRentalBalances:{}, creditCardBalances:{}, airlineCreditCards:[], hotelCreditCards:[],
      notes:'', joined:today(), totalTrips:0,
      notesLog:[{ts:ts, text:leadNoteText, noteType:'Lead', source:'contact-form'}]};
    db.clients.push(client);
    counters.added++;
  }

  db.planner.push({
    id:newId('PL',db.planner),
    title:'New contact form lead: '+client.name,
    dueDate:today(), done:false, clientId:client.id, vendorId:'', tripId:'',
    completionNoteType:'Lead',
    desc: message || 'New contact form submission — no message provided.',
    createdAt: today()
  });
  counters.tasksCreated++;
}

// ── Auto-import revenue report emails ───────────────────────────────────
// A QuickBooks "Sales by Customer Detail" report gets emailed on a schedule
// as a password-protected PDF, with the same columns (Date, Num, Memo, Name,
// Ship Date, Item, Class, Qty, Sales Price, Amount) as the file "Clean &
// Import Revenue File" already reads from CSV/XLSX. A PDF has no real grid
// though, so each row's cells are rebuilt from pdf.js text-item x/y
// positions.
//
// Two wrinkles this has to handle:
// 1. When the report is too wide for one page, QuickBooks splits the
//    columns across sequential PDF pages instead of wrapping rows — e.g.
//    page 1 has Date/Num/Memo/Name/Ship Date/Item and page 2 has
//    Class/Qty/Sales Price/Amount for the SAME rows, aligned by matching
//    y-coordinates. A page's header row is found by label text; if it
//    includes "Date" it starts a new batch of rows, otherwise (no "Date")
//    it's a continuation whose columns get merged into whichever batch is
//    currently open, matching rows to the open batch by y-position.
// 2. Within a row, a header label sits centered over its column, but a
//    short data value (e.g. a 7-digit invoice number in a wide Memo
//    column) can end up spatially closer to an earlier neighboring
//    column's header than to its own — plain nearest-center matching
//    misassigns it. Walking each row's items left to right with a
//    forward-only column pointer (each item claims the nearest column
//    that's not already been passed) fixes that while still letting a
//    genuinely blank column (e.g. an empty Class) be skipped over.
//
// A row only counts as a transaction if its Date-column cell parses as a
// date, and only rows below the header line on a page are ever considered
// — that quietly excludes the report's title/print-date block, customer
// group headers, "Total <name>" subtotals, and the grand "TOTAL" line
// (none of those have a real date in that position). The reconstructed
// table is then fed through the exact same cleanImportTable +
// extractRevenueRow + startRevenueImport pipeline as a manual CSV import,
// so client/supplier matching and duplicate detection behave identically
// either way.
const REVENUE_REPORT_EMAIL_SUBJECTS = ['Report(s) from Miles Man', 'Report from Miles Man'];
const REVENUE_REPORT_PDF_PASSWORD = 'milesman';
const REVENUE_PDF_COLUMNS = ['Date','Num','Memo','Name','Ship Date','Item','Class','Qty','Sales Price','Amount'];

function groupPdfItemsIntoRows(items){
  var rows = [];
  items.forEach(function(it){
    if(!it.str || !it.str.trim()) return;
    var row = rows.find(function(r){ return Math.abs(r.y-it.y)<2; });
    if(!row){ row = {y:it.y, items:[]}; rows.push(row); }
    row.items.push(it);
  });
  rows.sort(function(a,b){ return b.y-a.y; }); // PDF y grows upward — top of page first
  return rows;
}
// Returns this page's recognized header labels in left-to-right order (not
// just a name->center map) — classifyRowCells needs the order to walk its
// forward-only pointer. Requires at least 2 matches to avoid a stray cell
// that happens to equal a single column name being mistaken for a header.
function findPageHeaderColumns(row){
  var found = [];
  row.items.slice().sort(function(a,b){return a.x-b.x;}).forEach(function(it){
    var label = REVENUE_PDF_COLUMNS.find(function(h){ return h.toLowerCase()===it.str.trim().toLowerCase(); });
    if(label) found.push({name:label, center: it.x + it.w/2});
  });
  return found.length>=2 ? found : null;
}
function findOrCreateBatchRow(batchRows, y){
  var row = batchRows.find(function(r){ return Math.abs(r.y-y)<2; });
  if(!row){ row = {y:y, cells:{}}; batchRows.push(row); }
  return row;
}
function classifyRowCells(row, pageColumns){
  var cells = {};
  var pointer = 0;
  row.items.slice().sort(function(a,b){return a.x-b.x;}).forEach(function(it){
    var center = it.x + it.w/2;
    var bestIdx = -1, bestDist = Infinity;
    for(var i=pointer; i<pageColumns.length; i++){
      var dist = Math.abs(pageColumns[i].center-center);
      if(dist<bestDist){ bestDist=dist; bestIdx=i; }
    }
    if(bestIdx===-1) return;
    var name = pageColumns[bestIdx].name;
    cells[name] = (cells[name]?cells[name]+' ':'') + it.str.trim();
    pointer = bestIdx+1;
  });
  return cells;
}
async function extractRevenueTableFromPdf(arrayBuffer, password){
  var pdfjsLib = await loadPdfJs();
  var pdf = await pdfjsLib.getDocument({data:arrayBuffer, password:password}).promise;

  var finishedRows = [];
  var batchRows = null; // rows for the batch currently being accumulated
  var sawAnyHeader = false;

  function flushBatch(){
    if(batchRows) finishedRows = finishedRows.concat(batchRows);
    batchRows = null;
  }

  for(var p=1; p<=pdf.numPages; p++){
    var page = await pdf.getPage(p);
    var content = await page.getTextContent();
    var items = content.items.map(function(it){
      var tr = it.transform;
      return {str:it.str, x:tr[4], y:tr[5], w:it.width};
    });
    var rows = groupPdfItemsIntoRows(items);

    var headerRowRef = null, pageColumns = null;
    for(var ri=0; ri<rows.length; ri++){
      var hc = findPageHeaderColumns(rows[ri]);
      if(hc){ headerRowRef = rows[ri]; pageColumns = hc; break; }
    }
    if(!pageColumns) continue; // no recognizable header on this page at all

    sawAnyHeader = true;
    var isPrimary = pageColumns.some(function(c){return c.name==='Date';});
    if(isPrimary){
      flushBatch(); // start a new row batch, finalizing whatever was pending
      batchRows = [];
    } else if(!batchRows){
      continue; // continuation page with no open batch to merge into
    }

    var headerY = headerRowRef.y;
    rows.forEach(function(row){
      if(row===headerRowRef) return;
      if(row.y >= headerY) return; // report title/date-range lines sit above the header — skip
      var pageCells = classifyRowCells(row, pageColumns);
      var batchRow = findOrCreateBatchRow(batchRows, row.y);
      Object.keys(pageCells).forEach(function(k){ batchRow.cells[k]=pageCells[k]; });
    });
  }
  flushBatch();

  if(!sawAnyHeader) throw new Error('Could not find the report\'s column headers (Num/Memo/Name/Amount) in the PDF — is this a "Sales by Customer Detail" report?');

  var dataRows = finishedRows
    .filter(function(r){ return /^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test((r.cells['Date']||'').trim()); })
    .map(function(r){ return REVENUE_PDF_COLUMNS.map(function(h){ return r.cells[h]||''; }); });

  return {header:REVENUE_PDF_COLUMNS, rows:dataRows};
}
// Same cleaning + revenue-row-extraction + import pipeline as
// cleanAndImportRevenue (the manual file picker), minus the confirm()
// dialog — this runs unattended off the 5-minute email poll, so nothing
// here can wait on a click. Client-matching gaps still surface via the
// normal import-match modal (inside startRevenueImport), which is a page
// overlay rather than a blocking dialog, so it won't stall the poll timer.
async function cleanAndImportRevenuePdfEmail(arrayBuffer, filename){

  var hdrsLower = result.header.map(function(h){ return (h||'').toString().toLowerCase().trim(); });
  function getCol(row, names, fallbackIdx){
    for(var i=0;i<names.length;i++){
      var idx=hdrsLower.indexOf(names[i]);
      if(idx>=0) return (row[idx]||'').toString().trim();

  var revenueRows=[];

    return;
  }
  startRevenueImport(revenueRows);
}
async function checkForNewRevenueReportEmails(silent){

    }

      var d = new Date(); d.setDate(d.getDate()-1); return d.toISOString();
    })();
    var processedIds = JSON.parse(localStorage.getItem('mm_revenuereport_processed_ids')||'[]');
    var checkedAt = new Date().toISOString();

    var url = 'https://graph.microsoft.com/v1.0/me/messages'+
      '?$select=id,subject,receivedDateTime,hasAttachments'+
      '&$orderby=receivedDateTime desc&$top=50'+
      '&$filter=receivedDateTime+ge+'+encodeURIComponent(lastCheck);

    if(!r.ok){

    (d.value||[]).forEach(function(m){
      if(REVENUE_REPORT_EMAIL_SUBJECTS.indexOf((m.subject||'').trim())!==-1){
        debugLog('Revenue report email check: found subject match — id='+m.id+' hasAttachments='+m.hasAttachments+' alreadyProcessed='+(processedIds.indexOf(m.id)!==-1)+' receivedDateTime='+m.receivedDateTime);
      }
    });

      return REVENUE_REPORT_EMAIL_SUBJECTS.indexOf((m.subject||'').trim())!==-1 && m.hasAttachments && processedIds.indexOf(m.id)===-1;
    });
    debugLog('Revenue report email check: '+messages.length+' new report email(s)');
    localStorage.setItem('mm_last_revenuereport_check', checkedAt);
    if(!messages.length) return;

    for(var mi=0; mi<messages.length; mi++){
      var msg = messages[mi];
      processedIds.push(msg.id);
      try{
        var attUrl = 'https://graph.microsoft.com/v1.0/me/messages/'+msg.id+'/attachments';
        var ar = await fetch(attUrl, {headers:{Authorization:'Bearer '+token}});
        var ad = await ar.json();
        if(!ar.ok){ debugLog('Revenue report email: attachment fetch error - '+(ad.error&&ad.error.message||ar.status)); continue; }
        var pdfAtt = (ad.value||[]).find(function(a){
          return a['@odata.type']==='#microsoft.graph.fileAttachment' &&
            ((a.contentType||'').toLowerCase()==='application/pdf' || /\.pdf$/i.test(a.name||''));
        });
        if(!pdfAtt){ debugLog('Revenue report email: no PDF attachment found on "'+msg.subject+'"'); continue; }
        var bin = atob(pdfAtt.contentBytes);
        var bytes = new Uint8Array(bin.length);
        for(var bi=0; bi<bin.length; bi++) bytes[bi]=bin.charCodeAt(bi);
        await cleanAndImportRevenuePdfEmail(bytes.buffer, pdfAtt.name||'revenue-report.pdf');
      }catch(attErr){
        debugLog('Revenue report email: import failed for "'+msg.subject+'" — '+attErr.message);
        console.error(attErr);
      }
    }
    if(processedIds.length > 500) processedIds = processedIds.slice(processedIds.length-500);
    localStorage.setItem('mm_revenuereport_processed_ids', JSON.stringify(processedIds));
  }catch(e){
    debugLog('Revenue report email check failed: '+e.message);
  }
}

// ── Book a Trip Form PDF import ──────────────────────────────────────────
// Imports "Book a Trip" Google Form submissions exported as PDFs (the Google
// Forms Notification add-on emails one PDF per submission, laid out as a
// list of "Question label" / "Answer" pairs). Only maps recognized labels
// onto fields that already exist on the client record (name, email, phone,
// address/location, and — if present in a given form — birthdate, preferred
// airline/hotel/cruise line). Every other question (number of travelers,
// trip dates, points balances, room type, etc.) has no matching client
// field and is intentionally left unmapped rather than inventing a new one.
//
// Label matching is text-based against the exact question wording of the
// "Miles Man Travel Info Form" template — if the form's questions are
// reworded later, the labels below need to be updated to match.
const PDFJS_VERSION='6.1.200';
let _pdfjsLibPromise=null;
function loadPdfJs(){
  if(!_pdfjsLibPromise){
    _pdfjsLibPromise=import('https://cdn.jsdelivr.net/npm/pdfjs-dist@'+PDFJS_VERSION+'/build/pdf.min.mjs').then(function(lib){
      lib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@'+PDFJS_VERSION+'/build/pdf.worker.min.mjs';
      return lib;
    });
  }
  return _pdfjsLibPromise;
}
async function extractPdfText(arrayBuffer){
  const pdfjsLib=await loadPdfJs();
  const pdf=await pdfjsLib.getDocument({data:arrayBuffer}).promise;
  let text='';
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const content=await page.getTextContent();
    text+=content.items.map(function(it){return it.str;}).join(' ')+' ';
  }
  return text.replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/\s+/g,' ').trim();
}
// Every question label in the template, used as boundaries so we know where
// one answer ends and the next question starts. `find` overrides the default
// substring search when a label could otherwise collide with another
// (e.g. "Address" is a substring of "Email address").
const TRIP_FORM_LABELS=[
  {label:'Your name'},
  {label:'Email address'},
  {label:'Phone number'},
  {label:'Address', find:function(lower){var m=/(?<!email )address/.exec(lower); return m?m.index:-1;}},
  {label:'How many travelers?'},
  {label:"Other travelers' names and ages"},
  {label:'Please list all airline points balances you have in your name. Do not list account numbers.'},
  {label:"Please list all airline points balances you have in your spouse's name. Do not list account numbers. Type N/A if not applicable."},
  {label:'Please list all hotel points balances you have in your name. Do not list account numbers.'},
  {label:'Please list all credit card points balances you have in your name. Do not list account numbers, but do list specific card (i.e. Chase Sapphire Reserve)'},
  {label:'If looking for hotel, what types of hotels will you consider?'},
  {label:'Do you need a rental car?'},
  {label:'How many people are traveling?'},
  {label:'For Airfare, preferred departure date'},
  {label:'For Airfare, preferred return date'},
  {label:'Are your dates flexible?'},
  {label:'For Airfare: Departure and Arrival Cities'},
  {label:'For airfare: Will you consider alternate airports?'},
  {label:'For airfare: do you only want non-stop flights?'},
  {label:'For airfare, what class of service?'},
  {label:'For Hotel: Number of nights'},
  {label:'For Hotel: Room type'},
  {label:'For Hotel: Number of Beds'},
  {label:'For Hotel: How many rooms?'},
  {label:'Birthdate'},
  {label:'Date of Birth'},
  {label:'Preferred Airline'},
  {label:'Preferred Hotel'},
  {label:'Preferred Cruise Line'}
];
function findLabelIndex(lower,entry){
  return entry.find ? entry.find(lower) : lower.indexOf(entry.label.toLowerCase());
}
function extractLabelValue(flatText,targetLabel){
  const lower=flatText.toLowerCase();
  const target=TRIP_FORM_LABELS.find(function(e){return e.label===targetLabel;});
  if(!target) return '';
  const startIdx=findLabelIndex(lower,target);
  if(startIdx===-1) return '';
  const afterLabel=startIdx+target.label.length;
  let nextIdx=flatText.length;
  TRIP_FORM_LABELS.forEach(function(e){
    if(e.label===targetLabel) return;
    const idx=findLabelIndex(lower.slice(afterLabel),e);
    if(idx!==-1){
      const abs=afterLabel+idx;
      if(abs<nextIdx) nextIdx=abs;
    }
  });
  return flatText.slice(afterLabel,nextIdx).trim();
}
function matchOption(val,opts){
  if(!val) return '';
  const found=opts.find(function(o){return o.toLowerCase()===val.toLowerCase().trim();});
  return found||'';
}
// Parses free-text answers like "UNITED: Lawrence 34,213" into
// {United:34213}. Only recognizes names already in the given option list
// (AIRLINES or HOTELS); anything else in the text (traveler names, etc.) is
// ignored rather than guessed at. Assumes the option name and its number
// appear in that order, which holds for airline/hotel brand names.
function extractPointsBalances(text,optionsList){
  if(!text) return null;
  const out={};
  optionsList.forEach(function(opt){
    const re=new RegExp(opt.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'[^\\d]*([\\d][\\d,]*)','i');
    const m=re.exec(text);
    if(m){
      const n=parseInt(m[1].replace(/,/g,''),10);
      if(!isNaN(n)) out[opt]=n;
    }
  });
  return Object.keys(out).length?out:null;
}
// Same as extractPointsBalances but wraps each number in the {balance,status}
// shape used by mileageBalances/hotelBalances (status left blank — the form
// doesn't ask for elite status).
function extractBalanceObjects(text,optionsList){
  const raw=extractPointsBalances(text,optionsList);
  if(!raw) return null;
  const out={};
  Object.keys(raw).forEach(function(k){ out[k]={balance:raw[k],status:''}; });
  return out;
}
// Credit card names are often written in a different word order than the
// canonical CREDIT_CARDS entries (e.g. "Platinum American Express" for "Amex
// Platinum"), so this matches all significant words regardless of order
// instead of requiring an exact substring.
function extractCreditCardBalances(text){
  if(!text) return null;
  const normalized=text.replace(/american express/gi,'Amex');
  const out={};
  CREDIT_CARDS.forEach(function(card){
    const words=card.split(/\s+/);
    const allPresent=words.every(function(w){
      return new RegExp('\\b'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i').test(normalized);
    });
    if(allPresent){
      const m=/([\d][\d,]*)/.exec(normalized);
      if(m){
        const n=parseInt(m[1].replace(/,/g,''),10);
        if(!isNaN(n)) out[card]=n;
      }
    }
  });
  return Object.keys(out).length?out:null;
}
// Adds any newly-found balances without touching an entry that already has
// a recorded balance on the client. Shared by mileageBalances/hotelBalances
// ({balance,status} objects).
function mergeBalanceObjects(existingBalances,newBalances){
  const merged=Object.assign({},existingBalances||{});
  const added=[];
  Object.keys(newBalances||{}).forEach(function(name){
    if(!merged[name]||!merged[name].balance){
      merged[name]=newBalances[name];
      added.push(name);
    }
  });
  return {merged:merged,added:added};
}
// Same, but for creditCardBalances, which stores plain numbers rather than
// {balance,status} objects.
function mergeCreditCardBalances(existingBalances,newBalances){
  const merged=Object.assign({},existingBalances||{});
  const added=[];
  Object.keys(newBalances||{}).forEach(function(card){
    if(!merged[card]){
      merged[card]=newBalances[card];
      added.push(card);
    }
  });
  return {merged:merged,added:added};
}
// airlineCreditCards/hotelCreditCards are plain arrays of held card names (no
// balance/status), so merging is just a dedup union, not a per-key object merge.
function mergeCardChecklist(existingCards,newCards){
  const merged=Array.isArray(existingCards)?existingCards.slice():[];
  const added=[];
  (newCards||[]).forEach(function(card){
    if(merged.indexOf(card)===-1){ merged.push(card); added.push(card); }
  });
  return {merged:merged,added:added};
}
async function importTripFormPDF(){
  const i=document.createElement('input');i.type='file';i.accept='application/pdf';i.multiple=true;
  i.onchange=async function(e){
    const files=Array.from(e.target.files||[]);
    if(!files.length) return;
    let added=0,enriched=0,skipped=0,failed=0;
    for(const file of files){
      try{
        const buf=await file.arrayBuffer();
        const flatText=await extractPdfText(buf);

        const name=extractLabelValue(flatText,'Your name');
        const email=extractLabelValue(flatText,'Email address');
        const phone=extractLabelValue(flatText,'Phone number');
        const location=extractLabelValue(flatText,'Address');
        const birthdate=extractLabelValue(flatText,'Birthdate')||extractLabelValue(flatText,'Date of Birth');
        const preferredAirline=matchOption(extractLabelValue(flatText,'Preferred Airline'),AIRLINES);
        const preferredHotel=matchOption(extractLabelValue(flatText,'Preferred Hotel'),HOTELS);
        const preferredCruiseLine=matchOption(extractLabelValue(flatText,'Preferred Cruise Line'),CRUISE_LINES);
        const mileageBalances=extractBalanceObjects(extractLabelValue(flatText,'Please list all airline points balances you have in your name. Do not list account numbers.'),AIRLINES);
        const hotelBalances=extractBalanceObjects(extractLabelValue(flatText,'Please list all hotel points balances you have in your name. Do not list account numbers.'),HOTELS);
        const creditCardBalances=extractCreditCardBalances(extractLabelValue(flatText,'Please list all credit card points balances you have in your name. Do not list account numbers, but do list specific card (i.e. Chase Sapphire Reserve)'));

        if(!name&&!email){debugLog('Trip form PDF: no name or email found in '+file.name);skipped++;continue;}

        const nameFirst=getFirstName(name).toLowerCase();
        const nameLast=getLastName(name).toLowerCase();
        const existing=db.clients.find(function(c){
          if(email && c.email && c.email.toLowerCase()===email.toLowerCase()) return true;
          if(!name) return false;
          const cFull=(c.name||'').toLowerCase().trim();
          if(cFull===name.toLowerCase().trim()) return true;
          const cFirst=getFirstName(c.name).toLowerCase();
          const cLast=getLastName(c.name).toLowerCase();
          return nameFirst && nameLast && nameFirst!==nameLast && cFirst===nameFirst && cLast===nameLast;
        });

        const fieldsToFill={email:email,phone:phone,location:location,birthdate:birthdate,preferredAirline:preferredAirline,preferredHotel:preferredHotel,preferredCruiseLine:preferredCruiseLine};

        if(existing){
          const filled=[];
          Object.keys(fieldsToFill).forEach(function(k){
            if(fieldsToFill[k] && !existing[k]){existing[k]=fieldsToFill[k];filled.push(k);}
          });
          if(mileageBalances){
            const merge=mergeBalanceObjects(existing.mileageBalances,mileageBalances);
            if(merge.added.length){existing.mileageBalances=merge.merged;filled.push('mileageBalances ('+merge.added.join(', ')+')');}
          }
          if(hotelBalances){
            const merge=mergeBalanceObjects(existing.hotelBalances,hotelBalances);
            if(merge.added.length){existing.hotelBalances=merge.merged;filled.push('hotelBalances ('+merge.added.join(', ')+')');}
          }
          if(creditCardBalances){
            const merge=mergeCreditCardBalances(existing.creditCardBalances,creditCardBalances);
            if(merge.added.length){existing.creditCardBalances=merge.merged;filled.push('creditCardBalances ('+merge.added.join(', ')+')');}
          }
          if(filled.length){debugLog('Trip form PDF: enriched '+existing.name+' with '+filled.join(', ')+' from '+file.name);enriched++;}
          skipped++;
          continue;
        }

        if(!name){skipped++;continue;} // no name to create a new client with

        db.clients.push(Object.assign({id:newId('C',db.clients),name:toLastFirst(name),email:'',phone:'',location:'',preferredAirline:'',preferredHotel:'',preferredCruiseLine:'',mileageBalances:mileageBalances||{},hotelBalances:hotelBalances||{},creditCardBalances:creditCardBalances||{},notes:'',joined:today(),totalTrips:0,totalRevenue:0,notesLog:[]},fieldsToFill));
        added++;
      }catch(err){
        debugLog('Trip form PDF error for '+file.name+': '+err.message);
        console.error('Trip form PDF error for '+file.name,err);
        failed++;
      }
    }
    snapshot('Import trip form PDF');
    saveDB();render();
    toast('Trip form PDF import: '+added+' new client'+(added!==1?'s':'')+(enriched?', enriched '+enriched+' existing':'')+(skipped?' ('+skipped+' skipped)':'')+(failed?', '+failed+' failed to parse — see Debug Log':''),failed?'err':'ok');
  };
  i.click();
}

function getInvoiceReportData(){
  var fromDate = (document.getElementById('rpt-inv-from')||{}).value||'';
  var toDate   = (document.getElementById('rpt-inv-to')||{}).value||'';
  var supplierId = (document.getElementById('rpt-inv-supplier')||{}).value||'';
  var clientId = (document.getElementById('rpt-inv-client')||{}).value||'';
  // "Travel Date" (departDate) or "Invoice Date" (invoiceDate) — these can
  // legitimately differ (booked in one period, travel happens in another),
  // so the From/To range needs to be explicit about which one it's filtering.
  // invoiceDate is only ever populated by the revenue importer (§4 of
  // DOCUMENTATION.md); trips added by hand or from the Book a Trip form
  // don't have one, so an empty invoiceDate sorts before any real fromDate
  // and those trips are excluded when filtering by Invoice Date with a From
  // Date set — not a bug, there's genuinely no invoice date recorded for them.
  var dateField = (document.getElementById('rpt-inv-datetype')||{}).value||'departDate';

  // Group trips by invoice number
  var groups = {};
  db.trips.forEach(function(t){
    if(supplierId && t.supplierId !== supplierId) return;
    if(clientId && t.clientId !== clientId) return;
    var tripDate = t[dateField]||'';
    if(fromDate && tripDate < fromDate) return;
    if(toDate   && tripDate > toDate)   return;
    var key = t.invoiceNum || t.bookingRef || ('(no invoice) '+t.id);
    if(!groups[key]) groups[key] = {invoiceNum:key, trips:[], totalValue:0, totalCash:0};
    groups[key].trips.push(t);
    groups[key].totalValue += (t.totalValue||0);
    groups[key].totalCash  += (t.cashPaid||0);
  });

  var rows = Object.keys(groups).map(function(k){ return groups[k]; });
  rows.sort(function(a,b){
    var ad = (a.trips[0]&&a.trips[0][dateField])||'';
    var bd = (b.trips[0]&&b.trips[0][dateField])||'';
    return bd.localeCompare(ad);
  });
  return rows;
}

// A certificate can have a referralCredits row on more than one client's
// record (every referrer named on it gets one — see addReferralCreditEntries
// and syncReferralCreditUsedAcrossClients), so this groups by certNumber
// across all clients rather than listing raw rows, and shows the full set of
// referrers and referred names that share each certificate.
function getUnusedCertificatesReportData(){
  var clientFilter = (document.getElementById('rpt-cert-client')||{}).value||'';
  var groups = {};
  db.clients.forEach(function(c){
    (c.referralCredits||[]).forEach(function(rc){
      if(rc.certNumber==null) return;
      var g = groups[rc.certNumber];
      if(!g){ g = groups[rc.certNumber] = {certNumber:rc.certNumber, referrerIds:[], referrerNames:[], referredNames:[], date:rc.date||'', amount:rc.amount||0, used:false}; }
      if(g.referrerIds.indexOf(c.id)===-1){ g.referrerIds.push(c.id); g.referrerNames.push(c.name||''); }
      if(rc.referredName && g.referredNames.indexOf(rc.referredName)===-1) g.referredNames.push(rc.referredName);
      if(rc.used) g.used = true;
    });
  });
  var rows = Object.keys(groups).map(function(k){return groups[k];}).filter(function(g){
    if(g.used) return false;
    if(clientFilter && g.referrerIds.indexOf(clientFilter)===-1) return false;
    return true;
  });
  rows.sort(function(a,b){return (b.certNumber||0)-(a.certNumber||0);});
  return rows;
}

// Builds one section per loyalty category (Airline/Hotel/Cruise/Car Rental/
// Credit Card), each a program-by-traveler grid with a Combined Total column
// — the actual point of this report is seeing whether pooling everyone
// selected's balance for the same program clears a redemption threshold.
// Only programs with a nonzero combined total show up, so a couple with a
// dozen empty airline programs between them doesn't get an all-zero table.
function getCombinedPointsReportData(clientIds){
  var travelers = clientIds.map(function(id){return db.clients.find(function(c){return c.id===id;});}).filter(Boolean);
  function buildSection(title, programs, field, hasStatus){
    var rows = programs.map(function(program){
      var perTraveler = travelers.map(function(t){
        var bal = (t[field]||{})[program];
        if(hasStatus) return {balance:(bal&&bal.balance)||0, status:(bal&&bal.status)||''};
        return {balance:bal||0, status:''};
      });
      var total = perTraveler.reduce(function(a,p){return a+(Number(p.balance)||0);},0);
      return {program:program, perTraveler:perTraveler, total:total};
    }).filter(function(r){return r.total>0;});
    return {title:title, rows:rows};
  }
  var groups = [
    buildSection('Airline Miles', AIRLINES, 'mileageBalances', true),
    buildSection('Hotel Points', HOTELS, 'hotelBalances', true),
    buildSection('Cruise Line Loyalty', CRUISE_LINES, 'cruiseBalances', true),
    buildSection('Car Rental Loyalty', CAR_RENTALS, 'carRentalBalances', true),
    buildSection('Credit Card Points', CREDIT_CARDS, 'creditCardBalances', false)
  ];
  return {travelers:travelers, groups:groups};
}

  var clientIds = Array.from(document.querySelectorAll('.rpt-pts-client-cb:checked')).map(function(cb){return cb.value;});

    container.innerHTML = '<div class="empty" style="padding:40px">Select at least one traveler above and click Run Report</div>';
    window._pointsReportData = null;
    return;

  var data = getCombinedPointsReportData(clientIds);

  var anyRows = groups.some(function(g){return g.rows.length;});
  if(!anyRows){

          }).join('')+
          '<td style="text-align:right;font-weight:700">'+fmt(r.total)+'</td>'+
        '</tr>';
      }).join('')+

    '</div>';
  }).join('');

function getReportData(){
  var fromDate = (document.getElementById('rpt-from')||{}).value||'';
  var toDate   = (document.getElementById('rpt-to')||{}).value||'';
  var noteType = (document.getElementById('rpt-type')||{}).value||'';
  var clientId = (document.getElementById('rpt-client')||{}).value||'';

  var rows = [];

  // Include trip records (when filter is blank or set to 'Trips')
  if(!noteType || noteType==='Trips'){
    db.trips.forEach(function(t){
      if(clientId && t.clientId !== clientId) return;
      var tripDate = t.departDate||'';
      if(fromDate && tripDate < fromDate) return;
      if(toDate   && tripDate > toDate)   return;
      var supplierTxt = t.supplierName ? ' via '+t.supplierName : '';
      var text = (t.destination||'Trip')+supplierTxt+(t.invoiceNum?' (Invoice #'+t.invoiceNum+')':'')+' — $'+money(t.totalValue||0);
      rows.push({
        client: t.clientName||'',
        email: '',
        ts: tripDate,
        type: 'Trips',
        text: text,
        tripId: t.id
      });
    });
  }

  // Include notes from clients (skip Trip Import - those are legacy, trips now come from db.trips)
  if(!noteType || noteType!=='Trips'){
    db.clients.forEach(function(c){
      if(clientId && c.id !== clientId) return;
      (c.notesLog||[]).forEach(function(n){
        if((n.noteType||'')==='Trip Import') return; // legacy - trips now in db.trips
        var noteDateRaw = n.ts;
        var noteDate = '';
        try{ noteDate = new Date(noteDateRaw).toISOString().slice(0,10); }catch(e){}
        if(fromDate && noteDate && noteDate < fromDate) return;
        if(toDate   && noteDate && noteDate > toDate)   return;
        if(!(n.noteType||'')) return;
        if(noteType && (n.noteType||'') !== noteType) return;
        rows.push({
          client: c.name,
          email:  c.email||'',
          ts:     n.ts,
          type:   n.noteType||'',
          text:   n.text||''
        });
      });
    });
  }

  // Sort by timestamp/date descending
  rows.sort(function(a,b){ return new Date(b.ts)-new Date(a.ts); });
  return rows;
}
