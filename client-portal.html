<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Miles Man — Client Portal</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#f7f8fa;color:#111;padding:16px 12px 48px;line-height:1.45}
  .wrap{max-width:760px;margin:0 auto}
  .brand{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 14px}
  .brand h1{font-size:18px;margin:0}
  .brand .sub{font-size:12px;color:#777}
  .card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:22px 20px;box-shadow:0 1px 3px rgba(0,0,0,.04);margin-bottom:14px}
  .card h2{font-size:17px;margin:0 0 6px}
  .card h3{font-size:14px;margin:18px 0 8px;color:#333}
  .muted{color:#777;font-size:13px}
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
  .field label{font-size:13px;font-weight:600;color:#333}
  .field input[type=text],.field input[type=email],.field input[type=tel],.field input[type=date],.field textarea{padding:10px 12px;border:1px solid #d1d5db;border-radius:9px;font-size:15px;font-family:inherit;width:100%;background:#fff}
  .field textarea{min-height:70px;resize:vertical}
  .field input:focus,.field textarea:focus{outline:none;border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
  @media(max-width:560px){.grid2{grid-template-columns:1fr}}
  button{font-family:inherit;cursor:pointer}
  button.primary{padding:12px 20px;border-radius:9px;border:none;background:#2563eb;color:#fff;font-size:15px;font-weight:600}
  button.primary:disabled{opacity:.55;cursor:default}
  button.link{background:none;border:none;color:#2563eb;font-size:13px;font-weight:600;padding:4px 0}
  .msg{border-radius:10px;padding:12px 14px;font-size:14px;margin:0 0 14px}
  .msg.err{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
  .msg.ok{background:#d1fae5;color:#065f46;border:1px solid #6ee7b7}
  .msg.info{background:#eff6ff;color:#1e3a8a;border:1px solid #bfdbfe}
  .tabs{display:flex;gap:6px;margin-bottom:14px;border-bottom:1px solid #e5e7eb}
  .tab{background:none;border:none;border-bottom:3px solid transparent;padding:10px 14px;font-size:15px;font-weight:600;color:#666}
  .tab[aria-selected=true]{color:#2563eb;border-bottom-color:#2563eb}
  .trip{border:1px solid #e5e7eb;border-radius:12px;padding:14px 16px;margin-bottom:12px;background:#fff}
  .trip-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
  .trip-name{font-size:16px;font-weight:700}
  .trip-meta{font-size:13px;color:#555;margin-top:2px}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:#e5e7eb;color:#374151;white-space:nowrap}
  .badge.Confirmed,.badge.Upcoming{background:#d1fae5;color:#065f46}
  .badge.Planning{background:#fef3c7;color:#92400e}
  .badge.Cancelled{background:#fee2e2;color:#991b1b}
  .badge.Completed{background:#dbeafe;color:#1e40af}
  details.more{margin-top:10px}
  details.more summary{cursor:pointer;color:#2563eb;font-size:13px;font-weight:600}
  .sec{margin-top:12px}
  .sec h4{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:#888}
  .row{font-size:14px;padding:4px 0;border-bottom:1px solid #f1f1f1}
  .row:last-child{border-bottom:none}
  .conf{font-family:ui-monospace,Menlo,Consolas,monospace;background:#f3f4f6;padding:1px 6px;border-radius:5px;font-size:13px}
  dl.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;margin:0;font-size:14px}
  dl.kv dt{color:#777}
  dl.kv dd{margin:0;word-break:break-word}
  .switch{margin-bottom:12px}
  .switch select{padding:8px 10px;border-radius:8px;border:1px solid #d1d5db;font-size:14px}
  .chk{display:flex;gap:8px;align-items:center;font-size:14px;margin-bottom:14px}
  .chk input{width:17px;height:17px}
  .hp{position:absolute;left:-9999px;height:0;overflow:hidden}
  ul.plain{margin:4px 0 0;padding-left:18px;font-size:14px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div><h1>The Miles Man</h1><div class="sub">Client Portal</div></div>
    <button class="link" id="signout" hidden>Sign out</button>
  </div>

  <div id="banner" class="msg" hidden role="status"></div>

  <!-- Sign in -->
  <section id="view-login" class="card" hidden>
    <h2>Sign in</h2>
    <p class="muted">Enter the email address we have on file for you and we'll email you a secure sign-in link. There is no password to remember.</p>
    <form id="login-form" novalidate>
      <div class="field"><label for="login-email">Email address</label>
        <input type="email" id="login-email" autocomplete="email" inputmode="email" required></div>
      <button class="primary" id="login-btn" type="submit">Email me a sign-in link</button>
    </form>
    <p class="muted" style="margin-top:14px">Not receiving it? Check your spam folder, or contact us at <a href="mailto:eric@themilesman.com">eric@themilesman.com</a>.</p>
  </section>

  <!-- Portal -->
  <section id="view-portal" hidden>
    <div class="card" style="padding:16px 20px">
      <h2 id="hello">Welcome</h2>
      <div class="muted" id="asof"></div>
      <div class="switch" id="switch" hidden><label class="muted" for="person">Viewing: </label><select id="person"></select></div>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-trips" aria-selected="true">My trips</button>
      <button class="tab" role="tab" id="tab-profile" aria-selected="false">My record</button>
    </div>
    <div id="pane-trips"></div>
    <div id="pane-profile" hidden></div>
  </section>
</div>

<script>
(function(){
'use strict';
var API = 'https://milesman-auth.vercel.app/api/client-portal';
var SKEY = 'mm_portal_session';
var state = { data: null, idx: 0 };
var $ = function(id){ return document.getElementById(id); };

function esc(v){ return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function getSession(){ try{ return sessionStorage.getItem(SKEY) || ''; }catch(e){ return ''; } }
function setSession(v){ try{ if(v) sessionStorage.setItem(SKEY, v); else sessionStorage.removeItem(SKEY); }catch(e){} }

var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(s){
  var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || '');
  if(!m) return s || '';
  return MONTHS[+m[2]-1] + ' ' + (+m[3]) + ', ' + m[1];
}
function fmtStamp(s){
  var d = new Date(s); if(isNaN(d)) return '';
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}) + ' ' + d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
}
function today(){ var d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function banner(text, kind){
  var b = $('banner');
  if(!text){ b.hidden = true; return; }
  b.className = 'msg ' + (kind || 'info'); b.textContent = text; b.hidden = false;
  b.scrollIntoView({block:'nearest'});
}

async function api(action, body, auth){
  var headers = {'Content-Type':'application/json'};
  if(auth) headers.Authorization = 'Bearer ' + auth;
  var r = await fetch(API, { method:'POST', headers: headers, body: JSON.stringify(Object.assign({action: action}, body || {})) });
  var d = {}; try{ d = await r.json(); }catch(e){}
  if(!r.ok){ var err = new Error(d.error_description || 'Something went wrong. Please try again.'); err.code = d.error || ''; err.status = r.status; throw err; }
  return d;
}

function show(which){
  $('view-login').hidden = which !== 'login';
  $('view-portal').hidden = which !== 'portal';
  $('signout').hidden = which !== 'portal';
}

// ── sign in ──────────────────────────────────────────────────────────
$('login-form').addEventListener('submit', async function(e){
  e.preventDefault();
  var email = $('login-email').value.trim();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ banner('Please enter a valid email address.', 'err'); return; }
  var btn = $('login-btn'); btn.disabled = true; btn.textContent = 'Sending...';
  try{
    var d = await api('request-link', { email: email });
    banner(d.message || 'If that email is on file, a sign-in link is on its way.', 'ok');
    $('login-form').hidden = true;
  }catch(err){ banner(err.message, 'err'); }
  btn.disabled = false; btn.textContent = 'Email me a sign-in link';
});

$('signout').addEventListener('click', function(){
  setSession(''); state.data = null; banner('You have been signed out.', 'info');
  $('login-form').hidden = false; show('login');
});

async function exchangeLinkToken(){
  var m = /[#&]t=([^&]+)/.exec(location.hash || '');
  if(!m) return false;
  var token = decodeURIComponent(m[1]);
  history.replaceState(null, '', location.pathname + location.search); // keep the token out of history/bookmarks
  try{
    var d = await api('verify', { token: token });
    setSession(d.session);
    return true;
  }catch(err){
    banner(err.message, 'err');
    return false;
  }
}

async function load(){
  var s = getSession();
  if(!s){ show('login'); return; }
  try{
    state.data = await api('me', null, s);
    state.idx = 0;
    render();
    show('portal');
  }catch(err){
    if(err.status === 401){ setSession(''); banner(err.code === 'session_expired' ? 'Your session has expired. Please sign in again.' : err.message, 'info'); }
    else banner(err.message, 'err');
    show('login');
  }
}

// ── rendering ────────────────────────────────────────────────────────
function rec(){ return state.data.records[state.idx]; }

function render(){
  var d = state.data, r = rec();
  $('hello').textContent = 'Welcome, ' + (r.profile.firstName || r.profile.name || 'traveler');
  $('asof').textContent = d.dataAsOf ? 'Information as of ' + fmtStamp(d.dataAsOf) + '. Anything newer will appear after our next update.' : '';
  var sw = $('switch');
  if(d.records.length > 1){
    sw.hidden = false;
    $('person').innerHTML = d.records.map(function(x, i){ return '<option value="'+i+'"'+(i===state.idx?' selected':'')+'>'+esc(x.profile.name)+'</option>'; }).join('');
  } else sw.hidden = true;
  renderTrips(); renderProfile();
}
$('person').addEventListener('change', function(){ state.idx = +this.value; render(); });

function tab(which){
  var t = which === 'trips';
  $('pane-trips').hidden = !t; $('pane-profile').hidden = t;
  $('tab-trips').setAttribute('aria-selected', t); $('tab-profile').setAttribute('aria-selected', !t);
}
$('tab-trips').addEventListener('click', function(){ tab('trips'); });
$('tab-profile').addEventListener('click', function(){ tab('profile'); });

function conf(v){ return v ? ' <span class="conf">'+esc(v)+'</span>' : ''; }
function line(label, v){ return v ? '<div class="row"><span class="muted">'+esc(label)+':</span> '+esc(v)+'</div>' : ''; }
function sec(title, inner){ return inner ? '<div class="sec"><h4>'+esc(title)+'</h4>'+inner+'</div>' : ''; }

function tripDetails(b){
  var h = '';
  (b.flights || []).forEach(function(f, i){
    var inner = (f.recordNumber ? '<div class="row">Confirmation'+conf(f.recordNumber)+'</div>' : '');
    (f.segments || []).forEach(function(s){
      inner += '<div class="row">'+esc([s.airline, s.flightNumber].filter(Boolean).join(' '))+' &middot; '+esc((s.origin||'?')+' → '+(s.destination||'?'))+
        (s.departDate?' &middot; '+esc(fmtDate(s.departDate)):'')+(s.departTime?' '+esc(s.departTime):'')+(s.arrivalTime?' → '+esc(s.arrivalTime):'')+(s.classOfService?' &middot; '+esc(s.classOfService):'')+'</div>';
    });
    if(f.passengers && f.passengers.length) inner += '<div class="row muted">Passengers: '+esc(f.passengers.join(', '))+'</div>';
    h += sec('Flights'+((b.flights.length>1)?' '+(i+1):''), inner);
  });
  if(b.hotels) h += sec('Hotels', b.hotels.map(function(x){
    return '<div class="row">'+esc([x.hotelBrand, x.property].filter(Boolean).join(' – '))+conf(x.confirmationNumber)+(x.checkInDate?' &middot; check-in '+esc(fmtDate(x.checkInDate)):'')+(x.nights?' &middot; '+esc(x.nights)+' night(s)':'')+'</div>';
  }).join(''));
  if(b.cruise){
    var c = b.cruise;
    h += sec('Cruise',
      '<div class="row">'+esc([c.cruiseLine, c.shipName].filter(Boolean).join(' – '))+conf(c.confirmationNumber)+'</div>'+
      line('Sailing', [c.sailingDate && fmtDate(c.sailingDate), c.returnDate && 'returns '+fmtDate(c.returnDate)].filter(Boolean).join(', '))+
      line('Nights', c.nights)+line('Departs from', c.departurePort)+line('Returns to', c.returnPort)+
      (c.cabins||[]).map(function(x){ return '<div class="row">Cabin: '+esc([x.cabinType, x.cabinNumber && '#'+x.cabinNumber, x.peopleInCabin && x.peopleInCabin+' guests'].filter(Boolean).join(' · '))+'</div>'; }).join(''));
  }
  if(b.carRental){
    var k = b.carRental;
    h += sec('Car rental', '<div class="row">'+esc([k.company, k.carSize].filter(Boolean).join(' – '))+conf(k.confirmationNumber)+'</div>'+
      line('Pick-up', [k.pickupLocation, k.pickupDate && fmtDate(k.pickupDate), k.pickupTime].filter(Boolean).join(' · '))+
      line('Drop-off', [k.dropoffLocation, k.dropoffDate && fmtDate(k.dropoffDate), k.dropoffTime].filter(Boolean).join(' · ')));
  }
  if(b.transfers) h += sec('Transfers', b.transfers.map(function(x){
    return '<div class="row">'+esc([x.pickupDate && fmtDate(x.pickupDate), x.pickupTime].filter(Boolean).join(' '))+' &middot; '+esc((x.origin||'?')+' → '+(x.destination||'?'))+
      (x.carType?' &middot; '+esc(x.carType):'')+(x.provider?' &middot; '+esc(x.provider):'')+conf(x.confirmationNumber)+'</div>';
  }).join(''));
  if(b.tours) h += sec('Tours & activities', b.tours.map(function(x){ return '<div class="row">'+esc([x.vendor, x.description].filter(Boolean).join(' – '))+conf(x.confirmationNumber)+'</div>'; }).join(''));
  if(b.themeParks) h += sec('Theme parks', b.themeParks.map(function(x){ return '<div class="row">'+esc([x.park, x.ticketType].filter(Boolean).join(' – '))+conf(x.confirmationNumber)+'</div>'; }).join(''));
  [['train','Train'],['bus','Bus']].forEach(function(p){
    var x = b[p[0]]; if(!x) return;
    h += sec(p[1], '<div class="row">'+esc((x.departureCity||'?')+' → '+(x.arrivalCity||'?'))+conf(x.confirmationNumber)+'</div>'+
      line('Departs', x.departureDate && fmtDate(x.departureDate))+line('Returns', x.returnDate && fmtDate(x.returnDate))+line('Class', x.classOfService));
  });
  return h;
}

function tripCard(t){
  var dates = [t.departDate && fmtDate(t.departDate), t.returnDate && fmtDate(t.returnDate)].filter(Boolean).join(' – ');
  var meta = [t.destination && t.destination !== t.name ? t.destination : '', dates, t.type].filter(Boolean).join(' · ');
  var det = tripDetails(t.booked || {});
  return '<div class="trip"><div class="trip-top"><div><div class="trip-name">'+esc(t.name)+'</div><div class="trip-meta">'+esc(meta)+'</div>'+
    (t.travelers && t.travelers.length > 1 ? '<div class="trip-meta">Travelers: '+esc(t.travelers.join(', '))+'</div>' : '')+'</div>'+
    '<span class="badge '+esc(t.status)+'">'+esc(t.status)+'</span></div>'+
    (det ? '<details class="more"><summary>Booking details</summary>'+det+'</details>' : '<div class="muted" style="margin-top:8px">Booking details will appear here once your reservations are confirmed.</div>')+'</div>';
}

function renderTrips(){
  var trips = rec().trips.slice();
  var upcoming = trips.filter(function(t){ return t.status !== 'Cancelled' && t.status !== 'Completed'; }); // server already maps future-dated Completed to Upcoming
  var upIds = {}; upcoming.forEach(function(t){ upIds[t.id] = 1; });
  var past = trips.filter(function(t){ return !upIds[t.id]; });
  upcoming.sort(function(a,b){ return (a.departDate||'9999').localeCompare(b.departDate||'9999'); });
  past.sort(function(a,b){ return (b.departDate||'').localeCompare(a.departDate||''); });
  var h = '';
  if(!trips.length) h = '<div class="card"><p class="muted" style="margin:0">We don\'t have any trips on file for you yet. Questions? Email <a href="mailto:eric@themilesman.com">eric@themilesman.com</a>.</p></div>';
  else {
    h += '<h3 style="margin:4px 2px 10px">Upcoming &amp; in progress</h3>' + (upcoming.length ? upcoming.map(tripCard).join('') : '<p class="muted">No upcoming trips right now.</p>');
    if(past.length) h += '<h3 style="margin:18px 2px 10px">Past &amp; cancelled</h3>' + past.map(tripCard).join('');
  }
  $('pane-trips').innerHTML = h;
}

// ── profile / change requests ────────────────────────────────────────
var FIELDS = [
  ['firstName','First name','text'],['lastName','Last name','text'],
  ['email','Email','email','Changing this changes the address you sign in with.'],['phone','Phone','tel'],
  ['streetAddress','Street address','text'],['city','City','text'],['state','State / province','text'],['zip','ZIP / postal code','text'],
  ['birthdate','Date of birth','date'],['passportExpiration','Passport expiration date','date'],
  ['countryOfCitizenship','Country of citizenship','text'],['countryOfBirth','Country of birth','text'],
  ['preferredAirline','Preferred airline','text'],['preferredHotel','Preferred hotel','text'],['preferredCruiseLine','Preferred cruise line','text']
];

function loyaltyHtml(l){
  var groups = [['Airline miles', l.airlines],['Hotel points', l.hotels],['Cruise', l.cruise],['Car rental', l.carRental]];
  var out = '';
  groups.forEach(function(g){
    if(!g[1] || !g[1].length) return;
    out += sec(g[0], g[1].map(function(x){ return '<div class="row">'+esc(x.name)+(x.balance?' &middot; '+esc(x.balance):'')+(x.status?' &middot; '+esc(x.status):'')+'</div>'; }).join(''));
  });
  return out ? '<h3>Loyalty programs we track for you</h3><div class="muted">As of the date above; check the program\'s own site for live balances.</div>'+out : '';
}

function pendingHtml(p){
  if(!p.length) return '';
  return '<div class="msg info"><strong>Waiting for review</strong><br>'+p.map(function(q){
    return esc(fmtStamp(q.createdAt))+': '+esc(Object.keys(q.changes).map(function(k){ return q.changes[k].label; }).join(', '));
  }).join('<br>')+'<br><span style="font-size:13px">These will show on your record once we have reviewed them.</span></div>';
}

function renderProfile(){
  var r = rec(), p = r.profile;
  var form = FIELDS.map(function(f){
    return '<div class="field"><label for="pf-'+f[0]+'">'+esc(f[1])+'</label><input id="pf-'+f[0]+'" type="'+f[2]+'" value="'+esc(p[f[0]])+'" maxlength="120" autocomplete="off">'+(f[3]?'<span class="muted">'+esc(f[3])+'</span>':'')+'</div>';
  }).join('');
  var extras = (p.discounts.length ? '<div class="muted" style="margin-top:10px">Discounts on file: '+esc(p.discounts.join(', '))+'</div>' : '') +
               (p.interests.length ? '<div class="muted">Interests on file: '+esc(p.interests.join(', '))+'</div>' : '');
  $('pane-profile').innerHTML =
    '<div class="card"><h2>My record</h2>'+
    '<p class="muted">Update anything that has changed. We review each change before it is added to your record, usually within one business day.</p>'+
    '<div id="pending">'+pendingHtml(r.pendingRequests)+'</div>'+
    '<div id="profile-msg" class="msg" hidden role="status"></div>'+
    '<form id="profile-form" novalidate><div class="grid2">'+form+'</div>'+
    '<div class="chk"><input type="checkbox" id="pf-okToText"'+(p.okToText?' checked':'')+'><label for="pf-okToText">It\'s OK to text me about my trips</label></div>'+
    '<div class="field"><label for="pf-message">Anything else we should know? (optional)</label><textarea id="pf-message" maxlength="1000"></textarea></div>'+
    '<button class="primary" id="profile-btn" type="submit">Submit changes for review</button></form>'+extras+'</div>'+
    (loyaltyHtml(p.loyalty) ? '<div class="card">'+loyaltyHtml(p.loyalty)+'</div>' : '');
  $('profile-form').addEventListener('submit', submitProfile);
}

function pmsg(text, kind){
  var m = $('profile-msg'); m.className = 'msg ' + kind; m.textContent = text; m.hidden = false; m.scrollIntoView({block:'nearest'});
}

async function submitProfile(e){
  e.preventDefault();
  var r = rec(), p = r.profile, changes = {};
  FIELDS.forEach(function(f){
    var v = $('pf-'+f[0]).value.trim();
    if(v !== (p[f[0]] || '')) changes[f[0]] = v;
  });
  var ok = $('pf-okToText').checked;
  if(ok !== !!p.okToText) changes.okToText = ok;
  if(!Object.keys(changes).length){ pmsg('You haven\'t changed anything yet.', 'info'); return; }
  var btn = $('profile-btn'); btn.disabled = true; btn.textContent = 'Submitting...';
  try{
    await api('update', { clientId: p.id, changes: changes, message: $('pf-message').value.trim() }, getSession());
    var d = await api('me', null, getSession());
    state.data = d; render(); tab('profile');
    pmsg('Thank you! Your changes were sent to us for review.', 'ok');
  }catch(err){
    if(err.status === 401){ setSession(''); banner('Your session has expired. Please sign in again.', 'info'); show('login'); return; }
    pmsg(err.message, 'err');
    btn.disabled = false; btn.textContent = 'Submit changes for review';
  }
}

// ── boot ─────────────────────────────────────────────────────────────
(async function boot(){
  await exchangeLinkToken();
  await load();
})();
})();
</script>
</body>
</html>
